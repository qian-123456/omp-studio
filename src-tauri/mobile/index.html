<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#0a0a0a" />
		<title>omp-workspace</title>
		<style>
			:root {
				--bg: #0a0a0a;
				--panel: #141414;
				--border: #262626;
				--text: #e5e5e5;
				--muted: #8a8a8a;
				--accent: #4f8ef7;
				--ok: #34c759;
				--warn: #ff9f0a;
				--err: #ff453a;
			}
			* {
				box-sizing: border-box;
				-webkit-tap-highlight-color: transparent;
			}
			body {
				font-family: -apple-system, system-ui, sans-serif;
				background: var(--bg);
				color: var(--text);
				margin: 0;
				font-size: 15px;
			}
			header {
				position: sticky;
				top: 0;
				z-index: 10;
				background: var(--bg);
				border-bottom: 1px solid var(--border);
				padding: calc(env(safe-area-inset-top) + 10px) 14px 0;
			}
			.bar {
				display: flex;
				align-items: center;
				gap: 8px;
				padding-bottom: 8px;
			}
			.bar h1 {
				font-size: 16px;
				margin: 0;
				font-weight: 600;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--muted);
				flex: none;
			}
			.dot.on {
				background: var(--ok);
			}
			.dot.off {
				background: var(--err);
			}
			#conn {
				font-size: 12px;
				color: var(--muted);
			}
			.tabs {
				display: flex;
				gap: 4px;
			}
			.tab {
				flex: 1;
				padding: 9px 0;
				text-align: center;
				color: var(--muted);
				border: none;
				background: none;
				font-size: 14px;
				border-bottom: 2px solid transparent;
			}
			.tab.active {
				color: var(--text);
				border-bottom-color: var(--accent);
				font-weight: 600;
			}
			.badge {
				display: inline-block;
				min-width: 18px;
				padding: 0 5px;
				border-radius: 9px;
				background: var(--err);
				color: #fff;
				font-size: 11px;
				line-height: 18px;
				margin-left: 4px;
			}
			main {
				padding: 12px 14px calc(env(safe-area-inset-bottom) + 20px);
			}
			.card {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 10px;
				padding: 12px;
				margin-bottom: 10px;
			}
			.card .top {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.kind {
				font-size: 11px;
				padding: 1px 7px;
				border-radius: 8px;
				background: #262626;
				color: var(--muted);
				flex: none;
			}
			.kind.approval {
				color: var(--warn);
			}
			.kind.question {
				color: var(--accent);
			}
			.kind.error,
			.kind.interrupted {
				color: var(--err);
			}
			.title {
				font-weight: 600;
				margin: 6px 0 2px;
				word-break: break-word;
			}
			.detail {
				color: var(--muted);
				font-size: 13px;
				white-space: pre-wrap;
				word-break: break-word;
			}
			.meta {
				color: var(--muted);
				font-size: 12px;
				margin-top: 6px;
			}
			.actions {
				display: flex;
				gap: 8px;
				margin-top: 10px;
				flex-wrap: wrap;
			}
			button.btn {
				border: 1px solid var(--border);
				background: #1d1d1d;
				color: var(--text);
				border-radius: 8px;
				padding: 8px 14px;
				font-size: 14px;
			}
			button.btn.primary {
				background: var(--accent);
				border-color: var(--accent);
				color: #fff;
			}
			button.btn.danger {
				color: var(--err);
			}
			button.btn:disabled {
				opacity: 0.4;
			}
			textarea {
				width: 100%;
				background: #0f0f0f;
				border: 1px solid var(--border);
				border-radius: 8px;
				color: var(--text);
				padding: 8px;
				font-size: 14px;
				font-family: inherit;
				resize: vertical;
				min-height: 56px;
				margin-top: 8px;
			}
			.sdot {
				width: 9px;
				height: 9px;
				border-radius: 50%;
				flex: none;
			}
			.s-working {
				background: var(--accent);
			}
			.s-awaiting_approval,
			.s-awaiting_answer {
				background: var(--warn);
			}
			.s-review {
				background: #bf5af2;
			}
			.s-error,
			.s-interrupted {
				background: var(--err);
			}
			.s-suspended {
				background: var(--warn);
			}
			.s-external {
				background: #64d2ff;
			}
			.s-idle {
				background: var(--ok);
			}
			.empty {
				color: var(--muted);
				text-align: center;
				padding: 40px 0;
				font-size: 14px;
			}
			.last {
				margin-top: 8px;
				padding: 8px;
				background: #0f0f0f;
				border-radius: 8px;
				font-size: 13px;
				color: var(--muted);
				white-space: pre-wrap;
				word-break: break-word;
				max-height: 200px;
				overflow: auto;
			}
			#fatal {
				display: none;
				padding: 40px 20px;
				text-align: center;
				color: var(--err);
			}
			.hidden {
				display: none !important;
			}
			.notify-row {
				padding: 0 14px 10px;
			}
			.notify-row button {
				font-size: 12px;
				color: var(--muted);
				background: none;
				border: none;
				text-decoration: underline;
				padding: 0;
			}
		</style>
	</head>
	<body>
		<header>
			<div class="bar">
				<span id="dot" class="dot"></span>
				<h1>omp-workspace</h1>
				<span id="conn"></span>
			</div>
			<div class="tabs">
				<button id="tab-todos" class="tab active">
					待办<span id="todo-badge" class="badge hidden"></span>
				</button>
				<button id="tab-sessions" class="tab">会话</button>
			</div>
		</header>
		<div class="notify-row">
			<button id="notify-btn" class="hidden">开启新待办通知</button>
		</div>
		<main>
			<div id="fatal"></div>
			<div id="pane-todos"></div>
			<div id="pane-sessions" class="hidden"></div>
		</main>
		<script>
			"use strict";

			const $ = (id) => document.getElementById(id);
			const esc = (s) =>
				String(s ?? "").replace(
					/[&<>"']/g,
					(c) =>
						({
							"&": "&amp;",
							"<": "&lt;",
							">": "&gt;",
							'"': "&quot;",
							"'": "&#39;",
						})[c],
				);

			const STATUS_LABEL = {
				working: "运行中",
				awaiting_approval: "待批准",
				awaiting_answer: "待回复",
				review: "待验收",
				idle: "空闲",
				error: "错误",
				interrupted: "已中断",
				suspended: "已挂起",
				external: "外部进程",
			};
			const KIND_LABEL = {
				approval: "批准",
				question: "问题",
				error: "错误",
				interrupted: "中断",
				review: "验收",
				suggestion: "建议",
				service_left: "服务",
			};

			let sessions = [];
			let todos = [];
			let lastOpenCount = -1;
			let es = null;
			let pollTimer = null;

			async function api(path, opts) {
				const res = await fetch("/api" + path, {
					credentials: "same-origin",
					headers: { "Content-Type": "application/json" },
					...opts,
				});
				if (res.status === 401) {
					showFatal("配对已失效或被撤销，请在电脑上重新生成二维码配对。");
					throw new Error("unauthorized");
				}
				const body = await res.json().catch(() => ({}));
				if (!res.ok) throw new Error(body.error || res.statusText);
				return body;
			}

			function showFatal(msg) {
				$("fatal").textContent = msg;
				$("fatal").style.display = "block";
				setConn(false, "已断开");
				if (es) {
					es.close();
					es = null;
				}
			}

			function setConn(on, text) {
				$("dot").className = "dot " + (on ? "on" : "off");
				$("conn").textContent = text;
			}

			function relTime(iso) {
				const t = Date.parse(iso);
				if (!t) return "";
				const s = Math.max(0, (Date.now() - t) / 1000);
				if (s < 60) return "刚刚";
				if (s < 3600) return Math.floor(s / 60) + " 分钟前";
				if (s < 86400) return Math.floor(s / 3600) + " 小时前";
				return Math.floor(s / 86400) + " 天前";
			}

			function sessionLabel(id) {
				const s = sessions.find((x) => x.id === id);
				return s ? s.label + " " + s.title : "";
			}

			// ---- pending UI dialogs ----

			function reqTitle(req) {
				return (
					req.title ||
					req.message ||
					req.prompt ||
					req.description ||
					req.method ||
					"请求"
				);
			}

			function reqOptions(req) {
				const raw = req.options || req.choices;
				if (!Array.isArray(raw) || raw.length === 0) return null;
				return raw.map((o) =>
					typeof o === "string"
						? { id: o, label: o }
						: { id: o.id ?? o.value ?? o.label, label: o.label ?? o.id ?? o.value },
				);
			}

			async function respond(sessionId, response, btn) {
				if (btn) btn.disabled = true;
				try {
					await api("/sessions/" + sessionId + "/ui-respond", {
						method: "POST",
						body: JSON.stringify({ response }),
					});
					await refresh();
				} catch (e) {
					alert("操作失败：" + e.message);
					if (btn) btn.disabled = false;
				}
			}

			function renderPending(container, sessionId, requests) {
				for (const p of requests) {
					const req = p.request || {};
					const box = document.createElement("div");
					box.className = "card";
					const opts = reqOptions(req);
					let html =
						'<div class="top"><span class="kind question">待处理</span></div>' +
						'<div class="title">' + esc(reqTitle(req)) + "</div>";
					if (req.detail || req.body)
						html += '<div class="detail">' + esc(req.detail || req.body) + "</div>";
					box.innerHTML = html;
					const actions = document.createElement("div");
					actions.className = "actions";
					if (opts) {
						for (const o of opts) {
							const b = document.createElement("button");
							b.className =
								"btn" + (/approve|允许|批准|yes|ok/i.test(o.id + o.label) ? " primary" : "");
							b.textContent = o.label;
							b.onclick = () =>
								respond(
									sessionId,
									{ id: req.id, type: "extension_ui_response", value: o.id },
									b,
								);
							actions.appendChild(b);
						}
					} else {
						const ta = document.createElement("textarea");
						ta.placeholder = "输入回复…";
						const b = document.createElement("button");
						b.className = "btn primary";
						b.textContent = "提交";
						b.onclick = () =>
							respond(
								sessionId,
								{ id: req.id, type: "extension_ui_response", value: ta.value },
								b,
							);
						box.appendChild(ta);
						actions.appendChild(b);
					}
					box.appendChild(actions);
					container.appendChild(box);
				}
			}

			// ---- todos ----

			async function renderTodos() {
				const pane = $("pane-todos");
				pane.innerHTML = "";
				const open = todos.filter((t) => t.status === "open");
				$("todo-badge").textContent = open.length;
				$("todo-badge").classList.toggle("hidden", open.length === 0);
				if (open.length === 0) {
					pane.innerHTML = '<div class="empty">没有待办事项</div>';
					return;
				}
				for (const t of open) {
					const card = document.createElement("div");
					card.className = "card";
					const kind = KIND_LABEL[t.kind] || t.kind;
					card.innerHTML =
						'<div class="top"><span class="kind ' +
						esc(t.kind) +
						'">' +
						esc(kind) +
						"</span>" +
						(t.sessionId
							? '<span class="meta">' + esc(sessionLabel(t.sessionId)) + "</span>"
							: "") +
						"</div>" +
						'<div class="title">' +
						esc(t.title) +
						"</div>" +
						(t.detail ? '<div class="detail">' + esc(t.detail) + "</div>" : "");

					const actions = document.createElement("div");
					actions.className = "actions";
					const uiReq = t.payload && t.payload.uiRequest;
					if (t.sessionId && uiReq && uiReq.id) {
						// Approval/question todos carry a live extension_ui_request:
						// answer it directly so the agent unblocks.
						const opts = reqOptions(uiReq) || [
							{ id: "Approve", label: "批准" },
							{ id: "Deny", label: "拒绝" },
						];
						for (const o of opts) {
							const b = document.createElement("button");
							b.className =
								"btn" + (/approve|批准|允许/i.test(o.id + o.label) ? " primary" : "");
							b.textContent = o.label;
							b.onclick = () =>
								respond(
									t.sessionId,
									{ id: uiReq.id, type: "extension_ui_response", value: o.id },
									b,
								);
							actions.appendChild(b);
						}
					} else {
						const done = document.createElement("button");
						done.className = "btn primary";
						done.textContent = "完成";
						done.onclick = () => act(t.id, "done", done);
						actions.appendChild(done);
					}
					const ign = document.createElement("button");
					ign.className = "btn danger";
					ign.textContent = "忽略";
					ign.onclick = () => act(t.id, "ignore", ign);
					actions.appendChild(ign);
					card.appendChild(actions);
					pane.appendChild(card);
				}
			}

			async function act(id, action, btn) {
				if (btn) btn.disabled = true;
				try {
					await api("/todos/" + encodeURIComponent(id) + "/act", {
						method: "POST",
						body: JSON.stringify({ action }),
					});
					await refresh();
				} catch (e) {
					alert("操作失败：" + e.message);
					if (btn) btn.disabled = false;
				}
			}

			// ---- sessions ----

			async function renderSessions() {
				const pane = $("pane-sessions");
				pane.innerHTML = "";
				if (sessions.length === 0) {
					pane.innerHTML = '<div class="empty">没有会话</div>';
					return;
				}
				for (const s of sessions) {
					const card = document.createElement("div");
					card.className = "card";
					const st = s.status || "idle";
					card.innerHTML =
						'<div class="top"><span class="sdot s-' +
						esc(st) +
						'"></span>' +
						'<span class="meta">' +
						esc(STATUS_LABEL[st] || st) +
						(s.live ? " · 在线" : "") +
						"</span></div>" +
						'<div class="title">' +
						esc(s.label + " " + (s.title || "")) +
						"</div>" +
						'<div class="meta">' +
						esc(relTime(s.updatedAt)) +
						"</div>";

					// Pending dialogs for this session.
					if (s.pending === "approval" || s.pending === "question") {
						const holder = document.createElement("div");
						card.appendChild(holder);
						api("/sessions/" + s.id + "/pending-ui")
							.then((reqs) => renderPending(holder, s.id, reqs))
							.catch(() => {});
					}

					// Reply box when the agent waits for an answer.
					if (st === "awaiting_answer") {
						const ta = document.createElement("textarea");
						ta.placeholder = "回复会话…";
						const b = document.createElement("button");
						b.className = "btn primary";
						b.textContent = "发送";
						b.onclick = async () => {
							const text = ta.value.trim();
							if (!text) return;
							b.disabled = true;
							try {
								await api("/sessions/" + s.id + "/prompt", {
									method: "POST",
									body: JSON.stringify({ text }),
								});
								ta.value = "";
								await refresh();
							} catch (e) {
								alert("发送失败：" + e.message);
								b.disabled = false;
							}
						};
						card.appendChild(ta);
						const row = document.createElement("div");
						row.className = "actions";
						row.appendChild(b);
						card.appendChild(row);
					}

					// One-tap resume for dead sessions.
					if (st === "interrupted" || st === "suspended" || st === "error") {
						const row = document.createElement("div");
						row.className = "actions";
						const b = document.createElement("button");
						b.className = "btn primary";
						b.textContent = "一键恢复";
						b.onclick = async () => {
							b.disabled = true;
							try {
								await api("/sessions/" + s.id + "/resume", { method: "POST" });
								await refresh();
							} catch (e) {
								alert("恢复失败：" + e.message);
								b.disabled = false;
							}
						};
						row.appendChild(b);
						card.appendChild(row);
					}

					// Last assistant reply (expandable).
					if (s.lastAssistant) {
						const b = document.createElement("button");
						b.className = "btn";
						b.textContent = "最近回复";
						const pre = document.createElement("div");
						pre.className = "last hidden";
						b.onclick = async () => {
							if (pre.classList.contains("hidden")) {
								pre.classList.remove("hidden");
								if (!pre.textContent) {
									try {
										const r = await api("/sessions/" + s.id + "/last");
										pre.textContent = r.text || "(无内容)";
									} catch (e) {
										pre.textContent = "加载失败：" + e.message;
									}
								}
							} else {
								pre.classList.add("hidden");
							}
						};
						const row = document.createElement("div");
						row.className = "actions";
						row.appendChild(b);
						card.appendChild(row);
						card.appendChild(pre);
					}

					pane.appendChild(card);
				}
			}

			// ---- data + events ----

			async function refresh() {
				const [s, t] = await Promise.all([
					api("/sessions"),
					api("/todos"),
				]);
				sessions = s;
				todos = t;
				await renderTodos();
				await renderSessions();
				notifyNewTodos();
			}

			function notifyNewTodos() {
				const open = todos.filter((t) => t.status === "open").length;
				if (lastOpenCount >= 0 && open > lastOpenCount) {
					if (navigator.vibrate) navigator.vibrate(200);
					if (window.Notification && Notification.permission === "granted") {
						const newest = todos.find((t) => t.status === "open");
						new Notification("新的待办", {
							body: newest ? newest.title : "",
						});
					}
				}
				lastOpenCount = open;
			}

			function connect() {
				if (es) es.close();
				es = new EventSource("/api/events");
				es.onopen = () => setConn(true, "已连接");
				es.onerror = () => {
					setConn(false, "重连中…");
					startPolling();
				};
				es.addEventListener("todos", () =>
					api("/todos").then((t) => {
						todos = t;
						renderTodos();
						notifyNewTodos();
					}),
				);
				es.addEventListener("session", () =>
					api("/sessions").then((s) => {
						sessions = s;
						renderSessions();
					}),
				);
				es.addEventListener("resync", () => refresh());
			}

			function startPolling() {
				if (pollTimer) return;
				pollTimer = setInterval(() => {
					refresh().catch(() => {});
				}, 15000);
			}

			// ---- tabs + boot ----

			$("tab-todos").onclick = () => {
				$("tab-todos").classList.add("active");
				$("tab-sessions").classList.remove("active");
				$("pane-todos").classList.remove("hidden");
				$("pane-sessions").classList.add("hidden");
			};
			$("tab-sessions").onclick = () => {
				$("tab-sessions").classList.add("active");
				$("tab-todos").classList.remove("active");
				$("pane-sessions").classList.remove("hidden");
				$("pane-todos").classList.add("hidden");
			};

			if (window.Notification && Notification.permission === "default") {
				$("notify-btn").classList.remove("hidden");
				$("notify-btn").onclick = () => {
					Notification.requestPermission().then(() =>
						$("notify-btn").classList.add("hidden"),
					);
				};
			}

			refresh()
				.then(connect)
				.catch((e) => {
					if (e.message !== "unauthorized") showFatal("加载失败：" + e.message);
				});
		</script>
	</body>
</html>
