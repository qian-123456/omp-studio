[package]
name = "omp-workspace"
version = "0.1.1"
description = "Desktop workbench for OMP agent sessions"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "omp_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = ["macos-private-api", "protocol-asset", "image-png"] }
tauri-plugin-notification = "2.3"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-dialog = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
notify-debouncer-full = "0.6"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "6"
axum = "0.8"
qrcode = "0.14"
local-ip-address = "0.6"
parking_lot = "0.12"
regex = "1"
tracing = "0.1"
portable-pty = "0.9"
libc = "0.2.189"
sha2 = "0.10"
getrandom = "0.3"
trash = "5.2"
futures-util = "0.3"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_yaml_ng = "0.10"
yaml-edit = "=0.3.2"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1"
socket2 = "0.6"
# Serving the TLS listener directly through hyper-util (handshake in the
# per-connection task, header-read timeout, connection cap).
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
    "server",
    "service",
    "http1",
] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Mobile web bundle (src-tauri/mobile-dist): embedded in release, read from disk in debug.
rust-embed = { version = "=8.13.0", default-features = false }
# Web push (RFC 8030/8291/8292) is hand-rolled on ring + aes-gcm; ring is already
# in the tree through rustls, pinned to the same version here.
ring = "=0.17.14"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.6.0"
core-foundation = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
