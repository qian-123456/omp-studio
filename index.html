<!doctype html>
<html lang="zh-CN" class="dark" style="background-color: #0c0c0c; color: #ededed;">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vecway-logo.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Vecway</title>
		<style>
			:root, html, body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #0c0c0c;
				color: #ededed;
			}
			#startup-fallback {
				display: none;
				height: 100vh;
				width: 100vw;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				background-color: #0c0c0c;
				color: #a3a3a3;
				font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
			}
		</style>
	</head>
	<body style="background-color: #0c0c0c; color: #ededed;">
		<div id="root">
			<div id="startup-fallback">
				<div style="max-width: 440px; margin: 0 24px; padding: 24px 28px; border-radius: 14px; border: 1px solid #262626; background-color: #171717; text-align: center; box-shadow: 0 16px 36px rgba(0,0,0,0.6);">
					<div style="font-size: 15px; font-weight: 600; color: #f5f5f5; margin-bottom: 8px;">界面加载超时 / Loading Timed Out</div>
					<div style="font-size: 12px; color: #8a8a8a; margin-bottom: 20px; line-height: 1.6;">前端未能正常渲染。若使用开发模式，请确认开发服务正在运行；亦可点击下方按钮重新尝试载入。</div>
					<button type="button" onclick="window.location.reload()" style="cursor: pointer; padding: 8px 18px; font-size: 13px; font-weight: 500; border-radius: 7px; border: 1px solid #3b82f6; background-color: #2563eb; color: #ffffff;">重新加载 / Reload</button>
				</div>
			</div>
		</div>
		<script>
			setTimeout(function() {
				var root = document.getElementById("root");
				var fallback = document.getElementById("startup-fallback");
				if (root && fallback && (!root.firstElementChild || root.firstElementChild === fallback)) {
					fallback.style.display = "flex";
				}
			}, 4000);
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
