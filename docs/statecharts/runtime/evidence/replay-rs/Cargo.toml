[package]
name = "runtime-replay"
version = "0.0.0"
edition = "2021"
[lib]
path = "src/lib.rs"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
tracing = "0.1"
[workspace]
