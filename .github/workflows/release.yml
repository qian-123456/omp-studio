name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'omp-workspace ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### 下载与架构选择 / Download & Architecture
            - **Apple Silicon (M1/M2/M3/M4/M5)**: 下载 `*aarch64.dmg`（推荐大多数用户）
            - **Intel Mac**: 下载 `*x64.dmg`
            - 自动更新文件（`.app.tar.gz` / `.sig`）由应用内置更新器使用，日常使用直接下载 `.dmg` 即可。

            ---

            ### ⚠️ 重要安全提示：macOS 绕过未签名与隔离提示
            由于开源社区版未购买苹果商业开发者证书，首次在 macOS 打开可能提示 **“omp-workspace 已损坏，无法打开。你应该将它移到废纸篓”**。
            **软件并非损坏**，只需打开 macOS「终端（Terminal）」并运行以下命令清除隔离属性：
            ```bash
            xattr -cr /Applications/omp-workspace.app
            ```
            *备选方式*：在访达「应用程序」中按住 `Control` 键点按应用选择「打开」，或在系统「系统设置 ▸ 隐私与安全性」中点击「仍要打开」。

            ---

            ### 运行环境 / Requirements
            - 需要本地已安装或自动安装 [`omp`](https://github.com/can1357/oh-my-pi) CLI（首次启动未检测到会自动安装）。
            - 准备至少一个模型供应商凭据（支持 API Key 或 OAuth 订阅）。

            ---

            ### 本次更新 / What's New
            #### 修复与优化 / Fixes & Improvements
            - 优化模型目录管理与状态提示：当模型列表读取异常或刷新滞留时，提供明确的状态提示与最后已知列表保留机制，避免选型面板无响应或列表闪烁；同步增强模型目录快照的来源与完整性校验。
            - 完善模型能力识别与冷会话编辑：恢复非活动与冷会话状态下的历史消息编辑能力，正确识别模型思考等级与上下文窗口；批量替换模型支持更精确的模型分类与名称搜索匹配。
            - 增强暂存队列与恢复重试体验：优化消息暂存队列（Held Queue）调度逻辑，新增缺失模型恢复引导弹窗与重试指引；移动端同步适配最新模型目录结构。
            - 增加持久化本地诊断记录控制：在通用设置中新增本地诊断记录开关，方便用户自主控制问题排查证据采集。
            - 构建与性能优化：完善编译缓存与多进程协作安全性，提升应用运行稳定性与打包效率。

            #### 验证范围 / Verification Scope
            - 已通过全量 TypeScript 类型检查、前端 431 套件（4033 案例）单元测试、Rust 1008 项单元测试及生产构建打包验证。
            ---

            ### 问题反馈与帮助 / Support
            - [在线用户手册](https://github.com/qian-123456/omp-studio/tree/main/docs/guide/zh)
            - [GitHub Issues](https://github.com/qian-123456/omp-studio/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
