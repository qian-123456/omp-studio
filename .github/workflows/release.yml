name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'Vecway ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### 下载与架构选择 / Download & Architecture
            - **Apple Silicon (M1/M2/M3/M4/M5)**: 下载 `*aarch64.dmg`（推荐大多数用户）
            - **Intel Mac**: 下载 `*x64.dmg`
            - 自动更新文件（`.app.tar.gz` / `.sig`）由应用内置更新器使用，日常使用直接下载 `.dmg` 即可。

            ---

            ### ⚠️ 重要安全提示：macOS 绕过未签名与隔离提示
            由于开源社区版未购买苹果商业开发者证书，首次在 macOS 打开可能提示 **“Vecway 已损坏，无法打开。你应该将它移到废纸篓”**。
            **软件并非损坏**，只需打开 macOS「终端（Terminal）」并运行以下命令清除隔离属性：
            ```bash
            xattr -cr /Applications/Vecway.app
            ```
            *备选方式*：在访达「应用程序」中按住 `Control` 键点按应用选择「打开」，或在系统「系统设置 ▸ 隐私与安全性」中点击「仍要打开」。

            ---

            ### 运行环境 / Requirements
            - 需要本地已安装或自动安装 [`omp`](https://github.com/can1357/oh-my-pi) CLI（首次启动未检测到会自动安装）。
            - 准备至少一个模型供应商凭据（支持 API Key 或 OAuth 订阅）。

            ---

            ### 本次更新 / What's New
            #### 新增功能 / Features
            - **正式更名为 Vecway**：应用名称、窗口标题、通知与手机端界面全面更新为 **Vecway**（专为 `oh-my-pi` / `omp` 打造的原生桌面 GUI 与智能路由工作台），并同步启用全新黑白灰扳手 V 矢量应用图标。
            - **Rebranded to Vecway**: Updated app name, window title, notifications, mobile UI, and monochrome wrench-V icon set as the native desktop GUI & intelligent routing workbench for `oh-my-pi` (`omp`).
            - **仓库迁移与兼容**：GitHub 仓库与自动更新源迁至 `qian-123456/vecway`；本地数据目录（`~/.omp-workspace`）与应用标识保持向后兼容，旧版本升级不丢失任何会话与设置。
            - **Repository & Upgrade Continuity**: Release and updater endpoints now point to `qian-123456/vecway` while preserving `~/.omp-workspace` and bundle identity so existing users upgrade seamlessly.

            #### 修复与优化 / Fixes & Improvements
            - 更新中英双语 README、用户指南与 `llms.txt` 检索索引，完善面向搜索引擎与 AI 搜索的产品发现信息。
            - Updated bilingual README, user guide, and `llms.txt` for improved search and AI discovery.

            #### 验证范围 / Verification Scope
            - TypeScript 类型检查、437 个前端与移动端测试文件（4,132 项）、Rust `cargo check`，以及 GitHub Actions macOS 双架构自动发布构建。
            - Verified: TypeScript type-check, 437 frontend/mobile test files (4,132 tests), Rust `cargo check`, and GitHub Actions macOS universal release workflow.
            ---

            ### 问题反馈与帮助 / Support
            - [在线用户手册](https://github.com/qian-123456/vecway/tree/main/docs/guide/zh)
            - [GitHub Issues](https://github.com/qian-123456/vecway/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
