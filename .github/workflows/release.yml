name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'Vecway ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### 下载与架构选择 / Download & Architecture
            - **Apple Silicon (M1/M2/M3/M4/M5)**: 下载 `*aarch64.dmg`（推荐大多数用户）
            - **Intel Mac**: 下载 `*x64.dmg`
            - 自动更新文件（`.app.tar.gz` / `.sig`）由应用内置更新器使用，日常使用直接下载 `.dmg` 即可。

            ---

            ### ⚠️ 重要安全提示：macOS 绕过未签名与隔离提示
            由于开源社区版未购买苹果商业开发者证书，首次在 macOS 打开可能提示 **“Vecway 已损坏，无法打开。你应该将它移到废纸篓”**。
            **软件并非损坏**，只需打开 macOS「终端（Terminal）」并运行以下命令清除隔离属性：
            ```bash
            xattr -cr /Applications/Vecway.app
            ```
            *备选方式*：在访达「应用程序」中按住 `Control` 键点按应用选择「打开」，或在系统「系统设置 ▸ 隐私与安全性」中点击「仍要打开」。

            ---

            ### 运行环境 / Requirements
            - 需要本地已安装或自动安装 [`omp`](https://github.com/can1357/oh-my-pi) CLI（首次启动未检测到会自动安装）。
            - 准备至少一个模型供应商凭据（支持 API Key 或 OAuth 订阅）。

            ---

            ### 本次更新 / What's New
            #### 新增功能 / Features
            - 供应商密钥现在支持直接保存或使用环境变量；新增与编辑供应商的配置界面重新设计。
            - Provider keys can now be saved directly or supplied through environment variables; provider setup and editing have been redesigned.

            #### 修复与优化 / Fixes & Improvements
            - 调整供应商表单的列布局与对齐，并统一服务配置体验。
            - Improved provider form alignment and consistency across service configuration.

            #### 重大改动 / Breaking Changes
            - 供应商 API 密钥现以明文保存在 OMP 的 `~/.omp/agent/models.yml`；已移除供应商密钥加密存储。升级前请确认该文件及其备份的访问权限。可识别的旧密钥引用会在启动时迁移。
            - Provider API keys are now stored unencrypted in OMP's `~/.omp/agent/models.yml`; encrypted provider-key storage has been removed. Review access to this file and its backups before upgrading. Recognized legacy key references migrate at startup.

            #### 验证范围 / Verification Scope
            - TypeScript 类型检查、435 个前端与移动端测试文件（4,123 项）、Rust `cargo check`，以及 Apple Silicon 本地发布包与更新签名构建均已通过。
            - Verified: TypeScript type-check, 435 frontend/mobile test files (4,123 tests), Rust `cargo check`, and the Apple Silicon release bundle with updater signature.
            ---

            ### 问题反馈与帮助 / Support
            - [在线用户手册](https://github.com/qian-123456/vecway/tree/main/docs/guide/zh)
            - [GitHub Issues](https://github.com/qian-123456/vecway/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
