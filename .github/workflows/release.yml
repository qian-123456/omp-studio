name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - target: 'x86_64-apple-darwin'
            args: '--target x86_64-apple-darwin'

    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: 'omp-workspace ${{ github.event.inputs.tag_name || github.ref_name }}'
          releaseBody: |
            ### 下载与架构选择 / Download & Architecture
            - **Apple Silicon (M1/M2/M3/M4/M5)**: 下载 `*aarch64.dmg`（推荐大多数用户）
            - **Intel Mac**: 下载 `*x64.dmg`
            - 自动更新文件（`.app.tar.gz` / `.sig`）由应用内置更新器使用，日常使用直接下载 `.dmg` 即可。

            ---

            ### ⚠️ 重要安全提示：macOS 绕过未签名与隔离提示
            由于开源社区版未购买苹果商业开发者证书，首次在 macOS 打开可能提示 **“omp-workspace 已损坏，无法打开。你应该将它移到废纸篓”**。
            **软件并非损坏**，只需打开 macOS「终端（Terminal）」并运行以下命令清除隔离属性：
            ```bash
            xattr -cr /Applications/omp-workspace.app
            ```
            *备选方式*：在访达「应用程序」中按住 `Control` 键点按应用选择「打开」，或在系统「系统设置 ▸ 隐私与安全性」中点击「仍要打开」。

            ---

            ### 运行环境 / Requirements
            - 需要本地已安装或自动安装 [`omp`](https://github.com/can1357/oh-my-pi) CLI（首次启动未检测到会自动安装）。
            - 准备至少一个模型供应商凭据（支持 API Key 或 OAuth 订阅）。

            ---

            ### 本次更新 / What's New
            #### 修复与优化 / Fixes & Improvements
            - 优化流式输出与对话渲染体验：重构流式快照合并逻辑（streamSnapshot），大幅降低高频流式片段引起的无谓渲染与抖动；优化副对话（Sidechat）交互与占位提示，完善交回主对话后的结论动作支持。
            - 增强待办与灵感编辑器：灵感编辑器完整支持中文等输入法（IME）原生组合输入与拼音合成状态保护；撤销与重做操作完整保留并恢复附件历史；以草稿预填（draft prefill）替代原派发对话框，提升派发流转流畅度。
            - 完善计划评审与选区高亮：修复计划评审（Plan Review）布局，准确对齐文档中计划选区的高亮展示与完成状态。
            - 存储空间管理与清理能力增强：新增 OMP 运行缓存清理支持（安全清理 ~/.omp/cache 与 ~/.omp/puppeteer）；数据库紧凑化操作扩展至跨多库清理（app.db、search.db 与 activity-cache.sqlite 全量 VACUUM & checkpoint），释放更多本地磁盘空间。

            #### 验证范围 / Verification Scope
            - 已通过全量 TypeScript 类型检查、前端 434 套件（4116 案例）单元测试、Rust 1010 项单元测试及代码规范（clippy）校验。
            ---

            ### 问题反馈与帮助 / Support
            - [在线用户手册](https://github.com/qian-123456/omp-studio/tree/main/docs/guide/zh)
            - [GitHub Issues](https://github.com/qian-123456/omp-studio/issues)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
