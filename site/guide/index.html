<script id="guide-data" type="application/json">{"zh":[{"slug":"01-getting-started","title":"快速开始","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/getting-started-layout.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/getting-started-first-session.png\"/>\u003ch1 id=\"快速开始\">快速开始\u003c/h1>\n\u003cblockquote>\n\u003cp>omp-workspace 是一个桌面工作台：在一个窗口里启动、查看和管理所有 OMP 智能体会话。本章介绍运行前提、窗口布局，以及如何开始第一个会话。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E4%BA%86%E8%A7%A3-omp-workspace\">了解 omp-workspace 是什么\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E5%87%86%E5%A4%87%E7%8E%AF%E5%A2%83\">确认运行前提并启动应用\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E8%AE%A4%E8%AF%86%E7%AA%97%E5%8F%A3%E5%B8%83%E5%B1%80\">认识窗口的各个区域\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E5%BC%80%E5%A7%8B%E7%AC%AC%E4%B8%80%E4%B8%AA%E4%BC%9A%E8%AF%9D\">开始第一个会话\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E7%99%BB%E5%BD%95%E6%A8%A1%E5%9E%8B%E4%BE%9B%E5%BA%94%E5%95%86\">登录模型供应商\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"了解-omp-workspace\">了解 omp-workspace\u003c/h2>\n\u003cp>omp-workspace 是 OMP 命令行智能体的桌面外壳（Tauri 2 应用，界面语言为简体中文）。它不替代 \u003ccode>omp\u003c/code>，而是在其上提供：\u003c/p>\n\u003cul>\n\u003cli>会话列表：按项目、分支分组，用状态标记显示哪些会话在运行、在等你回复、已中断。\u003c/li>\n\u003cli>对话界面：消息流、工具调用卡、审批按钮、输入框，以及随手可开的辅助对话。\u003c/li>\n\u003cli>工作区工具：文件浏览与编辑、Git 变更与工作树、终端。\u003c/li>\n\u003cli>自动化与监控：定时任务、待办与想法、收件箱、用量统计、手机访问。\u003c/li>\n\u003c/ul>\n\u003cp>应用启动时会读取 \u003ccode>~/.omp/agent/sessions/\u003c/code> 下已有的 OMP 会话，因此你之前在终端里用 \u003ccode>omp\u003c/code> 产生的会话会直接出现在列表里。\u003c/p>\n\u003ch2 id=\"准备环境\">准备环境\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项目\u003c/th>\u003cth>要求\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>系统\u003c/td>\u003ctd>macOS（应用使用系统钥匙串保存密钥，并提供「在访达中显示」等功能）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OMP 命令行\u003c/td>\u003ctd>已安装 \u003ccode>omp\u003c/code>，并能在终端里直接运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型凭据\u003c/td>\u003ctd>至少一个可用的模型供应商（API 密钥或 OAuth 登录），见\u003ca href=\"#/zh/01-getting-started/%E7%99%BB%E5%BD%95%E6%A8%A1%E5%9E%8B%E4%BE%9B%E5%BA%94%E5%95%86\">登录模型供应商\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>从源码构建时\u003c/td>\u003ctd>Node.js、\u003ccode>pnpm\u003c/code>、Rust 工具链\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>应用通过「omp 程序位置」这个命令启动会话，默认值是 \u003ccode>omp\u003c/code>。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>如果 \u003ccode>omp\u003c/code> 不在系统 \u003ccode>PATH\u003c/code> 中，或装在非常规位置，请到 \u003cstrong>设置 ▸ 高级 ▸ omp 程序位置\u003c/strong> 填写完整路径。\u003cstrong>设置 ▸ 版本与更新\u003c/strong> 中找不到 omp 时会提示「未找到 omp，可在「高级」中设置 omp 程序位置」。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"安装与启动\">安装与启动\u003c/h2>\n\u003cp>从源码运行或打包：\u003c/p>\n\u003cpre>\u003ccode class=\"hljs language-bash\">pnpm install        \u003cspan class=\"hljs-comment\"># 安装前端依赖\u003c/span>\npnpm tauri dev      \u003cspan class=\"hljs-comment\"># 开发模式运行（构建 Rust 并启动 Vite）\u003c/span>\npnpm build:app      \u003cspan class=\"hljs-comment\"># 类型检查、构建前端并打包桌面应用\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>想同时开一个互不干扰的实例（例如试用新版本），可以用 \u003ccode>pnpm dev:preview\u003c/code>：它使用独立端口，并把数据放到 \u003ccode>~/.omp-workspace-dev\u003c/code>。数据目录的更多说明见\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E6%95%B0%E6%8D%AE%E4%BD%8D%E7%BD%AE\">数据位置\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003cp>首次启动时应用会：\u003c/p>\n\u003col>\n\u003cli>在 \u003ccode>~/.omp-workspace/\u003c/code> 下创建自己的数据目录。\u003c/li>\n\u003cli>扫描 \u003ccode>~/.omp/agent/sessions/\u003c/code>，把已有会话载入列表。\u003c/li>\n\u003cli>如果上次关闭时停留在某个会话，且该会话属于当前空间，自动回到它；否则显示首页。\u003c/li>\n\u003c/ol>\n\u003cp>默认窗口大小为 1440 × 900，窗口标题栏为覆盖式（内容延伸到标题栏下）。\u003c/p>\n\u003ch2 id=\"认识窗口布局\">认识窗口布局\u003c/h2>\n\u003cp>窗口由左侧栏、中间区域、右侧面板和底部状态栏组成。\u003c/p>\n\u003cp>\u003cimg src=\"images/getting-started-layout.png\" alt=\"窗口布局总览：左侧栏、中间对话区、右侧面板与底部状态栏\"/>\u003c/p>\n\u003ch3 id=\"左侧栏\">左侧栏\u003c/h3>\n\u003cp>左侧栏管理所有会话，按 \u003ccode>⌘B\u003c/code> 收起或展开。\u003c/p>\n\u003cul>\n\u003cli>顶部：当前\u003cstrong>空间\u003c/strong>名称（点击切换，见\u003ca href=\"#/zh/02-sessions-and-chat/%E7%A9%BA%E9%97%B4\">空间\u003c/a>），以及 \u003cstrong>收件箱\u003c/strong>、\u003cstrong>搜索\u003c/strong>（\u003ccode>⌘F\u003c/code>）、\u003cstrong>收起左侧栏\u003c/strong> 三个按钮。\u003c/li>\n\u003cli>导航区：\u003cstrong>新建会话\u003c/strong>（\u003ccode>⌘N\u003c/code>）、\u003cstrong>定时任务\u003c/strong>、\u003cstrong>Skills 管理\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>项目\u003c/strong> 区：你添加的项目目录，每个目录下是它的会话，可再按分支或工作树分组。\u003c/li>\n\u003cli>底部：\u003cstrong>设置\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"中间区域\">中间区域\u003c/h3>\n\u003cp>中间默认显示当前会话：顶栏是会话标题和操作按钮（分享与导出、终端、想法），下面是消息流和输入框。\u003cstrong>收件箱\u003c/strong>、\u003cstrong>定时任务\u003c/strong>、\u003cstrong>Skills 管理\u003c/strong>、文档编辑和设置会占用中间区域，并出现\u003cstrong>返回\u003c/strong>按钮（也可按 \u003ccode>Esc\u003c/code> 或 \u003ccode>⌘[\u003c/code>）。\u003c/p>\n\u003ch3 id=\"右侧面板\">右侧面板\u003c/h3>\n\u003cp>右侧面板以标签页形式提供辅助工具，按 \u003ccode>⌘J\u003c/code> 收起或展开。点击标签栏末尾的 \u003cstrong>打开新标签页\u003c/strong> 添加标签。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>标签\u003c/th>\u003cth>用途\u003c/th>\u003cth>详见\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>辅助对话\u003c/td>\u003ctd>不打断主会话的侧聊\u003c/td>\u003ctd>\u003ca href=\"#/zh/02-sessions-and-chat/%E8%BE%85%E5%8A%A9%E5%AF%B9%E8%AF%9D\">第 2 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>文件\u003c/td>\u003ctd>浏览项目文件\u003c/td>\u003ctd>\u003ca href=\"#/zh/03-workspace\">第 3 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Git\u003c/td>\u003ctd>变更、工作树、时光机\u003c/td>\u003ctd>\u003ca href=\"#/zh/03-workspace\">第 3 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>终端\u003c/td>\u003ctd>项目目录下的命令行\u003c/td>\u003ctd>\u003ca href=\"#/zh/03-workspace\">第 3 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>文件预览\u003c/td>\u003ctd>预览或编辑单个文件\u003c/td>\u003ctd>\u003ca href=\"#/zh/03-workspace\">第 3 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>计划\u003c/td>\u003ctd>规划模式下自动出现的计划\u003c/td>\u003ctd>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%B7%BB%E5%8A%A0%E8%8F%9C%E5%8D%95\">第 2 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>服务\u003c/td>\u003ctd>本机端口与进程\u003c/td>\u003ctd>\u003ca href=\"#/zh/06-monitoring-and-mobile\">第 6 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Token 用量\u003c/td>\u003ctd>用量热力图与会话体检\u003c/td>\u003ctd>\u003ca href=\"#/zh/06-monitoring-and-mobile\">第 6 章\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>在 \u003cstrong>收件箱\u003c/strong>、\u003cstrong>定时任务\u003c/strong>、\u003cstrong>Skills 管理\u003c/strong> 页面，中间区域占满宽度，右侧面板会隐藏。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"底部状态栏\">底部状态栏\u003c/h3>\n\u003cp>底部状态栏显示当前会话的轮数与步数、缓存命中率、\u003cstrong>性能\u003c/strong>（内存占用，点击查看各进程明细）、omp 版本（点击打开 \u003cstrong>设置 ▸ 版本与更新\u003c/strong>）、界面缩放按钮，以及当前 Git 分支（点击打开 Git 面板）。\u003c/p>\n\u003ch2 id=\"开始第一个会话\">开始第一个会话\u003c/h2>\n\u003col>\n\u003cli>在左侧栏顶部确认当前空间。\u003cstrong>Universal\u003c/strong> 空间不需要项目；其他空间（Code、Work、Study、Research）按项目组织会话。\u003c/li>\n\u003cli>如果当前空间还没有项目，首页会显示 \u003cstrong>选择项目目录\u003c/strong>：点击它，选择一个本地文件夹，该目录会被添加到当前空间并立即准备好一个新会话。\u003c/li>\n\u003cli>在输入框里写下需求。输入框提示为「输入你的需求，Enter 发送」；开始输入的第一个字符就会启动会话。\u003c/li>\n\u003cli>按 \u003ccode>Enter\u003c/code> 发送。Agent 开始工作后，消息流会实时显示思考、工具调用和回复。\u003c/li>\n\u003c/ol>\n\u003cp>之后随时可以点击 \u003cstrong>新建会话\u003c/strong> 或按 \u003ccode>⌘N\u003c/code> 再开一个会话：它会使用当前所选会话所属的项目，没有选中会话时使用该空间最近用过的项目。\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>没点输入框也没关系：焦点不在其他输入控件或弹窗里时，直接打字，文字会进入当前会话的输入框。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cimg src=\"images/getting-started-first-session.png\" alt=\"首页：选择项目目录并开始输入第一条消息\"/>\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>如果首页提示「会话没启动成功，点此重试」，点击该按钮重新创建；仍失败时检查 omp 是否可用，见\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E5%B8%B8%E8%A7%81%E9%97%AE%E9%A2%98\">常见问题\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"登录模型供应商\">登录模型供应商\u003c/h2>\n\u003cp>会话需要至少一个可用的模型供应商。三种入口任选其一：\u003c/p>\n\u003cul>\n\u003cli>打开 \u003cstrong>设置 ▸ 模型与供应商\u003c/strong>，使用 \u003cstrong>添加供应商\u003c/strong>、\u003cstrong>OAuth 登录\u003c/strong>，或 \u003cstrong>导入 / 导出\u003c/strong> 菜单里的「一键导入 OMP 供应商」（把 OMP 已配置的密钥加密导入工作台）。\u003c/li>\n\u003cli>在输入框里输入 \u003ccode>/login\u003c/code>，选择 \u003cstrong>登录\u003c/strong>，直接跳到上述页面。\u003c/li>\n\u003cli>如果你已经在终端里用 \u003ccode>omp\u003c/code> 登录过，通常无需重复配置。\u003c/li>\n\u003c/ul>\n\u003cp>API 密钥由系统钥匙串加密后保存在 \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>，明文只在内存中出现。详细配置见\u003ca href=\"#/zh/05-settings-and-models\">第 5 章\u003c/a>。\u003c/p>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cul>\n\u003cli>学习会话列表和输入框的全部用法：\u003ca href=\"#/zh/02-sessions-and-chat\">会话与对话\u003c/a>\u003c/li>\n\u003cli>查看文件、Git 与终端：\u003ca href=\"#/zh/03-workspace\">工作区\u003c/a>\u003c/li>\n\u003cli>速查快捷键、排查问题：\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting\">快捷键与问题排查\u003c/a>\u003c/li>\n\u003c/ul>"},{"slug":"02-sessions-and-chat","title":"会话与对话","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-sidebar.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-composer.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-side-chat.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-tool-cards.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-share-image.png\"/>\u003ch1 id=\"会话与对话\">会话与对话\u003c/h1>\n\u003cblockquote>\n\u003cp>管理会话列表、写消息、查看 Agent 的工作过程，并用辅助对话、批注和分享把结果用起来。\u003c/p>\n\u003c/blockquote>\n\u003cp>在本章你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%B5%8F%E8%A7%88%E5%92%8C%E7%AE%A1%E7%90%86%E4%BC%9A%E8%AF%9D\">浏览和管理会话\u003c/a>：空间、分组、状态、搜索、归档\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E5%BC%80%E5%A7%8B%E6%96%B0%E4%BC%9A%E8%AF%9D\">开始新会话\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E5%9C%A8%E8%BE%93%E5%85%A5%E6%A1%86%E9%87%8C%E5%86%99%E6%B6%88%E6%81%AF\">在输入框里写消息\u003c/a>：发送方式、附件、\u003ccode>@\u003c/code> 与 \u003ccode>/\u003c/code>、模型与思考等级\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%89%B9%E6%B3%A8%E4%B8%8E%E5%BC%95%E7%94%A8\">批注与引用\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E8%BE%85%E5%8A%A9%E5%AF%B9%E8%AF%9D\">使用辅助对话\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%9F%A5%E7%9C%8B%E5%AF%B9%E8%AF%9D%E4%B8%8E%E5%A4%84%E7%90%86%E5%AE%A1%E6%89%B9\">查看对话与处理审批\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%9F%A5%E7%9C%8B%E4%B8%8A%E4%B8%8B%E6%96%87%E7%94%A8%E9%87%8F\">查看上下文用量\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E5%88%86%E4%BA%AB%E4%B8%8E%E5%AF%BC%E5%87%BA\">分享与导出\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"浏览和管理会话\">浏览和管理会话\u003c/h2>\n\u003ch3 id=\"空间\">空间\u003c/h3>\n\u003cp>左侧栏顶部显示当前\u003cstrong>空间\u003c/strong>的名称（鼠标悬停提示「Code 模式 (点击切换)」），点击后在 \u003cstrong>切换模式\u003c/strong> 菜单中选择：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>空间\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Code\u003c/td>\u003ctd>代码项目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Work\u003c/td>\u003ctd>工作类项目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Study\u003c/td>\u003ctd>学习类项目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Research\u003c/td>\u003ctd>研究类项目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Universal\u003c/td>\u003ctd>不属于任何项目的通用对话\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>每个空间有独立的项目与会话，互不共享；切换到另一个空间时，列表里只显示该空间的内容。其他空间里有会话在运行时，菜单里会出现提示点。\u003c/p>\n\u003ch3 id=\"会话列表的结构\">会话列表的结构\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>项目\u003c/strong> 区：点击 \u003cstrong>项目\u003c/strong> 标题旁的 \u003ccode>+\u003c/code>（\u003cstrong>添加工作区目录\u003c/strong>）添加本地目录。每个项目是一个分组，可折叠。\u003c/li>\n\u003cli>项目分组右侧的 \u003ccode>+\u003c/code>（\u003cstrong>新建会话（选择当前目录或独立工作树）\u003c/strong>）弹出 \u003cstrong>新建会话选项\u003c/strong>：\u003cstrong>在当前目录创建\u003c/strong>，或 \u003cstrong>在独立工作树创建\u003c/strong>（后者仅在开启 \u003cstrong>按工作树区分会话\u003c/strong> 时出现，见\u003ca href=\"#/zh/02-sessions-and-chat/%E5%BC%80%E5%A7%8B%E6%96%B0%E4%BC%9A%E8%AF%9D\">开始新会话\u003c/a>）。\u003c/li>\n\u003cli>在 Code 空间，如果打开了 \u003cstrong>设置 ▸ 会话 ▸ 按工作树区分会话\u003c/strong>，项目内的会话还会按 Git 工作树 / 分支再分组。关闭后平铺显示。\u003c/li>\n\u003cli>Universal 空间没有项目：会话直接列出，也可以用 \u003cstrong>新建分组\u003c/strong> 建立分组，并通过会话右键菜单的 \u003cstrong>移到分组\u003c/strong> 归类。\u003c/li>\n\u003cli>置顶的会话带有 \u003cstrong>已置顶\u003c/strong> 图标。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-sidebar.png\" alt=\"左侧栏：空间、项目分组、会话状态标记与搜索\"/>\u003c/p>\n\u003ch3 id=\"会话状态\">会话状态\u003c/h3>\n\u003cp>每行会话的标题旁会显示状态标记，中间区域顶栏的状态点悬停时显示对应名称：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态\u003c/th>\u003cth>列表中的标记\u003c/th>\u003cth>含义\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>运行中\u003c/td>\u003ctd>旋转图标\u003c/td>\u003ctd>Agent 正在工作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>待批准 / 待回答\u003c/td>\u003ctd>蓝色 \u003cstrong>待回复\u003c/strong> 标签\u003c/td>\u003ctd>需要你批准工具调用，或回答 Agent 的提问\u003c/td>\u003c/tr>\u003ctr>\u003ctd>待验收\u003c/td>\u003ctd>行尾蓝色未读点\u003c/td>\u003ctd>一轮工作结束，等你确认；右键菜单有 \u003cstrong>验收并归档\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>空闲\u003c/td>\u003ctd>无\u003c/td>\u003ctd>没有进行中的工作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>出错\u003c/td>\u003ctd>红点（\u003cstrong>异常\u003c/strong>）\u003c/td>\u003ctd>会话因错误停止\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已中断\u003c/td>\u003ctd>红点（\u003cstrong>已中断\u003c/strong>）\u003c/td>\u003ctd>进程意外退出；右键菜单 \u003cstrong>恢复会话\u003c/strong> 接着运行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>已挂起\u003c/td>\u003ctd>无\u003c/td>\u003ctd>闲置一段时间后被休眠以省内存，发送消息时自动恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>外部\u003c/td>\u003ctd>无\u003c/td>\u003ctd>由终端里的 \u003ccode>omp\u003c/code> 运行；右键菜单 \u003cstrong>接管会话\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>\u003cstrong>接管会话\u003c/strong> 会终止终端里原来的 omp 进程（先 SIGTERM，5 秒内未退出则强制结束），再由本应用恢复该会话，可能丢失尚未落盘的状态。操作前会弹出 \u003cstrong>接管外部会话\u003c/strong> 确认框。\u003c/p>\n\u003c/blockquote>\n\u003cp>闲置休眠时间在 \u003cstrong>设置 ▸ 会话 ▸ 闲置多久后休眠（分钟）\u003c/strong> 调整。\u003c/p>\n\u003ch3 id=\"搜索会话\">搜索会话\u003c/h3>\n\u003cp>按 \u003ccode>⌘F\u003c/code>（或点击 \u003cstrong>搜索\u003c/strong>），在搜索框输入关键词。多个关键词用空格分隔，需要同时匹配；匹配范围包括标题、标签、分支、工作树、模型、最近一条助手回复和目录名。没有结果时显示「未找到匹配会话」，如果只有已归档会话匹配，会给出一键显示的提示。\u003c/p>\n\u003ch3 id=\"置顶归档与删除\">置顶、归档与删除\u003c/h3>\n\u003cp>在会话行右键，或点击行末的 \u003cstrong>操作菜单\u003c/strong>，可使用：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>菜单项\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>重命名\u003c/td>\u003ctd>修改标题（也可在顶栏双击标题）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>置顶会话 / 取消置顶\u003c/td>\u003ctd>固定到列表前部\u003c/td>\u003c/tr>\u003ctr>\u003ctd>归档会话 / 取消归档\u003c/td>\u003ctd>移出列表；归档后顶部会出现 \u003cstrong>撤销\u003c/strong> 条\u003c/td>\u003c/tr>\u003ctr>\u003ctd>归入工作区\u003c/td>\u003ctd>手动指定会话所属的项目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>移到分组\u003c/td>\u003ctd>仅 Universal 空间\u003c/td>\u003c/tr>\u003ctr>\u003ctd>诊断此会话\u003c/td>\u003ctd>打开诊断对话框，见\u003ca href=\"#/zh/06-monitoring-and-mobile\">第 6 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复制会话 ID / 复制分支名\u003c/td>\u003ctd>复制到剪贴板\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在访达中打开\u003c/td>\u003ctd>打开会话所在目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重启会话\u003c/td>\u003ctd>启动或重启该会话的 omp 进程，历史保留\u003c/td>\u003c/tr>\u003ctr>\u003ctd>删除会话\u003c/td>\u003ctd>永久删除，不可恢复\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>归档默认隐藏：在搜索栏旁的 \u003cstrong>过滤与显示设置\u003c/strong> 里勾选 \u003cstrong>显示已归档会话\u003c/strong> 可查看；这里还有 \u003cstrong>全部展开\u003c/strong> / \u003cstrong>全部折叠\u003c/strong>。\u003c/p>\n\u003cp>如果会话关联了 Git 工作树，归档时会弹出 \u003cstrong>归档会话与工作树清理\u003c/strong>，可选择 \u003cstrong>仅归档会话 (保留工作树)\u003c/strong> 或 \u003cstrong>归档并清理工作树\u003c/strong>。\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>\u003cstrong>删除会话\u003c/strong> 会同时删除对话记录文件，无法恢复。要保留记录，请使用归档。\u003c/p>\n\u003c/blockquote>\n\u003cp>按住 \u003ccode>⌘\u003c/code>（Windows/Linux 为 \u003ccode>Ctrl\u003c/code>）点击多个会话，或按住 \u003ccode>Shift\u003c/code> 点击选择一段范围，之后的右键菜单可批量归档、置顶、移到分组或删除。\u003c/p>\n\u003ch3 id=\"用键盘操作列表\">用键盘操作列表\u003c/h3>\n\u003cp>点击会话列表使其获得焦点后：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>按键\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>移动高亮并切换到该会话（略有延迟，连按不会频繁切换）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>打开高亮会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> \u003ccode>→\u003c/code>\u003c/td>\u003ctd>折叠 / 展开高亮会话所在的分组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Delete\u003c/code> / \u003ccode>Backspace\u003c/code>\u003c/td>\u003ctd>归档\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Delete\u003c/code>\u003c/td>\u003ctd>永久删除（会先确认）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>F2\u003c/code>\u003c/td>\u003ctd>重命名\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+F10\u003c/code> 或菜单键\u003c/td>\u003ctd>打开操作菜单\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"开始新会话\">开始新会话\u003c/h2>\n\u003ch3 id=\"从新建会话开始\">从新建会话开始\u003c/h3>\n\u003cp>点击 \u003cstrong>新建会话\u003c/strong> 或按 \u003ccode>⌘N\u003c/code>：应用在当前空间打开一个空白草稿。Universal 使用全局工作区；其他空间使用当前所选会话所属的项目，没有选中会话时使用最近用过的项目。如果该空间还没有任何项目，首页会让你先 \u003cstrong>选择项目目录\u003c/strong>。\u003c/p>\n\u003cp>空白草稿在你没输入任何内容就离开时会自动清除，不会在列表里留下空会话；写了文字或附了图片的草稿会保留。\u003c/p>\n\u003cp>在会话还没有消息时，输入框上沿会显示两个小标签：左侧是 \u003cstrong>项目\u003c/strong>（点击切换工作区，或选择 \u003cstrong>新建工作区\u003c/strong>、\u003cstrong>全局模式 (不关联项目)\u003c/strong>），右侧是 \u003cstrong>Git 分支\u003c/strong>（可搜索并切换分支，或 \u003cstrong>创建并检出新分支\u003c/strong>，也能转到已有工作树）。\u003c/p>\n\u003ch3 id=\"在独立工作树中创建\">在独立工作树中创建\u003c/h3>\n\u003cp>Git 项目可以把每个会话放进自己的工作树，多个会话并行修改同一仓库而不互相覆盖：\u003c/p>\n\u003col>\n\u003cli>点击项目分组的 \u003ccode>+\u003c/code>，选择 \u003cstrong>在独立工作树创建\u003c/strong>（需开启 \u003cstrong>按工作树区分会话\u003c/strong>，且项目有 Git 工作树支持；否则该项不出现或不可用）。\u003c/li>\n\u003cli>在 \u003cstrong>新建工作树会话\u003c/strong> 对话框中确认 \u003cstrong>从哪个分支分出\u003c/strong>、\u003cstrong>新分支名前缀\u003c/strong>（如 \u003ccode>omp/\u003c/code>）和 \u003cstrong>工作树目录名\u003c/strong>。\u003c/li>\n\u003cli>点击 \u003cstrong>创建\u003c/strong>（或按 \u003ccode>⌘Enter\u003c/code>）。\u003c/li>\n\u003c/ol>\n\u003cp>工作树放在 \u003ccode>&lt;项目&gt;/.worktrees/&lt;名称&gt;\u003c/code>。更多 Git 与工作树操作见\u003ca href=\"#/zh/03-workspace\">第 3 章\u003c/a>。\u003c/p>\n\u003ch3 id=\"用-new-与-fork\">用 \u003ccode>/new\u003c/code> 与 \u003ccode>/fork\u003c/code>\u003c/h3>\n\u003cp>在输入框中，\u003ccode>/new\u003c/code> 在当前目录开一个新会话；\u003ccode>/fork\u003c/code> 复制当前对话为新会话，后面可以直接带第一条消息。\u003c/p>\n\u003ch2 id=\"在输入框里写消息\">在输入框里写消息\u003c/h2>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-composer.png\" alt=\"输入框：添加菜单、模型与思考等级、上下文占用与发送按钮\"/>\u003c/p>\n\u003ch3 id=\"发送与换行\">发送与换行\u003c/h3>\n\u003cp>默认 \u003ccode>Enter\u003c/code> 发送、\u003ccode>Shift+Enter\u003c/code> 换行。可在 \u003cstrong>设置 ▸ 会话 ▸ 发送方式 ▸ 发送快捷键\u003c/strong> 改为 \u003cstrong>⌘ Enter 发送\u003c/strong>，此时 \u003ccode>Enter\u003c/code> 换行。输入法正在组词时不会触发发送。在列表中换行时，\u003ccode>Enter\u003c/code> 会自动延续 Markdown 列表，\u003ccode>Tab\u003c/code> / \u003ccode>Shift+Tab\u003c/code> 调整缩进。\u003c/p>\n\u003cp>在空输入框按 \u003ccode>↑\u003c/code> 可以调出之前发过的消息，继续按 \u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code> 翻看。\u003c/p>\n\u003ch3 id=\"任务进行中发送新消息\">任务进行中发送新消息\u003c/h3>\n\u003cp>Agent 还在回复时发出的消息怎么处理，由 \u003cstrong>设置 ▸ 会话 ▸ 发送方式 ▸ 任务进行中发送新消息\u003c/strong> 决定：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>选项\u003c/th>\u003cth>效果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>引导\u003c/td>\u003ctd>立即插入当前回合，Agent 据此调整（默认）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>排队\u003c/td>\u003ctd>等当前回合结束后依次发送\u003c/td>\u003c/tr>\u003ctr>\u003ctd>打断后发送\u003c/td>\u003ctd>先停止当前回合，再发送\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>按住 \u003ccode>⌥\u003c/code> 发送（默认 \u003ccode>⌥Enter\u003c/code>，发送快捷键为 ⌘ Enter 时是 \u003ccode>⌥⌘Enter\u003c/code>）可对单条消息临时换一种方式：引导与排队互换，「打断后发送」换成排队。\u003c/p>\n\u003cp>排队的消息在消息流中显示为灰色的「排队中」气泡，可立即发送或移出；输入框右下的 \u003cstrong>排队 N\u003c/strong> 可查看暂存的消息，\u003cstrong>排队队列\u003c/strong> 栏里可以合并发送、逐条确认、上移 / 下移或清空。\u003cstrong>设置 ▸ 会话 ▸ 排队消息自动发送\u003c/strong> 控制是否在回合结束后自动逐条发送。\u003c/p>\n\u003cp>点击 \u003cstrong>停止当前回合\u003c/strong>（或按 \u003ccode>Esc\u003c/code>）终止生成。\u003c/p>\n\u003ch3 id=\"添加菜单\">添加菜单\u003c/h3>\n\u003cp>点击输入框左下角的 \u003ccode>+\u003c/code>（\u003cstrong>添加\u003c/strong>）：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>文件\u003c/td>\u003ctd>从电脑选择文件并附加\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finder 选中项\u003c/td>\u003ctd>附加当前在访达中选中的文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在项目中工作\u003c/td>\u003ctd>为新聊天选择项目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>目标\u003c/td>\u003ctd>设置要持续追求的目标\u003c/td>\u003c/tr>\u003ctr>\u003ctd>规划模式\u003c/td>\u003ctd>先出计划再执行；开启后右侧会出现 \u003cstrong>计划\u003c/strong> 标签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>草图\u003c/td>\u003ctd>画一张草图作为图片附加\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>目标\u003c/strong> 生效后，输入框上方显示 \u003cstrong>目标\u003c/strong> 栏，可 \u003cstrong>暂停目标\u003c/strong> / \u003cstrong>恢复目标\u003c/strong>、\u003cstrong>编辑目标\u003c/strong> 或 \u003cstrong>清除目标\u003c/strong>。也可以用 \u003ccode>/goal &lt;目标描述 | pause | resume | off&gt;\u003c/code>。规划模式开启时，输入框上方有一个可点击关闭的标签；也可用 \u003ccode>/plan\u003c/code> 切换。\u003c/p>\n\u003ch3 id=\"附加图片与文件\">附加图片与文件\u003c/h3>\n\u003cul>\n\u003cli>直接粘贴或把图片拖进输入框：图片会保存到 \u003ccode>~/.omp-workspace/images/\u003c/code>，并以 \u003ccode>图片 #N\u003c/code> 标记插入光标位置。\u003c/li>\n\u003cli>拖入或用 \u003cstrong>文件\u003c/strong> 选择的非图片文件，以 \u003ccode>文件 #N\u003c/code> 标记插入，发送时 omp 读取原文件路径。\u003c/li>\n\u003cli>标记可以像文字一样移动或删除。发送前删除了标记但文件仍在附件列表里时，文件仍会随消息发送。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"草图\">草图\u003c/h3>\n\u003cp>选择 \u003cstrong>草图\u003c/strong> 打开草图编辑器：工具有 \u003cstrong>选择\u003c/strong>、\u003cstrong>画笔\u003c/strong>、\u003cstrong>文字\u003c/strong>、\u003cstrong>形状\u003c/strong>（直线、箭头、矩形、椭圆、三角形、菱形、星形、心形）和 \u003cstrong>橡皮\u003c/strong>，可 \u003cstrong>撤销\u003c/strong> / \u003cstrong>重做\u003c/strong>、换 \u003cstrong>画笔颜色\u003c/strong>。点击 \u003cstrong>附加草图\u003c/strong> 把它作为图片插入输入框。\u003c/p>\n\u003ch3 id=\"用--引用文件用--运行命令\">用 \u003ccode>@\u003c/code> 引用文件，用 \u003ccode>/\u003c/code> 运行命令\u003c/h3>\n\u003cul>\n\u003cli>输入 \u003ccode>@\u003c/code> 并继续输入文件名，从当前会话工作目录的文件列表中选择；按 \u003ccode>↑↓\u003c/code> 选择，\u003ccode>Tab\u003c/code> 或 \u003ccode>Enter\u003c/code> 确认，\u003ccode>Esc\u003c/code> 关闭。\u003c/li>\n\u003cli>输入 \u003ccode>/\u003c/code> 打开命令菜单。部分命令由应用直接执行，其余转发给 omp：\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分组\u003c/th>\u003cth>命令\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>会话\u003c/td>\u003ctd>\u003ccode>/new\u003c/code> \u003ccode>/fork\u003c/code> \u003ccode>/btw\u003c/code> \u003ccode>/rename\u003c/code> \u003ccode>/compact\u003c/code> \u003ccode>/handoff\u003c/code> \u003ccode>/shake\u003c/code> \u003ccode>/export\u003c/code> \u003ccode>/copy\u003c/code> \u003ccode>/retry\u003c/code> \u003ccode>/resume\u003c/code> \u003ccode>/plan\u003c/code> \u003ccode>/goal\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型\u003c/td>\u003ctd>\u003ccode>/model\u003c/code> \u003ccode>/thinking\u003c/code> \u003ccode>/fast\u003c/code> \u003ccode>/slow\u003c/code> \u003ccode>/advisor\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>状态\u003c/td>\u003ctd>\u003ccode>/status\u003c/code> \u003ccode>/context\u003c/code> \u003ccode>/usage\u003c/code> \u003ccode>/tools\u003c/code> \u003ccode>/jobs\u003c/code> \u003ccode>/stats\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>集成\u003c/td>\u003ctd>\u003ccode>/mcp\u003c/code> \u003ccode>/plugins\u003c/code> \u003ccode>/memory\u003c/code> \u003ccode>/browser\u003c/code> \u003ccode>/computer\u003c/code> \u003ccode>/extended-context\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>设置\u003c/td>\u003ctd>\u003ccode>/agents\u003c/code> \u003ccode>/approvals\u003c/code> \u003ccode>/login\u003c/code> \u003ccode>/settings\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>更多 OMP 命令\u003c/td>\u003ctd>\u003ccode>/init\u003c/code> \u003ccode>/share\u003c/code> \u003ccode>/review\u003c/code> \u003ccode>/changelog\u003c/code> \u003ccode>/security\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>技能\u003c/td>\u003ctd>\u003ccode>/skill:visualize\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>菜单里每个命令都有中文标题与说明（例如 \u003ccode>/compact\u003c/code> 是 \u003cstrong>压缩上下文\u003c/strong>，\u003ccode>/btw\u003c/code> 是 \u003cstrong>顺便问一句\u003c/strong>）。\u003c/p>\n\u003ch3 id=\"模型与思考等级\">模型与思考等级\u003c/h3>\n\u003cp>输入框底部工具栏显示当前模型。点击打开模型选择器：左侧是供应商，右侧是该供应商的模型，输入关键词会跨供应商搜索。切换成功后提示「已切换模型」。\u003c/p>\n\u003cp>模型名旁的思考等级芯片，可选项来自当前模型实际支持的等级（如 \u003ccode>off\u003c/code>、\u003ccode>low\u003c/code>、\u003ccode>medium\u003c/code>、\u003ccode>high\u003c/code> 等），各等级有一句说明。若模型不支持思考，显示 \u003cstrong>不支持思考\u003c/strong>；能思考但没有配置等级时显示 \u003cstrong>未配置思考等级\u003c/strong>，点击可去供应商设置补上。\u003c/p>\n\u003ch2 id=\"批注与引用\">批注与引用\u003c/h2>\n\u003cp>在消息流、文档或代码里选中一段文字，会弹出浮动工具条：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>按钮\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>批注\u003c/td>\u003ctd>为选中内容写一条批注，输入 \u003ccode>Enter\u003c/code> 确认；可选 \u003cstrong>主对话\u003c/strong> 或 \u003cstrong>辅助对话\u003c/strong> 作为目标\u003c/td>\u003c/tr>\u003ctr>\u003ctd>记到收集箱\u003c/td>\u003ctd>把选中文字存为想法，见\u003ca href=\"#/zh/04-automation\">第 4 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>发到主对话\u003c/td>\u003ctd>在辅助对话里选中文字时出现，放进主会话的输入框\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>批注以标签形式停靠在输入框上方，显示「N 条批注」，可 \u003cstrong>定位到原消息\u003c/strong>、\u003cstrong>编辑批注\u003c/strong>、\u003cstrong>删除批注\u003c/strong> 或 \u003cstrong>清空批注\u003c/strong>。发送时批注会连同原文被组织成清晰的引用块交给 Agent。\u003c/p>\n\u003ch2 id=\"辅助对话\">辅助对话\u003c/h2>\n\u003cp>辅助对话是主会话的分身：继承当前上下文，但在独立会话里提问，不打断主线。\u003c/p>\n\u003cul>\n\u003cli>点击右侧面板的 \u003cstrong>打开新标签页\u003c/strong> ▸ \u003cstrong>新辅助对话\u003c/strong>，或输入 \u003ccode>/btw 你的问题\u003c/code>（不带问题时只打开标签）。\u003c/li>\n\u003cli>在消息里选中文字，批注目标选 \u003cstrong>辅助对话\u003c/strong>，批注会暂存到辅助对话的输入框。\u003c/li>\n\u003cli>辅助对话也会出现在左侧栏，归在主会话下。最多支持 3 层嵌套，超出时提示「已达分支嵌套深度上限（3 层）」，请 \u003cstrong>新建主会话\u003c/strong>。\u003c/li>\n\u003cli>辅助对话右上角的 \u003cstrong>更多操作\u003c/strong> 菜单提供 \u003cstrong>在主视图打开\u003c/strong> 和 \u003cstrong>回传给父会话\u003c/strong>。\u003cstrong>回传给父会话\u003c/strong> 会让辅助对话整理出结论，确认后放进主对话输入框（不会自动发送）。回传方式可在 \u003cstrong>设置 ▸ 外观 ▸ 对话显示 ▸ 回传给父会话的方式\u003c/strong> 改为 \u003cstrong>手动选择\u003c/strong>。\u003c/li>\n\u003cli>按 \u003ccode>⌘[\u003c/code> 可从辅助对话回到父会话。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-side-chat.png\" alt=\"右侧面板中的辅助对话标签\"/>\u003c/p>\n\u003ch2 id=\"查看对话与处理审批\">查看对话与处理审批\u003c/h2>\n\u003ch3 id=\"工具卡与执行过程\">工具卡与执行过程\u003c/h3>\n\u003cp>Agent 的每个动作在消息流里是一张工具卡，动词随状态变化：\u003cstrong>正在读取\u003c/strong> → \u003cstrong>已读取\u003c/strong>，类似的还有搜索、查找、列出、运行、编辑、写入、更新待办、获取网页和子代理。长的执行步骤会折叠成「已处理 N 个步骤」，点击展开；思考内容显示为「思考」，模型思考时可显示最新两行（\u003cstrong>设置 ▸ 外观 ▸ 对话显示 ▸ 思考时显示最新两行\u003c/strong>）。运行类卡片提供 \u003cstrong>复制命令\u003c/strong> / \u003cstrong>复制输出\u003c/strong>，涉及文件的卡片可 \u003cstrong>打开文件\u003c/strong>。\u003c/p>\n\u003cp>消息区里有 \u003cstrong>对话问题导航\u003c/strong>，点击其中的条目可跳转到第 N 条问题。\u003c/p>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-tool-cards.png\" alt=\"消息流中的工具卡与执行步骤折叠\"/>\u003c/p>\n\u003ch3 id=\"批准与回答\">批准与回答\u003c/h3>\n\u003cp>Agent 需要许可时，消息流里出现审批卡：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>按钮\u003c/th>\u003cth>效果\u003c/th>\u003cth>快捷键\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>仅本次\u003c/td>\u003ctd>只允许这一次执行\u003c/td>\u003ctd>\u003ccode>y\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>本会话始终\u003c/td>\u003ctd>本会话内不再询问此工具\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>永久允许\u003c/td>\u003ctd>加入全局允许名单\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>拒绝\u003c/td>\u003ctd>拒绝本次执行\u003c/td>\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>本会话始终\u003c/strong> 与 \u003cstrong>永久允许\u003c/strong> 只在该请求提供了对应选项时出现。\u003c/p>\n\u003cp>Agent 向你提问时，输入框位置会换成提问面板：按数字键选择选项（多选题用数字或空格勾选），\u003ccode>←\u003c/code> \u003ccode>→\u003c/code> 切换问题，\u003ccode>Enter\u003c/code> 提交或进入下一题，\u003ccode>Esc\u003c/code> 取消提问；也可选 \u003cstrong>其他（自己填写）\u003c/strong>，或 \u003cstrong>跳过\u003c/strong>。默认的审批策略在 \u003cstrong>设置 ▸ 通用 ▸ 审批模式\u003c/strong> 调整。\u003c/p>\n\u003ch3 id=\"编辑已发送的消息\">编辑已发送的消息\u003c/h3>\n\u003cp>鼠标悬停在你发的消息上，点击 \u003cstrong>编辑并重新发送\u003c/strong>，修改后按 \u003ccode>⌘Enter\u003c/code>（或点 \u003cstrong>重新发送\u003c/strong>）。如果当时 Agent 还在生成，会先停止当前回合。注意这是把修改后的内容作为新消息发送，不会改写已有的历史。\u003c/p>\n\u003ch3 id=\"回复时间与撤回\">回复时间与撤回\u003c/h3>\n\u003cp>每条回复下方显示 \u003cstrong>回复时间\u003c/strong>，并可 \u003cstrong>复制回复\u003c/strong>。在每个模型请求下面还可以显示统计行（等第一个字、生成用时等），在 \u003cstrong>设置 ▸ 外观 ▸ 请求统计\u003c/strong> 打开。\u003c/p>\n\u003cp>打开 \u003cstrong>设置 ▸ 会话 ▸ 对话检查点 ▸ 每轮自动存档\u003c/strong> 后，应用会在每轮对话前用 Git 保存项目快照（只对之后在本应用里新开的对话生效）。此后回复下方会出现 \u003cstrong>撤回这一轮\u003c/strong>，可把这一轮改动的文件恢复到这一轮开始前的样子（这一轮新建的文件会被删除，之后的轮次也会被一并撤回）；还能点开 \u003cstrong>这一轮改了 N 个文件\u003c/strong>，在版本历史里查看存档。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>撤回只影响项目文件，Agent 下一轮会收到通知。若这些文件在这一轮之后又被改过，会先提示冲突，确认后才会覆盖。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"回合计时\">回合计时\u003c/h3>\n\u003cp>Agent 工作时，执行区显示「正在处理 Xs…」的实时计时；刚发出请求、模型尚未回应时显示「正在等待模型回复」。回合结束后折叠为「已处理」摘要（有用时则带上用时，否则显示步骤数）。窗口底部状态栏显示当前会话的轮数与步数，点击可打开 \u003cstrong>详细会话统计\u003c/strong>（模型用时、TTFT、TPS、Token 消耗）。\u003c/p>\n\u003ch2 id=\"查看上下文用量\">查看上下文用量\u003c/h2>\n\u003cp>输入框工具栏里的圆环表示上下文窗口占用百分比。点击展开面板：\u003c/p>\n\u003cul>\n\u003cli>顶部显示已用 token / 窗口大小，下方的分段条与列表按 \u003cstrong>系统工具\u003c/strong>、\u003cstrong>系统提示词\u003c/strong>、\u003cstrong>MCP 工具\u003c/strong>、\u003cstrong>Skills\u003c/strong>、\u003cstrong>规则文件\u003c/strong>、\u003cstrong>对话消息\u003c/strong>、\u003cstrong>其他\u003c/strong>、\u003cstrong>剩余空间\u003c/strong> 拆分，并可展开 \u003cstrong>MCP 工具\u003c/strong>、\u003cstrong>Skills\u003c/strong>、\u003cstrong>规则文件\u003c/strong> 的明细。\u003c/li>\n\u003cli>\u003cstrong>查看系统提示词构成\u003c/strong> 跳转到 \u003cstrong>设置 ▸ 系统提示词构成\u003c/strong>，查看每次请求都会带上哪些内容，并可让 AI 帮你精简。\u003c/li>\n\u003cli>\u003cstrong>压缩\u003c/strong> 按钮压缩上下文（回合进行中不可用）；也可输入 \u003ccode>/compact\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>上下文接近上限时先试 \u003ccode>/compact\u003c/code>；只想丢掉工具结果等大块内容而不调用模型，用 \u003ccode>/shake\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"分享与导出\">分享与导出\u003c/h2>\n\u003cp>点击中间顶栏的 \u003cstrong>分享与导出\u003c/strong>：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>项\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>选择消息分享为图片\u003c/td>\u003ctd>勾选消息，\u003cstrong>生成图片\u003c/strong> 后可 \u003cstrong>复制图片\u003c/strong> 或 \u003cstrong>保存图片\u003c/strong>（PNG）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>创建分享链接\u003c/td>\u003ctd>把会话加密上传到 OMP 分享服务，拿到链接的任何人都能查看；已知密钥会自动脱敏。会先确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>复制为 Markdown\u003c/td>\u003ctd>复制整场对话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>导出为 HTML\u003c/td>\u003ctd>导出为独立 HTML 文件并在访达中显示\u003c/td>\u003c/tr>\u003ctr>\u003ctd>手机扫码查看\u003c/td>\u003ctd>手机与电脑在同一局域网时扫码查看，详见\u003ca href=\"#/zh/06-monitoring-and-mobile\">第 6 章\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>选择消息时底部出现选择栏：\u003cstrong>全选\u003c/strong> / \u003cstrong>取消全选\u003c/strong>、\u003cstrong>取消\u003c/strong>、\u003cstrong>生成图片\u003c/strong>。\u003c/p>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-share-image.png\" alt=\"选择消息分享为图片的预览对话框\"/>\u003c/p>"},{"slug":"03-workspace","title":"工作区：文件、Git 与终端","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-right-panel-tabs.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-explorer-tree.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-doc-split.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-git-panel.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-git-history.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-terminal.png\"/>\u003ch1 id=\"工作区文件git-与终端\">工作区：文件、Git 与终端\u003c/h1>\n\u003cblockquote>\n\u003cp>在右侧面板里浏览项目文件、预览和编辑文档、管理 Git 工作树与历史版本，并在不离开 omp-workspace 的情况下使用终端。\u003c/p>\n\u003c/blockquote>\n\u003cp>你可以：\u003c/p>\n\u003cul>\n\u003cli>在 \u003ca href=\"#/zh/03-workspace/%E6%B5%8F%E8%A7%88%E9%A1%B9%E7%9B%AE%E6%96%87%E4%BB%B6\">文件\u003c/a> 里浏览、搜索工作区文件\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/03-workspace/%E9%A2%84%E8%A7%88%E4%B8%8E%E7%BC%96%E8%BE%91%E6%96%87%E4%BB%B6\">文件预览与文档视图\u003c/a> 中阅读、编辑文件，并在 Markdown 上写批注\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/03-workspace/%E6%9F%A5%E7%9C%8B%E5%92%8C%E7%AE%A1%E7%90%86-git\">Git 面板\u003c/a> 查看改动、存档、管理工作树与分支\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/03-workspace/%E5%9B%9E%E5%88%B0%E5%8E%86%E5%8F%B2%E7%89%88%E6%9C%AC\">版本历史\u003c/a> 预览或回退到旧版本\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/03-workspace/%E4%BD%BF%E7%94%A8%E7%BB%88%E7%AB%AF\">终端\u003c/a> 中运行命令\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/03-workspace/%E5%9C%A8%E5%85%B6%E4%BB%96%E5%BA%94%E7%94%A8%E4%B8%AD%E6%89%93%E5%BC%80\">系统应用\u003c/a> 打开文件或在访达中显示\u003c/li>\n\u003c/ul>\n\u003cp>这些功能都位于\u003cstrong>右侧面板\u003c/strong>（顶部是一排标签页）和中央的\u003cstrong>文档\u003c/strong>视图中。右侧面板的显示/收起快捷键是 \u003ccode>⌘J\u003c/code>，见 \u003ca href=\"#/zh/07-shortcuts-and-troubleshooting\">快捷键\u003c/a>。\u003c/p>\n\u003ch2 id=\"认识右侧面板标签页\">认识右侧面板标签页\u003c/h2>\n\u003cp>右侧面板像浏览器一样用标签页组织。点击标签栏末尾的 \u003cstrong>+\u003c/strong>（「打开新标签页」）可以添加以下标签：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>标签\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>文件\u003c/strong>\u003c/td>\u003ctd>当前工作区的文件树\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Git\u003c/strong>\u003c/td>\u003ctd>改动、工作树、分支、版本历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>终端\u003c/strong>\u003c/td>\u003ctd>命令行终端，可开多个\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>文件预览\u003c/strong>\u003c/td>\u003ctd>在对话中点击文件路径时打开，每个文件一个标签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>辅助对话\u003c/strong>\u003c/td>\u003ctd>依附当前会话的侧边对话，见 \u003ca href=\"#/zh/02-sessions-and-chat\">会话与对话\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>服务\u003c/strong>\u003c/td>\u003ctd>运行中的服务和端口，见 \u003ca href=\"#/zh/06-monitoring-and-mobile\">监控与手机访问\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Token 用量\u003c/strong>\u003c/td>\u003ctd>用量热力图，见 \u003ca href=\"#/zh/06-monitoring-and-mobile\">监控与手机访问\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>标签太多放不下时，多出的标签会收进 \u003cstrong>+N\u003c/strong> 溢出菜单（「全部标签页」）。点击标签上的关闭按钮（「关闭标签页」）可以关掉它。\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-right-panel-tabs.png\" alt=\"右侧面板的标签栏与 + 菜单\"/>\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>\u003cstrong>计划\u003c/strong> 标签不能手动添加，它会在规划模式下自动打开。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"浏览项目文件\">浏览项目文件\u003c/h2>\n\u003cp>打开右侧的 \u003cstrong>文件\u003c/strong> 标签即可看到当前工作区的文件树。顶部的工作区卡片显示工作区名称和路径；如果有多个工作区，点击卡片可以 \u003cstrong>切换工作区\u003c/strong>。卡片上的状态点会提示「工作区已就绪」，或显示未提交变更的数量。\u003c/p>\n\u003cp>工具栏按钮：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>按钮\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>搜索文件（\u003ccode>⌘F\u003c/code>）\u003c/td>\u003ctd>展开过滤输入框，输入文件名即可过滤；结果显示为「搜索结果 (N)」，较多时点 \u003cstrong>显示更多\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在访达中显示工作区目录\u003c/td>\u003ctd>在访达中打开工作区根目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>全部折叠\u003c/td>\u003ctd>折叠所有已展开的目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>刷新文件树\u003c/td>\u003ctd>重新读取目录\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>目录第一次展开时才会加载其内容。右键文件或目录（或点击行尾的 \u003cstrong>更多选项\u003c/strong>）可以：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>在访达中显示\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>复制相对路径\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>复制完整路径\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>刷新此目录\u003c/strong>（仅目录）\u003c/li>\n\u003c/ul>\n\u003cp>单击文件会在中央打开 \u003cstrong>文档\u003c/strong> 视图，见下一节。\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-explorer-tree.png\" alt=\"文件文件树与右键菜单\"/>\u003c/p>\n\u003ch2 id=\"预览与编辑文件\">预览与编辑文件\u003c/h2>\n\u003cp>omp-workspace 有两种查看文件的方式：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>文档视图\u003c/strong>：占据中央区域，从文件或 Git 改动列表打开。\u003c/li>\n\u003cli>\u003cstrong>文件预览标签\u003c/strong>：在右侧面板中，当你在对话里点击消息中的文件路径时打开。\u003c/li>\n\u003c/ul>\n\u003cp>两者都支持在磁盘上保存修改，并共用同一套逻辑：\u003c/p>\n\u003cul>\n\u003cli>有未保存修改时标题旁显示 \u003cstrong>未保存\u003c/strong>。\u003c/li>\n\u003cli>点击 \u003cstrong>保存\u003c/strong>（\u003ccode>⌘S\u003c/code>）写入磁盘。\u003c/li>\n\u003cli>点击 \u003cstrong>重新加载\u003c/strong> 可以从磁盘重新读取。\u003c/li>\n\u003cli>切回窗口时，如果文件已被外部程序修改，会出现「文件已在磁盘上被修改」提示；干净的缓冲区会静默更新，有未保存修改时你可以选择 \u003cstrong>重新加载\u003c/strong> 或 \u003cstrong>保留我的修改\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"在右侧预览文件\">在右侧预览文件\u003c/h3>\n\u003cp>文件预览标签用 \u003cstrong>查看方式\u003c/strong> 切换 \u003cstrong>预览\u003c/strong> 与 \u003cstrong>编辑\u003c/strong>：文本文件默认只读预览，切到 \u003cstrong>编辑\u003c/strong> 后使用代码编辑器（CodeMirror）。图片会直接显示，Markdown 预览沿用对话里的渲染方式，文档中的路径依然可以点击。\u003c/p>\n\u003cp>标签顶部还有两个快捷按钮：\u003cstrong>系统打开\u003c/strong>（用系统默认应用打开）和 \u003cstrong>访达\u003c/strong>（在访达中显示）。\u003c/p>\n\u003cp>没有打开任何文件时会提示「还没有打开的文件」——在对话里点击文件路径即可在此预览。\u003c/p>\n\u003ch3 id=\"在文档视图中阅读和编辑\">在文档视图中阅读和编辑\u003c/h3>\n\u003cp>文档视图提供三种布局，通过顶部的切换控件选择：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>布局\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>预览\u003c/strong>\u003c/td>\u003ctd>渲染后的 Markdown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>分栏\u003c/strong>\u003c/td>\u003ctd>左侧源码、右侧预览\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>编辑\u003c/strong>\u003c/td>\u003ctd>仅源码编辑器\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>点击 \u003cstrong>关闭\u003c/strong>（\u003ccode>Esc\u003c/code>）退出文档视图；有未保存修改时会询问是否「放弃并退出」。\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-doc-split.png\" alt=\"文档视图的分栏布局\"/>\u003c/p>\n\u003ch3 id=\"给文档写批注\">给文档写批注\u003c/h3>\n\u003cp>你可以把文档里的某段文字连同你的意见一并发给 Agent：\u003c/p>\n\u003col>\n\u003cli>在预览或编辑区域中划选一段文字，下方会出现「划选片段」条。\u003c/li>\n\u003cli>在输入框里写批注（可留空），选择目标会话——如果当前已有选中的会话则自动使用它，否则在 \u003cstrong>选择目标会话\u003c/strong> 下拉框里选一个。\u003c/li>\n\u003cli>点击 \u003cstrong>批注\u003c/strong>（\u003ccode>⌘Enter\u003c/code>）。\u003c/li>\n\u003c/ol>\n\u003cp>批注会被加入该会话的输入框草稿，你可以点击 \u003cstrong>前往会话查看\u003c/strong> 跳转过去，再决定何时发送。\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>同样的批注方式也适用于 Git 的 Diff 视图（见下文）和终端中选中的文字。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"查看和管理-git\">查看和管理 Git\u003c/h2>\n\u003cp>右侧的 \u003cstrong>Git\u003c/strong> 标签以当前所选会话的工作目录为准。如果没有选中会话，或会话没有工作目录，会提示「没有选中的会话，或该会话未关联工作目录」；如果目录不是仓库，会提示「不是 git 仓库」。面板每 10 秒自动刷新一次，也可以点击刷新按钮（\u003ccode>⌘R\u003c/code>）。\u003c/p>\n\u003cp>面板分为上下两部分，中间的分隔条可拖动调整高度：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>上半部分\u003c/strong>：用顶部的切换控件在 \u003cstrong>工作树\u003c/strong> 与 \u003cstrong>分支\u003c/strong> 之间切换。\u003c/li>\n\u003cli>\u003cstrong>下半部分\u003c/strong>：针对选中的工作树，用 \u003cstrong>改动\u003c/strong> 与 \u003cstrong>历史\u003c/strong> 两个标签查看详情。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/workspace-git-panel.png\" alt=\"Git 面板的工作树列表与改动详情\"/>\u003c/p>\n\u003ch3 id=\"查看并存档改动\">查看并存档改动\u003c/h3>\n\u003cp>\u003cstrong>改动\u003c/strong> 标签列出未提交的文件，每个文件显示状态（已修改、新增文件、已删除、已重命名、未跟踪新文件）和增删行数。\u003c/p>\n\u003cul>\n\u003cli>点击 \u003cstrong>全部 diff\u003c/strong> 打开 Diff 窗口，查看所有未提交改动。\u003c/li>\n\u003cli>每个文件行有按钮：\u003cstrong>在文档视图中打开\u003c/strong>（Markdown 文件）、\u003cstrong>复制相对路径\u003c/strong>、\u003cstrong>派发给 Agent 审查\u003c/strong>、\u003cstrong>撤销这个文件的改动\u003c/strong>（未跟踪文件则是 \u003cstrong>删除未跟踪文件\u003c/strong>）。右键文件还有 \u003cstrong>查看 Diff\u003c/strong>、\u003cstrong>复制完整路径\u003c/strong>、\u003cstrong>向 Agent 询问此改动\u003c/strong> 等选项。\u003c/li>\n\u003cli>撤销改动和删除未跟踪文件都会弹出确认框，且不可恢复。\u003c/li>\n\u003c/ul>\n\u003cp>要把改动存成一个版本，点击 \u003cstrong>存档：提交全部 N 个文件\u003c/strong>。提交说明由 AI 自动生成；也可以先点击自己写提交说明的按钮，输入说明后按 \u003ccode>⌘Enter\u003c/code> 存档。存档只会在本地提交，不会推送到远端。\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>如果 Agent 仍在修改这个工作树，存档可能只存下一半的改动。面板会显示相应提醒。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"在-diff-窗口中批注\">在 Diff 窗口中批注\u003c/h3>\n\u003cp>Diff 窗口支持：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>单栏合并视图（Unified）\u003c/strong> 与 \u003cstrong>双栏对比视图（Split）\u003c/strong> 切换，以及 \u003cstrong>自动换行\u003c/strong>。\u003c/li>\n\u003cli>左侧文件列表可以隐藏或显示，每个文件的 diff 可折叠。\u003c/li>\n\u003cli>选中若干行后点击行旁的 \u003cstrong>为此行添加批注\u003c/strong>，写下意见，然后选择：\u003cstrong>仅加到草稿\u003c/strong>（加入当前会话输入框草稿，窗口保持打开）、\u003cstrong>发给 Agent\u003c/strong>（立即发送）或 \u003cstrong>批注并关闭\u003c/strong>（\u003ccode>⌘Enter\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"使用工作树\">使用工作树\u003c/h3>\n\u003cp>工作树（worktree）是同一仓库在磁盘上的另一份独立文件夹，让多个任务并行修改代码而互不干扰。在 \u003cstrong>工作树\u003c/strong> 视图中：\u003c/p>\n\u003cul>\n\u003cli>每一行显示分支名、未提交数量、领先/落后主干的提交数、关联会话数；正在监听端口的工作树可点击端口在浏览器中预览。\u003c/li>\n\u003cli>行内按钮：\u003cstrong>提交全部改动\u003c/strong>（AI 生成说明）、\u003cstrong>在此工作树新建会话\u003c/strong>、\u003cstrong>更多操作\u003c/strong>。右键同样打开更多操作菜单。\u003c/li>\n\u003cli>点击标题栏的 \u003cstrong>新建并行工作树\u003c/strong>，输入名称（例如 \u003ccode>feat-auth\u003c/code>），按 \u003ccode>Enter\u003c/code> 创建；\u003cstrong>更多选项\u003c/strong> 可以展开完整的新建会话对话框，里面可选择从哪个分支分出、新分支名前缀等，见 \u003ca href=\"#/zh/02-sessions-and-chat\">会话与对话\u003c/a>。\u003c/li>\n\u003cli>列表下方还会显示「未建工作树的分支」，点击 \u003cstrong>建工作树\u003c/strong> 即可基于该分支创建。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>更多操作\u003c/strong> 菜单包含：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>从 main 同步\u003c/strong>\u003c/td>\u003ctd>把主干最新提交合并进此工作树，带冲突预检\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>同步并合入 main\u003c/strong>\u003c/td>\u003ctd>先合入主干，再把本地主干快进到此分支；仅本地，不推送\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>合并其他分支进来\u003c/strong>\u003c/td>\u003ctd>选择一个分支合并到此工作树\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>变基到 main\u003c/strong>\u003c/td>\u003ctd>重写此分支历史；已推送过则需要强制推送\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>交付/提PR\u003c/strong>\u003c/td>\u003ctd>按「主干交付模式」设置交付，见下文\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>查看相对 main 的总 diff\u003c/strong>\u003c/td>\u003ctd>此分支相对主干的全部提交改动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>在此工作树打开终端\u003c/strong>\u003c/td>\u003ctd>在该目录开一个终端\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>在文件管理器打开\u003c/strong>、\u003cstrong>复制路径\u003c/strong>、\u003cstrong>复制分支名\u003c/strong>\u003c/td>\u003ctd>常规辅助操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>丢弃全部未提交改动\u003c/strong>\u003c/td>\u003ctd>含未跟踪文件，不可撤销\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>删除工作树\u003c/strong>\u003c/td>\u003ctd>清理工作树，可选择一并删除分支；仍有关联会话时会自动归档这些会话\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>合并、同步、变基前会做冲突预检。预检发现冲突时，仓库保持原状，并询问是否 \u003cstrong>AI 辅助解冲突\u003c/strong>，选择后会新建一个会话，由 Agent 执行操作并解决冲突。\u003c/p>\n\u003cp>\u003cstrong>交付\u003c/strong> 的行为由 \u003cstrong>设置 → 通用 → Git → 主干交付模式\u003c/strong> 决定：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模式\u003c/th>\u003cth>行为\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>发起 Pull Request（推荐）\u003c/strong>\u003c/td>\u003ctd>推送到云端同名分支，并在浏览器中打开 GitHub 的 PR 创建页\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>本地合并并直接推送\u003c/strong>\u003c/td>\u003ctd>本地合并入主干后直接推送到 \u003ccode>origin/main\u003c/code>，无需 PR 审查\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>直接推送模式会修改正式主干，操作前会再次确认。\u003c/p>\n\u003c/blockquote>\n\u003cp>已没有任何会话关联的工作树会被标为「闲置」，Git 面板会出现 \u003cstrong>闲置工作树\u003c/strong> 提示条，可以 \u003cstrong>全部回收\u003c/strong>，也可以对某个仓库选择 \u003cstrong>对此仓库不再提醒\u003c/strong>。回收会删除工作树目录及其关联分支。\u003c/p>\n\u003ch3 id=\"管理分支\">管理分支\u003c/h3>\n\u003cp>切换到 \u003cstrong>分支\u003c/strong> 视图后，\u003cstrong>仓库分支资产\u003c/strong> 面板按 \u003cstrong>本地\u003c/strong> 与 \u003cstrong>云端 origin\u003c/strong> 分页列出分支，可按名称搜索。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>刷新云端\u003c/strong> 执行 \u003ccode>git fetch\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>清理已合并\u003c/strong> 一键删除已合并到主干的本地分支（会先列出并确认）。\u003c/li>\n\u003cli>每个分支会显示 \u003cstrong>仅本地\u003c/strong>、\u003cstrong>已同步\u003c/strong>、\u003cstrong>已合并\u003c/strong> 等状态，以及领先/落后云端的提交数。\u003c/li>\n\u003cli>分支行上的操作包括 \u003cstrong>查看工作树\u003c/strong>、推送到云端、交付、从 main 同步更新、建工作树、删除分支。正在被工作树使用的分支不能删除。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"回到历史版本\">回到历史版本\u003c/h2>\n\u003cp>\u003cstrong>历史\u003c/strong> 标签按天分组显示当前工作树的提交，可以搜索提交说明、作者或版本编号，滚动到底部点击 \u003cstrong>加载更多提交\u003c/strong> 继续加载。展开某个版本后，里面分成几行操作：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>行\u003c/th>\u003cth>操作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>看看\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>这一版改了什么\u003c/strong>：查看该版本的 diff\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>试试\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>时光机快照预览\u003c/strong>：在隔离的临时目录（\u003ccode>.worktrees/tm-xxxx\u003c/code>）中运行该版本的快照，不影响当前代码；也可以 \u003cstrong>用自定义命令运行\u003c/strong>，例如 \u003ccode>pnpm dev --port 5180\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>回到\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>回到这个版本\u003c/strong>：选择 \u003cstrong>保留之后的修改（推荐）\u003c/strong>——撤销之后的提交，文件里的修改保留为未提交改动；或 \u003cstrong>彻底丢弃之后的一切\u003c/strong>，之后的提交和所有未提交修改都会消失，无法恢复\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>运行中的快照会以卡片显示命令、地址和日志，可以 \u003cstrong>打开目录\u003c/strong>、\u003cstrong>停止\u003c/strong>、\u003cstrong>丢弃\u003c/strong>。\u003c/p>\n\u003cp>如果某个版本来自某一轮对话，展开后会显示「来自对话」并可以跳转回那一轮。\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-git-history.png\" alt=\"历史标签中展开的版本与时光机操作\"/>\u003c/p>\n\u003ch3 id=\"对话检查点\">对话检查点\u003c/h3>\n\u003cp>历史标签里可能会出现 \u003cstrong>开启对话检查点\u003c/strong> 提示。开启后，每轮对话会自动留底，改坏了可以一键撤回；Agent 完成并验证通过后会自动存档（不会推送到远端）。该设置只对之后新开的会话生效，点击 \u003cstrong>查看规则原文\u003c/strong> 可以看到注入的具体规则。选择 \u003cstrong>暂不\u003c/strong> 则不开启。\u003c/p>\n\u003ch2 id=\"使用终端\">使用终端\u003c/h2>\n\u003cp>终端标签提供真正的登录 shell，适合在 Agent 工作时手动输入命令、密钥或回答。\u003c/p>\n\u003cp>\u003cstrong>打开与切换\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>按 \u003ccode>⌘`\u003c/code>（Windows/Linux 为 \u003ccode>Ctrl+`\u003c/code>）切换终端标签；也可以点击中央标题栏的终端按钮，或在右侧标签栏 \u003cstrong>+\u003c/strong> 菜单里选择 \u003cstrong>新建终端\u003c/strong>。\u003c/li>\n\u003cli>终端以所选会话的工作目录启动。点击 \u003cstrong>+ 新建终端\u003c/strong> 总是创建新的终端标签，命名为「终端 1」「终端 2」……，最多同时打开 10 个。\u003c/li>\n\u003cli>每个终端的状态显示为 \u003cstrong>正在连接\u003c/strong>、\u003cstrong>已连接\u003c/strong>、\u003cstrong>已退出\u003c/strong> 或 \u003cstrong>启动失败\u003c/strong>。进程退出后会显示退出代码，并提供 \u003cstrong>重新连接\u003c/strong>；启动失败时点击 \u003cstrong>重试\u003c/strong>。\u003c/li>\n\u003cli>切换右侧标签页不会结束终端进程；关闭终端标签会终止其中正在运行的进程（有进程时会先确认「终止并关闭」）。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>常用操作\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>搜索\u003c/td>\u003ctd>在终端中搜索，支持大小写匹配、全字匹配、正则表达式；\u003ccode>Enter\u003c/code> 下一处，\u003ccode>Shift+Enter\u003c/code> 上一处，\u003ccode>Esc\u003c/code> 关闭\u003c/td>\u003c/tr>\u003ctr>\u003ctd>选中文本后点击 \u003cstrong>引用\u003c/strong>\u003c/td>\u003ctd>把选中内容加入当前会话的批注（\u003ccode>⌘⇧A\u003c/code>）；没有会话时变为 \u003cstrong>复制\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>发送到侧聊\u003c/strong>\u003c/td>\u003ctd>把选中的终端文本发给辅助对话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>右键菜单\u003c/td>\u003ctd>\u003cstrong>复制选中内容\u003c/strong>、\u003cstrong>粘贴至终端\u003c/strong>、\u003cstrong>清屏\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>标签上的 \u003cstrong>折叠为后台服务\u003c/strong> 按钮会把终端收起为后台服务，之后可在 \u003cstrong>服务\u003c/strong> 面板查看与恢复，见 \u003ca href=\"#/zh/06-monitoring-and-mobile\">监控与手机访问\u003c/a>。\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>在这里的终端里直接运行 \u003ccode>omp\u003c/code>、\u003ccode>claude\u003c/code> 或 \u003ccode>codex\u003c/code>，会接续当前选中会话的记录。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cimg src=\"images/workspace-terminal.png\" alt=\"命令终端与搜索栏\"/>\u003c/p>\n\u003ch2 id=\"在其他应用中打开\">在其他应用中打开\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>文件预览\u003c/strong> 标签顶部：\u003cstrong>系统打开\u003c/strong> 用系统默认应用打开文件，\u003cstrong>访达\u003c/strong> 在访达中显示。\u003c/li>\n\u003cli>\u003cstrong>文件\u003c/strong>：右键 \u003cstrong>在访达中显示\u003c/strong>，或点击工具栏的在访达中显示工作区目录。\u003c/li>\n\u003cli>\u003cstrong>Git 面板\u003c/strong>：工作树的更多操作里有 \u003cstrong>在文件管理器打开\u003c/strong>；工作树行也可以在右侧文件中打开该目录。\u003c/li>\n\u003cli>中央标题栏会话名旁的目录按钮会在访达中显示会话的工作目录。\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>这些入口调用的是系统默认应用，omp-workspace 不提供自选外部编辑器的设置。\u003c/p>\n\u003c/blockquote>"},{"slug":"04-automation","title":"自动化：定时任务、收件箱与技能","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-schedules-list.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-schedule-editor.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-inbox.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-ideas-panel.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-skills-list.png\"/>\u003ch1 id=\"自动化定时任务收件箱与技能\">自动化：定时任务、收件箱与技能\u003c/h1>\n\u003cblockquote>\n\u003cp>让 Agent 按计划自动工作，用收件箱集中处理需要你介入的事项，随手记下想法稍后派发，并管理 Agent 可用的技能与扩展。\u003c/p>\n\u003c/blockquote>\n\u003cp>你可以：\u003c/p>\n\u003cul>\n\u003cli>用 \u003ca href=\"#/zh/04-automation/%E5%88%9B%E5%BB%BA%E5%AE%9A%E6%97%B6%E4%BB%BB%E5%8A%A1\">定时任务\u003c/a> 在指定时间或周期自动向 Agent 发送指令\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/04-automation/%E5%A4%84%E7%90%86%E6%94%B6%E4%BB%B6%E7%AE%B1\">收件箱\u003c/a> 里集中处理待审批、提问、报错、中断和未读的会话\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/04-automation/%E6%94%B6%E9%9B%86%E6%83%B3%E6%B3%95\">想法收集\u003c/a> 随手记录，之后一键派给 Agent\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/04-automation/%E7%AE%A1%E7%90%86%E6%8A%80%E8%83%BD%E4%B8%8E%E6%89%A9%E5%B1%95\">Skills 管理\u003c/a> 里查看、启用、停用 Skill 与扩展\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"创建定时任务\">创建定时任务\u003c/h2>\n\u003cp>定时任务会按预设时间自动向 Agent 发送指令，运行结果同步到收件箱。点击侧边栏的 \u003cstrong>定时任务\u003c/strong> 打开列表页。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>定时任务依赖本地进程调度，应用需保持运行才能按时触发；错过的时间会在启动时补跑一次。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"任务列表\">任务列表\u003c/h3>\n\u003cp>任务按 \u003cstrong>即将运行\u003c/strong>、\u003cstrong>已暂停\u003c/strong>、\u003cstrong>已完成\u003c/strong> 分组，可用搜索框和状态筛选（\u003cstrong>全部\u003c/strong>、\u003cstrong>运行中\u003c/strong>、\u003cstrong>已暂停\u003c/strong>、\u003cstrong>已完成\u003c/strong>）缩小范围。列表为空时可以点击 \u003cstrong>创建第一个任务\u003c/strong>，或从常用模板快速创建：\u003c/p>\n\u003cul>\n\u003cli>每天早上总结昨天的提交（每工作日 09:00）\u003c/li>\n\u003cli>每工作日检查依赖安全更新（每工作日 10:00）\u003c/li>\n\u003cli>每周五梳理待办与未完成任务（每周五 17:00）\u003c/li>\n\u003c/ul>\n\u003cp>每个任务行显示下次运行时间、上次运行是否失败，并提供启停开关。点击行尾的 \u003cstrong>更多操作\u003c/strong> 可以：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>立即运行\u003c/strong>\u003c/td>\u003ctd>立刻触发一次执行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>暂停\u003c/strong> / \u003cstrong>恢复\u003c/strong>\u003c/td>\u003ctd>暂停或恢复任务；已完成的任务不能恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>编辑\u003c/strong>\u003c/td>\u003ctd>打开编辑页\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>重命名\u003c/strong>\u003c/td>\u003ctd>修改标题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>复制\u003c/strong>\u003c/td>\u003ctd>以此任务的配置新建一个任务（标题加「（副本）」）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>删除\u003c/strong>\u003c/td>\u003ctd>需要二次确认\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cimg src=\"images/automation-schedules-list.png\" alt=\"定时任务列表页\"/>\u003c/p>\n\u003ch3 id=\"配置任务\">配置任务\u003c/h3>\n\u003cp>点击 \u003cstrong>新建任务\u003c/strong> 或 \u003cstrong>编辑\u003c/strong> 进入编辑页，顶部可切换 \u003cstrong>设置\u003c/strong> 与 \u003cstrong>历史\u003c/strong>。\u003cstrong>设置\u003c/strong> 页的字段如下：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>任务标题\u003c/strong>\u003c/td>\u003ctd>留空时使用指令第一行作为名称\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>周期\u003c/strong>\u003c/td>\u003ctd>点击 \u003cstrong>添加计划\u003c/strong> 选择：\u003cstrong>每小时\u003c/strong>、\u003cstrong>每天\u003c/strong>、\u003cstrong>每工作日\u003c/strong>、\u003cstrong>每周\u003c/strong>、\u003cstrong>每月\u003c/strong>，或 \u003cstrong>自定义\u003c/strong>（每 N 分钟/小时/天/周/月，分钟间隔至少 5）或 \u003cstrong>不重复（仅一次）\u003c/strong>。按周期还需设置时间、星期或日期（月份天数不足时自动顺延到最后一天）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>结束重复\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>从不\u003c/strong>、\u003cstrong>截止日期\u003c/strong> 或 \u003cstrong>重复 N 次后\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>指令\u003c/strong>\u003c/td>\u003ctd>发送给 Agent 的内容，可粘贴或拖入图片\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>指令框下方的工具栏用于选择：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>项目目录\u003c/strong>：任务运行的目录（可选已有项目、\u003cstrong>全局\u003c/strong> 或 \u003cstrong>自定义目录\u003c/strong>）。\u003c/li>\n\u003cli>\u003cstrong>审批模式\u003c/strong>：\n\u003cul>\n\u003cli>\u003cstrong>每次询问\u003c/strong>——仅只读工具自动通过，写入与执行前均需确认；\u003c/li>\n\u003cli>\u003cstrong>写入需审批\u003c/strong>——只读与文件写入自动通过，执行命令需确认；\u003c/li>\n\u003cli>\u003cstrong>完全访问\u003c/strong>——全部工具自动批准，无人值守也能跑完。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>模型\u003c/strong> 与思考等级：默认使用 \u003cstrong>使用默认模型\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>展开 \u003cstrong>高级选项\u003c/strong> 还可以设置：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>选项\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>收件箱通知\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>重要更新\u003c/strong>（仅运行失败或中途需要审批/回答时提醒）、\u003cstrong>所有更新\u003c/strong>（每次运行结束都提醒）、\u003cstrong>不通知\u003c/strong>（不放入收件箱，运行记录仍保存在历史中）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>运行位置\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>本地目录\u003c/strong>，或 \u003cstrong>独立 Git Worktree\u003c/strong>（自动隔离在专属分支中运行；当前目录不是 Git 仓库时不可用）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>每次运行新建会话\u003c/strong>\u003c/td>\u003ctd>关闭后，每次接着上一次的会话继续；Worktree 模式下每次都会新建会话\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>审批模式低于 \u003cstrong>完全访问\u003c/strong> 时，无人值守触发的任务若需要审批，会在收件箱中等待你确认，期间任务不会继续。\u003c/p>\n\u003c/blockquote>\n\u003cp>保存前会校验：必须填写指令、选择项目目录、添加计划，一次性任务的时间必须在未来。点击 \u003cstrong>创建定时任务\u003c/strong>（编辑时是 \u003cstrong>保存更改\u003c/strong>）完成。\u003c/p>\n\u003cp>\u003cimg src=\"images/automation-schedule-editor.png\" alt=\"定时任务编辑页\"/>\u003c/p>\n\u003ch3 id=\"查看运行历史\">查看运行历史\u003c/h3>\n\u003cp>编辑页的 \u003cstrong>历史\u003c/strong> 标签列出该任务的历次运行及其状态（\u003cstrong>运行中\u003c/strong>、\u003cstrong>成功\u003c/strong>、\u003cstrong>失败\u003c/strong>、\u003cstrong>已跳过\u003c/strong>）。点击一条记录可以在主工作台打开对应的会话；没有关联会话的运行会提示「该次运行没有关联会话」。任务创建后才能查看历史。\u003c/p>\n\u003ch2 id=\"处理收件箱\">处理收件箱\u003c/h2>\n\u003cp>收件箱汇集需要你处理的事项。点击侧边栏顶部的铃铛图标（\u003cstrong>收件箱\u003c/strong>）打开，图标上的数字是待处理数量（运行中的不计入）。\u003c/p>\n\u003cp>页面顶部按类型分为标签页：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>标签\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>全部\u003c/strong>\u003c/td>\u003ctd>所有事项，按 待审批 → 提问 → 报错 → 中断 → 未读 → 定时任务 → 运行中 的顺序分组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>待审批\u003c/strong>\u003c/td>\u003ctd>等你批准工具调用的会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>提问\u003c/strong>\u003c/td>\u003ctd>等你回答 Agent 提问的会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>报错\u003c/strong>\u003c/td>\u003ctd>出错的会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>中断\u003c/strong>\u003c/td>\u003ctd>被中断的会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>未读\u003c/strong>\u003c/td>\u003ctd>已完成但你还没有查看的会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>定时任务\u003c/strong>\u003c/td>\u003ctd>定时任务产生的待处理结果\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>操作方式：\u003c/p>\n\u003cul>\n\u003cli>点击一行打开对应会话；定时任务条目若关联了会话也会跳转到会话，否则进入定时任务页。\u003c/li>\n\u003cli>键盘：\u003ccode>j\u003c/code>/\u003ccode>k\u003c/code>（或 \u003ccode>↓\u003c/code>/\u003ccode>↑\u003c/code>）切换选中行，\u003ccode>Enter\u003c/code> 打开。\u003c/li>\n\u003cli>\u003cstrong>全部已读\u003c/strong> 把当前列表中的未读、报错与中断会话标为已读（待审批、提问和运行中的不受影响，定时任务条目也不受影响）。\u003c/li>\n\u003cli>定时任务条目上有 \u003cstrong>完成\u003c/strong> 与 \u003cstrong>忽略\u003c/strong> 两个按钮。\u003c/li>\n\u003cli>右上角的刷新按钮重新加载，齿轮按钮打开 \u003cstrong>收件箱设置\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/automation-inbox.png\" alt=\"收件箱页面的分类标签与列表\"/>\u003c/p>\n\u003ch3 id=\"智能待办\">智能待办\u003c/h3>\n\u003cp>收件箱不需要手动录入待办。当会话出现审批请求、提问、报错、中断或等你验收时，应用会自动把它收进来，问题解决后自动消失。你可以在 \u003cstrong>设置 → 收件箱\u003c/strong> 里调整：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>设置\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>自动收集待办\u003c/strong>\u003c/td>\u003ctd>开启后自动收集上述事项\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>自动移出时间（小时）\u003c/strong>\u003c/td>\u003ctd>超过这个时间没动静的会话不再出现在收件箱；待回复的不受影响。可填 1–720\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>已归档的会话和不是由 omp-workspace 创建的会话不会出现在收件箱中。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"收集想法\">收集想法\u003c/h2>\n\u003cp>想法收集是一个轻量的备忘箱：随手记下想法或缺陷，稍后再派给 Agent。点击中央标题栏右侧的灯泡图标（\u003cstrong>想法收集\u003c/strong>）打开面板，图标变琥珀色表示有待处理或待验收的条目。\u003c/p>\n\u003ch3 id=\"记录\">记录\u003c/h3>\n\u003cul>\n\u003cli>在面板顶部输入框 \u003cstrong>记一条想法\u003c/strong>，选择类型 \u003cstrong>想法\u003c/strong> 或 \u003cstrong>缺陷\u003c/strong>，按 \u003ccode>Enter\u003c/code> 记录。\u003c/li>\n\u003cli>可以点击 \u003cstrong>添加图片\u003c/strong>，也可以直接粘贴或拖入图片。\u003c/li>\n\u003cli>勾选 \u003cstrong>附带当前会话\u003c/strong> 会把当前会话作为引用一并保存。\u003c/li>\n\u003cli>用 \u003cstrong>归属项目\u003c/strong> 选择条目属于哪个项目：\u003cstrong>跟随当前会话\u003c/strong>、某个项目或 \u003cstrong>不归属项目\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"全局快速记录\">全局快速记录\u003c/h3>\n\u003cp>在任何应用里按下全局快捷键，即可弹出 \u003cstrong>记到收集箱\u003c/strong> 窗口。快捷键在 \u003cstrong>设置 → 通用 → 快捷键 → 快速记录快捷键\u003c/strong> 中设置：点击按钮后按下新的组合键；清除即停用，且需包含 \u003ccode>⌘\u003c/code> / \u003ccode>⌃\u003c/code> / \u003ccode>⌥\u003c/code> / \u003ccode>⇧\u003c/code> 之一（F 键除外）。\u003c/p>\n\u003ch3 id=\"整理与派发\">整理与派发\u003c/h3>\n\u003cp>面板按状态分为标签页：\u003cstrong>待处理\u003c/strong>、\u003cstrong>运行中\u003c/strong>、\u003cstrong>待验收\u003c/strong>、\u003cstrong>已结束\u003c/strong>、\u003cstrong>废纸篓\u003c/strong>。右上角可以搜索，并可通过 \u003cstrong>按项目筛选\u003c/strong> 切换 \u003cstrong>全部项目\u003c/strong> 或某个项目。\u003c/p>\n\u003cp>每个条目可以：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>填入输入框\u003c/strong>\u003c/td>\u003ctd>追加到当前会话的输入框（需要先选中会话）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>派发\u003c/strong>\u003c/td>\u003ctd>打开 \u003cstrong>派给 Agent\u003c/strong> 对话框：选择 \u003cstrong>现有会话\u003c/strong> 或 \u003cstrong>开启新会话\u003c/strong>，点击 \u003cstrong>下一步\u003c/strong> 后确认\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>完成\u003c/strong> / \u003cstrong>放回\u003c/strong>\u003c/td>\u003ctd>标为已完成，或放回待处理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>编辑、删除\u003c/td>\u003ctd>删除会先移入废纸篓，并提供 \u003cstrong>撤销\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>可以勾选多个条目批量操作（\u003cstrong>全选\u003c/strong>、\u003cstrong>填入输入框\u003c/strong>、\u003cstrong>派发\u003c/strong>、\u003cstrong>完成\u003c/strong>、\u003cstrong>放回\u003c/strong>、\u003cstrong>删除\u003c/strong>）。派发已发出的条目不会重复发送，失败的可点击 \u003cstrong>重试\u003c/strong>。\u003c/p>\n\u003cp>废纸篓中的条目会保留 7 天后彻底删除，也可以 \u003cstrong>恢复\u003c/strong>、\u003cstrong>彻底删除\u003c/strong> 或 \u003cstrong>清空废纸篓\u003c/strong>。\u003c/p>\n\u003cp>\u003cimg src=\"images/automation-ideas-panel.png\" alt=\"想法收集面板\"/>\u003c/p>\n\u003ch2 id=\"管理技能与扩展\">管理技能与扩展\u003c/h2>\n\u003cp>点击侧边栏的 \u003cstrong>Skills 管理\u003c/strong> 打开。页面有两个标签：\u003cstrong>我的 Skill\u003c/strong> 和 \u003cstrong>扩展\u003c/strong>。\u003c/p>\n\u003ch3 id=\"skill\">Skill\u003c/h3>\n\u003cp>Skill 是放在目录里的 \u003ccode>SKILL.md\u003c/code>，模型会根据其 \u003ccode>description\u003c/code> 判断何时调用。omp-workspace 会发现这两处的技能：\u003c/p>\n\u003cul>\n\u003cli>全局：\u003ccode>~/.omp/agent/skills\u003c/code>\u003c/li>\n\u003cli>项目级：项目内的 \u003ccode>.omp/skills\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>页面顶部是统计卡片：\u003cstrong>全部 skills\u003c/strong>、\u003cstrong>近期活跃\u003c/strong>、\u003cstrong>在吃灰\u003c/strong>（一段时间内零触发）和 \u003cstrong>有问题\u003c/strong>。\u003cstrong>常驻上下文占用\u003c/strong> 条显示所有技能描述占用上下文的估算值，超过建议上限时会提示，超限越多每轮固定开销越大。\u003c/p>\n\u003cp>列表支持：\u003c/p>\n\u003cul>\n\u003cli>搜索，以及按来源（\u003cstrong>全局\u003c/strong>、\u003cstrong>项目级\u003c/strong>）和状态（\u003cstrong>活跃\u003c/strong>、\u003cstrong>未触发\u003c/strong>、\u003cstrong>有问题\u003c/strong>、\u003cstrong>已停用\u003c/strong>）筛选；\u003c/li>\n\u003cli>按 \u003cstrong>按触发次数\u003c/strong>、\u003cstrong>按最后触发\u003c/strong> 或 \u003cstrong>按名称\u003c/strong> 排序。触发次数统计模型自动调用和手动 \u003ccode>/skill:\u003c/code> 调用；\u003c/li>\n\u003cli>对于存在多个同名副本的技能，会标出「N 处副本」，按优先级生效其中一处。\u003c/li>\n\u003c/ul>\n\u003cp>「有问题」包括三种情况：\u003cstrong>缺描述\u003c/strong>、\u003cstrong>描述超长\u003c/strong>（超过 1024 字符，注入系统提示时会被截断）、\u003cstrong>不可读\u003c/strong>。\u003c/p>\n\u003cp>每一行的操作：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>启用开关\u003c/td>\u003ctd>写入 OMP 配置，\u003cstrong>对新会话生效\u003c/strong>；不会删除文件，也不影响正在进行的对话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>在访达中显示\u003c/strong>\u003c/td>\u003ctd>打开技能所在位置\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>移到废纸篓\u003c/strong>\u003c/td>\u003ctd>把整个技能目录移到废纸篓，可从废纸篓恢复\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>查看详情\u003c/strong>\u003c/td>\u003ctd>打开详情抽屉：安装位置、\u003ccode>SKILL.md\u003c/code> 路径、触发统计、问题和文档内容\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>详情抽屉里的 \u003cstrong>在当前会话中使用\u003c/strong> 会在当前会话输入框插入 \u003ccode>/skill:名称\u003c/code>。如果该技能已停用，则改为插入一条「读取该 Skill 文件」的临时指令。使用前需要先在侧边栏选中一个会话。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>开关灰色不可点，说明这一整类技能在设置里被统一关闭了（例如 \u003ccode>skills.enabled = false\u003c/code>、来源开关或忽略规则）；鼠标放上去可以看到具体原因。\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cimg src=\"images/automation-skills-list.png\" alt=\"Skills 管理页的统计卡片与技能列表\"/>\u003c/p>\n\u003ch3 id=\"扩展\">扩展\u003c/h3>\n\u003cp>\u003cstrong>扩展\u003c/strong> 标签列出 OMP 原生扩展的名称、来源、路径与状态。扩展能介入工具调用和消息流；启用/停用通过 OMP 配置项 \u003ccode>disabledExtensions\u003c/code> 同步，在会话启动时加载。在详情里点击 \u003cstrong>停用扩展\u003c/strong> / \u003cstrong>启用扩展\u003c/strong> 切换。\u003c/p>\n\u003cp>更多与模型、插件、MCP 服务器相关的配置见 \u003ca href=\"#/zh/05-settings-and-models\">设置与模型\u003c/a>。\u003c/p>"},{"slug":"05-settings-and-models","title":"设置与模型","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-settings-nav.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-provider-dialog.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-quota-overview.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-role-assignments.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-model-replace-preview.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-templates-rules.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-privacy-library.png\"/>\u003ch1 id=\"设置与模型\">设置与模型\u003c/h1>\n\u003cblockquote>\n\u003cp>在 \u003cstrong>设置\u003c/strong> 里配置供应商、模型角色、MCP 服务器、插件、隐私库和 omp 的各项参数；需要成批改模型时，用「批量替换模型」和「模板与自动切换」一次完成。\u003c/p>\n\u003c/blockquote>\n\u003cp>你可以：\u003c/p>\n\u003cul>\n\u003cli>在 \u003ca href=\"#/zh/05-settings-and-models/%E6%89%93%E5%BC%80%E8%AE%BE%E7%BD%AE%E9%A1%B5\">设置页\u003c/a> 按分类浏览或搜索任何一项设置\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/05-settings-and-models/%E9%85%8D%E7%BD%AE%E6%A8%A1%E5%9E%8B%E4%BE%9B%E5%BA%94%E5%95%86\">模型与供应商\u003c/a> 里添加 API 密钥、登录订阅账号并查看额度\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/05-settings-and-models/%E4%B8%BA%E4%B8%8D%E5%90%8C%E7%94%A8%E9%80%94%E6%8C%87%E5%AE%9A%E6%A8%A1%E5%9E%8B\">模型角色\u003c/a> 里决定主力、轻量、子代理等各用哪个模型\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/05-settings-and-models/%E6%89%B9%E9%87%8F%E6%9B%BF%E6%8D%A2%E6%A8%A1%E5%9E%8B\">批量替换模型\u003c/a> 把一个模型的所有引用换成另一个，并且可以撤销\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/05-settings-and-models/%E6%A8%A1%E6%9D%BF%E4%B8%8E%E6%8C%89%E9%A2%9D%E5%BA%A6%E8%87%AA%E5%8A%A8%E5%88%87%E6%8D%A2\">模板与自动切换\u003c/a> 保存「角色 → 模型」方案，额度快用完时自动换方案\u003c/li>\n\u003cli>配置 \u003ca href=\"#/zh/05-settings-and-models/%E5%A4%87%E7%94%A8%E6%A8%A1%E5%9E%8B%E4%B8%8E%E4%B8%8A%E4%B8%8B%E6%96%87%E7%AA%97%E5%8F%A3\">备用模型与重试\u003c/a> 和上下文窗口\u003c/li>\n\u003cli>接入 \u003ca href=\"#/zh/05-settings-and-models/%E7%AE%A1%E7%90%86-mcp-%E6%9C%8D%E5%8A%A1%E5%99%A8\">MCP 服务器\u003c/a> 与 \u003ca href=\"#/zh/05-settings-and-models/%E7%AE%A1%E7%90%86%E6%8F%92%E4%BB%B6\">插件\u003c/a>\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/05-settings-and-models/%E4%BF%9D%E6%8A%A4%E6%95%8F%E6%84%9F%E4%BF%A1%E6%81%AF%E9%9A%90%E7%A7%81%E5%BA%93\">隐私库\u003c/a> 让密码、Token 不以明文发给 AI\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/05-settings-and-models/%E8%B0%83%E6%95%B4-omp-%E9%85%8D%E7%BD%AE%E9%A1%B9\">omp 配置项\u003c/a> 里调整其余行为，并 \u003ca href=\"#/zh/05-settings-and-models/%E5%A4%87%E4%BB%BD%E6%81%A2%E5%A4%8D%E4%B8%8E%E9%87%8D%E7%BD%AE\">备份或重置\u003c/a> 设置\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"打开设置页\">打开设置页\u003c/h2>\n\u003cp>点击侧边栏底部的 \u003cstrong>设置\u003c/strong>，或在输入框里执行 \u003ccode>/settings\u003c/code>，设置会在中间区域打开。再点一次 \u003cstrong>设置\u003c/strong> 即可返回。\u003c/p>\n\u003cp>左侧是分类导航，右侧是当前分类的内容：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分组\u003c/th>\u003cth>页面\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>常规\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>通用\u003c/strong>、\u003cstrong>存储空间\u003c/strong>、\u003cstrong>外观\u003c/strong>、\u003cstrong>通知\u003c/strong>、\u003cstrong>隐私\u003c/strong>、\u003cstrong>版本与更新\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>模型\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>模型与供应商\u003c/strong>、\u003cstrong>模型角色\u003c/strong>、\u003cstrong>思考与采样\u003c/strong>、\u003cstrong>辅助模型\u003c/strong>、\u003cstrong>备用模型与重试\u003c/strong>、\u003cstrong>上下文窗口\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>会话\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>会话\u003c/strong>、\u003cstrong>收件箱\u003c/strong>、\u003cstrong>会话体检\u003c/strong>、\u003cstrong>规则文件\u003c/strong>、\u003cstrong>系统提示词构成\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Agent 能力\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>工具\u003c/strong>、\u003cstrong>文件读写\u003c/strong>、\u003cstrong>命令行\u003c/strong>、\u003cstrong>子代理\u003c/strong>、\u003cstrong>记忆\u003c/strong>、\u003cstrong>技能与命令\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>连接\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>手机访问\u003c/strong>、\u003cstrong>MCP 服务器\u003c/strong>、\u003cstrong>插件\u003c/strong>、\u003cstrong>联网搜索\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>高级\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>高级\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>在导航顶部的 \u003cstrong>搜索设置\u003c/strong> 框输入关键词（\u003ccode>⌘F\u003c/code> 聚焦，\u003ccode>Esc\u003c/code> 清除），会按页面列出匹配的设置项；没有结果时会提示换个关键词。\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-settings-nav.png\" alt=\"设置页：左侧分类导航与顶部搜索框\"/>\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>设置分两类：本应用自己的设置（保存在本应用的数据目录，见 \u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E6%95%B0%E6%8D%AE%E4%BD%8D%E7%BD%AE\">数据位置\u003c/a>），以及 omp 的配置（保存在 omp 的 \u003ccode>config.yml\u003c/code>，在终端里使用 omp 时读取同一份）。大部分改动只对 \u003cstrong>之后新开的会话\u003c/strong> 生效，页面上会标出。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"配置模型供应商\">配置模型供应商\u003c/h2>\n\u003cp>进入 \u003cstrong>设置 ▸ 模型与供应商\u003c/strong>。页面有两个标签：\u003cstrong>接口与密钥\u003c/strong> 和 \u003cstrong>订阅与配额\u003c/strong>。右上角的 \u003cstrong>编辑原始配置文件\u003c/strong> 可以直接编辑 omp 的 \u003ccode>models.yml\u003c/code>、\u003ccode>config.yml\u003c/code> 和 \u003ccode>.env\u003c/code>（保存前会校验 YAML 语法，文件里可能有 API 密钥，不要截图或分享）。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>供应商就是提供模型的服务商。配好之后，新会话即可使用它的模型。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"添加供应商\">添加供应商\u003c/h3>\n\u003col>\n\u003cli>在 \u003cstrong>接口与密钥\u003c/strong> 标签点击 \u003cstrong>添加供应商\u003c/strong>。\u003c/li>\n\u003cli>在 \u003cstrong>从预设开始\u003c/strong> 里选一个预设（内置有 OpenAI、Anthropic、Google Gemini、DeepSeek、Moonshot Kimi、OpenRouter、SiliconFlow、Groq、Mistral、xAI、Ollama，以及 \u003cstrong>自定义 OpenAI 兼容\u003c/strong>），或直接填写。\u003c/li>\n\u003cli>填写 \u003cstrong>名称\u003c/strong>、\u003cstrong>环境变量名\u003c/strong> 和 \u003cstrong>密钥\u003c/strong>。展开 \u003cstrong>进阶设置\u003c/strong> 还可以改 \u003cstrong>标识符\u003c/strong>、\u003cstrong>协议\u003c/strong>（\u003cstrong>OpenAI 兼容\u003c/strong>、\u003cstrong>OpenAI Responses\u003c/strong>、\u003cstrong>Anthropic\u003c/strong>、\u003cstrong>Gemini\u003c/strong>、\u003cstrong>Ollama\u003c/strong>）、\u003cstrong>默认上下文窗口 (tokens)\u003c/strong> 和 \u003cstrong>默认输出上限 (tokens)\u003c/strong>。\u003c/li>\n\u003cli>在 \u003cstrong>模型列表\u003c/strong> 里点 \u003cstrong>添加模型\u003c/strong> 手动写模型 ID，或点 \u003cstrong>获取模型列表\u003c/strong> 从供应商接口拉取，勾选后选择 \u003cstrong>追加到列表\u003c/strong> 或 \u003cstrong>覆盖当前列表\u003c/strong>。各模型的上下文窗口、输出上限留空时继承上方的供应商默认值。\u003c/li>\n\u003cli>可选填 \u003cstrong>默认模型\u003c/strong> 与 \u003cstrong>备注\u003c/strong>，点击 \u003cstrong>保存并加密密钥\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/settings-and-models-provider-dialog.png\" alt=\"添加供应商对话框\"/>\u003c/p>\n\u003cp>保存后，新会话里用 \u003ccode>ompws-&lt;标识符&gt;/&lt;模型 ID&gt;\u003c/code> 的形式选择这个供应商的模型。\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>密钥使用 macOS 钥匙串中的主密钥加密（AES-256-GCM）后存于 \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>，明文只在内存中出现，不会写入数据库或日志。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"导入导出与登录\">导入、导出与登录\u003c/h3>\n\u003cp>点击 \u003cstrong>导入 / 导出\u003c/strong>：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>操作\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>一键导入 OMP 供应商\u003c/strong>\u003c/td>\u003ctd>把 omp 已配置密钥的供应商加密导入工作台\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>从 .env 文件导入\u003c/strong>\u003c/td>\u003ctd>粘贴多行 \u003ccode>变量名=密钥\u003c/code>，能识别的变量会自动匹配预设，预览后点 \u003cstrong>确认导入\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>复制 .env 文本\u003c/strong>\u003c/td>\u003ctd>把已配置的密钥以明文 \u003ccode>.env\u003c/code> 复制到剪贴板，粘贴后请及时清空剪贴板\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>OAuth 登录\u003c/strong> 用于订阅类账号：选择支持登录的供应商，应用会通过 omp 的原生授权流程打开浏览器完成登录，凭据写入 omp 自己的凭证库，列表会自动刷新。个别供应商需要在终端运行 \u003ccode>omp\u003c/code> 后用 \u003ccode>/login\u003c/code> 完成。\u003c/p>\n\u003ch3 id=\"管理供应商列表\">管理供应商列表\u003c/h3>\n\u003cp>列表顶部有搜索框，可按供应商名称、地址或模型筛选。每个供应商可以：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>测试连接\u003c/strong>：检查接口是否可用，结果显示 \u003cstrong>连接正常\u003c/strong> 或 \u003cstrong>连接失败\u003c/strong>\u003c/li>\n\u003cli>点击行展开后查看模型列表，并对单个模型点 \u003cstrong>测试\u003c/strong>（需要先导入工作台）\u003c/li>\n\u003cli>\u003cstrong>编辑\u003c/strong>、\u003cstrong>删除\u003c/strong>：删除只移除工作台的私有副本和加密密钥，不影响 omp 全局配置（\u003ccode>models.yml\u003c/code>、\u003ccode>agent.db\u003c/code>）\u003c/li>\n\u003cli>\u003cstrong>重新导入\u003c/strong>：从 omp 配置重新导入密钥，更新工作台副本\u003c/li>\n\u003cli>用开关 \u003cstrong>启用\u003c/strong> 或停用：启用后新会话会注入它的密钥\u003c/li>\n\u003c/ul>\n\u003cp>由 omp 托管的供应商（没有可导入的 API 密钥，例如订阅账号）不需要导入。\u003c/p>\n\u003ch3 id=\"查看订阅与配额\">查看订阅与配额\u003c/h3>\n\u003cp>切到 \u003cstrong>订阅与配额\u003c/strong> 标签，\u003cstrong>配额与用量概览\u003c/strong> 会汇总已授权的订阅账号：按供应商显示各时间窗口的已用比例与重置时间，点击 \u003cstrong>查看明细\u003c/strong> 可以看到每个账号的用量、超额余额和重置券。点 \u003cstrong>刷新\u003c/strong> 重新获取；数据来自 omp。\u003c/p>\n\u003cp>没有账号时页面会提示在终端执行 \u003ccode>omp login\u003c/code> 登录；普通 API 密钥按量计费，不在这里显示，到 \u003cstrong>接口与密钥\u003c/strong> 配置。\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-quota-overview.png\" alt=\"订阅与配额概览\"/>\u003c/p>\n\u003ch2 id=\"为不同用途指定模型\">为不同用途指定模型\u003c/h2>\n\u003cp>进入 \u003cstrong>设置 ▸ 模型角色\u003c/strong>。omp 把不同用途分成「角色」，每个角色可以用不同的模型。页面顶部的 \u003cstrong>配置范围\u003c/strong> 决定改动写到哪里：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>范围\u003c/th>\u003cth>写入位置\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>全局\u003c/strong>\u003c/td>\u003ctd>omp 全局配置\u003c/td>\u003ctd>对所有项目生效\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>项目\u003c/strong>\u003c/td>\u003ctd>所选项目的 \u003ccode>.omp/config.yml\u003c/code>\u003c/td>\u003ctd>只对该项目生效，没有设置的角色继承全局；需要先在侧栏添加项目或打开一个会话\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"角色分配\">角色分配\u003c/h3>\n\u003cp>\u003cstrong>角色分配\u003c/strong> 表把角色和子代理放在同一个列表里：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>角色\u003c/th>\u003cth>用途\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>主力模型\u003c/strong> (\u003ccode>default\u003c/code>)\u003c/td>\u003ctd>会话默认使用，承担主要对话与工具调用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>快速模型\u003c/strong> (\u003ccode>smol\u003c/code>)\u003c/td>\u003ctd>轻量任务与快速响应\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>深度模型\u003c/strong> (\u003ccode>slow\u003c/code>)\u003c/td>\u003ctd>需要深入推理时使用，速度慢但更仔细\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>视觉模型\u003c/strong> (\u003ccode>vision\u003c/code>)\u003c/td>\u003ctd>处理图片、截图等多模态输入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>规划模型\u003c/strong> (\u003ccode>plan\u003c/code>)\u003c/td>\u003ctd>计划模式与方案设计\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>提交信息\u003c/strong> (\u003ccode>commit\u003c/code>)、\u003cstrong>轻量后台\u003c/strong> (\u003ccode>tiny\u003c/code>)、\u003cstrong>记忆\u003c/strong> (\u003ccode>memory\u003c/code>)、\u003cstrong>子代理\u003c/strong> (\u003ccode>task\u003c/code>)、\u003cstrong>顾问\u003c/strong> (\u003ccode>advisor\u003c/code>)\u003c/td>\u003ctd>对应的后台任务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>图像生成\u003c/strong>、\u003cstrong>网络搜索\u003c/strong>、\u003cstrong>语音合成\u003c/strong>、\u003cstrong>语音识别\u003c/strong>、\u003cstrong>判断\u003c/strong>\u003c/td>\u003ctd>专用服务使用的模型\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>每一行有两种互斥的设置方式：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>专属模型\u003c/strong>：直接选一个模型（可带思考等级），写入模型名\u003c/li>\n\u003cli>\u003cstrong>复用角色模型\u003c/strong>：选另一个角色，写入 \u003ccode>@角色名\u003c/code>，该行始终跟随那个角色当前的模型\u003c/li>\n\u003c/ul>\n\u003cp>点 \u003cstrong>清除\u003c/strong> 或选回默认项会删除这一项，交给优先级更低的层处理。\u003c/p>\n\u003ch3 id=\"子代理用哪个模型\">子代理用哪个模型\u003c/h3>\n\u003cp>子代理按下面的顺序从上往下找，第一个有值的生效。点击行尾 ⓘ（\u003cstrong>查看读写的字段和优先级\u003c/strong>）可以看到每一层的当前值和 \u003cstrong>✓ 正在使用\u003c/strong> 的位置：\u003c/p>\n\u003col>\n\u003cli>\u003ccode>task.agentModelOverrides.&lt;名称&gt;\u003c/code>：本页设置的 \u003cstrong>专属模型\u003c/strong> 或 \u003cstrong>复用角色模型\u003c/strong>\u003c/li>\n\u003cli>子代理定义文件里的 \u003ccode>model:\u003c/code>（内置子代理为 omp 出厂定义，本页不修改）\u003c/li>\n\u003cli>\u003ccode>modelRoles.task\u003c/code>：\u003cstrong>子代理\u003c/strong> 角色的模型\u003c/li>\n\u003cli>当前会话使用的模型\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>项目范围下，如果全局已经设置了同一个子代理的覆盖，全局优先，项目里的值不会生效；ⓘ 面板里会提示这一点。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"侧边对话专用模型\">侧边对话专用模型\u003c/h3>\n\u003cp>页面最后的 \u003cstrong>侧边对话\u003c/strong> 卡片有一个开关 \u003cstrong>侧边对话专用模型\u003c/strong>。关闭时，侧边对话继承主对话的模型与思考级别；开启后新建的侧边对话使用你选的模型，思考等级可在模型右侧单独选择。侧边对话面板里仍可临时更改。\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-role-assignments.png\" alt=\"模型角色页：角色分配表\"/>\u003c/p>\n\u003ch2 id=\"批量替换模型\">批量替换模型\u003c/h2>\n\u003cp>模型下线、换供应商或想统一升级时，不用一处处改。在 \u003cstrong>模型角色\u003c/strong> 页点击 \u003cstrong>批量替换\u003c/strong>，会打开 \u003cstrong>批量替换模型\u003c/strong> 对话框，一次把某个模型的所有引用换成另一个。它覆盖：全局与项目配置里的角色和子代理覆盖、备用模型回退链、应用设置（新会话模型、侧边对话模型、会话体检模型）以及定时任务。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>项目配置只覆盖在本桌面端添加过的项目；扫描不到的位置会在预览里列为 \u003cstrong>未能扫描的位置\u003c/strong>，不会被修改。子代理定义文件、\u003ccode>models.yml\u003c/code>、\u003ccode>providers.json\u003c/code> 和会话历史从不改动。\u003c/p>\n\u003c/blockquote>\n\u003cp>对话框分四步，底部有 \u003cstrong>上一步\u003c/strong> 按钮，右上角 \u003cstrong>历史记录\u003c/strong> 可随时查看过去的替换：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>选择来源\u003c/strong>：总览按类型列出当前所有模型引用，分为 \u003cstrong>模型目录中找不到（可能已失效）\u003c/strong>、\u003cstrong>对话模型\u003c/strong>、\u003cstrong>搜索服务\u003c/strong>、\u003cstrong>判断模型\u003c/strong>、\u003cstrong>其他类型\u003c/strong>，可以搜索模型名、供应商或位置，并用 \u003cstrong>范围\u003c/strong> 筛选全部/全局/某个项目。点某个模型右侧的 \u003cstrong>替换\u003c/strong> 选中它；\u003cstrong>测试\u003c/strong> 会用一次真实调用探测这个模型（消耗少量 token，只在点击时执行）。\u003c/li>\n\u003cli>\u003cstrong>选择目标\u003c/strong>：选 \u003cstrong>统一目标\u003c/strong> 模型和 \u003cstrong>思考等级\u003c/strong>（\u003cstrong>模型默认\u003c/strong> 表示不写入等级后缀），再点 \u003cstrong>预览改动\u003c/strong>。匹配只看模型选择器本身，会忽略结尾的 \u003ccode>:off\u003c/code>、\u003ccode>:high\u003c/code> 等思考等级后缀；同名但不同供应商的模型不会被替换，\u003ccode>@角色\u003c/code> 别名也不会被改写。\u003c/li>\n\u003cli>\u003cstrong>预览改动\u003c/strong>：按 \u003cstrong>全局\u003c/strong>、每个项目、\u003cstrong>回退链\u003c/strong>、\u003cstrong>应用设置\u003c/strong>、\u003cstrong>定时任务\u003c/strong> 分组列出每一处 旧 → 新，每行有复选框；可以用 \u003cstrong>换成别的模型\u003c/strong> 给个别行单独指定模型或等级，\u003cstrong>改回统一目标\u003c/strong> 还原。回退链里目标键已存在时标记 \u003cstrong>冲突\u003c/strong>（勾选后会把条目合并进去，不覆盖原有链），去除重复项后标记 \u003cstrong>已去重\u003c/strong>。点击 \u003cstrong>应用 N 项\u003c/strong> 写入。\u003c/li>\n\u003cli>\u003cstrong>执行结果\u003c/strong>：逐项显示成功或失败原因，失败项可 \u003cstrong>重试失败项\u003c/strong>。点 \u003cstrong>返回总览\u003c/strong> 重新开始。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/settings-and-models-model-repl
