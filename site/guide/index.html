<style>
:root{--bg:#fff;--fg:#1f1e1d;--muted:#6b6a68;--border:#e5e3de;--side:#faf9f7;--accent:#c2410c;--code-bg:#f5f4f1;--note:#2563eb;--tip:#16a34a;--warn:#d97706;--top:56px;
--hl-c:#6b6a68;--hl-k:#b91c1c;--hl-s:#15803d;--hl-n:#1d4ed8;--hl-t:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#1a1918;--fg:#ece9e4;--muted:#a09d97;--border:#34322f;--side:#1f1e1c;--accent:#fb923c;--code-bg:#262421;--note:#60a5fa;--tip:#4ade80;--warn:#fbbf24;
--hl-c:#8a8780;--hl-k:#f87171;--hl-s:#86efac;--hl-n:#93c5fd;--hl-t:#c4b5fd}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
.top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--border);z-index:30}
.top .brand{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button,.lang button{font:inherit;font-size:14px;color:var(--fg);background:none;border:1px solid var(--border);border-radius:8px;padding:4px 12px;cursor:pointer}
.lang{display:flex}.lang button{border-radius:0}.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0;border-left:0}
.lang button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#menu{display:none}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr) 220px;padding-top:var(--top);min-height:100vh}
nav.chapters{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:20px 12px;background:var(--side);border-right:1px solid var(--border)}
nav.chapters a{display:block;padding:6px 12px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:14.5px;line-height:1.5}
nav.chapters a:hover{background:var(--code-bg)}
nav.chapters a[aria-current=page]{background:var(--code-bg);color:var(--accent);font-weight:600}
main{padding:32px 32px 80px;min-width:0}
article{max-width:760px;margin:0 auto}
aside.toc{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto;padding:32px 16px;font-size:13.5px}
aside.toc h4{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
aside.toc a{display:block;padding:3px 0 3px 10px;border-left:2px solid var(--border);color:var(--muted);text-decoration:none;line-height:1.45}
aside.toc a.l3{padding-left:22px}
aside.toc a.active{color:var(--accent);border-left-color:var(--accent)}
h1{font-size:2rem;line-height:1.25;margin:0 0 .5em}
h2{font-size:1.5rem;margin:2.2em 0 .6em;padding-top:.4em;border-top:1px solid var(--border)}
h3{font-size:1.2rem;margin:1.8em 0 .5em}
h1,h2,h3,h4{scroll-margin-top:calc(var(--top) + 16px)}
h1+blockquote:not(.callout){border:0;padding:0;margin:0 0 1.5em;font-size:1.1rem;color:var(--muted)}
blockquote{margin:1em 0;padding:.1em 1em;border-left:3px solid var(--border);color:var(--muted)}
.callout{border:1px solid var(--cc);border-left-width:4px;border-radius:8px;background:color-mix(in srgb,var(--cc) 8%,transparent);padding:.7em 1em;color:var(--fg)}
.callout p{margin:.4em 0}
.callout-note{--cc:var(--note)}.callout-tip{--cc:var(--tip)}.callout-warning{--cc:var(--warn)}
.callout-title{font-weight:700;color:var(--cc);font-size:.9rem}
.table-wrap{overflow-x:auto;margin:1em 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--border);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--side)}
code{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);padding:.15em .4em;border-radius:5px}
pre{position:relative;background:var(--code-bg);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow:auto;line-height:1.55}
pre code{background:none;padding:0}
pre .copy{position:absolute;top:6px;right:6px;font:12px inherit;padding:2px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
pre:hover .copy,pre .copy:focus{opacity:1}
.hljs-comment,.hljs-quote{color:var(--hl-c)}.hljs-keyword,.hljs-literal,.hljs-selector-tag{color:var(--hl-k)}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--hl-s)}.hljs-number,.hljs-attr,.hljs-attribute,.hljs-built_in{color:var(--hl-n)}
.hljs-title,.hljs-type,.hljs-section,.hljs-name{color:var(--hl-t)}.hljs-deletion{color:var(--hl-k)}
img{max-width:100%;border-radius:8px;border:1px solid var(--border)}
.img-ph{border:2px dashed var(--border);border-radius:8px;padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;margin:1em 0}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:3em;padding-top:1.5em;border-top:1px solid var(--border)}
.pager a{flex:1;max-width:48%;border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--fg)}
.pager a:hover{border-color:var(--accent)}.pager small{display:block;color:var(--muted)}.pager .next{text-align:right;margin-left:auto}
.empty{color:var(--muted);padding:40px 0}
.scrim{display:none}
@media(max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}aside.toc{display:none}}
@media(max-width:760px){
#menu{display:block}.layout{grid-template-columns:minmax(0,1fr)}main{padding:24px 16px 60px}
nav.chapters{position:fixed;top:var(--top);left:0;bottom:0;width:280px;height:auto;transform:translateX(-100%);transition:transform .2s;z-index:25}
body.drawer nav.chapters{transform:none}
body.drawer .scrim{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(0,0,0,.4);z-index:20}}
</style>

<script id="guide-data" type="application/json">{"zh":[{"slug":"01-getting-started","title":"快速开始","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/getting-started-layout.png\"/>\u003ch1 id=\"快速开始\">快速开始\u003c/h1>\n\u003cblockquote>\n\u003cp>omp-workspace 是 OMP 智能体的社区桌面工作台（非 OMP 官方项目）：在一个现代化的原生桌面窗口中启动、查看、调试和并行管理所有 AI 会话与项目代码。本章介绍架构定位、准备工作、窗口布局及开启第一个会话。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E4%BA%86%E8%A7%A3-omp-workspace\">了解 omp-workspace 的设计定位\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E5%87%86%E5%A4%87%E7%8E%AF%E5%A2%83\">确认运行环境与启动应用\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E8%AE%A4%E8%AF%86%E7%AA%97%E5%8F%A3%E5%B8%83%E5%B1%80\">熟悉窗口的核心功能分区\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E5%BC%80%E5%90%AF%E7%AC%AC%E4%B8%80%E4%B8%AA%E4%BC%9A%E8%AF%9D\">开启你的第一个智能体会话\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/01-getting-started/%E9%85%8D%E7%BD%AE%E6%A8%A1%E5%9E%8B%E4%BE%9B%E5%BA%94%E5%95%86\">配置模型供应商与凭据\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"了解-omp-workspace\">了解 omp-workspace\u003c/h2>\n\u003cp>omp-workspace 是 OMP 命令行智能体的现代化桌面外壳（基于 Tauri 2 + React 19 构建，原生沉浸体验）。它与命令行 \u003ccode>omp\u003c/code> 紧密协作而非割裂替代：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>会话双向同步\u003c/strong>：应用启动时自动扫描并索引 \u003ccode>~/.omp/agent/sessions/\u003c/code>。你在终端中用 \u003ccode>omp\u003c/code> 启动的会话会直接展示在左侧栏中；桌面端发起的会话也能在终端中无缝续接。\u003c/li>\n\u003cli>\u003cstrong>项目与工作树隔离\u003c/strong>：原生支持 Git Worktree（独立工作树）。多个智能体可以在同一个仓库的不同分支或工作树下并行修改代码，互不干扰、永不踩踏。\u003c/li>\n\u003cli>\u003cstrong>可视化对话与执行追踪\u003c/strong>：实时展示思考过程、代码 Diff、工具调用卡片与执行结果，支持自然输入法防抖打字与丰富的行间批注。\u003c/li>\n\u003cli>\u003cstrong>全套工作区辅助工具\u003c/strong>：内置文件浏览器、Markdown 分栏文档视图、多标签交互式终端、时光机版本快照、服务端口监控与 Token 用量分析。\u003c/li>\n\u003cli>\u003cstrong>智能自动化与移动互联\u003c/strong>：支持定时调度任务、智能待办收件箱、全局想法收集箱，以及局域网/公网安全穿透的手机端远程访问。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"准备环境\">准备环境\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>检查项\u003c/th>\u003cth>要求说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>操作系统\u003c/td>\u003ctd>macOS（全面适配系统外观与系统钥匙串安全加密，支持访达快捷联动）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OMP 命令行\u003c/td>\u003ctd>建议本机已安装 \u003ccode>omp\u003c/code> 核心引擎，且可在终端命令行中直接调用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>模型凭据\u003c/td>\u003ctd>至少一个可用的模型供应商（支持 API 密钥或 OAuth 订阅账号），见\u003ca href=\"#/zh/01-getting-started/%E9%85%8D%E7%BD%AE%E6%A8%A1%E5%9E%8B%E4%BE%9B%E5%BA%94%E5%95%86\">配置模型供应商\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>源码构建环境\u003c/td>\u003ctd>Node.js (&gt;=18)、\u003ccode>pnpm\u003c/code>、Rust (Cargo) 工具链\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>应用默认通过系统环境变量中的 \u003ccode>omp\u003c/code> 命令拉起智能体进程。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>如果你的 \u003ccode>omp\u003c/code> 安装在非常规路径（例如自编译路径或特定的虚拟环境），请前往 \u003cstrong>设置 ▸ 高级 ▸ omp 程序位置\u003c/strong> 填写绝对路径。前往 \u003cstrong>设置 ▸ 版本与更新\u003c/strong> 可直接查看当前检测到的 omp 版本及状态。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"安装与启动\">安装与启动\u003c/h2>\n\u003cp>若通过源码开发或打包：\u003c/p>\n\u003cpre>\u003ccode class=\"hljs language-bash\">pnpm install        \u003cspan class=\"hljs-comment\"># 安装前端与项目依赖\u003c/span>\npnpm tauri dev      \u003cspan class=\"hljs-comment\"># 启动本地开发模式（自动构建 Rust 底层与 Vite 前端）\u003c/span>\npnpm build:app      \u003cspan class=\"hljs-comment\"># 完整编译、类型检查并打包出 macOS 应用程序 (.app / .dmg)\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>如果想在不影响当前数据的情况下启动一个干净的调试实例，可以运行 \u003ccode>pnpm dev:preview\u003c/code>：它将使用隔离端口并将数据存入独立目录 \u003ccode>~/.omp-workspace-dev\u003c/code>。详细数据分布见\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E6%95%B0%E6%8D%AE%E4%BD%8D%E7%BD%AE%E4%B8%8E%E7%9B%AE%E5%BD%95%E7%BB%93%E6%9E%84\">数据位置与目录结构\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003cp>首次启动时，应用会自动完成初始化：\u003c/p>\n\u003col>\n\u003cli>在 \u003ccode>~/.omp-workspace/\u003c/code> 初始化本地配置与 SQLite 数据库；\u003c/li>\n\u003cli>扫描加载本机历史会话与上下文；\u003c/li>\n\u003cli>恢复上次打开的工作区与会话；未选定时停留在空间引导页。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"认识窗口布局\">认识窗口布局\u003c/h2>\n\u003cp>工作台窗口采用符合工程直觉的四区分割布局：\u003c/p>\n\u003cp>\u003cimg src=\"images/getting-started-layout.png\" alt=\"窗口布局总览：左侧栏、中间对话区、右侧面板与底部状态栏\"/>\u003c/p>\n\u003ch3 id=\"1-左侧栏会话与导航\">1. 左侧栏（会话与导航）\u003c/h3>\n\u003cp>管理所有会话与空间，按快捷键 \u003ccode>⌘B\u003c/code> 可随时展开或收起。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>空间切换器\u003c/strong>：顶部显示当前\u003cstrong>空间\u003c/strong>（如 Code、Work、Study、Research 或 Universal 通用空间）。每个空间拥有独立的项目和会话列表。\u003c/li>\n\u003cli>\u003cstrong>快捷工具入口\u003c/strong>：顶部集成 \u003cstrong>收件箱\u003c/strong>（聚合待审批/报错/提问）、\u003cstrong>搜索\u003c/strong>（\u003ccode>⌘F\u003c/code> 全局检索会话）、\u003cstrong>新建会话\u003c/strong>（\u003ccode>⌘N\u003c/code>）、\u003cstrong>定时任务\u003c/strong> 及 \u003cstrong>Skills 管理\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>项目与工作树分组\u003c/strong>：按本地代码仓库组织会话，支持折叠展开，并可按 Git 工作树/分支聚合展示并行任务。\u003c/li>\n\u003cli>\u003cstrong>底部入口\u003c/strong>：点击左下角齿轮打开 \u003cstrong>设置\u003c/strong>（或按 \u003ccode>⌘,\u003c/code>）。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"2-中间区域主工作台\">2. 中间区域（主工作台）\u003c/h3>\n\u003cp>核心操作视图，承载主要交互：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>对话界面\u003c/strong>：显示当前会话标题、状态、模型标签、消息流、工具调用详情卡、审批确认面板与输入框。\u003c/li>\n\u003cli>\u003cstrong>全屏功能视图\u003c/strong>：打开收件箱、定时任务配置、Skills 管理、文档编辑或设置时，将平铺展开于中间区域，点击左上角返回或按 \u003ccode>Esc\u003c/code> / \u003ccode>⌘[\u003c/code> 即可切回会话。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3-右侧面板辅助工具箱\">3. 右侧面板（辅助工具箱）\u003c/h3>\n\u003cp>多标签页抽屉，按快捷键 \u003ccode>⌘J\u003c/code> 展开或收起。点击标签栏末尾的 \u003ccode>+\u003c/code>（打开新标签页）可按需切换工具：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>辅助对话（Side Chat）\u003c/strong>：轻量级旁聊，继承主对话上下文，无需打断主线思路；\u003c/li>\n\u003cli>\u003cstrong>文件\u003c/strong>：浏览当前工作区的文件树结构与快速检索文件；\u003c/li>\n\u003cli>\u003cstrong>Git\u003c/strong>：查看代码 Diff、暂存与提交、工作树并行管理、主干同步与时光机历史回溯；\u003c/li>\n\u003cli>\u003cstrong>终端\u003c/strong>：支持多个持久化 Shell 终端，可一键将输出文本作为批注发给 AI；\u003c/li>\n\u003cli>\u003cstrong>文件预览\u003c/strong>：高亮查看代码与渲染 Markdown 文档；\u003c/li>\n\u003cli>\u003cstrong>服务与端口\u003c/strong>：检测本机正在监听的本地开发端口，并清理残留无用进程；\u003c/li>\n\u003cli>\u003cstrong>Token 用量与体检\u003c/strong>：分析上下文开销分布、定位浪费并提供深度会话体检。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"4-底部状态栏\">4. 底部状态栏\u003c/h3>\n\u003cp>全局监控指示器：\u003c/p>\n\u003cul>\n\u003cli>实时显示当前会话的轮数与步数、上下文缓存命中率；\u003c/li>\n\u003cli>\u003cstrong>性能监控\u003c/strong>：显示本应用及关联进程的物理内存占用（点击可展开多进程明细）；\u003c/li>\n\u003cli>\u003cstrong>OMP 版本\u003c/strong>：快速查看核心程序版本与更新状态；\u003c/li>\n\u003cli>\u003cstrong>当前分支与界面缩放\u003c/strong>：显示当前工作树分支名，并提供界面字号与缩放比例调整。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"开启第一个会话\">开启第一个会话\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>确认当前空间\u003c/strong>：在左侧栏顶部选择所在空间。如果进行代码开发，推荐选择 \u003cstrong>Code\u003c/strong> 空间；日常临时对话可切到 \u003cstrong>Universal\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>选择或添加项目\u003c/strong>：如果是首次使用，在首页点击 \u003cstrong>选择项目目录\u003c/strong>，选中本地代码仓库或文件夹。应用会自动关联该项目并就绪。\u003c/li>\n\u003cli>\u003cstrong>输入需求\u003c/strong>：光标处于输入框时，直接写下你的开发需求或指令。\u003c/li>\n\u003cli>\u003cstrong>即打即连（Type-to-focus）\u003c/strong>：无需反复用鼠标点击输入框——只要当前焦点不在其他文本输入框或弹窗内，直接在键盘上打字，文字便会自动送达输入框。\u003c/li>\n\u003cli>\u003cstrong>按 \u003ccode>Enter\u003c/code> 发送\u003c/strong>：智能体随即启动，实时流式输出思考过程、生成方案、执行工具或提出询问。\u003c/li>\n\u003c/ol>\n\u003cp>随时可以按 \u003ccode>⌘N\u003c/code> 快速开启新会话；系统会自动绑定当前项目，并在未输入任何内容离开时自动清理空白草稿。\u003c/p>\n\u003ch2 id=\"配置模型供应商\">配置模型供应商\u003c/h2>\n\u003cp>智能体工作需要至少一个有效的大模型接入点。你可以通过以下方式极速配置：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>设置面板\u003c/strong>：打开 \u003cstrong>设置 ▸ 模型与供应商\u003c/strong>，点击 \u003cstrong>添加供应商\u003c/strong> 选择官方预设（如 Anthropic、OpenAI、DeepSeek、Gemini、OpenRouter 等）填写 API 密钥，或选择 \u003cstrong>OAuth 登录\u003c/strong> 使用订阅账号。\u003c/li>\n\u003cli>\u003cstrong>一键导入已有密钥\u003c/strong>：点击 \u003cstrong>导入 / 导出 ▸ 一键导入 OMP 供应商\u003c/strong>，自动将终端中已有的 OMP 配置安全迁移进工作台。\u003c/li>\n\u003cli>\u003cstrong>斜杠命令快捷跳转\u003c/strong>：在对话输入框输入 \u003ccode>/login\u003c/code> 并按回车，可直接打开供应商配置页面。\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>所有本地 API 密钥均由 macOS 系统钥匙串主密钥进行高强度加密（AES-256-GCM），明文只在向模型发起安全通信时在内存短暂驻留，绝不落盘于明文文件或日志中。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"下一步\">下一步\u003c/h2>\n\u003cul>\n\u003cli>掌握会话进阶操作与输入框技巧：\u003ca href=\"#/zh/02-sessions-and-chat\">会话与对话\u003c/a>\u003c/li>\n\u003cli>探索 Git 工作树并行开发与终端协同：\u003ca href=\"#/zh/03-workspace\">工作区：文件、Git 与终端\u003c/a>\u003c/li>\n\u003cli>查看完整的键盘快捷键与故障诊断指南：\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting\">快捷键速查与问题排查\u003c/a>\u003c/li>\n\u003c/ul>"},{"slug":"02-sessions-and-chat","title":"会话与对话","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-composer.png\"/>\u003ch1 id=\"会话与对话\">会话与对话\u003c/h1>\n\u003cblockquote>\n\u003cp>高效驾驭会话生命周期、掌握智能输入框的并发策略与命令系统，利用辅助对话、行间批注与检查点机制保障复杂任务的安全可控。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E7%A9%BA%E9%97%B4%E4%B8%8E%E4%BC%9A%E8%AF%9D%E7%AE%A1%E7%90%86\">管理空间与会话列表\u003c/a>：空间区分、会话状态、搜索与归档\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E5%BC%80%E5%90%AF%E6%96%B0%E4%BC%9A%E8%AF%9D\">以多种模式开启新会话\u003c/a>：当前目录 vs 独立 Git 工作树并行模式\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%99%BA%E8%83%BD%E8%BE%93%E5%85%A5%E6%A1%86%E4%B8%8E%E6%B6%88%E6%81%AF%E5%8F%91%E9%80%81\">玩转智能输入框\u003c/a>：发送与排队策略、富附件与草图、\u003ccode>@\u003c/code> 引用与 \u003ccode>/\u003c/code> 斜杠命令\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E5%88%92%E9%80%89%E6%89%B9%E6%B3%A8%E4%B8%8E%E7%B2%BE%E5%87%86%E5%BC%95%E7%94%A8\">使用跨界面划选批注\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E8%BE%85%E5%8A%A9%E5%AF%B9%E8%AF%9D-side-chat\">利用辅助对话处理并行旁聊\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E6%89%A7%E8%A1%8C%E8%BF%BD%E8%B8%AA%E4%B8%8E%E5%AE%A1%E6%89%B9%E7%A1%AE%E8%AE%A4\">追踪工具执行与处理审批询问\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E4%B8%8A%E4%B8%8B%E6%96%87%E7%94%A8%E9%87%8F%E4%B8%8E%E6%B7%B1%E5%BA%A6%E7%B2%BE%E7%AE%80\">掌控上下文用量与一键压缩\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/02-sessions-and-chat/%E4%BC%9A%E8%AF%9D%E5%88%86%E4%BA%AB%E4%B8%8E%E5%AF%BC%E5%87%BA\">分享与多格式导出对话\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"空间与会话管理\">空间与会话管理\u003c/h2>\n\u003ch3 id=\"空间体系\">空间体系\u003c/h3>\n\u003cp>左侧栏顶部展示当前所在的\u003cstrong>空间\u003c/strong>。点击名称可快速在 \u003cstrong>切换模式\u003c/strong> 菜单中选择：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>空间\u003c/th>\u003cth>定位与适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Code\u003c/strong>\u003c/td>\u003ctd>专为代码研发打造，支持按仓库、Git 工作树和分支层级管理会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Work\u003c/strong>\u003c/td>\u003ctd>适用于日常工作任务、文档起草与日常事务跟踪\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Study\u003c/strong>\u003c/td>\u003ctd>针对技术探索、论文阅读与知识梳理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Research\u003c/strong>\u003c/td>\u003ctd>针对深度调研与复杂方案推导\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Universal\u003c/strong>\u003c/td>\u003ctd>无需关联本地项目目录的通用自由对话空间\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>各空间之间的数据与会话完全独立，切换空间时会话列表自动隔离。当其他空间有智能体正在后台运算时，空间菜单项右侧会出现动态提示点。\u003c/p>\n\u003ch3 id=\"会话分组与层级结构\">会话分组与层级结构\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>项目目录分组\u003c/strong>：在侧栏项目区点击 \u003ccode>+\u003c/code>（添加工作区目录）关联本地文件夹。项目分组支持折叠收起。\u003c/li>\n\u003cli>\u003cstrong>工作树智能聚类\u003c/strong>：在 Code 空间下，开启 \u003cstrong>设置 ▸ 会话 ▸ 按工作树区分会话\u003c/strong> 后，同一仓库内属于不同分支或 Git Worktree 的会话将自动归拢在对应的工作树分组下，多任务并行修改一目了然。\u003c/li>\n\u003cli>\u003cstrong>Universal 自由分组\u003c/strong>：通用空间无需代码仓库，你可以使用 \u003cstrong>新建分组\u003c/strong> 整理对话，并在会话右键菜单中使用 \u003cstrong>移到分组\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>置顶与标星\u003c/strong>：常用会话可随时置顶，固定在列表顶部。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"会话生命周期与状态标志\">会话生命周期与状态标志\u003c/h3>\n\u003cp>每条会话旁均配有直观的状态标记，鼠标悬停可查看详情：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>状态\u003c/th>\u003cth>列表标记\u003c/th>\u003cth>含义与操作建议\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>运行中\u003c/strong>\u003c/td>\u003ctd>旋转加载图标\u003c/td>\u003ctd>智能体正在思考或执行工具操作\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>待回复\u003c/strong>\u003c/td>\u003ctd>蓝色「待回复」标签\u003c/td>\u003ctd>智能体发起了审批请求（写入文件/执行命令）或向你提问\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>待验收\u003c/strong>\u003c/td>\u003ctd>行末蓝色圆点\u003c/td>\u003ctd>智能体已完成当前轮次工作，等待你审阅确认；右键可「验收并归档」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>空闲\u003c/strong>\u003c/td>\u003ctd>无标记\u003c/td>\u003ctd>当前无正在进行的任务，处于随时待命状态\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>异常/报错\u003c/strong>\u003c/td>\u003ctd>红色实心圆点\u003c/td>\u003ctd>因网络或工具错误非正常退出，右键可进行会话体检或诊断\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>已中断\u003c/strong>\u003c/td>\u003ctd>橙红警告标\u003c/td>\u003ctd>智能体进程被意外终止，右键点击「恢复会话」即可从断点续接\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>已挂起（休眠）\u003c/strong>\u003c/td>\u003ctd>浅灰休眠标\u003c/td>\u003ctd>闲置超过设定阈值后自动休眠以释放系统内存；发消息时即刻毫秒级唤醒\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>外部接管\u003c/strong>\u003c/td>\u003ctd>终端指示图标\u003c/td>\u003ctd>由原生终端 \u003ccode>omp\u003c/code> 运行的会话；右键可选择「接管会话」转为桌面端托管\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>自动休眠时间可在 \u003cstrong>设置 ▸ 会话 ▸ 闲置多久后休眠（分钟）\u003c/strong> 中自由调整，默认 15 分钟，休眠会话完整保留所有上下文。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"快捷检索与键盘流操作\">快捷检索与键盘流操作\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>全文检索（\u003ccode>⌘F\u003c/code>）\u003c/strong>：在侧栏搜索框输入关键词，支持空格分隔多词复合匹配。检索范围覆盖：会话标题、分支名称、工作树目录、模型标识及最近一条助手回复摘要。\u003c/li>\n\u003cli>\u003cstrong>会话操作菜单\u003c/strong>：右键点击会话（或按行末菜单按钮），支持：重命名、置顶/取消置顶、归档会话、在访达中定位、诊断此会话、重启会话、导出等。\u003c/li>\n\u003cli>\u003cstrong>纯键盘导航流\u003c/strong>：焦点置于列表时，按 \u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code> 移动选区并平滑加载会话；按 \u003ccode>←\u003c/code> / \u003ccode>→\u003c/code> 折叠或展开当前分组；按 \u003ccode>Delete\u003c/code> 快速归档；按 \u003ccode>Shift+Delete\u003c/code> 永久删除。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"开启新会话\">开启新会话\u003c/h2>\n\u003ch3 id=\"标准模式与项目绑定\">标准模式与项目绑定\u003c/h3>\n\u003cp>点击左侧栏 \u003cstrong>新建会话\u003c/strong> 或按快捷键 \u003ccode>⌘N\u003c/code>。\n系统会自动在中间区域打开一个崭新的输入界面。若当前已有选中的项目，新会话自动绑定该项目；空白草稿未输入任何内容离开时会自动清理，不会在列表残留无效死会话。\u003c/p>\n\u003ch3 id=\"独立-git-工作树worktree并行模式\">独立 Git 工作树（Worktree）并行模式\u003c/h3>\n\u003cp>当你想让智能体开发一个全新需求，但不想污染当前正在编辑的代码分支时：\u003c/p>\n\u003col>\n\u003cli>点击项目分组右侧的 \u003ccode>+\u003c/code> 按钮，选择 \u003cstrong>在独立工作树创建\u003c/strong>；\u003c/li>\n\u003cli>在弹出面板中确认基础分支（如 \u003ccode>main\u003c/code>）、新分支前缀（如 \u003ccode>feat/\u003c/code>）与新目录名；\u003c/li>\n\u003cli>点击创建后，系统将在 \u003ccode>&lt;项目&gt;/.worktrees/&lt;名称&gt;\u003c/code> 目录下自动拉出全新分支并建立独立工作树；\u003c/li>\n\u003cli>多个智能体可以同时在各自的工作树中拉代码、跑测试、提交变更，互不阻塞！\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"智能输入框与消息发送\">智能输入框与消息发送\u003c/h2>\n\u003cp>输入框不仅是打字框，更是多任务调度的中枢。\u003c/p>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-composer.png\" alt=\"输入框功能一览\"/>\u003c/p>\n\u003ch3 id=\"沉浸式自然打字type-to-focus\">沉浸式自然打字（Type-to-focus）\u003c/h3>\n\u003cp>应用内置智能打字捕获：在浏览消息、翻看文档或审阅 Diff 时，只要当前焦点未处于其他输入框、终端或模态弹窗内，直接按下键盘字符，焦点将自动瞬时转入输入框，彻底告别频繁的鼠标点击定位。同时内置输入法（IME）防抖，组词期间不会误触快捷键。\u003c/p>\n\u003ch3 id=\"并发发送策略与临时切换\">并发发送策略与临时切换\u003c/h3>\n\u003cp>当智能体正在思考或长耗时运行工具时，如果又有了新想法，输入框提供了三种精巧的处理策略（在 \u003cstrong>设置 ▸ 会话 ▸ 发送方式\u003c/strong> 中配置默认值）：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>引导（Steer，默认推荐）\u003c/strong>：消息会作为实时的前置补充，立即注入智能体当前的回合中，指导其修正路径，无需等待全部跑完；\u003c/li>\n\u003cli>\u003cstrong>排队（Queue）\u003c/strong>：消息进入排队队列，等智能体把当前任务彻底完成后，自动接续发出；\u003c/li>\n\u003cli>\u003cstrong>打断后发送（Interrupt）\u003c/strong>：立即强制终止当前回合，并立即带着新指令重新开始。\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>\u003cstrong>单次快捷切换\u003c/strong>：按住 \u003ccode>⌥\u003c/code> 键发送（如 \u003ccode>⌥Enter\u003c/code>）可以对当前单条消息反转策略（例如将引导临时切换为排队），无需修改全局配置。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"排队队列管理\">排队队列管理\u003c/h3>\n\u003cp>已排队的消息会以半透明气泡形式暂存于消息流末尾。点击输入框右侧的 \u003cstrong>排队 N\u003c/strong> 标签可展开管理面板，支持：调整消息发送先后顺序、合并多条排队消息合并发送、或一键移出队列。\u003c/p>\n\u003ch3 id=\"添加菜单与增强模式\">添加菜单与增强模式\u003c/h3>\n\u003cp>点击输入框左侧的 \u003ccode>+\u003c/code>（添加）可开启高级工作模式：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>规划模式（Plan 模式）\u003c/strong>：勾选后智能体会先输出缜密的分解方案，右侧自动拉出 \u003cstrong>计划\u003c/strong> 面板展示实施步骤，经你审阅后才逐步落地执行；也可通过命令 \u003ccode>/plan\u003c/code> 切换。\u003c/li>\n\u003cli>\u003cstrong>目标模式（Goal）\u003c/strong>：设定长期追求的验收目标。输入框上方将出现目标进度卡，即使历经多次上下文压缩，智能体也不会偏离核心目标；支持 \u003ccode>/goal &lt;描述&gt;\u003c/code> 配置。\u003c/li>\n\u003cli>\u003cstrong>草图画布（Sketch）\u003c/strong>：内置手绘矢量白板，支持画笔、箭头、矩形、文本与配色，画完直接一键插入输入框作为视觉参考。\u003c/li>\n\u003cli>\u003cstrong>多媒体附件与代码引用\u003c/strong>：支持直接从访达粘贴或拖入图片（PNG/JPG/SVG）、日志文件、代码片段，支持一键载入访达当前选中的文件。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"-快速引用与--斜杠命令\">\u003ccode>@\u003c/code> 快速引用与 \u003ccode>/\u003c/code> 斜杠命令\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>输入 \u003ccode>@\u003c/code> 文件引用\u003c/strong>：输入 \u003ccode>@\u003c/code> 并键入文件名关键字，可在当前工作目录中快速模糊搜索文件，自动插入路径引用。\u003c/li>\n\u003cli>\u003cstrong>输入 \u003ccode>/\u003c/code> 触发命令菜单\u003c/strong>：\n\u003cul>\n\u003cli>\u003cstrong>会话流转\u003c/strong>：\u003ccode>/new\u003c/code>（新会话）、\u003ccode>/fork\u003c/code>（派生当前对话）、\u003ccode>/btw\u003c/code>（开启侧聊）、\u003ccode>/compact\u003c/code>（压缩上下文）、\u003ccode>/shake\u003c/code>（快速抖掉冗余工具结果）；\u003c/li>\n\u003cli>\u003cstrong>模型调度\u003c/strong>：\u003ccode>/model\u003c/code>（快速选模）、\u003ccode>/thinking\u003c/code>（设置思考预算）、\u003ccode>/advisor\u003c/code>（呼叫顾问模型协同）；\u003c/li>\n\u003cli>\u003cstrong>状态与分析\u003c/strong>：\u003ccode>/status\u003c/code>（查看系统状态）、\u003ccode>/context\u003c/code>（查看上下文构成）、\u003ccode>/stats\u003c/code>（查看吞吐量与耗时）；\u003c/li>\n\u003cli>\u003cstrong>环境与安全\u003c/strong>：\u003ccode>/mcp\u003c/code>（MCP 状态）、\u003ccode>/login\u003c/code>（登录供应商）、\u003ccode>/settings\u003c/code>（直达设置）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"模型选择与真实思考等级\">模型选择与真实思考等级\u003c/h3>\n\u003cp>底部工具栏显示当前模型。点击可打开双栏供应商模型选择器（左侧供应商分类，右侧模型列表，支持拼音与模糊检索）。\n模型名右侧附带思考等级（如 \u003ccode>off\u003c/code>, \u003ccode>low\u003c/code>, \u003ccode>medium\u003c/code>, \u003ccode>high\u003c/code>）。所列出的档位严格根据所选模型的官方真实能力动态解析，绝不呈现硬编码的不支持选项。\u003c/p>\n\u003ch2 id=\"划选批注与精准引用\">划选批注与精准引用\u003c/h2>\n\u003cp>在阅读消息、查阅右侧文件、审阅 Git Diff 或终端输出时，只需\u003cstrong>用鼠标划选任意一段文字\u003c/strong>，即可唤出浮动批注栏：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>写批注（\u003ccode>Enter\u003c/code> 确认）\u003c/strong>：写下对该段代码或回复的具体要求，支持选择将批注附加到 \u003cstrong>主对话\u003c/strong> 还是 \u003cstrong>辅助对话\u003c/strong>；\u003c/li>\n\u003cli>\u003cstrong>批注暂存区\u003c/strong>：批注将作为结构化卡片整齐悬浮于输入框上方，支持查看原文出处、随时修改或删除，点击发送时会自动拼接为带有精准行号与上下文的结构化提示词。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"辅助对话side-chat\">辅助对话（Side Chat）\u003c/h2>\n\u003cp>辅助对话是主会话的轻量级“沙盒分身”，非常适合做临时方案推导、原理咨询或辅助测试，而完全不破坏主会话干净的上下文。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>快速开启\u003c/strong>：在右侧面板点击 \u003ccode>+\u003c/code> ▸ \u003cstrong>新辅助对话\u003c/strong>，或直接在输入框输入 \u003ccode>/btw 你的疑问\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>上下文继承\u003c/strong>：辅助对话自动获得主会话当前的全部历史与记忆；\u003c/li>\n\u003cli>\u003cstrong>多层嵌套\u003c/strong>：支持从辅助对话中继续开下级辅助对话（最多 3 层），按 \u003ccode>⌘[\u003c/code> 随时返回上一级；\u003c/li>\n\u003cli>\u003cstrong>一键整理回传\u003c/strong>：在辅助对话得出结论后，点击右上角 \u003cstrong>回传给父会话\u003c/strong>，系统将自动提炼精炼结论并放入主会话输入框，确认后即可发送。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"执行追踪与审批确认\">执行追踪与审批确认\u003c/h2>\n\u003ch3 id=\"透明的执行细节展示\">透明的执行细节展示\u003c/h3>\n\u003cp>智能体的每一次操作在对话区均以标准工具卡形式呈现：\u003c/p>\n\u003cul>\n\u003cli>动态显示：正在读取 → 已读取、正在搜索 → 已找到、正在编辑 → 已保存；\u003c/li>\n\u003cli>多步自动化任务会自动收起为折叠步骤条，避免长输出刷屏；\u003c/li>\n\u003cli>模型思考内容以收纳块展示，可开启 \u003cstrong>思考时显示最新两行\u003c/strong> 查看动态心流；\u003c/li>\n\u003cli>命令行调用提供 \u003cstrong>复制命令\u003c/strong> 与 \u003cstrong>查看完整输出\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"审批请求与键盘交互\">审批请求与键盘交互\u003c/h3>\n\u003cp>当安全级别需要介入时，对话流中会呈现明确的审批卡：\u003c/p>\n\u003cul>\n\u003cli>按键盘 \u003ccode>y\u003c/code>：\u003cstrong>仅本次执行\u003c/strong>（安全受控）；\u003c/li>\n\u003cli>点击 \u003cstrong>本会话始终允许\u003c/strong>：本会话生命周期内不再反复询问；\u003c/li>\n\u003cli>点击 \u003cstrong>永久加入白名单\u003c/strong>：全局信任；\u003c/li>\n\u003cli>按键盘 \u003ccode>n\u003c/code>：\u003cstrong>拒绝执行\u003c/strong>，智能体将立即改变策略。\u003c/li>\n\u003c/ul>\n\u003cp>智能体主动向你提问时（Ask），输入框会自动转换为选项面板：按数字键快速选择，\u003ccode>Enter\u003c/code> 提交，亦可自由填写自定义回答。\u003c/p>\n\u003ch3 id=\"git-对话检查点与一键撤回\">Git 对话检查点与一键撤回\u003c/h3>\n\u003cp>在 \u003cstrong>设置 ▸ 会话 ▸ 对话检查点\u003c/strong> 开启自动存档后：\u003c/p>\n\u003cul>\n\u003cli>应用在智能体每一轮行动前自动通过 Git 进行项目快照留底；\u003c/li>\n\u003cli>如果智能体改坏了代码或思路跑偏，在回复下方点击 \u003cstrong>撤回这一轮\u003c/strong>，即可将本轮所有文件的改动一键物理还原，彻底规避代码丢失风险！\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"上下文用量与深度精简\">上下文用量与深度精简\u003c/h2>\n\u003cp>输入框底部配备环形上下文水位指示盘。点击可展开用量仪表盘：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>细分维度拆解\u003c/strong>：清晰掌握已用 Token 中各个组成部分的占比（系统提示词、内置工具定义、MCP 服务、Skills 技能描述、规则文件、对话历史）；\u003c/li>\n\u003cli>\u003cstrong>查看系统提示词构成\u003c/strong>：一键跳转分析每次发给模型的底层 Prompt，支持让 AI 诊断并给出精简方案；\u003c/li>\n\u003cli>\u003cstrong>手动压缩（\u003ccode>/compact\u003c/code>）\u003c/strong>：调用总结模型压缩对话上下文，保留关键结论并释放空间；\u003c/li>\n\u003cli>\u003cstrong>快速抖动（\u003ccode>/shake\u003c/code>）\u003c/strong>：零模型开销，纯粹丢弃过往工具调用的冗长返回内容，极速腾出上下文。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"会话分享与导出\">会话分享与导出\u003c/h2>\n\u003cp>点击主界面顶部工具栏的 \u003cstrong>分享与导出\u003c/strong> 按钮：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>导出方式\u003c/th>\u003cth>特性与适用场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>选择消息生成图片\u003c/strong>\u003c/td>\u003ctd>自由勾选重要消息轮次，渲染为精致的长截图（支持复制或保存为 PNG）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>创建加密分享链接\u003c/strong>\u003c/td>\u003ctd>将会话加密上传至云端只读阅读页，自动对已知 API 密钥与敏感信息执行物理脱敏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>复制为 Markdown\u003c/strong>\u003c/td>\u003ctd>一键将整场对话以标准 Markdown 源码拷贝至系统剪贴板\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>导出为独立 HTML\u003c/strong>\u003c/td>\u003ctd>导出包含现代样式的离线单文件 HTML，脱离网络亦可随处翻阅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>手机扫码同屏查看\u003c/strong>\u003c/td>\u003ctd>在同一局域网下生成实时 Web 端访问码，手机端即刻同步浏览与回复\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"slug":"03-workspace","title":"工作区：文件、Git 与终端","html":"\u003ch1 id=\"工作区文件git-与终端\">工作区：文件、Git 与终端\u003c/h1>\n\u003cblockquote>\n\u003cp>在右侧面板中沉浸式浏览项目架构、预览编辑文档代码、利用 Git Worktree 并行多任务、审查 Diff 变更，并在无需离开工作台的情况下随手调用内置多标签终端。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/03-workspace/%E8%AE%A4%E8%AF%86%E5%8F%B3%E4%BE%A7%E9%9D%A2%E6%9D%BF%E5%A4%9A%E6%A0%87%E7%AD%BE%E4%BD%93%E7%B3%BB\">驾驭右侧面板多标签体系\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/03-workspace/%E6%96%87%E4%BB%B6%E9%9D%A2%E6%9D%BF%E4%B8%8E%E6%96%87%E4%BB%B6%E6%90%9C%E7%B4%A2\">在文件面板中探索与搜索项目文件\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/03-workspace/%E9%A2%84%E8%A7%88%E4%B8%8E%E5%88%86%E6%A0%8F%E7%BC%96%E8%BE%91\">高效预览、编辑与分栏阅读文档\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/03-workspace/git-%E6%94%B9%E5%8A%A8%E5%AE%A1%E6%9F%A5%E4%B8%8E%E6%99%BA%E8%83%BD%E5%AD%98%E6%A1%A3\">使用 Git 面板审查改动并安全存档\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/03-workspace/git-worktree-%E7%8B%AC%E7%AB%8B%E5%B7%A5%E4%BD%9C%E6%A0%91%E5%B9%B6%E8%A1%8C%E5%AE%9E%E6%88%98\">利用 Git Worktree 实现多任务并行开发\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/03-workspace/%E6%97%B6%E5%85%89%E6%9C%BA%E7%89%88%E6%9C%AC%E5%9B%9E%E6%BA%AF%E4%B8%8E%E5%BF%AB%E7%85%A7%E9%A2%84%E8%A7%88\">使用时光机快照回溯历史版本\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/03-workspace/%E5%86%85%E7%BD%AE%E5%A4%9A%E6%A0%87%E7%AD%BE%E7%BB%88%E7%AB%AF\">使用多标签持久化终端与服务收纳\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"认识右侧面板多标签体系\">认识右侧面板多标签体系\u003c/h2>\n\u003cp>右侧面板集合了代码研发与项目调试的核心工具，按快捷键 \u003ccode>⌘J\u003c/code> 可随时展开或收起。\u003c/p>\n\u003cp>点击标签栏末尾的 \u003ccode>+\u003c/code>（打开新标签页）可以在右侧自由添加并切换以下工具：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>标签页\u003c/th>\u003cth>核心用途与能力\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>文件\u003c/strong>\u003c/td>\u003ctd>树状浏览当前项目的工作区文件，支持实时过滤与快速定位\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Git\u003c/strong>\u003c/td>\u003ctd>未提交改动审查、文件 Diff、工作树并行管理、分支切换与版本历史\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>终端\u003c/strong>\u003c/td>\u003ctd>内置持久化命令行，支持开启多个终端标签，并可将终端折叠为后台服务\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>文件预览\u003c/strong>\u003c/td>\u003ctd>点击对话中的文件路径或文件面板中的代码时激活，支持只读预览与即时编辑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>辅助对话\u003c/strong>\u003c/td>\u003ctd>无干扰轻量级侧聊，随时向智能体提出独立问题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>本地服务\u003c/strong>\u003c/td>\u003ctd>扫描当前本机端口占用，识别开发服务器，并一键终止残留进程\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Token 用量\u003c/strong>\u003c/td>\u003ctd>分析上下文开销构成，下钻检查工具调用浪费，进行会话深度体检\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>处于「规划模式」时，系统会自动在右侧打开专属的 \u003cstrong>计划\u003c/strong> 标签页，实时展示智能体拟定的方案实施步骤与勾选进度。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"文件面板与文件搜索\">文件面板与文件搜索\u003c/h2>\n\u003cp>打开右侧的 \u003cstrong>文件\u003c/strong> 即可查看当前工作区的文件目录树。\u003c/p>\n\u003ch3 id=\"目录与文件操作\">目录与文件操作\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>快速过滤（\u003ccode>⌘F\u003c/code>）\u003c/strong>：在顶部搜索框输入文件名，即时过滤展示匹配文件；\u003c/li>\n\u003cli>\u003cstrong>访达联动\u003c/strong>：点击工具栏的访达图标，在系统文件管理器中直接定位当前项目根目录；\u003c/li>\n\u003cli>\u003cstrong>右键上下文菜单\u003c/strong>：\n\u003cul>\n\u003cli>\u003cstrong>在访达中显示\u003c/strong>：在 macOS 访达中高亮当前文件；\u003c/li>\n\u003cli>\u003cstrong>复制相对路径 / 完整路径\u003c/strong>：精准拷贝路径供提示词使用；\u003c/li>\n\u003cli>\u003cstrong>刷新目录\u003c/strong>：重新读取磁盘变动。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>单击任何文件，将在中央主区域打开 \u003cstrong>文档视图\u003c/strong>。\u003c/p>\n\u003ch2 id=\"预览与分栏编辑\">预览与分栏编辑\u003c/h2>\n\u003cp>omp-workspace 提供两种轻巧舒适的代码与文档查看方式：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>中央文档视图\u003c/strong>：占据中央区域，提供大视野的沉浸式阅读与修改；\u003c/li>\n\u003cli>\u003cstrong>右侧文件预览标签\u003c/strong>：在对话中点击智能体提到的文件路径时就地激活。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"三种视图布局自由切换\">三种视图布局自由切换\u003c/h3>\n\u003cp>在中央文档视图顶部，可根据需要随时切换：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>预览模式\u003c/strong>：富文本渲染 Markdown，格式精美且链接均可点击；\u003c/li>\n\u003cli>\u003cstrong>分栏模式（Split）\u003c/strong>：左侧展示源码编辑器（CodeMirror 支持智能高亮），右侧实时同步渲染预览；\u003c/li>\n\u003cli>\u003cstrong>编辑模式\u003c/strong>：纯代码编辑视图，按 \u003ccode>⌘S\u003c/code> 快速保存写入磁盘。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"外部修改智能感知\">外部修改智能感知\u003c/h3>\n\u003cp>当代码在 VS Code 等外部编辑器被修改并切回 omp-workspace 时，未修改的干净缓冲区会自动静默刷新；若本地有尚未保存的编辑内容，系统会弹出冲突保护提示，让你自由选择「重新加载磁盘内容」或「保留当前修改」。\u003c/p>\n\u003ch3 id=\"划选内容一键批注\">划选内容一键批注\u003c/h3>\n\u003cp>在预览或编辑器中划选代码行，底部会浮出 \u003cstrong>添加批注\u003c/strong> 工具条。输入改进意见并按 \u003ccode>⌘Enter\u003c/code>，该代码段与你的诉求将立即装配成精准的上下文送入输入框，无需手动复制粘贴文件路径与行号。\u003c/p>\n\u003ch2 id=\"git-改动审查与智能存档\">Git 改动审查与智能存档\u003c/h2>\n\u003cp>在右侧打开 \u003cstrong>Git\u003c/strong> 标签页，面板自动绑定当前所选会话的工作目录。\u003c/p>\n\u003ch3 id=\"改动审查与-diff-窗口\">改动审查与 Diff 窗口\u003c/h3>\n\u003cp>在 \u003cstrong>改动\u003c/strong> 子标签下列出了所有未提交的文件及其变更状态（修改、新增、删除、重命名）：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>单文件操作\u003c/strong>：点击文件行可 \u003cstrong>复制相对路径\u003c/strong>、\u003cstrong>派发给智能体审查\u003c/strong> 或 \u003cstrong>撤销此文件改动\u003c/strong>；\u003c/li>\n\u003cli>\u003cstrong>全屏 Diff 审查\u003c/strong>：点击 \u003cstrong>全部 Diff\u003c/strong>，打开多文件差异审查面板。支持：\n\u003cul>\n\u003cli>\u003cstrong>单栏合并（Unified）\u003c/strong> 与 \u003cstrong>双栏对比（Split）\u003c/strong> 自由切换；\u003c/li>\n\u003cli>语法高亮与行号对齐；\u003c/li>\n\u003cli>\u003cstrong>逐行行间批注\u003c/strong>：选中任意变动代码行，点击行号旁的批注按钮，直接针对具体代码行向智能体发出修正意见！\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"ai-生成提交说明与本地存档\">AI 生成提交说明与本地存档\u003c/h3>\n\u003cp>点击 \u003cstrong>存档：提交全部 N 个文件\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>系统会自动调用轻量模型分析当前代码 Diff，一秒生成符合语义化规范（Conventional Commits）的中文提交信息；\u003c/li>\n\u003cli>也可以手动编辑提交说明后按 \u003ccode>⌘Enter\u003c/code> 完成提交；\u003c/li>\n\u003cli>存档完全在本地 Git 仓库安全执行，绝不会在你未经确认的情况下擅自推送到远程仓库。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"git-worktree-独立工作树并行实战\">Git Worktree 独立工作树并行实战\u003c/h2>\n\u003cp>在传统的单工作区开发中，如果让智能体同时处理两个任务，不同分支的代码会发生交叉污染甚至文件覆盖。omp-workspace 原生基于 \u003cstrong>Git Worktree（工作树）\u003c/strong> 彻底终结了这一痛点。\u003c/p>\n\u003ch3 id=\"什么是工作树\">什么是工作树？\u003c/h3>\n\u003cp>工作树是 Git 提供的高级能力：它允许你在同一个本地仓库中，将多个不同分支同时检出到不同的独立磁盘文件夹中。每个工作树拥有独立的编译产物、依赖和未提交修改，物理级隔离！\u003c/p>\n\u003ch3 id=\"工作树操作全景\">工作树操作全景\u003c/h3>\n\u003cp>在 Git 面板切换至 \u003cstrong>工作树\u003c/strong> 视图：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>新建并行工作树\u003c/strong>：点击顶部的 \u003cstrong>新建并行工作树\u003c/strong>（或从已有分支派生），指定分支名后系统自动在 \u003ccode>.worktrees/\u003c/code> 目录下完成就绪；\u003c/li>\n\u003cli>\u003cstrong>多会话并行研发\u003c/strong>：在不同的工作树中分别启动智能体，一个修 Bug，一个开发新特性，两者互不影响；\u003c/li>\n\u003cli>\u003cstrong>主干同步与变基\u003c/strong>：\n\u003cul>\n\u003cli>\u003cstrong>从 main 同步\u003c/strong>：自动检测主干最新变动并合入当前分支，前置执行冲突预检；\u003c/li>\n\u003cli>\u003cstrong>AI 辅助解决冲突\u003c/strong>：预检发现冲突时，可一键开启专门的解冲突会话，由智能体自动读取冲突标记并完成修复；\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>主干交付模式\u003c/strong>：\n在 \u003cstrong>设置 ▸ 通用 ▸ Git ▸ 主干交付模式\u003c/strong> 中可选：\n\u003cul>\n\u003cli>\u003cstrong>发起 Pull Request（推荐）\u003c/strong>：自动将分支推送到远程仓库并在浏览器中拉起 GitHub / GitLab 的 PR 页面；\u003c/li>\n\u003cli>\u003cstrong>本地合并并直接推送\u003c/strong>：将特性分支快速快进合入本地 main 分支并推送。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>闲置工作树智能回收\u003c/strong>：当某个工作树关联的所有会话均已关闭或归档时，面板会浮现 \u003cstrong>闲置工作树\u003c/strong> 提示，点击 \u003cstrong>一键回收\u003c/strong> 即可安全清理磁盘空间。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"时光机版本回溯与快照预览\">时光机版本回溯与快照预览\u003c/h2>\n\u003cp>在 Git 面板切至 \u003cstrong>历史\u003c/strong> 视图，按时间线查看提交记录。点击任意提交，可使用强大的时光机三部曲：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>看看（审查 Diff）\u003c/strong>：查看该历史版本当时做了哪些具体变动；\u003c/li>\n\u003cli>\u003cstrong>试试（时光机沙盒快照预览）\u003c/strong>：\n\u003cul>\n\u003cli>想要验证 3 天前的一个历史版本，但又不想打乱当前正在写的代码？\u003c/li>\n\u003cli>点击 \u003cstrong>时光机快照预览\u003c/strong>，系统会在隔离的临时目录（\u003ccode>.worktrees/tm-xxxx\u003c/code>）中启动一个只读的独立运行环境，并自动执行启动命令（如 \u003ccode>pnpm dev --port 5180\u003c/code>）；\u003c/li>\n\u003cli>你可以在浏览器中一边体验旧版本的运行表现，一边继续在当前工作区编写代码！\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>回到（版本安全穿梭）\u003c/strong>：\n\u003cul>\n\u003cli>\u003cstrong>保留之后的修改（推荐）\u003c/strong>：将 HEAD 软回退到该版本，其后的所有提交内容安全保留为工作区中的未提交改动；\u003c/li>\n\u003cli>\u003cstrong>彻底回滚\u003c/strong>：彻底丢弃之后的一切提交与未提交代码（高危操作，需输入确认）。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"内置多标签终端\">内置多标签终端\u003c/h2>\n\u003cp>点击顶部工具栏的终端图标或按快捷键 \u003ccode>⌘`\u003c/code> 即可在右侧唤出全功能终端。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>多终端并发\u003c/strong>：支持点击 \u003ccode>+\u003c/code> 开启最多 10 个独立 Shell 标签，每个标签以当前工作目录环境启动；\u003c/li>\n\u003cli>\u003cstrong>终端与对话深度联动\u003c/strong>：\n\u003cul>\n\u003cli>在终端中划选任何错误堆栈或输出日志，直接点击 \u003cstrong>引用\u003c/strong> 即可附加为对话批注（快捷键 \u003ccode>⌘⇧A\u003c/code>）；\u003c/li>\n\u003cli>支持一键 \u003cstrong>发送到侧聊\u003c/strong>，让辅助智能体协助分析终端报错；\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>折叠为后台常驻服务\u003c/strong>：\n\u003cul>\n\u003cli>点击终端标签上的 \u003cstrong>折叠为后台服务\u003c/strong> 按钮，该进程将收拢进 \u003cstrong>服务\u003c/strong> 面板常驻运行，释放界面空间；\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>自动上下文承接\u003c/strong>：在内置终端中直接输入 \u003ccode>omp\u003c/code> 启动命令行，将自动感知并接续当前图形界面的会话记录。\u003c/li>\n\u003c/ul>"},{"slug":"04-automation","title":"任务自动化：定时任务、收件箱与想法收集","html":"\u003ch1 id=\"任务自动化定时任务收件箱与想法收集\">任务自动化：定时任务、收件箱与想法收集\u003c/h1>\n\u003cblockquote>\n\u003cp>让智能体按计划自动执行例行巡检与任务、用智能收件箱聚合需要人工介入的关键事项，并利用随手收集箱随时捕获灵感并批量派发。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/04-automation/%E5%88%9B%E5%BB%BA%E5%91%A8%E6%9C%9F%E5%AE%9A%E6%97%B6%E4%BB%BB%E5%8A%A1\">创建与管理周期性定时任务\u003c/a>：计划设定、审批模式与独立 Worktree 隔离\u003c/li>\n\u003cli>\u003ca href=\"#/zh/04-automation/%E6%99%BA%E8%83%BD%E6%94%B6%E4%BB%B6%E7%AE%B1%E7%AE%A1%E7%90%86\">在智能收件箱中集中处理待办事项\u003c/a>：待审批、提问、报错与一键处理流\u003c/li>\n\u003cli>\u003ca href=\"#/zh/04-automation/%E6%83%B3%E6%B3%95%E6%94%B6%E9%9B%86%E7%AE%B1-backlog\">使用想法收集箱捕获灵感与缺陷\u003c/a>：全局快捷键唤出、上下文附带与一键派发\u003c/li>\n\u003cli>\u003ca href=\"#/zh/04-automation/%E6%8A%80%E8%83%BD%E4%B8%8E%E6%89%A9%E5%B1%95%E8%83%BD%E5%8A%9B%E6%A6%82%E8%A7%88\">技能与扩展能力速览\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"创建周期定时任务\">创建周期定时任务\u003c/h2>\n\u003cp>定时任务允许智能体在指定的时间点或周期性循环中自动执行任务（如：每日清晨汇总前一日 Git 提交、每周五扫描依赖库安全漏洞、定期分析代码坏味道等），并将处理结果同步至收件箱。\u003c/p>\n\u003cp>点击左侧栏的 \u003cstrong>定时任务\u003c/strong> 即可打开任务管理中心。\u003c/p>\n\u003ch3 id=\"常用任务模板快速启用\">常用任务模板快速启用\u003c/h3>\n\u003cp>在任务列表为空时，可直接选用内置的典型工程模板：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>晨会工作准备\u003c/strong>：每天 09:00 自动总结团队昨日提交并整理今日关注点；\u003c/li>\n\u003cli>\u003cstrong>依赖安全巡检\u003c/strong>：每个工作日 10:00 自动检查项目依赖更新与已知 CVE 漏洞；\u003c/li>\n\u003cli>\u003cstrong>周末待办盘点\u003c/strong>：每周五 17:00 梳理当前未关闭的 TODO 与临时注释。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"详细配置项指南\">详细配置项指南\u003c/h3>\n\u003cp>点击 \u003cstrong>新建任务\u003c/strong> 进入编辑界面：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>配置字段\u003c/th>\u003cth>说明与建议\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>任务标题\u003c/strong>\u003c/td>\u003ctd>简明标识任务用途；留空时将自动使用提示词第一行作为标题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>执行周期\u003c/strong>\u003c/td>\u003ctd>支持 \u003cstrong>每小时\u003c/strong>、\u003cstrong>每天\u003c/strong>、\u003cstrong>每工作日\u003c/strong>、\u003cstrong>每周\u003c/strong>、\u003cstrong>每月\u003c/strong>，或 \u003cstrong>自定义间隔\u003c/strong>（最少 5 分钟），亦支持单次执行（指定未来时间）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>重复截止\u003c/strong>\u003c/td>\u003ctd>可选 \u003cstrong>从不\u003c/strong>、\u003cstrong>指定截止日期\u003c/strong> 或 \u003cstrong>重复 N 次后终止\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>执行指令（Prompt）\u003c/strong>\u003c/td>\u003ctd>派发给智能体的详细任务描述，支持拖入参考图片作为多模态输入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>项目工作区\u003c/strong>\u003c/td>\u003ctd>任务运行的目标目录；可选已有项目、通用全局工作区或自定义路径\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>审批访问模式\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>完全访问\u003c/strong>（全自动通过，适合无人值守例行巡检）；\u003cstrong>写入需审批\u003c/strong>（只读自动通过，写文件需确认）；\u003cstrong>每次询问\u003c/strong>（所有写操作等待人工批准）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>模型与思考深度\u003c/strong>\u003c/td>\u003ctd>默认继承全局默认模型，亦可指定性价比更高的专用轻量模型\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"高级选项专属-git-worktree-隔离\">高级选项：专属 Git Worktree 隔离\u003c/h3>\n\u003cp>在定时任务的 \u003cstrong>高级选项\u003c/strong> 中，强烈建议开启 \u003cstrong>在独立 Git Worktree 中运行\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>启用后，定时任务每次触发都会自动在一个隔离的分支与工作树中拉起执行，绝不污染你当前正在本地编辑的代码工作区！\u003c/li>\n\u003cli>\u003cstrong>每次运行新建会话\u003c/strong>：推荐开启，确保每次例行巡检都有干净独立的上下文。\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>当审批模式低于「完全访问」时，若定时任务在半夜或离开电脑时触发且需要审批，任务会自动挂起并在收件箱中等待，直至你确认后继续。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"查看历次运行日志\">查看历次运行日志\u003c/h3>\n\u003cp>切换至定时任务的 \u003cstrong>历史\u003c/strong> 标签，可完整查阅历次执行的状态（运行中、成功、失败、已跳过）及消耗时间。点击任意历史记录，可直接在主工作台打开该次运行创建的真实会话。\u003c/p>\n\u003ch2 id=\"智能收件箱管理\">智能收件箱管理\u003c/h2>\n\u003cp>收件箱是工作台中所有需要人工介入事项的统一指挥中心。点击左侧栏顶部的铃铛图标（\u003cstrong>收件箱\u003c/strong>）即可打开，图标上的小徽标会实时展示当前待处理总数。\u003c/p>\n\u003ch3 id=\"智能待办自动汇流\">智能待办自动汇流\u003c/h3>\n\u003cp>收件箱完全无需手动录入待办。系统会自动侦测并归集以下五大类事件：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分类标签\u003c/th>\u003cth>汇集条件与触发场景\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>待审批\u003c/strong>\u003c/td>\u003ctd>智能体即将执行危险工具（如写入关键文件、运行 Shell 脚本），等待人工放行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>提问\u003c/strong>\u003c/td>\u003ctd>智能体在方案分支上向你发起询问（Ask），等待你做出选择或补充信息\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>报错\u003c/strong>\u003c/td>\u003ctd>智能体在执行过程中遇到网络故障、环境缺失或未捕获的严重异常\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>中断\u003c/strong>\u003c/td>\u003ctd>因断电、强制退出或进程崩溃而意外停滞的会话，支持一键恢复续跑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>未读\u003c/strong>\u003c/td>\u003ctd>智能体已顺利完成整轮工作，等待你审阅验收的会话\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"极速处理流\">极速处理流\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>纯键盘盲操\u003c/strong>：进入收件箱后，按键盘 \u003ccode>j\u003c/code> / \u003ccode>k\u003c/code>（或 \u003ccode>↓\u003c/code> / \u003ccode>↑\u003c/code>）快速切换条目，按 \u003ccode>Enter\u003c/code> 瞬间跳转至目标会话；\u003c/li>\n\u003cli>\u003cstrong>一键全部已读\u003c/strong>：点击右上角 \u003cstrong>全部已读\u003c/strong>，即可将所有已完成和报错的未读提示一键消警；\u003c/li>\n\u003cli>\u003cstrong>自动移出机制\u003c/strong>：在 \u003cstrong>设置 ▸ 会话 ▸ 收件箱\u003c/strong> 中，可设定闲置超时时间（默认 48 小时），超时未变动的非阻塞条目会自动移出收件箱，保持通知列表清爽。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"想法收集箱backlog\">想法收集箱（Backlog）\u003c/h2>\n\u003cp>开发过程中灵感往往转瞬即逝，或者在查阅代码时突然发现一处潜在 Bug。想法收集箱是一个常驻的“外挂脑皮层”，方便随手记下，稍后集中派发给智能体。\u003c/p>\n\u003cp>点击窗口中间顶栏右侧的灯泡图标（\u003cstrong>想法收集\u003c/strong>）展开面板。\u003c/p>\n\u003ch3 id=\"随时捕获想法\">随时捕获想法\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>双类型标记\u003c/strong>：记录时可快速区分为 \u003cstrong>想法（Feature/Idea）\u003c/strong> 或 \u003cstrong>缺陷（Bug）\u003c/strong>；\u003c/li>\n\u003cli>\u003cstrong>附带上下文\u003c/strong>：勾选 \u003cstrong>附带当前会话\u003c/strong>，系统会自动关联当前正在讨论的上下文与代码位置；\u003c/li>\n\u003cli>\u003cstrong>图片与截图支持\u003c/strong>：直接粘贴剪贴板中的报错截图或设计示意图。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"全局快捷键随时唤出\">全局快捷键随时唤出\u003c/h3>\n\u003cp>无论你当前处于 IDE、浏览器还是办公聊天软件中，按下系统全局快捷键（默认 \u003ccode>⌘⇧I\u003c/code>），屏幕正中央会立即弹出轻巧的 \u003cstrong>记到收集箱\u003c/strong> 浮窗。记完后按 \u003ccode>⌘Enter\u003c/code> 提交，浮窗自动隐去，你的工作流完全不被打断。\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>全局快速记录快捷键可在 \u003cstrong>设置 ▸ 通用 ▸ 快捷键 ▸ 快速记录快捷键\u003c/strong> 中自定义设置。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"批量整理与智能派发\">批量整理与智能派发\u003c/h3>\n\u003cp>在收集箱中，条目按 \u003cstrong>待处理\u003c/strong>、\u003cstrong>运行中\u003c/strong>、\u003cstrong>待验收\u003c/strong> 和 \u003cstrong>已结束\u003c/strong> 清晰分类：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>填入输入框\u003c/strong>：将选中的想法文本直接追加至当前会话的草稿框；\u003c/li>\n\u003cli>\u003cstrong>派发给智能体（Dispatch）\u003c/strong>：\n\u003cul>\n\u003cli>勾选一条或多条想法，点击 \u003cstrong>派发\u003c/strong>；\u003c/li>\n\u003cli>自由选择 \u003cstrong>追加至已有会话\u003c/strong> 或 \u003cstrong>为该需求开启全新独立会话\u003c/strong>；\u003c/li>\n\u003cli>确认后智能体立即根据收集箱中的内容开始编码！\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>软删除与恢复\u003c/strong>：误删的条目会进入 \u003cstrong>废纸篓\u003c/strong>，保留 7 天，期间可随时完整撤回与恢复。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"技能与扩展能力概览\">技能与扩展能力概览\u003c/h2>\n\u003cp>点击左侧栏的 \u003cstrong>Skills 管理\u003c/strong>，可以快速审阅当前工作台可用的原生智能体能力库：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>全局技能与项目级技能\u003c/strong>：自动索引 \u003ccode>~/.omp/agent/skills/\u003c/code> 与项目本地 \u003ccode>.omp/skills/\u003c/code>；\u003c/li>\n\u003cli>\u003cstrong>调用状态一目了然\u003c/strong>：统计每个技能近期是否活跃，及时发现存在描述过长或不可读问题的技能；\u003c/li>\n\u003cli>\u003cstrong>一键使用\u003c/strong>：在技能详情抽屉中点击 \u003cstrong>在当前会话中使用\u003c/strong>，即可将对应命令注入输入框。\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>想要深入了解自定义子代理定义、模型角色与技能的底层配置，请前往下一章：\u003ca href=\"#/zh/05-settings-and-models\">模型与 Agent 能力设置\u003c/a>。\u003c/p>\n\u003c/blockquote>"},{"slug":"05-settings-and-models","title":"模型与 Agent 能力设置","html":"\u003ch1 id=\"模型与-agent-能力设置\">模型与 Agent 能力设置\u003c/h1>\n\u003cblockquote>\n\u003cp>全面掌握工作台的配置体系：管理供应商与密钥、厘清模型角色与自定义子代理、配置备用回退链、利用规则与记忆文件打造专属智能体，并无缝接入 MCP 与插件生态。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E8%AE%BE%E7%BD%AE%E5%88%86%E7%B1%BB%E5%85%A8%E6%99%AF%E6%9E%B6%E6%9E%84\">了解设置分类全景架构\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E9%85%8D%E7%BD%AE%E6%A8%A1%E5%9E%8B%E4%BE%9B%E5%BA%94%E5%95%86%E4%B8%8E%E5%AF%86%E9%92%A5\">配置模型供应商与安全密钥\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E8%BE%A8%E6%9E%90%E6%A8%A1%E5%9E%8B%E8%A7%92%E8%89%B2-vs-%E8%87%AA%E5%AE%9A%E4%B9%89%E5%AD%90%E4%BB%A3%E7%90%86\">厘清核心概念：模型角色 vs 自定义子代理\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E6%A8%A1%E5%9E%8B%E8%A7%92%E8%89%B2%E5%88%86%E9%85%8D\">为不同场景分配模型角色\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E5%88%9B%E5%BB%BA%E4%B8%8E%E7%AE%A1%E7%90%86%E8%87%AA%E5%AE%9A%E4%B9%89%E5%AD%90%E4%BB%A3%E7%90%86\">创建与管理自定义子代理（带“让 AI 帮我写”）\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E6%A8%A1%E5%9E%8B%E6%89%B9%E9%87%8F%E6%9B%BF%E6%8D%A2%E4%B8%8E%E6%A8%A1%E6%9D%BF%E8%87%AA%E5%8A%A8%E5%88%87%E6%8D%A2\">模型批量替换与按额度自动切换\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E5%A4%87%E7%94%A8%E6%A8%A1%E5%9E%8B%E4%B8%8E%E9%87%8D%E8%AF%95%E5%9B%9E%E9%80%80\">配置备用模型与重试回退链\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E8%A7%84%E5%88%99%E6%96%87%E4%BB%B6%E8%AE%B0%E5%BF%86%E4%B8%8E%E7%B3%BB%E7%BB%9F%E6%8F%90%E7%A4%BA%E8%AF%8D\">规则文件、记忆管理与系统提示词构成\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E6%8E%A5%E5%85%A5-mcp-%E6%9C%8D%E5%8A%A1%E5%99%A8%E4%B8%8E%E6%8F%92%E4%BB%B6\">管理 MCP 服务器与插件扩展\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E9%9A%90%E7%A7%81%E5%BA%93%E4%B8%8E%E8%87%AA%E5%8A%A8%E8%84%B1%E6%95%8F\">保护敏感信息的隐私库\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/05-settings-and-models/%E9%85%8D%E7%BD%AE%E5%A4%87%E4%BB%BD%E6%81%A2%E5%A4%8D%E4%B8%8E%E6%9B%B4%E6%96%B0\">数据备份、恢复与重置\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"设置分类全景架构\">设置分类全景架构\u003c/h2>\n\u003cp>点击侧边栏底部的齿轮图标 \u003cstrong>设置\u003c/strong>（或在输入框中运行 \u003ccode>/settings\u003c/code>、按快捷键 \u003ccode>⌘,\u003c/code>），设置将在中间主区域展开。\u003c/p>\n\u003cp>工作台设置分为七大分类，涵盖本应用配置与 OMP 底层引擎配置：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>分类分组\u003c/th>\u003cth>包含页面与核心定位\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>常规\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>通用\u003c/strong>（新会话默认行为、Git 交付模式、审批模式）、\u003cstrong>存储空间\u003c/strong>（缓存与磁盘占用）、\u003cstrong>外观\u003c/strong>（主题与排版密度）、\u003cstrong>通知\u003c/strong>（系统提醒与免打扰）、\u003cstrong>隐私\u003c/strong>（密钥打码与脱敏）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>模型\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>模型与供应商\u003c/strong>（API 密钥、OAuth 订阅、配额用量）、\u003cstrong>模型角色\u003c/strong>（主力/轻量/深度等角色分配）、\u003cstrong>思考与采样\u003c/strong>（思考深度与参数）、\u003cstrong>辅助模型\u003c/strong>（顾问、预探与视觉辅助）、\u003cstrong>备用模型与重试\u003c/strong>（自动回退链）、\u003cstrong>上下文窗口\u003c/strong>（模型窗口限制与自动压缩）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>会话\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>会话\u003c/strong>（休眠与工作树策略）、\u003cstrong>收件箱\u003c/strong>（待办自动汇集规则）、\u003cstrong>会话体检\u003c/strong>（体检触发模型与频率）、\u003cstrong>规则文件\u003c/strong>（长期 AGENTS.md 规范与输出校验）、\u003cstrong>系统提示词构成\u003c/strong>（System Prompt 占比可视化与 AI 精简建议）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Agent 能力\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>工具\u003c/strong>（工具白名单与权限）、\u003cstrong>文件读写\u003c/strong>（读取/编辑策略与 LSP 诊断）、\u003cstrong>命令行\u003c/strong>（Shell 运行模式）、\u003cstrong>子代理\u003c/strong>（自定义子代理定义与创建）、\u003cstrong>记忆\u003c/strong>（长期记忆文件与跨会话状态）、\u003cstrong>技能与命令\u003c/strong>（Skills 路径与加载）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>连接\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>手机访问\u003c/strong>（局域网配对、Cloudflare Tunnel 隧道、IPv6 直连与 DDNS）、\u003cstrong>MCP 服务器\u003c/strong>（接入外部工具协议）、\u003cstrong>插件\u003c/strong>（已安装插件与原生扩展）、\u003cstrong>联网搜索\u003c/strong>（Web 搜索服务配置）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>高级\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>高级\u003c/strong>（omp 可执行程序路径、终端联动扩展、配置文件直接定位、数据备份与一键重置）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>帮助\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>使用教程\u003c/strong>（即本教程，功能详解与技巧速查）、\u003cstrong>版本与更新\u003c/strong>（检查应用与 omp 引擎最新版本并热更新）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>在设置页顶部搜索框输入关键词（按 \u003ccode>⌘F\u003c/code> 聚焦），可在全站所有配置项中秒级模糊检索。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"配置模型供应商与密钥\">配置模型供应商与密钥\u003c/h2>\n\u003cp>进入 \u003cstrong>设置 ▸ 模型与供应商\u003c/strong>。支持 \u003cstrong>接口与密钥\u003c/strong>（API Key 按量计费）与 \u003cstrong>订阅与配额\u003c/strong>（OAuth 订阅账号）。\u003c/p>\n\u003ch3 id=\"添加-api-供应商\">添加 API 供应商\u003c/h3>\n\u003col>\n\u003cli>点击 \u003cstrong>添加供应商\u003c/strong>；\u003c/li>\n\u003cli>在 \u003cstrong>从预设开始\u003c/strong> 中选择（内置主流预设：Anthropic、OpenAI、DeepSeek、Google Gemini、Moonshot Kimi、OpenRouter、SiliconFlow、Groq、Mistral、xAI、Ollama，或选择 \u003cstrong>自定义 OpenAI 兼容\u003c/strong>）；\u003c/li>\n\u003cli>填入名称、环境变量名及 API Key；展开 \u003cstrong>进阶设置\u003c/strong> 可自定义协议标准（OpenAI Compatible / Responses / Anthropic / Gemini / Ollama）、默认上下文窗口及输出上限；\u003c/li>\n\u003cli>点击 \u003cstrong>获取模型列表\u003c/strong> 从接口实时拉取可用模型，或手动填入模型 ID；\u003c/li>\n\u003cli>点击 \u003cstrong>保存并加密密钥\u003c/strong>。\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>\u003cstrong>钥匙串级硬件加密\u003c/strong>：工作台采用 macOS 系统钥匙串的主密钥对 API Key 进行 AES-256-GCM 本地加密，密文保存在 \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>，明文仅在向接口发送请求时短暂驻留在内存中，绝不写入普通文件或日志。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"oauth-订阅账号与配额看板\">OAuth 订阅账号与配额看板\u003c/h3>\n\u003cul>\n\u003cli>点击 \u003cstrong>OAuth 登录\u003c/strong>：通过浏览器完成官方授权流程，凭据直接托管于系统安全凭证库；\u003c/li>\n\u003cli>切换至 \u003cstrong>订阅与配额\u003c/strong> 标签页：可视化展现各供应商订阅账号的使用比例、重置周期与剩余重置券，实时监控余量。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"核心概念辨析模型角色-vs-自定义子代理\">核心概念辨析：模型角色 vs 自定义子代理\u003c/h2>\n\u003cp>许多用户容易混淆“模型角色”与“子代理”，请牢记两者的本质区别：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>维度\u003c/th>\u003cth>模型角色（Model Roles）\u003c/th>\u003cth>自定义子代理（Sub-agent Definitions）\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>核心本质\u003c/strong>\u003c/td>\u003ctd>模型的\u003cstrong>别名与用途映射\u003c/strong>（Alias）\u003c/td>\u003ctd>具备独立 Prompt、专属模型和工具权限的\u003cstrong>独立智能体定义\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>配置入口\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>设置 ▸ 模型角色\u003c/strong> (\u003ccode>RolesSection\u003c/code>)\u003c/td>\u003ctd>\u003cstrong>设置 ▸ 子代理\u003c/strong> (\u003ccode>AgentDefsPanel\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>存储位置\u003c/strong>\u003c/td>\u003ctd>\u003ccode>~/.omp/agent/config.yml\u003c/code> (\u003ccode>modelRoles.*\u003c/code>)\u003c/td>\u003ctd>\u003ccode>~/.omp/agent/agents/&lt;名称&gt;.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>典型代表\u003c/strong>\u003c/td>\u003ctd>\u003ccode>default\u003c/code> (主力), \u003ccode>smol\u003c/code> (轻量), \u003ccode>slow\u003c/code> (深度推理)\u003c/td>\u003ctd>\u003ccode>task\u003c/code> (通用子任务), \u003ccode>scout\u003c/code> (快速代码侦察), 自定义专家\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>调用方式\u003c/strong>\u003c/td>\u003ctd>在配置中以 \u003ccode>@角色名\u003c/code> 链式引用\u003c/td>\u003ctd>在对话中由主智能体调度，或由用户指定分派\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"模型角色分配\">模型角色分配\u003c/h2>\n\u003cp>在 \u003cstrong>设置 ▸ 模型角色\u003c/strong> 中，你可以决定不同职责的后台任务分别由哪款模型来承担：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>主力模型 (\u003ccode>default\u003c/code>)\u003c/strong>：承担主要对话逻辑、代码生成与主流程决策；\u003c/li>\n\u003cli>\u003cstrong>快速模型 (\u003ccode>smol\u003c/code>)\u003c/strong>：处理轻量分类、简短判断，兼顾极速响应与低资费；\u003c/li>\n\u003cli>\u003cstrong>深度模型 (\u003ccode>slow\u003c/code>)\u003c/strong>：负责架构设计、疑难 Bug 深度排查，具备高推理能力；\u003c/li>\n\u003cli>\u003cstrong>视觉模型 (\u003ccode>vision\u003c/code>)\u003c/strong>：理解用户传入的图片、UI 截图与设计草图；\u003c/li>\n\u003cli>\u003cstrong>专用角色\u003c/strong>：规划设计 (\u003ccode>plan\u003c/code>)、提交信息生成 (\u003ccode>commit\u003c/code>)、记忆梳理 (\u003ccode>memory\u003c/code>)、顾问分析 (\u003ccode>advisor\u003c/code>) 等。\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>每一行均支持选择 \u003cstrong>专属模型\u003c/strong> 或 \u003cstrong>复用角色模型\u003c/strong>（写入 \u003ccode>@default\u003c/code> 等），一旦主力模型更换，复用该角色的所有下游任务自动跟随升级。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"创建与管理自定义子代理\">创建与管理自定义子代理\u003c/h2>\n\u003cp>进入 \u003cstrong>设置 ▸ 子代理\u003c/strong>。这里展示所有可由主智能体派发的专业子代理（包含内置的 \u003ccode>task\u003c/code>、\u003ccode>scout\u003c/code>、\u003ccode>reviewer\u003c/code> 以及你自定义的专属子代理）。\u003c/p>\n\u003ch3 id=\"新建子代理\">新建子代理\u003c/h3>\n\u003cp>点击 \u003cstrong>添加子代理\u003c/strong>，弹出创建表单：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>子代理代号（Name）\u003c/strong>：小写英文字符与连字符（如 \u003ccode>security-auditor\u003c/code> 或 \u003ccode>doc-writer\u003c/code>）；\u003c/li>\n\u003cli>\u003cstrong>职责描述（Description）\u003c/strong>：告诉主智能体“在什么场景下应该把任务派发给你”（例如：“负责审查代码中的潜在安全漏洞与注入风险”）；\u003c/li>\n\u003cli>\u003cstrong>分配专属模型\u003c/strong>：为该子代理指定最适宜的模型；\u003c/li>\n\u003cli>\u003cstrong>工具权限白名单\u003c/strong>：精确勾选该子代理可以调用的工具（例如限制只能使用 \u003ccode>read\u003c/code> 和 \u003ccode>grep\u003c/code> 只读工具，严禁 \u003ccode>write\u003c/code> 或 \u003ccode>bash\u003c/code>）；\u003c/li>\n\u003cli>\u003cstrong>系统提示词（System Prompt Body）\u003c/strong>：定义子代理的角色准则、输出契约与工作规范。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"让-ai-帮我写-一键生成\">“让 AI 帮我写” 一键生成\u003c/h3>\n\u003cp>不确定如何编写高质量的子代理 Markdown？点击表单顶部的 \u003cstrong>让 AI 帮我写\u003c/strong> 按钮，描述你希望构建的专家角色（例如：“帮我写一个专门负责审查 React 19 渲染性能与重渲染问题的子代理”），系统将自动为你生成规范的 Prompt 与推荐工具权限，一键填入表单！\u003c/p>\n\u003ch2 id=\"模型批量替换与模板自动切换\">模型批量替换与模板自动切换\u003c/h2>\n\u003cp>当某个模型服务调整、下线或你想统一将某个模型升级时，无需手动逐项翻找修改：\u003c/p>\n\u003ch3 id=\"批量替换模型model-replace\">批量替换模型（Model Replace）\u003c/h3>\n\u003cp>在 \u003cstrong>模型角色\u003c/strong> 页面点击 \u003cstrong>批量替换\u003c/strong>：\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>选择来源模型\u003c/strong>：扫描并列出全局配置、所有已添加项目、回退链以及定时任务中的所有引用位置；\u003c/li>\n\u003cli>\u003cstrong>选择目标模型\u003c/strong>：指定要换成的新模型并选择思考等级；\u003c/li>\n\u003cli>\u003cstrong>精确预览变动\u003c/strong>：直观对比每一处的 旧 → 新 变动，遇到冲突时自动合并去重，允许单独取消勾选某一项；\u003c/li>\n\u003cli>\u003cstrong>一键应用与运行中会话热切换\u003c/strong>：写入配置后，可直接勾选将当前正在运行的会话即刻迁移到新模型；\u003c/li>\n\u003cli>\u003cstrong>安全撤销机制\u003c/strong>：系统保留最近 10 次替换历史，支持随时一键完全撤销。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"角色模板与配额自动降级\">角色模板与配额自动降级\u003c/h3>\n\u003cp>在 \u003cstrong>模板与自动切换\u003c/strong> 卡片中：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>方案模板\u003c/strong>：将一套完整的角色模型分配保存为一个方案（如“极致性能方案”、“低成本省钱方案”）；\u003c/li>\n\u003cli>\u003cstrong>按额度自动切换规则\u003c/strong>：设定触发规则（如：当某供应商本周配额消耗达到 90% 时，自动将当前项目切换为“省钱方案”；当配额恢复时自动切回）。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"备用模型与重试回退\">备用模型与重试回退\u003c/h2>\n\u003cp>进入 \u003cstrong>设置 ▸ 备用模型与重试\u003c/strong>。确保在模型突发限流、服务中断或额度超限时，你的开发任务不被打断。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>回退链配置\u003c/strong>：为每个角色（如 \u003ccode>default\u003c/code>）排定多级备选名单（如：\u003ccode>Claude 3.5 Sonnet\u003c/code> → \u003ccode>DeepSeek V3\u003c/code> → \u003ccode>GPT-4o\u003c/code>）；\u003c/li>\n\u003cli>\u003cstrong>同账号故障轮换\u003c/strong>：额度不足时优先轮换同一供应商的备用账号，再回退到其他供应商模型；\u003c/li>\n\u003cli>\u003cstrong>防死循环机制\u003c/strong>：内置最大连续重试次数与超时保护，防止无限循环消耗资费。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"规则文件记忆与系统提示词\">规则文件、记忆与系统提示词\u003c/h2>\n\u003ch3 id=\"规则文件agentsmd\">规则文件（AGENTS.md）\u003c/h3>\n\u003cp>进入 \u003cstrong>设置 ▸ 规则文件\u003c/strong>。长期规则决定了智能体的工作习惯与工程规范：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>全局长期规则\u003c/strong>：存放在 \u003ccode>~/.omp/agent/AGENTS.md\u003c/code>，每次对话自动注入；\u003c/li>\n\u003cli>\u003cstrong>项目级规则\u003c/strong>：位于项目根目录下的 \u003ccode>AGENTS.md\u003c/code>，用于定义该项目的架构契约、技术栈禁忌与代码风格；\u003c/li>\n\u003cli>\u003cstrong>输出实时检查规则\u003c/strong>：配置智能体在每一次输出时强制自检的核心准则。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"记忆文件管理memory\">记忆文件管理（Memory）\u003c/h3>\n\u003cp>进入 \u003cstrong>设置 ▸ 记忆\u003c/strong>。智能体在多轮迭代中积累的可复用经验存储于记忆文件中：\u003c/p>\n\u003cul>\n\u003cli>浏览与检索跨会话积累的长期记忆条目；\u003c/li>\n\u003cli>对已过时、不准确的项目假设进行手动修正或一键清理。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"系统提示词构成prompt-composition\">系统提示词构成（Prompt Composition）\u003c/h3>\n\u003cp>进入 \u003cstrong>设置 ▸ 系统提示词构成\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>可视成分拆解\u003c/strong>：清晰查看每一次向模型发起请求时，系统提示词是由哪些部分构成的（内置基础提示词、工具协议定义、MCP 工具描述、Skills 技能说明、AGENTS 规则文件等）以及各占用了多少 Token；\u003c/li>\n\u003cli>\u003cstrong>AI 瘦身建议\u003c/strong>：点击 \u003cstrong>让 AI 分析并建议精简\u003c/strong>，分析是否存在冗余规则或过长描述，大幅降低首字延迟与开销。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"接入-mcp-服务器与插件\">接入 MCP 服务器与插件\u003c/h2>\n\u003ch3 id=\"mcp-服务器model-context-protocol\">MCP 服务器（Model Context Protocol）\u003c/h3>\n\u003cp>进入 \u003cstrong>设置 ▸ MCP 服务器\u003c/strong>。为智能体扩展无限外部能力：\u003c/p>\n\u003cul>\n\u003cli>支持本地命令行服务（\u003ccode>stdio\u003c/code>，如通过 \u003ccode>npx\u003c/code> 调起各类服务）、远程 \u003ccode>HTTP\u003c/code> 接口及 \u003ccode>SSE\u003c/code> 推送协议；\u003c/li>\n\u003cli>\u003cstrong>项目级与全局隔离\u003c/strong>：支持将特定 MCP 仅绑定在当前项目，避免无关项目加载大量无用工具导致上下文膨胀；\u003c/li>\n\u003cli>\u003cstrong>环境变量加密\u003c/strong>：支持安全填入第三方 Token（如 GitHub、Sentry 凭据）。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"插件与扩展模块\">插件与扩展模块\u003c/h3>\n\u003cp>进入 \u003cstrong>设置 ▸ 插件\u003c/strong>。集中管理随应用附带或手动安装的原生插件（如代码可视化组件 Visualize、外部脚本扩展等），支持一键启用、禁用与更新。\u003c/p>\n\u003ch2 id=\"隐私库与自动脱敏\">隐私库与自动脱敏\u003c/h2>\n\u003cp>进入 \u003cstrong>设置 ▸ 隐私\u003c/strong>。彻底解决在对话或代码调试中不慎将 API Key、数据库密码、生产 Token 泄露给大模型的隐患：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>添加隐私项\u003c/strong>：将敏感字符串加入隐私库并设置代号（如“测试库密码”）；\u003c/li>\n\u003cli>\u003cstrong>动态占位符\u003c/strong>：发给 AI 的所有消息与上下文会被自动替换为不含语义的占位符（如 \u003ccode>⟦密码_a1b2⟧\u003c/code>）；\u003c/li>\n\u003cli>\u003cstrong>本地安全还原\u003c/strong>：占位符仅在智能体于本机真正执行 Shell 命令或工具的那一刹那在内存中还原为真实值；\u003c/li>\n\u003cli>\u003cstrong>防误伤机制\u003c/strong>：针对较短的字符串可开启“仅还原手动标记处”，避免误伤正常代码。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"配置备份恢复与更新\">配置备份、恢复与更新\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>设置导出与导入\u003c/strong>：在 \u003cstrong>设置 ▸ 高级\u003c/strong> 中，可一键将本应用的所有工作台偏好设置导出为 JSON 备份文件，换机时一键覆盖导入；\u003c/li>\n\u003cli>\u003cstrong>恢复出厂设置\u003c/strong>：遇到配置混乱时可一键清空重置；\u003c/li>\n\u003cli>\u003cstrong>版本更新\u003c/strong>：在 \u003cstrong>设置 ▸ 版本与更新\u003c/strong> 中，可同时检查桌面工作台本体与底层 OMP 引擎的更新。OMP 引擎更新无需重启客户端，新轮次自动无缝承接。\u003c/li>\n\u003c/ul>"},{"slug":"06-monitoring-and-mobile","title":"监控、体检与远程连接","html":"\u003ch1 id=\"监控体检与远程连接\">监控、体检与远程连接\u003c/h1>\n\u003cblockquote>\n\u003cp>深度洞察上下文水位与资费消耗、利用会话体检找准绕路根因、管理本地端口与后台服务进程，并通过手机端实现随时随地的远程查阅与审批。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/06-monitoring-and-mobile/%E6%8E%8C%E6%8F%A1-token-%E7%94%A8%E9%87%8F%E4%B8%8E%E5%BC%80%E9%94%80%E5%88%86%E5%B8%83\">在 Token 用量面板中掌握资源消耗\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/06-monitoring-and-mobile/%E4%BC%9A%E8%AF%9D%E6%B7%B1%E5%BA%A6%E4%BD%93%E6%A3%80-session-doctor\">使用会话体检排查浪费、优化提问并发现代码隐患\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/06-monitoring-and-mobile/%E8%AF%8A%E6%96%AD%E5%BC%82%E5%B8%B8%E4%B8%8E%E4%B8%AD%E6%96%AD%E4%BC%9A%E8%AF%9D\">使用独立诊断排查异常与中断会话\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/06-monitoring-and-mobile/%E6%9C%AC%E5%9C%B0%E6%9C%8D%E5%8A%A1%E4%B8%8E%E7%AB%AF%E5%8F%A3%E6%B2%BB%E7%90%86\">管理本地开发服务与一键清理残留进程\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/06-monitoring-and-mobile/%E6%80%A7%E8%83%BD%E4%B8%8E%E5%86%85%E5%AD%98%E7%9C%9F%E5%AE%9E%E7%9B%91%E6%8E%A7\">查看真实的物理内存占用\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/06-monitoring-and-mobile/%E5%85%A8%E5%9C%BA%E6%99%AF%E6%89%8B%E6%9C%BA%E8%BF%9C%E7%A8%8B%E8%AE%BF%E9%97%AE\">配置手机访问：局域网配对、公网隧道与 IPv6 直连\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"掌握-token-用量与开销分布\">掌握 Token 用量与开销分布\u003c/h2>\n\u003cp>在右侧面板打开 \u003cstrong>Token 用量\u003c/strong> 标签页（快捷键 \u003ccode>⌘J\u003c/code>），面板提供 \u003cstrong>本对话\u003c/strong> 与 \u003cstrong>全局洞察\u003c/strong> 两种视图。\u003c/p>\n\u003ch3 id=\"1-本对话用量分析\">1. 本对话用量分析\u003c/h3>\n\u003cp>选中当前会话后，面板清晰呈现：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>上下文水位计\u003c/strong>：当前会话已占用的 Token 数与当前模型上下文上限的百分比，临近上限时自动告警；\u003c/li>\n\u003cli>\u003cstrong>五大开销维度分布条\u003c/strong>：\n\u003cul>\n\u003cli>\u003cstrong>Tool Calls\u003c/strong>：工具调用的输入参数与返回结果占用；\u003c/li>\n\u003cli>\u003cstrong>Skills 注入\u003c/strong>：已加载技能的描述信息占用；\u003c/li>\n\u003cli>\u003cstrong>System Prompt\u003c/strong>：基础系统提示词与 AGENTS 规则文件占用；\u003c/li>\n\u003cli>\u003cstrong>MCP 服务\u003c/strong>：外部 MCP 协议工具清单占用；\u003c/li>\n\u003cli>\u003cstrong>思考与回复\u003c/strong>：模型的内在推理链与最终文本输出。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>逐项下钻与定位\u003c/strong>：点击任意分类卡片，可展开每一次具体工具调用的消耗明细；点击 \u003cstrong>定位\u003c/strong> 按钮，主对话流即刻平滑滚动至对应轮次；\u003c/li>\n\u003cli>\u003cstrong>子代理省流统计\u003c/strong>：如果会话派发了子代理，顶部可切换查看主对话与各子代理的独立开销，右上角直观展示通过子代理隔离技术为你节省的上下文总量。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"2-全局洞察与历史账单\">2. 全局洞察与历史账单\u003c/h3>\n\u003cp>切换至 \u003cstrong>全局洞察\u003c/strong> 标签页：\u003c/p>\n\u003cul>\n\u003cli>聚合统计全部会话的 Token 消耗、累计预估成本与会话总数；\u003c/li>\n\u003cli>按照 \u003cstrong>最高消耗优先\u003c/strong>、\u003cstrong>最多问题优先\u003c/strong> 或 \u003cstrong>最新活动优先\u003c/strong> 筛选排序；\u003c/li>\n\u003cli>顶部的 \u003cstrong>长期共性问题 Top 3\u003c/strong> 会根据多次会话体检结果，自动提炼你在需求表述或指令下达中的常见思维盲区。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"会话深度体检session-doctor\">会话深度体检（Session Doctor）\u003c/h2>\n\u003cp>当一场复杂的长对话变得迟缓、出现频繁返工或消耗远超预期时，无需人工从头翻看漫长记录。\u003cstrong>会话体检\u003c/strong> 会由一个独立的轻量模型回看整场对话，精准开具“体检诊断单”。\u003c/p>\n\u003ch3 id=\"四大体检方向\">四大体检方向\u003c/h3>\n\u003cp>在 \u003cstrong>Token 用量 ▸ 🩺 会话体检\u003c/strong> 中选择针对性方向：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>体检方向\u003c/th>\u003cth>核心排查目标与解决痛点\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>🪙 省钱瘦身\u003c/strong>\u003c/td>\u003ctd>揪出无意义的重复文件读取、超大工具返回、无效的试错重试与可压缩环节\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🎯 提问调优\u003c/strong>\u003c/td>\u003ctd>深度分析你的初始需求表述是否存在歧义、漏项，导致智能体思路偏航或范围蔓延\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🛡️ 代码暗坑\u003c/strong>\u003c/td>\u003ctd>检查智能体在未彻底验证的情况下做出的过度设计、破坏既有约定的改动或潜在 Bug\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>💬 自由体检\u003c/strong>\u003c/td>\u003ctd>针对该场对话提出你关心的任何特定问题（如：“分析第 3 轮工具调用为何失败”）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"骨架脱水技术与纠偏-prompt-生成\">骨架脱水技术与纠偏 Prompt 生成\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>隐私与轻量化脱水\u003c/strong>：系统会自动将整场对话脱水提取为仅保留“目标、动作流、错误日志与改动文件”的精简骨架，绝不将完整历史全部回传，既保护隐私又大幅节省资费；\u003c/li>\n\u003cli>\u003cstrong>纠偏 Prompt 草稿\u003c/strong>：体检报告不仅给出根因分析，还会直接生成一份\u003cstrong>纠偏提示词草稿\u003c/strong>。点击 \u003cstrong>填入输入框\u003c/strong> 即可立即发给智能体，一键拨乱反正！\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>前往 \u003cstrong>设置 ▸ 会话体检\u003c/strong>，可以为体检指定速度快、价格极低的专用模型，并可配置每日定时体检或会话闲置后自动体检。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"诊断异常与中断会话\">诊断异常与中断会话\u003c/h2>\n\u003cp>当某个会话报错停止或进程意外中断时：\u003c/p>\n\u003col>\n\u003cli>在左侧栏右键该会话，选择 \u003cstrong>诊断此会话\u003c/strong>；\u003c/li>\n\u003cli>系统自动提炼报错现场与最后几轮关键日志，生成结构化的诊断上下文；\u003c/li>\n\u003cli>选择 \u003cstrong>由哪个 Agent 执行诊断\u003c/strong>（可选择一个空闲的已有会话，或开启一个全新的独立诊断会话）；\u003c/li>\n\u003cli>点击 \u003cstrong>开始诊断\u003c/strong>，派发的智能体将专注于该报错日志进行源码排查，避免在原出错会话中反复试错导致污染现场。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"本地服务与端口治理\">本地服务与端口治理\u003c/h2>\n\u003cp>在右侧面板打开 \u003cstrong>服务\u003c/strong> 标签页，这里是本地开发服务器与常驻进程的“任务管理器”。\u003c/p>\n\u003ch3 id=\"识别与状态监控\">识别与状态监控\u003c/h3>\n\u003cul>\n\u003cli>系统自动扫描本机当前监听的所有端口，并高亮标记前端开发服务器（如 Vite、Next.js、Webpack、Uvicorn 等服务）；\u003c/li>\n\u003cli>每一行清晰显示监听端口、服务进程名、\u003ccode>PID\u003c/code>、对应的工作目录，以及该服务是由哪场智能体会话拉起的；\u003c/li>\n\u003cli>点击端口地址，可直接在默认浏览器中一键打开页面。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"时光机服务标记与残留清理\">时光机服务标记与残留清理\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>时光机快照服务\u003c/strong>：带有专属的「时光机」标记，方便与正式开发环境区分；\u003c/li>\n\u003cli>\u003cstrong>残留进程一键清理\u003c/strong>：如果某个端口对应的智能体会话已经关闭或结束，该服务会被标记为 \u003cstrong>残留\u003c/strong>。面板顶部会浮现 \u003cstrong>一键清理\u003c/strong> 横幅，点击后即可一键杀死全部孤儿进程，彻底解决“端口被占用”的困扰。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"性能与内存真实监控\">性能与内存真实监控\u003c/h2>\n\u003cp>点击窗口底部状态栏的 \u003cstrong>性能 xxx MB\u003c/strong> 按钮，可唤出系统级性能监视面板。\u003c/p>\n\u003ch3 id=\"严谨的物理内存口径\">严谨的物理内存口径\u003c/h3>\n\u003cul>\n\u003cli>采用与 macOS「活动监视器」完全一致的**物理常驻内存（Footprint）**口径统计；\u003c/li>\n\u003cli>清晰拆解呈现：本应用界面进程、本窗口智能体进程、本机其他终端的 OMP 进程及空闲系统内存；\u003c/li>\n\u003cli>\u003cstrong>开发与生产区别\u003c/strong>：在开发模式（\u003ccode>pnpm tauri dev\u003c/code>）下由于未打包的 Vite 模块热替换与 Debug 符号，数值会偏高；生产打包后经过深度优化，闲置占用极低。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"全场景手机远程访问\">全场景手机远程访问\u003c/h2>\n\u003cp>出门在外、躺在沙发上，或者在会议室中，你依然可以用手机查阅长任务的运行进展，并即时批准工具调用。进入 \u003cstrong>设置 ▸ 手机访问\u003c/strong>。\u003c/p>\n\u003ch3 id=\"1-局域网极速配对同一-wi-fi\">1. 局域网极速配对（同一 Wi-Fi）\u003c/h3>\n\u003col>\n\u003cli>在 \u003cstrong>手机访问服务\u003c/strong> 卡片点击 \u003cstrong>启动\u003c/strong>；\u003c/li>\n\u003cli>点击 \u003cstrong>生成配对二维码\u003c/strong>；\u003c/li>\n\u003cli>用手机微信或相机扫一扫二维码，即刻在手机浏览器中打开轻量化 Web 版工作台；\u003c/li>\n\u003cli>手机端支持：浏览会话流、发送后续指令、一键批准/拒绝危险工具调用、查看文件与 Git 提交。\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"2-公网隧道离开-wi-fi-访问\">2. 公网隧道（离开 Wi-Fi 访问）\u003c/h3>\n\u003cp>如果电脑在公司或家中，想在路上用手机移动蜂窝网络访问：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>临时公网地址（基于 Cloudflare Tunnel）\u003c/strong>：\n\u003cul>\n\u003cli>本机安装 \u003ccode>cloudflared\u003c/code>（\u003ccode>brew install cloudflared\u003c/code>）；\u003c/li>\n\u003cli>选择 \u003cstrong>临时公网地址\u003c/strong> 并点击启动，系统将自动分配一个安全的专属 \u003ccode>trycloudflare.com\u003c/code> 临时域名并生成公网配对码；\u003c/li>\n\u003cli>无需公网 IP，无需配置路由器端口映射，安全穿透 NAT！\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>固定自有域名\u003c/strong>：支持绑定你自己在 Cloudflare 托管的域名与隧道凭据，实现长期稳定的远程访问。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3-ipv6-公网直连与-ddns-自动解析\">3. IPv6 公网直连与 DDNS 自动解析\u003c/h3>\n\u003cp>对于拥有公网 IPv6 的宽带网络：\u003c/p>\n\u003cul>\n\u003cli>启动 \u003cstrong>直连（IPv6）\u003c/strong> 服务，手机利用 5G/4G 的原生 IPv6 直连电脑；\u003c/li>\n\u003cli>\u003cstrong>内置 Cloudflare DDNS 动态域名解析\u003c/strong>：开启后，当家庭宽带公网 IPv6 发生变动时，工作台会自动调用 Cloudflare API 同步更新 AAAA 解析记录，确保持续稳定连接。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"权限快速撤销\">权限快速撤销\u003c/h3>\n\u003cp>手机丢失或公共演示结束后，随时在 \u003cstrong>设置 ▸ 手机访问\u003c/strong> 底部点击 \u003cstrong>全部撤销\u003c/strong>，所有已授权的手机将立即被踢出并失效。\u003c/p>"},{"slug":"07-shortcuts-and-troubleshooting","title":"快捷键速查与问题排查","html":"\u003ch1 id=\"快捷键速查与问题排查\">快捷键速查与问题排查\u003c/h1>\n\u003cblockquote>\n\u003cp>键盘高效流快捷键汇总、典型日常疑问排查指南，以及工作台数据目录与文件架构全解。\u003c/p>\n\u003c/blockquote>\n\u003cp>读完本章，你可以：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E9%94%AE%E7%9B%98%E5%BF%AB%E6%8D%B7%E9%94%AE%E9%80%9F%E6%9F%A5\">速查全套键盘快捷键\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E5%B8%B8%E8%A7%81%E9%97%AE%E9%A2%98%E6%8E%92%E6%9F%A5\">排查常见疑问与故障\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E6%95%B0%E6%8D%AE%E4%BD%8D%E7%BD%AE%E4%B8%8E%E7%9B%AE%E5%BD%95%E7%BB%93%E6%9E%84\">了解本地数据存储位置与备份\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"键盘快捷键速查\">键盘快捷键速查\u003c/h2>\n\u003cblockquote>\n\u003cp>提示：文档中的 \u003ccode>⌘\u003c/code> 对应 macOS 的 Command 键；Windows / Linux 环境下对应 \u003ccode>Ctrl\u003c/code>。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"1-全局系统与窗口快捷键\">1. 全局系统与窗口快捷键\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>功能描述\u003c/th>\u003cth>适用上下文\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘B\u003c/code>\u003c/td>\u003ctd>展开 / 收起左侧会话栏\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘J\u003c/code>\u003c/td>\u003ctd>展开 / 收起右侧辅助面板\u003c/td>\u003ctd>全局（全屏视图除外）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘N\u003c/code>\u003c/td>\u003ctd>极速新建会话\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>聚焦搜索（会话列表搜索 / 设置页项搜索）\u003c/td>\u003ctd>全局（编辑器除外）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘,\u003c/code>\u003c/td>\u003ctd>打开 / 退出设置中心\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘[\u003c/code>\u003c/td>\u003ctd>一级返回（从全页视图/设置切回会话，或从辅助对话返回主会话）\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘`\u003c/code>\u003c/td>\u003ctd>快速展开 / 收起右侧内置终端标签\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘W\u003c/code>\u003c/td>\u003ctd>智能关闭：优先关闭最上层浮层 → 关闭当前右侧标签 → 隐藏窗口\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘+\u003c/code> / \u003ccode>⌘-\u003c/code> / \u003ccode>⌘0\u003c/code>\u003c/td>\u003ctd>放大 / 缩小 / 恢复 100% 界面缩放比例（80%–140%）\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>智能取消：关闭弹出层 / 回合运行中紧急终止生成 / 返回主视图\u003c/td>\u003ctd>全局\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧I\u003c/code>\u003c/td>\u003ctd>唤出全局想法与缺陷收集浮窗\u003c/td>\u003ctd>系统级（在任何其他 App 中均可唤出）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"2-智能输入框快捷键\">2. 智能输入框快捷键\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>功能描述\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>任意字符\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>自然打字捕获\u003c/strong>（Type-to-focus）：无需鼠标点击，直接键盘打字即可捕获入框\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>发送消息（默认配置）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Enter\u003c/code>\u003c/td>\u003ctd>换行（默认配置）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>发送消息（若在 \u003cstrong>设置 ▸ 会话 ▸ 发送快捷键\u003c/strong> 中选择了 ⌘Enter 模式）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌥Enter\u003c/code> / \u003ccode>⌥⌘Enter\u003c/code>\u003c/td>\u003ctd>临时反转发送策略（如将“引导”临时变为“排队”，无需改动设置）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>光标在首行 / 末行时上下翻阅历史输入记录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>@\u003c/code>\u003c/td>\u003ctd>唤起工作区文件模糊检索与引用菜单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/\u003c/code>\u003c/td>\u003ctd>唤起斜杠命令菜单（\u003ccode>/model\u003c/code>, \u003ccode>/compact\u003c/code>, \u003ccode>/plan\u003c/code> 等）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Tab\u003c/code> / \u003ccode>Shift+Tab\u003c/code>\u003c/td>\u003ctd>在 Markdown 列表输入时增加 / 减少缩进级别\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"3-会话列表焦点位于列表时\">3. 会话列表（焦点位于列表时）\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>功能描述\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>上下平滑移动高亮并切换查看对应会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>激活并打开当前高亮会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> / \u003ccode>→\u003c/code>\u003c/td>\u003ctd>折叠 / 展开当前会话所在的项目或工作树分组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Delete\u003c/code> / \u003ccode>Backspace\u003c/code>\u003c/td>\u003ctd>一键归档当前会话（顶部支持即时撤销）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Delete\u003c/code>\u003c/td>\u003ctd>永久物理删除当前会话（需二次确认）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>F2\u003c/code>\u003c/td>\u003ctd>重命名当前会话标题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+F10\u003c/code> / 菜单键\u003c/td>\u003ctd>弹出当前会话的操作上下文菜单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘\u003c/code> 点击 / \u003ccode>Shift\u003c/code> 点击\u003c/td>\u003ctd>连续多选或跨范围批量选中会话\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"4-审批交互与问答面板\">4. 审批交互与问答面板\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>功能描述\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>y\u003c/code>\u003c/td>\u003ctd>快速点击审批卡上的 \u003cstrong>仅本次允许\u003c/strong>（焦点不在输入框时）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\u003ctd>快速点击审批卡上的 \u003cstrong>拒绝执行\u003c/strong>（焦点不在输入框时）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>1\u003c/code>–\u003ccode>9\u003c/code> 数字键\u003c/td>\u003ctd>在提问选择题面板中快速选定对应选项序号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> / \u003ccode>→\u003c/code>\u003c/td>\u003ctd>在多题提问面板中切换上一题 / 下一题\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>提交当前选项答案或进入下一题\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"5-文档代码与终端\">5. 文档、代码与终端\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>功能描述\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘S\u003c/code>\u003c/td>\u003ctd>保存当前正在编辑的文档或预览文件至磁盘\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>提交行间批注、保存 Git 提交信息草稿、创建工作树\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>在右侧终端或当前打开的代码编辑器中开启查找\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧A\u003c/code>\u003c/td>\u003ctd>将右侧终端中划选的高亮日志文字直接引用为当前会话的批注\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"常见问题排查\">常见问题排查\u003c/h2>\n\u003ch3 id=\"1-提示未找到-omp或新会话启动失败\">1. 提示「未找到 omp」，或新会话启动失败\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>原因\u003c/strong>：桌面工作台默认在系统的标准 \u003ccode>PATH\u003c/code> 中调用 \u003ccode>omp\u003c/code> 命令行程序。如果你的 \u003ccode>omp\u003c/code> 安装在特定路径（例如 Homebrew 非标准目录、NVM 目录或 Python 虚拟环境），应用可能无法自动寻路。\u003c/li>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：\n\u003col>\n\u003cli>在系统终端中运行 \u003ccode>which omp\u003c/code>，获取其绝对路径（如 \u003ccode>/usr/local/bin/omp\u003c/code> 或 \u003ccode>~/.cargo/bin/omp\u003c/code>）；\u003c/li>\n\u003cli>打开工作台 \u003cstrong>设置 ▸ 高级 ▸ omp 程序位置\u003c/strong>，填入该绝对路径；\u003c/li>\n\u003cli>前往 \u003cstrong>设置 ▸ 版本与更新\u003c/strong> 确认已正常识别到 omp 版本。\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"2-终端里直接运行的-omp-会话没有出现在列表中\">2. 终端里直接运行的 omp 会话没有出现在列表中\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>原因\u003c/strong>：终端命令行的动态事件未向工作台守护模块广播。\u003c/li>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：\n\u003cul>\n\u003cli>打开 \u003cstrong>设置 ▸ 高级 ▸ 外部终端联动\u003c/strong>，点击 \u003cstrong>安装扩展\u003c/strong>；\u003c/li>\n\u003cli>该操作会将轻量监听扩展写入 \u003ccode>~/.omp/agent/extensions/\u003c/code>。之后你在任何外部终端运行的会话，都会以 \u003cstrong>外部\u003c/strong> 标记实时同步显示在工作台左侧列表中。右键点击该会话可随时选择 \u003cstrong>接管会话\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3-会话提示已中断\">3. 会话提示「已中断」\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>原因\u003c/strong>：通常由于系统休眠、终端关闭、电脑断电或底层进程被系统意外终止。\u003c/li>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：右键点击该会话，选择 \u003cstrong>恢复会话\u003c/strong>；或直接进入会话点击底部的 \u003cstrong>恢复中断的回合\u003c/strong>，系统将向智能体发送断点续跑信号。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"4-为什么键盘打字没有自动进入输入框\">4. 为什么键盘打字没有自动进入输入框？\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>原因\u003c/strong>：为了防止打字与你的正常操作发生冲突，自动打字捕获（Type-to-focus）在以下场景下会主动让出键盘所有权：\n\u003col>\n\u003cli>当前已有其他输入框（如搜索框、文档源码编辑器）拥有焦点；\u003c/li>\n\u003cli>屏幕上有模态对话框、设置弹窗或下拉菜单展开；\u003c/li>\n\u003cli>正在内置终端中操作 Shell。\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：按下 \u003ccode>Esc\u003c/code> 键退出当前弹窗，或点击消息流空白处，再次打字即可瞬间进入输入框。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"5-上下文快满了请求变慢或报错怎么办\">5. 上下文快满了，请求变慢或报错怎么办？\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：\n\u003col>\n\u003cli>\u003cstrong>一键压缩\u003c/strong>：在输入框输入 \u003ccode>/compact\u003c/code> 并发送，由智能体总结提炼前序对话并释放上下文；\u003c/li>\n\u003cli>\u003cstrong>轻量抖动\u003c/strong>：输入 \u003ccode>/shake\u003c/code> 并发送，瞬间物理丢弃之前庞大的工具调用输出结果，零模型耗费腾出空间；\u003c/li>\n\u003cli>\u003cstrong>检查提示词构成\u003c/strong>：点击上下文水位环中的 \u003cstrong>查看系统提示词构成\u003c/strong>，检查是否有冗余的规则文件或过长技能描述，让 AI 协助精简。\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"6-开发模式pnpm-tauri-dev下窗口偶发一片空白\">6. 开发模式（\u003ccode>pnpm tauri dev\u003c/code>）下窗口偶发一片空白？\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>原因\u003c/strong>：在源码开发模式下，当多个文件在被并发编辑且存在相互依赖尚未写入时，Vite 的热重载机制可能触发全局整页刷新并停留在白屏态。\u003c/li>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：在项目根目录下执行 \u003ccode>touch index.html\u003c/code>，强制 Vite 重新触发一次根渲染，窗口即刻恢复。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"7-提示无法读取主密钥\">7. 提示「无法读取主密钥」？\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>原因\u003c/strong>：工作台的供应商加密库依赖于主密钥文件 \u003ccode>~/.omp-workspace/env/.master.key\u003c/code>。\u003c/li>\n\u003cli>\u003cstrong>解决方式\u003c/strong>：检查该文件是否存在以及当前用户是否拥有读写权限；如果曾手工移动过用户主目录，请确保权限为 \u003ccode>600\u003c/code>。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"数据位置与目录结构\">数据位置与目录结构\u003c/h2>\n\u003cp>工作台秉持数据本地化与透明化原则，所有关键数据均保存在本地目录中：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>本地路径\u003c/th>\u003cth>存储内容与用途说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/app.db\u003c/code>\u003c/td>\u003ctd>本地 SQLite 核心数据库（存储会话元信息、定时任务、想法收集箱、设置状态等）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/env/keys.env\u003c/code>\u003c/td>\u003ctd>由 macOS 钥匙串高强度加密的供应商 API 密钥密文文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/env/.master.key\u003c/code>\u003c/td>\u003ctd>本机加密主密钥文件（严格本地受控）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/global/\u003c/code>\u003c/td>\u003ctd>Universal 通用空间对话所依附的全局工作目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/images/\u003c/code>\u003c/td>\u003ctd>会话中粘贴、拖拽或草图生成的本地图片缓存（超过 30 天无引用的图片会自动清理）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/privacy/\u003c/code>\u003c/td>\u003ctd>本地脱敏隐私库的配置文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp/agent/sessions/\u003c/code>\u003c/td>\u003ctd>OMP 智能体引擎的原生会话历史文件（桌面端直接读取并展现）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp/agent/agents/\u003c/code>\u003c/td>\u003ctd>自定义子代理（Sub-agents）的定义 Markdown 模板目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;项目目录&gt;/.worktrees/\u003c/code>\u003c/td>\u003ctd>由工作台拉起的各独立 Git 工作树实体文件夹\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>换新电脑时，只需前往 \u003cstrong>设置 ▸ 高级 ▸ 数据与备份\u003c/strong> 点击 \u003cstrong>导出设置\u003c/strong>，并在新电脑上点击 \u003cstrong>导入设置\u003c/strong> 即可一键平滑迁移全部偏好。\u003c/p>\n\u003c/blockquote>"}],"en":[{"slug":"01-getting-started","title":"Getting Started","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/getting-started-layout.png\"/>\u003ch1 id=\"getting-started\">Gett
