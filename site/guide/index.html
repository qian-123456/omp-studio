ace-preview.png\" alt=\"批量替换模型：预览改动\"/>\u003c/p>\n\u003cp>写入配置不会改变正在运行的会话。结果页会列出仍在旧模型上运行的会话，勾选后点 \u003cstrong>切换到 &lt;新模型&gt;\u003c/strong> 即可让它们立刻改用新模型（同时设置思考等级，如果你选了的话）。\u003c/p>\n\u003cp>\u003cstrong>历史记录\u003c/strong> 保留最近 10 次替换，每条可以展开查看每处改动，点 \u003cstrong>撤销\u003c/strong> 恢复本次替换前的值；撤销只恢复这次替换写过的值，之后被你改过的位置会跳过。\u003c/p>\n\u003ch2 id=\"模板与按额度自动切换\">模板与按额度自动切换\u003c/h2>\n\u003cp>\u003cstrong>模型角色\u003c/strong> 页的 \u003cstrong>模板与自动切换\u003c/strong> 卡片把「角色 → 模型」对照表存成模板，一键应用，也可以在订阅额度快用完时自动换模板。模板和规则都属于上面选择的 \u003cstrong>配置范围\u003c/strong>，全局和每个项目互不可见。\u003c/p>\n\u003ch3 id=\"角色模板\">角色模板\u003c/h3>\n\u003cp>点击 \u003cstrong>新建模板\u003c/strong>，会以当前范围已配置的模型角色为基础打开编辑器：\u003c/p>\n\u003cul>\n\u003cli>填 \u003cstrong>模板名称\u003c/strong>（例如「省钱模式」），为每个角色选一个模型，或保持 \u003cstrong>未配置\u003c/strong>\u003c/li>\n\u003cli>选择 \u003cstrong>未配置\u003c/strong> 的角色在应用时会从该范围的配置里删除，恢复继承；不在模板中的角色应用时保持不变\u003c/li>\n\u003cli>勾选 \u003cstrong>设为保底模板\u003c/strong>：额度全部用尽时也会应用；同一范围只能有一个保底模板\u003c/li>\n\u003c/ul>\n\u003cp>模板列表里可以 \u003cstrong>应用\u003c/strong>、\u003cstrong>编辑\u003c/strong>、\u003cstrong>复制\u003c/strong>、\u003cstrong>删除\u003c/strong>（引用它的规则会一起删除）。当前配置与某个模板一致时显示 \u003cstrong>当前生效\u003c/strong> 标记。\u003c/p>\n\u003cp>点 \u003cstrong>应用\u003c/strong> 会先出现预览：改动的角色（旧 → 新）、将写入的文件、不会跟随的项目覆盖，以及额度 \u003cstrong>预检结果\u003c/strong>（\u003cstrong>可以应用\u003c/strong>、\u003cstrong>部分角色额度不足\u003c/strong>、\u003cstrong>当前额度不满足\u003c/strong>）。预检未通过时应用会被拒绝，确认后可以点 \u003cstrong>仍然应用\u003c/strong>。应用的同时会把新模型推送给该范围内正在运行的会话。\u003c/p>\n\u003ch3 id=\"自动切换规则\">自动切换规则\u003c/h3>\n\u003cp>\u003cstrong>自动切换规则\u003c/strong> 把「某个供应商的某个额度窗口用到 N%」变成「应用某个模板」：\u003c/p>\n\u003col>\n\u003cli>点击 \u003cstrong>新建规则\u003c/strong>（需要先有模板，并且额度账号可用，否则 \u003cstrong>供应商\u003c/strong> 和 \u003cstrong>窗口\u003c/strong> 暂时无法选择）。\u003c/li>\n\u003cli>选择 \u003cstrong>供应商\u003c/strong>、\u003cstrong>窗口\u003c/strong> 和 \u003cstrong>达到\u003c/strong> 的阈值百分比，选择 \u003cstrong>作用范围\u003c/strong> 和 \u003cstrong>应用模板\u003c/strong> 的目标模板。\u003c/li>\n\u003cli>可勾选 \u003cstrong>额度恢复后自动切回\u003c/strong>，并设置 \u003cstrong>降到 … % 以下\u003c/strong> 的阈值；留空时按阈值减 10%。\u003c/li>\n\u003c/ol>\n\u003cp>规则按从上到下的顺序检查，同一范围里第一条命中的生效，可以用上移、下移调整优先级，也可以随时停用。卡片底部可以设置 \u003cstrong>保底模板\u003c/strong>，以及 \u003cstrong>额度检查频率\u003c/strong>（每 1–1440 分钟检查一次，显示上次和下次检查时间）。没有启用的规则时不会获取额度报告。\u003c/p>\n\u003cp>最近的应用、自动切换和撤销会记录在 \u003cstrong>最近切换\u003c/strong> 里（最多 200 条），每条可以展开看原因、角色改动和会话切换情况，并 \u003cstrong>撤销\u003c/strong> 恢复到切换前的模型；撤销时如果某个角色已被你手动改过，会跳过它。\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-templates-rules.png\" alt=\"模板与自动切换规则\"/>\u003c/p>\n\u003ch2 id=\"备用模型与上下文窗口\">备用模型与上下文窗口\u003c/h2>\n\u003cp>\u003cstrong>设置 ▸ 备用模型与重试\u003c/strong>：模型出错或额度用完时自动换备用模型。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>自动换备用模型\u003c/strong> 开关（默认开启）；关闭后下面的设置暂不生效\u003c/li>\n\u003cli>\u003cstrong>回退触发条件\u003c/strong> 与 \u003cstrong>回退后切回策略\u003c/strong>，以及 \u003cstrong>额度快用完时提前回退\u003c/strong>（根据订阅额度提前换同供应商账户，再换备用模型，普通 API 密钥不参与，默认关闭）\u003c/li>\n\u003cli>回退链按角色编辑：每个角色有三种状态——\u003cstrong>未设置\u003c/strong>（专用角色用内置备选，聊天类角色沿用 \u003ccode>default\u003c/code> 的名单）、\u003cstrong>不回退\u003c/strong>（出错即停）、\u003cstrong>自定义\u003c/strong>（按你排的顺序逐个尝试，条目可以是模型、\u003ccode>@角色\u003c/code> 或 \u003ccode>供应商/*\u003c/code>）。展开 \u003cstrong>出错后用哪份备用名单？看这里\u003c/strong> 可以查看查找顺序\u003c/li>\n\u003cli>\u003cstrong>会话内切换\u003c/strong> 设置在会话里用快捷键切换模型时的角色轮换顺序\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>设置 ▸ 上下文窗口\u003c/strong>：按型号批量设置每个模型的上下文窗口，以及自动压缩。可以搜索、按供应商和状态筛选模型，勾选多个模型后输入 \u003cstrong>批量窗口值\u003c/strong>（如 \u003ccode>200k\u003c/code>、\u003ccode>1m\u003c/code>），再勾选 \u003cstrong>记住为规则\u003c/strong> 把所选模型的共同名称存成「关键词 + 窗口值」规则；新建或修改规则会立即应用到所有匹配模型，修改后可以 \u003cstrong>撤销\u003c/strong>。页面上的 \u003cstrong>自动压缩\u003c/strong> 卡片可以选择按绝对 Token 数或窗口百分比（10%–95%）设置压缩阈值。\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>窗口设得比模型真实上限大，会导致自动压缩来不及触发，请求会因上下文过长报错。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"管理-mcp-服务器\">管理 MCP 服务器\u003c/h2>\n\u003cp>\u003cstrong>设置 ▸ MCP 服务器\u003c/strong> 给 AI 接入外部工具服务。改动只对之后新开的会话生效。\u003c/p>\n\u003cp>页面读取 omp 的 \u003ccode>mcp.json\u003c/code> 文件（项目的 \u003ccode>.omp/mcp.json\u003c/code>、\u003ccode>.mcp.json\u003c/code>，用户级的 \u003ccode>mcp.json\u003c/code>、\u003ccode>.mcp.json\u003c/code>，以及项目根目录的回退文件）。顶部可以选择 \u003cstrong>当前项目\u003c/strong>，不选则只显示全局服务器。\u003c/p>\n\u003cp>点击 \u003cstrong>添加服务器\u003c/strong>：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>名称\u003c/strong>\u003c/td>\u003ctd>例如 \u003ccode>filesystem\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>连接方式\u003c/strong>\u003c/td>\u003ctd>在本机运行一个命令（最常见，如用 \u003ccode>npx\u003c/code> 启动某个包）、连接远程 HTTP 地址，或连接远程 SSE 地址（旧式推送协议）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>保存到\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>仅当前项目\u003c/strong> 或 \u003cstrong>全局（所有项目通用）\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>命令\u003c/strong>、\u003cstrong>参数（每行一个）\u003c/strong>、\u003cstrong>工作目录（可选）\u003c/strong>\u003c/td>\u003ctd>本机命令方式使用，工作目录留空则使用会话所在目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>服务器地址\u003c/strong>、\u003cstrong>请求头\u003c/strong>\u003c/td>\u003ctd>远程方式使用\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>环境变量\u003c/strong>\u003c/td>\u003ctd>传给命令的环境变量，常用于填写 API 密钥，也可以写 \u003ccode>${变量}\u003c/code> 引用本机环境变量\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>超时（毫秒）\u003c/strong>\u003c/td>\u003ctd>留空使用默认值\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>已保存的环境变量值和请求头值不会在界面中显示，再次填写同名项即可覆盖；完整的 JSON（授权、OAuth 等额外字段）保留在文件里，页面底部的 \u003cstrong>配置文件\u003c/strong> 卡片可以用默认程序打开它。\u003c/p>\n\u003cp>每个服务器行显示作用范围（\u003cstrong>全局\u003c/strong> 或 \u003cstrong>项目\u003c/strong>）、连接方式和状态，并提供：\u003c/p>\n\u003cul>\n\u003cli>开关：启用或停用。全局服务器对所有项目生效，omp 暂不支持只对某个项目停用全局服务器\u003c/li>\n\u003cli>\u003cstrong>移入项目\u003c/strong> / \u003cstrong>移至全局\u003c/strong>：移入项目后其他项目的新会话不再加载它的工具，可以立即节省上下文\u003c/li>\n\u003cli>\u003cstrong>编辑\u003c/strong>、\u003cstrong>删除\u003c/strong>（删除会改写文件，无法撤销）\u003c/li>\n\u003c/ul>\n\u003cp>优先级更高的配置文件里有同名服务器时，这一条会标记为 \u003cstrong>被同名覆盖\u003c/strong>，不会生效。\u003c/p>\n\u003ch2 id=\"管理插件\">管理插件\u003c/h2>\n\u003cp>\u003cstrong>设置 ▸ 插件\u003c/strong> 列出已安装的插件和扩展模块，开关改动只对之后新开的会话生效。\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>已安装插件\u003c/strong>：来自 omp 的全局插件目录和当前项目的插件目录，来源标注为 \u003cstrong>本地链接\u003c/strong> 或 \u003cstrong>市场\u003c/strong>。用开关启用或停用；缺少 omp 清单的插件标记为 \u003cstrong>无清单\u003c/strong>，运行时不会加载；被项目覆盖配置禁用的标记为 \u003cstrong>项目已禁用\u003c/strong>。安装插件在终端运行 \u003ccode>omp plugin install &lt;包名&gt;\u003c/code>，装好后点右上角的刷新按钮\u003c/li>\n\u003cli>\u003cstrong>扩展模块\u003c/strong>：放在扩展目录里的脚本模块，可以启用、停用、在访达中显示，或永久删除（文件会从磁盘直接删除）\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"保护敏感信息隐私库\">保护敏感信息：隐私库\u003c/h2>\n\u003cp>\u003cstrong>设置 ▸ 隐私\u003c/strong> 管理需要脱敏的内容，比如密码、Token、私钥。加入隐私库的内容发给 AI 前会被替换成占位符（形如 \u003ccode>⟦名称_a1b2⟧\u003c/code>），只在本机执行工具之前还原。占位符创建后固定不变，修改名称只影响界面显示。\u003c/p>\n\u003ch3 id=\"标记与管理\">标记与管理\u003c/h3>\n\u003cul>\n\u003cli>在设置里点击 \u003cstrong>隐私库\u003c/strong> 卡片的 \u003cstrong>添加\u003c/strong>，输入 \u003cstrong>隐私内容\u003c/strong> 和可选的 \u003cstrong>备注名称\u003c/strong>（给自己看的别名，不填会自动生成代号）\u003c/li>\n\u003cli>在输入框里选中一段文字，点 \u003cstrong>标记为隐私\u003c/strong>（也可以右键菜单）。可以填名称，名称会被 AI 看到，不要填敏感内容；内容太短（少于 3 个字符）、含换行或超过 4096 个字符的无法标记\u003c/li>\n\u003cli>标记之后，如果提示 \u003cstrong>保存到隐私库？以后在其他会话中也会自动替换\u003c/strong>，选择 \u003cstrong>保存\u003c/strong> 即可在所有会话里自动识别替换；选择 \u003cstrong>不保存\u003c/strong> 则只在标记过它的会话里生效，这类条目列在 \u003cstrong>仅在会话中标记\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>隐私库里每一项显示备注、占位符和打码的真实值，可以 \u003cstrong>显示真实值\u003c/strong>、\u003cstrong>编辑备注\u003c/strong>、\u003cstrong>移出隐私库\u003c/strong> 或 \u003cstrong>彻底删除\u003c/strong>。较短或常见的内容会标记 \u003cstrong>易误伤\u003c/strong>（可能误伤普通文字），并多出一个 \u003cstrong>不追踪（只还原已标记处）\u003c/strong> 复选框，勾选后只还原你标记过的位置，不会在其他文字里自动替换。\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-privacy-library.png\" alt=\"隐私库列表与占位符\"/>\u003c/p>\n\u003cp>\u003cstrong>显示\u003c/strong> 卡片里的 \u003cstrong>默认显示真实值\u003c/strong> 决定对话里的占位符默认显示为真实内容还是名称（关闭后点击可临时切换）。\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>标记的内容如果已经在本会话里出现过，这些内容已经发给上游，标记无法撤回。选择 \u003cstrong>同时替换旧历史\u003c/strong> 会改变请求前缀，可能使缓存失效、增加费用；不接受的话请更换这个密钥并在新会话中继续。\u003c/p>\n\u003c/blockquote>\n\u003cp>隐私库里有内容时，omp 的 \u003cstrong>密钥脱敏\u003c/strong> 会在会话启动时自动开启，不需要在页面下方手动打开。如果 omp 的 \u003ccode>secrets.yml\u003c/code> 不是列表格式或写入失败，页面顶部会出现警告，为防泄露压缩上下文会被暂停，请检查该文件。\u003c/p>\n\u003ch2 id=\"调整-omp-配置项\">调整 omp 配置项\u003c/h2>\n\u003cp>\u003cstrong>模型\u003c/strong>、\u003cstrong>会话\u003c/strong>、\u003cstrong>Agent 能力\u003c/strong>、\u003cstrong>连接\u003c/strong> 分组里的大多数页面（例如 \u003cstrong>思考与采样\u003c/strong>、\u003cstrong>辅助模型\u003c/strong>、\u003cstrong>工具\u003c/strong>、\u003cstrong>文件读写\u003c/strong>、\u003cstrong>命令行\u003c/strong>、\u003cstrong>子代理\u003c/strong>、\u003cstrong>记忆\u003c/strong>、\u003cstrong>联网搜索\u003c/strong>）把 omp 的配置项做成了中文设置行，数据来自 omp 的 \u003ccode>config.yml\u003c/code>。\u003c/p>\n\u003cul>\n\u003cli>每一行显示名称、说明和控件；鼠标悬停在名称上可以看到配置键，以及它在 omp 终端界面里的位置\u003c/li>\n\u003cli>改过的项会标记 \u003cstrong>已修改\u003c/strong>，点击 \u003cstrong>恢复默认\u003c/strong> 删回默认值\u003c/li>\n\u003cli>列表、键值和嵌套结构有对应的编辑器，也可以点 \u003cstrong>直接编辑原始值\u003c/strong> 按 JSON 修改\u003c/li>\n\u003cli>密钥类设置只写不读：已设置的内容不会显示，输入新值即可整体替换\u003c/li>\n\u003cli>当前项目的 \u003ccode>.omp/config.yml\u003c/code> 里设置了同一项时，行上会标出 \u003cstrong>本项目已覆盖\u003c/strong>：在该项目中以项目文件为准，这里修改的是全局值\u003c/li>\n\u003cli>依赖其他开关的项会提示前置条件，例如「自动压缩」总开关关闭时相关设置暂不生效\u003c/li>\n\u003c/ul>\n\u003cp>如果页面提示 \u003cstrong>无法读取 omp 配置\u003c/strong>，请确认本机已安装 omp，并在 \u003cstrong>高级\u003c/strong> 页检查 omp 程序位置。\u003c/p>\n\u003ch2 id=\"备份恢复与重置\">备份、恢复与重置\u003c/h2>\n\u003cp>\u003cstrong>设置 ▸ 高级\u003c/strong>：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>环境与路径\u003c/strong>：\u003cstrong>程序位置\u003c/strong> 是本应用启动 AI 会话用的命令，一般填 \u003ccode>omp\u003c/code>，装在非常规位置时填完整路径；这里也能在访达中显示 omp 的 \u003ccode>config.yml\u003c/code>、打开 omp 数据目录和 \u003cstrong>重新读取 omp 配置\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>外部终端联动\u003c/strong>：点 \u003cstrong>安装扩展\u003c/strong>，让你在终端直接运行的 omp 对话也出现在本应用的列表里（安装到 \u003ccode>~/.omp/agent/extensions/\u003c/code>）\u003c/li>\n\u003cli>\u003cstrong>数据与备份\u003c/strong>：\u003cstrong>打开数据目录\u003c/strong>、\u003cstrong>导出设置\u003c/strong>、\u003cstrong>导入设置\u003c/strong>（覆盖导入，会先确认）。导出文件只包含本应用自己的设置，不含 omp 的配置\u003c/li>\n\u003cli>\u003cstrong>恢复默认设置\u003c/strong>：把本应用所有设置恢复成刚安装时的样子，需要二次确认且无法撤销，建议先导出备份\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>设置 ▸ 版本与更新\u003c/strong> 显示本应用和 omp 的版本，可以检查并安装更新；更新 omp 时空闲会话会立即切换到新版本，正在运行的会话在本轮结束后自动切换，对话记录会保留。\u003c/p>\n\u003cp>相关章节：\u003ca href=\"#/zh/06-monitoring-and-mobile\">手机访问与监控\u003c/a>、\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting\">快捷键与问题排查\u003c/a>。\u003c/p>"},{"slug":"06-monitoring-and-mobile","title":"监控与手机访问","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-token-distribution.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-doctor-result.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-services-panel.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-pairing-qr.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-tunnel.png\"/>\u003ch1 id=\"监控与手机访问\">监控与手机访问\u003c/h1>\n\u003cblockquote>\n\u003cp>用 Token 用量、会话体检、服务面板和性能面板了解会话与本机的资源消耗，并用手机在局域网或公网上查看会话、处理审批。\u003c/p>\n\u003c/blockquote>\n\u003cp>你可以：\u003c/p>\n\u003cul>\n\u003cli>在 \u003ca href=\"#/zh/06-monitoring-and-mobile/%E6%9F%A5%E7%9C%8B-token-%E7%94%A8%E9%87%8F\">Token 用量\u003c/a> 面板看每个会话的上下文水位、Token 消耗分布和预估成本\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/06-monitoring-and-mobile/%E4%BD%93%E6%A3%80%E4%BC%9A%E8%AF%9D\">会话体检\u003c/a> 让模型找出上下文浪费、返工和需求表述问题\u003c/li>\n\u003cli>用 \u003ca href=\"#/zh/06-monitoring-and-mobile/%E8%AF%8A%E6%96%AD%E5%BC%82%E5%B8%B8%E4%BC%9A%E8%AF%9D\">诊断异常会话\u003c/a> 把报错上下文派发给一个 Agent 去排查\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/06-monitoring-and-mobile/%E7%AE%A1%E7%90%86%E6%9C%AC%E5%9C%B0%E6%9C%8D%E5%8A%A1%E4%B8%8E%E7%AB%AF%E5%8F%A3\">服务面板\u003c/a> 里查看监听中的端口，停止服务，清理残留进程\u003c/li>\n\u003cli>在 \u003ca href=\"#/zh/06-monitoring-and-mobile/%E6%9F%A5%E7%9C%8B%E6%80%A7%E8%83%BD%E4%B8%8E%E5%86%85%E5%AD%98\">性能面板\u003c/a> 看本应用和 omp 占用的内存\u003c/li>\n\u003cli>配置 \u003ca href=\"#/zh/06-monitoring-and-mobile/%E7%94%A8%E6%89%8B%E6%9C%BA%E8%AE%BF%E9%97%AE\">手机访问\u003c/a>：局域网扫码配对、IPv6 直连或公网隧道\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"查看-token-用量\">查看 Token 用量\u003c/h2>\n\u003cp>在右侧面板顶部的标签栏打开 \u003cstrong>Token 用量\u003c/strong>。面板顶部有三个标签：\u003cstrong>本对话\u003c/strong>、\u003cstrong>全局洞察\u003c/strong>、\u003cstrong>🩺 会话体检\u003c/strong>。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>右侧面板可以用 \u003ccode>⌘J\u003c/code> 收起或展开。\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"本对话\">本对话\u003c/h3>\n\u003cp>先在侧栏选中一个会话。面板会显示：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>上下文水位\u003c/strong>：已用 Token / 模型上限（百分比）\u003c/li>\n\u003cli>\u003cstrong>Token 消耗分布\u003c/strong>：一条彩色分布条加分类卡片，分类包括 \u003cstrong>Tool Calls\u003c/strong>、\u003cstrong>Skills 注入\u003c/strong>、\u003cstrong>System Prompt\u003c/strong>、\u003cstrong>MCP 服务\u003c/strong> 和 \u003cstrong>思考与回复\u003c/strong>；有潜在浪费或冗余的分类会标上 ⚠️\u003c/li>\n\u003cli>\u003cstrong>钻取明细\u003c/strong>：点击分类，列出该类别下的每一项（如每次工具调用）及其消耗，可展开查看具体调用历史，点击 \u003cstrong>定位\u003c/strong> 会跳到对话里的对应一步，用上一处/下一处切换\u003c/li>\n\u003c/ul>\n\u003cp>如果会话用到了子代理，顶部会出现 \u003cstrong>检查对象\u003c/strong> 一行：\u003cstrong>主对话\u003c/strong> 和每个子代理各一个按钮，切换后分布条与明细只统计所选对象，右上角的 \u003cstrong>隔离省流\u003c/strong> 显示子代理隔离掉的 Token 量。\u003c/p>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-token-distribution.png\" alt=\"Token 用量：上下文水位与消耗分布\"/>\u003c/p>\n\u003ch3 id=\"全局洞察\">全局洞察\u003c/h3>\n\u003cp>\u003cstrong>全局洞察\u003c/strong> 汇总所有 omp 会话：\u003c/p>\n\u003cul>\n\u003cli>顶部的 \u003cstrong>长期共性问题 Top 3\u003c/strong> 来自会话体检；至少完成 2 次体检、同一问题在多个对话中反复出现后才会列出\u003c/li>\n\u003cli>用 \u003cstrong>今天\u003c/strong>、\u003cstrong>近 7 天\u003c/strong>、\u003cstrong>全部历史\u003c/strong> 选择时间范围，用 \u003cstrong>排序方式\u003c/strong> 选择 \u003cstrong>最高消耗优先\u003c/strong>、\u003cstrong>最多问题优先\u003c/strong> 或 \u003cstrong>最新活动优先\u003c/strong>\u003c/li>\n\u003cli>三张摘要卡片显示 \u003cstrong>会话总数\u003c/strong>、\u003cstrong>总消耗\u003c/strong> 和 \u003cstrong>预估成本\u003c/strong>\u003c/li>\n\u003cli>\u003cstrong>OMP 会话明细\u003c/strong> 逐个列出会话的 Token、成本、分支和状态（\u003cstrong>正常\u003c/strong> 或 \u003cstrong>异常中断\u003c/strong>），点击一行会跳到该会话的 \u003cstrong>本对话\u003c/strong> 视图\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>成本是按已知单价估算的预估值，不是账单。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"体检会话\">体检会话\u003c/h2>\n\u003cp>\u003cstrong>会话体检\u003c/strong> 让一个模型回看当前会话，给出诊断和可直接使用的提示词草稿。体检只给出建议，不会修改任何文件。\u003c/p>\n\u003col>\n\u003cli>\n\u003cp>在 \u003cstrong>Token 用量\u003c/strong> 面板选中会话，切到 \u003cstrong>🩺 会话体检\u003c/strong>。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>在 \u003cstrong>选择体检方向\u003c/strong> 里选一项：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方向\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>🪙 省钱瘦身\u003c/strong>\u003c/td>\u003ctd>找出上下文浪费、重复读取与无效重试\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🎯 提问调优\u003c/strong>\u003c/td>\u003ctd>分析需求表述是否导致范围蔓延或反复返工\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🛡️ 代码暗坑\u003c/strong>\u003c/td>\u003ctd>排查过度设计、隐藏风险与未验证的改动\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>💬 自由提问\u003c/strong>\u003c/td>\u003ctd>就本对话提出你自己的问题（必须填写问题）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/li>\n\u003cli>\n\u003cp>点击 \u003cstrong>开始体检\u003c/strong>。面板会提示对话已脱水为多少 Token 的骨架：只发送这份精简骨架（目标、动作序列、报错、改动文件），不会发送完整对话记录。\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>结果包含 \u003cstrong>核心结论\u003c/strong>、\u003cstrong>事实证据\u003c/strong>、\u003cstrong>根因分析\u003c/strong> 和 \u003cstrong>纠偏 Prompt 草稿\u003c/strong>。每份草稿可以 \u003cstrong>复制\u003c/strong>，或点 \u003cstrong>填入输入框\u003c/strong> 放进输入框再发送；在 \u003cstrong>追问\u003c/strong> 里可以继续提问。\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-doctor-result.png\" alt=\"会话体检结果\"/>\u003c/p>\n\u003cp>在 \u003cstrong>设置 ▸ 会话体检\u003c/strong>（面板底部的 \u003cstrong>设置\u003c/strong> 链接也能直达）可以配置：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>设置\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>使用模型\u003c/strong>\u003c/td>\u003ctd>体检调用的模型，建议选速度快、价格低的\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>自动体检\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>手动按需\u003c/strong>（默认，不点不花钱）、\u003cstrong>会话闲置后\u003c/strong>、\u003cstrong>每日定时\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>闲置时长（分钟）\u003c/strong>\u003c/td>\u003ctd>闲置后自动体检的等待时间，可选 30、60、120 分钟\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>定时时间\u003c/strong>\u003c/td>\u003ctd>每天自动体检的时间，24 小时制 \u003ccode>HH:MM\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>每次体检都会消耗所选模型的 Token；自动体检会持续消耗，请按需开启。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"诊断异常会话\">诊断异常会话\u003c/h2>\n\u003cp>对出错或中断的会话，可以把报错上下文交给另一个 Agent 排查：右键点击侧栏里的会话，选择 \u003cstrong>诊断此会话\u003c/strong>，打开 \u003cstrong>诊断异常会话\u003c/strong> 对话框。\u003c/p>\n\u003col>\n\u003cli>对话框先显示 \u003cstrong>被诊断会话\u003c/strong> 的标题、状态和工作目录，并生成 \u003cstrong>诊断上下文提示词\u003c/strong>（扫描会话尾部的错误并整理摘要）。展开后可以直接编辑，点击 \u003cstrong>重新生成\u003c/strong> 重新生成。\u003c/li>\n\u003cli>在 \u003cstrong>由哪个 Agent 执行诊断？\u003c/strong> 里选择 \u003cstrong>现有会话\u003c/strong>（选一个其他会话，显示 \u003cstrong>忙碌\u003c/strong>、\u003cstrong>空闲\u003c/strong>、\u003cstrong>异常\u003c/strong> 或 \u003cstrong>已挂起\u003c/strong> 状态），或 \u003cstrong>新开诊断会话\u003c/strong>（可选填模型，留空使用默认模型，在被诊断会话的工作目录下启动）。\u003c/li>\n\u003cli>点击 \u003cstrong>开始诊断\u003c/strong>，提示词会派发给所选会话。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"管理本地服务与端口\">管理本地服务与端口\u003c/h2>\n\u003cp>在右侧面板打开 \u003cstrong>服务\u003c/strong>，查看本机监听的端口和相关进程。面板标题 \u003cstrong>本地服务\u003c/strong> 后面的数字是当前行数。\u003c/p>\n\u003cul>\n\u003cli>默认只显示开发类服务（如 node、python、vite 等进程）；勾选右上角的 \u003cstrong>显示全部端口\u003c/strong> 显示所有监听端口，\u003cstrong>刷新服务列表\u003c/strong> 手动重新扫描。服务有变化时列表会自动更新\u003c/li>\n\u003cli>每一行显示端口、进程名、\u003ccode>pid\u003c/code>、工作目录，以及关联的会话（点击可切换到该会话）。右侧的按钮可以 \u003cstrong>在浏览器中打开此服务\u003c/strong>、\u003cstrong>复制服务地址\u003c/strong>、\u003cstrong>停止此服务\u003c/strong>（需要确认）\u003c/li>\n\u003cli>由时光机预览启动的服务带有 \u003cstrong>时光机\u003c/strong> 标记\u003c/li>\n\u003cli>所属会话已结束的服务标记为 \u003cstrong>残留\u003c/strong>，顶部会出现 \u003cstrong>一键清理\u003c/strong> 横幅，点击后确认即可 \u003cstrong>全部停止\u003c/strong>\u003c/li>\n\u003cli>从终端折叠到后台的终端显示在 \u003cstrong>后台终端\u003c/strong> 区，可以 \u003cstrong>恢复\u003c/strong> 到终端或 \u003cstrong>结束\u003c/strong> 进程\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-services-panel.png\" alt=\"服务面板\"/>\u003c/p>\n\u003ch2 id=\"查看性能与内存\">查看性能与内存\u003c/h2>\n\u003cp>点击窗口底部状态栏的 \u003cstrong>性能 xxx MB\u003c/strong>，打开 \u003cstrong>性能\u003c/strong> 面板。数字是本应用进程树（本体加 WebView/帮助进程）的真实物理内存，口径与「活动监视器」一致。面板打开时每 4 秒刷新一次，包含：\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>内存分布\u003c/strong>：整机内存按 \u003cstrong>本应用\u003c/strong>、\u003cstrong>智能体\u003c/strong>、\u003cstrong>其他程序\u003c/strong>、\u003cstrong>空闲\u003c/strong> 分段显示\u003c/li>\n\u003cli>\u003cstrong>本应用（界面）\u003c/strong>：本应用自己的进程数量\u003c/li>\n\u003cli>\u003cstrong>本应用开的会话\u003c/strong>：由本应用启动的 omp 会话进程；\u003cstrong>终端/其他窗口开的\u003c/strong>：本机其他 omp 进程\u003c/li>\n\u003cli>\u003cstrong>活跃窗口\u003c/strong>：本机正在运行的 omp-workspace 实例（按工作树或分支标注）和本窗口的 OMP 会话数\u003c/li>\n\u003cli>\u003cstrong>服务进程\u003c/strong>：与当前项目关联的服务进程\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>面板不会读取进程的命令行参数，只显示可执行文件名。开发模式（\u003ccode>pnpm tauri dev\u003c/code>）下的数字明显高于发布版本，不能代表正式使用时的内存占用。\u003c/p>\n\u003c/blockquote>\n\u003cp>状态栏里显示轮数和步数的会话统计按钮，点击后可以查看当前会话的模型用时、首字延迟（TTFT）、输出速度（TPS）和 Token 消耗。\u003c/p>\n\u003ch2 id=\"用手机访问\">用手机访问\u003c/h2>\n\u003cp>启动手机访问后，同一 Wi-Fi 下的手机扫码即可查看会话、回复消息和处理审批。进入 \u003cstrong>设置 ▸ 手机访问\u003c/strong>。\u003c/p>\n\u003ch3 id=\"启动并配对局域网\">启动并配对（局域网）\u003c/h3>\n\u003col>\n\u003cli>在 \u003cstrong>手机访问服务\u003c/strong> 卡片点击 \u003cstrong>启动\u003c/strong>。启动后卡片会显示 \u003cstrong>局域网地址\u003c/strong>。应用设置里记住了这个开关，下次打开本应用时会自动启动。\u003c/li>\n\u003cli>在 \u003cstrong>配对手机（局域网）\u003c/strong> 点击 \u003cstrong>生成配对二维码\u003c/strong>（需要先启动手机访问）。二维码 5 分钟内有效，只能用一次，过期后点击 \u003cstrong>重新生成\u003c/strong>。\u003c/li>\n\u003cli>用手机相机或微信扫一扫，在手机浏览器里完成配对。也可以点 \u003cstrong>复制配对链接\u003c/strong>，发到手机上打开。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-pairing-qr.png\" alt=\"手机访问设置页与配对二维码\"/>\u003c/p>\n\u003cp>\u003cstrong>端口\u003c/strong> 默认是 7788（范围 1–65535），一般不用改；和其他程序冲突导致启动失败时再换一个，保存后点 \u003cstrong>立即重启\u003c/strong> 生效。\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>局域网访问使用 HTTP，只有同一个 Wi-Fi / 局域网内的设备能连接，每台手机都需要配对一次。\u003c/p>\n\u003c/blockquote>\n\u003cp>配对后，手机页面左侧菜单有 \u003cstrong>会话\u003c/strong>、\u003cstrong>收件箱\u003c/strong>、\u003cstrong>搜索\u003c/strong>、\u003cstrong>定时任务\u003c/strong>、\u003cstrong>Skills\u003c/strong>、\u003cstrong>想法\u003c/strong>、\u003cstrong>设置\u003c/strong>，右侧菜单有 \u003cstrong>文件\u003c/strong>、\u003cstrong>旁聊\u003c/strong>、\u003cstrong>热力图\u003c/strong>（子代理统计）、\u003cstrong>待办\u003c/strong>、\u003cstrong>Git\u003c/strong>、\u003cstrong>服务\u003c/strong>、\u003cstrong>终端\u003c/strong>、\u003cstrong>计划\u003c/strong>。手机上可以向会话发消息、批准或拒绝 Agent 的请求，也可以管理定时任务、想法和部分模型设置。\u003c/p>\n\u003ch3 id=\"在其他网络访问\">在其他网络访问\u003c/h3>\n\u003cp>离开同一个 Wi-Fi 有三种方式：\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>方式\u003c/th>\u003cth>适合场景\u003c/th>\u003cth>需要什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>公网隧道 ▸ 临时公网地址\u003c/strong>\u003c/td>\u003ctd>临时使用\u003c/td>\u003ctd>安装 \u003ccode>cloudflared\u003c/code>，不需要其他配置；自动分配随机的 \u003ccode>trycloudflare.com\u003c/code> 网址，每次启动都会变\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>公网隧道 ▸ 固定域名\u003c/strong>\u003c/td>\u003ctd>长期使用\u003c/td>\u003ctd>你在 Cloudflare 上已建好的隧道和自己的域名；建议同时配置 Cloudflare Access\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>直连（IPv6）\u003c/strong>\u003c/td>\u003ctd>蜂窝网络直接连这台电脑\u003c/td>\u003ctd>本机有公网 IPv6 地址，路由器放行入站端口\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4 id=\"公网隧道\">公网隧道\u003c/h4>\n\u003cp>在 \u003cstrong>不在同一网络时访问（公网隧道）\u003c/strong> 卡片的 \u003cstrong>访问方式\u003c/strong> 里选择 \u003cstrong>临时公网地址\u003c/strong> 或 \u003cstrong>固定域名\u003c/strong>（\u003cstrong>关闭\u003c/strong> 则只能局域网访问，最安全）。\u003c/p>\n\u003col>\n\u003cli>如果提示需要安装 \u003ccode>cloudflared\u003c/code>，在 \u003cstrong>终端\u003c/strong> 里运行 \u003ccode>brew install cloudflared\u003c/code>，装好后点 \u003cstrong>刷新状态\u003c/strong>。\u003c/li>\n\u003cli>选择 \u003cstrong>固定域名\u003c/strong> 时填写 \u003cstrong>隧道名称\u003c/strong> 和 \u003cstrong>域名\u003c/strong>。\u003c/li>\n\u003cli>点击 \u003cstrong>保存并启动隧道\u003c/strong>（修改后是 \u003cstrong>保存并重新连接\u003c/strong>）。连接成功后显示 \u003cstrong>公网地址\u003c/strong> 和 \u003cstrong>已连接\u003c/strong> 标记；临时地址可能要几秒才出现。\u003c/li>\n\u003cli>点击 \u003cstrong>生成公网配对二维码\u003c/strong> 配对手机。仍然需要扫码配对，陌生人无法直接使用。\u003c/li>\n\u003c/ol>\n\u003ch4 id=\"ipv6-直连\">IPv6 直连\u003c/h4>\n\u003cp>\u003cstrong>直连\u003c/strong> 卡片利用公网 IPv6 没有 NAT 的特点，让手机在 4G/5G 下直接连接这台电脑，不经过第三方服务器。\u003c/p>\n\u003col>\n\u003cli>点击 \u003cstrong>启动\u003c/strong>，卡片显示 \u003cstrong>公网 IPv6 地址\u003c/strong>、\u003cstrong>访问链接\u003c/strong> 和 \u003cstrong>证书 SHA-256 指纹\u003c/strong>；本机没有公网 IPv6 地址时无法使用。\u003c/li>\n\u003cli>\u003cstrong>端口\u003c/strong> 默认 7789；路由器防火墙需要放行该端口的 IPv6 入站连接。\u003c/li>\n\u003cli>点击 \u003cstrong>生成 IPv6 配对二维码\u003c/strong> 配对手机。\u003c/li>\n\u003c/ol>\n\u003cp>使用提示：\u003c/p>\n\u003cul>\n\u003cli>首次打开会提示证书不受信任，核对指纹一致后继续\u003c/li>\n\u003cli>用手机流量（关闭 Wi-Fi）测试\u003c/li>\n\u003cli>地址变化后重新扫码配对，或启用 DDNS\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>动态域名\u003c/strong> 可以在公网 IPv6 地址变化时自动更新 Cloudflare 上的 AAAA 解析记录。打开 \u003cstrong>启用 Cloudflare DDNS\u003c/strong>，填写 \u003cstrong>Zone ID\u003c/strong>、\u003cstrong>解析域名（AAAA）\u003c/strong>，并保存一个具备 \u003ccode>Zone:DNS:Edit\u003c/code> 权限的 API \u003cstrong>令牌\u003c/strong>（\u003cstrong>保存令牌\u003c/strong> / \u003cstrong>清除令牌\u003c/strong>）。令牌存放在本地加密保管库，不会明文回显。遇到鉴权失败或连续同步错误时自动同步会暂停，检查配置后点击 \u003cstrong>立即同步\u003c/strong> 恢复。\u003c/p>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-tunnel.png\" alt=\"公网隧道与 IPv6 直连卡片\"/>\u003c/p>\n\u003ch3 id=\"撤销手机访问权限\">撤销手机访问权限\u003c/h3>\n\u003cp>页面底部 \u003cstrong>已配对的手机\u003c/strong> 里的 \u003cstrong>全部撤销\u003c/strong> 会让所有已配对的手机立刻断开，之后需要重新扫码。手机丢失或不想再让某台手机访问时使用。\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">警告\u003c/div>\n\u003cp>目前无法单独移除某一台手机，只能全部撤销后让需要的手机重新配对。\u003c/p>\n\u003c/blockquote>\n\u003cp>相关章节：\u003ca href=\"#/zh/05-settings-and-models\">设置与模型\u003c/a>、\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting\">快捷键与问题排查\u003c/a>。\u003c/p>"},{"slug":"07-shortcuts-and-troubleshooting","title":"快捷键与问题排查","html":"\u003ch1 id=\"快捷键与问题排查\">快捷键与问题排查\u003c/h1>\n\u003cblockquote>\n\u003cp>键盘快捷键速查表、常见问题的处理办法，以及应用把数据存放在哪里。\u003c/p>\n\u003c/blockquote>\n\u003cp>本章内容：\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E9%94%AE%E7%9B%98%E5%BF%AB%E6%8D%B7%E9%94%AE\">键盘快捷键\u003c/a>：全局、输入框、列表、编辑器\u003c/li>\n\u003cli>\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E5%B8%B8%E8%A7%81%E9%97%AE%E9%A2%98\">常见问题\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/zh/07-shortcuts-and-troubleshooting/%E6%95%B0%E6%8D%AE%E4%BD%8D%E7%BD%AE\">数据位置\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"键盘快捷键\">键盘快捷键\u003c/h2>\n\u003cp>文中的 \u003ccode>⌘\u003c/code> 在 macOS 上是 Command 键；其他平台对应 \u003ccode>Ctrl\u003c/code>。\u003c/p>\n\u003ch3 id=\"全局快捷键\">全局快捷键\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘B\u003c/code>\u003c/td>\u003ctd>展开 / 收起左侧栏\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘J\u003c/code>\u003c/td>\u003ctd>展开 / 收起右侧面板（在 \u003cstrong>收件箱\u003c/strong>、\u003cstrong>定时任务\u003c/strong>、\u003cstrong>Skills 管理\u003c/strong> 页面无效）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘N\u003c/code>\u003c/td>\u003ctd>新建会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>聚焦左侧栏搜索框；在设置页聚焦设置搜索。焦点在代码编辑器、终端等自带查找的区域时不拦截\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘[\u003c/code>\u003c/td>\u003ctd>返回：在全页视图（文档、收件箱等）中回到会话；在辅助对话中回到父会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘`\u003c/code>\u003c/td>\u003ctd>打开 / 关闭右侧面板的 \u003cstrong>终端\u003c/strong> 标签\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘W\u003c/code>\u003c/td>\u003ctd>依次关闭：最上层的浮层 → 右侧面板当前标签 → 都没有时隐藏窗口\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘+\u003c/code> / \u003ccode>⌘-\u003c/code> / \u003ccode>⌘0\u003c/code>\u003c/td>\u003ctd>放大 / 缩小 / 重置界面缩放（范围 80%–140%，每次 5%，会被记住）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>关闭弹出层；会话正在生成时终止生成；在全页视图中返回会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧I\u003c/code>\u003c/td>\u003ctd>弹出快速记录窗口（系统级快捷键，默认值，在任何应用里都可用；功能说明见\u003ca href=\"#/zh/04-automation\">第 4 章\u003c/a>）\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">注意\u003c/div>\n\u003cp>\u003ccode>⌘B\u003c/code>、\u003ccode>⌘J\u003c/code>、\u003ccode>⌘[\u003c/code>、\u003ccode>⌘`\u003c/code> 在设置页打开时不生效。\u003ccode>⌘K\u003c/code> 仅在设置页有效，用来聚焦设置搜索。\u003c/p>\n\u003c/blockquote>\n\u003cp>快速记录的快捷键可在 \u003cstrong>设置 ▸ 通用 ▸ 快捷键 ▸ 快速记录快捷键\u003c/strong> 修改：点击按钮后按下新的组合键。清除即停用；组合必须包含 \u003ccode>⌘\u003c/code> / \u003ccode>⌃\u003c/code> / \u003ccode>⌥\u003c/code> / \u003ccode>⇧\u003c/code> 之一（F 键除外）。\u003c/p>\n\u003cp>底部状态栏的缩放按钮 \u003cstrong>缩小界面 (-5%)\u003c/strong>、\u003cstrong>重置缩放为 100%\u003c/strong>、\u003cstrong>放大界面 (+5%)\u003c/strong> 与上面的缩放快捷键等效。\u003c/p>\n\u003ch3 id=\"输入框\">输入框\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>发送（默认）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Enter\u003c/code>\u003c/td>\u003ctd>换行（默认）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>发送。若在 \u003cstrong>设置 ▸ 会话 ▸ 发送方式 ▸ 发送快捷键\u003c/strong> 选了 \u003cstrong>⌘ Enter 发送\u003c/strong>，则 \u003ccode>Enter\u003c/code> 换行、\u003ccode>⌘Enter\u003c/code> 发送\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌥Enter\u003c/code>（或 \u003ccode>⌥⌘Enter\u003c/code>）\u003c/td>\u003ctd>Agent 正在回复时，用另一种方式发送这一条：引导与排队互换，「打断后发送」换成排队\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>光标在第一行 / 最后一行时翻看历史输入\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>@\u003c/code>\u003c/td>\u003ctd>引用工作目录里的文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/\u003c/code>\u003c/td>\u003ctd>打开命令菜单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> \u003ccode>↓\u003c/code> / \u003ccode>Tab\u003c/code> 或 \u003ccode>Enter\u003c/code> / \u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>在 \u003ccode>@\u003c/code>、\u003ccode>/\u003c/code> 弹出菜单中选择 / 确认 / 关闭\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Tab\u003c/code> / \u003ccode>Shift+Tab\u003c/code>\u003c/td>\u003ctd>在 Markdown 列表中增加 / 减少缩进\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>回合进行中终止生成\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>在输入法组词期间，上面的发送和换行按键不会生效。\u003c/p>\n\u003ch3 id=\"会话列表焦点在列表上\">会话列表（焦点在列表上）\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>移动高亮并打开该会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>打开高亮会话\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> \u003ccode>→\u003c/code>\u003c/td>\u003ctd>折叠 / 展开分组\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Delete\u003c/code> / \u003ccode>Backspace\u003c/code>\u003c/td>\u003ctd>归档\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Delete\u003c/code>\u003c/td>\u003ctd>永久删除\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>F2\u003c/code>\u003c/td>\u003ctd>重命名\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+F10\u003c/code> / 菜单键\u003c/td>\u003ctd>打开会话操作菜单\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘\u003c/code> 点击 / \u003ccode>Shift\u003c/code> 点击\u003c/td>\u003ctd>多选 / 选择一段范围\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"审批与提问\">审批与提问\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>y\u003c/code>\u003c/td>\u003ctd>审批卡上的 \u003cstrong>仅本次\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\u003ctd>审批卡上的 \u003cstrong>拒绝\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>数字键、\u003ccode>←\u003c/code> \u003ccode>→\u003c/code>、\u003ccode>Enter\u003c/code>、\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>提问面板中选择、切换问题、提交、取消\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>在需要输入文字的确认卡中提交\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>y\u003c/code> / \u003ccode>n\u003c/code> 只在焦点不在文本框时生效。\u003c/p>\n\u003ch3 id=\"编辑与对话框\">编辑与对话框\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>快捷键\u003c/th>\u003cth>作用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘S\u003c/code>\u003c/td>\u003ctd>保存：文档编辑、文件预览编辑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>提交：重新发送已编辑的消息、批注、Git 提交说明、新建工作树会话、诊断、定时任务编辑\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code> / \u003ccode>Shift+Enter\u003c/code>\u003c/td>\u003ctd>批注输入框中提交 / 换行\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>取消批注、关闭对话框\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Z\u003c/code>\u003c/td>\u003ctd>草图编辑器中撤销\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>j\u003c/code> / \u003ccode>k\u003c/code> 或 \u003ccode>↓\u003c/code> / \u003ccode>↑\u003c/code>、\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>\u003cstrong>收件箱\u003c/strong> 页面（焦点不在输入框时）移动并打开条目\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>终端内打开搜索\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧A\u003c/code>\u003c/td>\u003ctd>终端内把选中文字作为批注引用到输入框\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"常见问题\">常见问题\u003c/h2>\n\u003ch3 id=\"提示找不到-omp或会话启动不起来\">提示找不到 omp，或会话启动不起来\u003c/h3>\n\u003cp>应用通过 \u003cstrong>设置 ▸ 高级 ▸ omp 程序位置\u003c/strong> 指定的命令启动 omp，默认是 \u003ccode>omp\u003c/code>。先在终端里确认 \u003ccode>omp\u003c/code> 能直接运行；如果装在非常规位置，把完整路径填进去。\u003cstrong>设置 ▸ 版本与更新\u003c/strong> 会显示是否找到 omp 及其版本。\u003c/p>\n\u003cp>首页如果显示「会话没启动成功，点此重试」，修好 omp 后点击重试即可。\u003c/p>\n\u003ch3 id=\"终端里的-omp-会话没有出现在列表里\">终端里的 omp 会话没有出现在列表里\u003c/h3>\n\u003cp>应用会读取 \u003ccode>~/.omp/agent/sessions/\u003c/code> 下的会话。若要让终端里直接运行的 omp 对话也实时出现在列表中，在 \u003cstrong>设置 ▸ 高级 ▸ 外部终端联动\u003c/strong> 打开 \u003cstrong>让终端里的 omp 也显示在这里\u003c/strong>（会安装一个小扩展到 \u003ccode>~/.omp/agent/extensions/\u003c/code>）。\u003c/p>\n\u003cp>这类会话显示为 \u003cstrong>外部\u003c/strong> 状态，要在本应用里继续操作，先在会话右键菜单里选择 \u003cstrong>接管会话\u003c/strong>。\u003c/p>\n\u003ch3 id=\"会话显示已中断\">会话显示「已中断」\u003c/h3>\n\u003cp>说明会话的进程意外退出。右键该会话选择 \u003cstrong>恢复会话\u003c/strong>，或直接在会话里点击 \u003cstrong>恢复中断的回合\u003c/strong>（发送 Continue）。\u003c/p>\n\u003ch3 id=\"找不到某个会话\">找不到某个会话\u003c/h3>\n\u003cul>\n\u003cli>确认当前\u003cstrong>空间\u003c/strong>：每个空间的会话互不共享，在左上角切换到对应空间。\u003c/li>\n\u003cli>打开搜索框旁的 \u003cstrong>过滤与显示设置\u003c/strong>，勾选 \u003cstrong>显示已归档会话\u003c/strong>。\u003c/li>\n\u003cli>在搜索框里输入标题、分支或目录名。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"误归档误删\">误归档、误删\u003c/h3>\n\u003cul>\n\u003cli>归档后顶部会出现 \u003cstrong>撤销\u003c/strong> 条；错过了也可以显示已归档会话，对会话选择 \u003cstrong>取消归档\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>删除会话\u003c/strong> 会永久删除记录文件，无法在应用内恢复。通过 \u003cstrong>设置 ▸ 存储空间\u003c/strong> 清理的会话会被移到废纸篓，可以从废纸篓恢复。\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"直接打字没有进入输入框\">直接打字没有进入输入框\u003c/h3>\n\u003cp>直接输入的字符只会在没有其他输入控件获得焦点、也没有菜单或对话框打开时转入输入框。先按 \u003ccode>Esc\u003c/code> 关闭弹出层，或点击消息区空白处，再输入即可。\u003c/p>\n\u003ch3 id=\"没有收到通知\">没有收到通知\u003c/h3>\n\u003cp>在 \u003cstrong>设置 ▸ 通知\u003c/strong> 确认对应事件（完成一轮回复、需要你批准或回答、出错或意外中断）已打开，检查 \u003cstrong>免打扰\u003c/strong> 时段，并点击 \u003cstrong>发送测试通知\u003c/strong> 确认系统通知和提示音正常。若测试通知也没有出现，检查系统设置中是否允许 omp-workspace 发送通知。\u003c/p>\n\u003ch3 id=\"快速记录快捷键没有反应\">快速记录快捷键没有反应\u003c/h3>\n\u003cp>快捷键格式不合法时设置会提示「快捷键格式无效」。组合若已被系统或其他应用占用，注册不会成功，请换一个组合。\u003c/p>\n\u003ch3 id=\"内存占用偏高\">内存占用偏高\u003c/h3>\n\u003cp>底部状态栏的 \u003cstrong>性能\u003c/strong> 数值按活动监视器的口径统计本体及 WebView、辅助进程的内存，点击可查看各进程明细。开发模式（\u003ccode>pnpm tauri dev\u003c/code>）下数值明显偏高，因为包含未打包的前端模块和调试版 Rust 代码；以打包后的应用为准。想减少运行中的 omp 进程，可缩短 \u003cstrong>设置 ▸ 会话 ▸ 闲置多久后休眠（分钟）\u003c/strong>。\u003c/p>\n\u003ch3 id=\"上下文快满了\">上下文快满了\u003c/h3>\n\u003cp>输入 \u003ccode>/compact\u003c/code> 或点击上下文圆环里的 \u003cstrong>压缩\u003c/strong>；只想丢弃工具结果等大块内容、不调用模型，用 \u003ccode>/shake\u003c/code>。想知道每次请求都带上了什么，点击 \u003cstrong>查看系统提示词构成\u003c/strong>。详见\u003ca href=\"#/zh/02-sessions-and-chat/%E6%9F%A5%E7%9C%8B%E4%B8%8A%E4%B8%8B%E6%96%87%E7%94%A8%E9%87%8F\">查看上下文用量\u003c/a>。\u003c/p>\n\u003ch3 id=\"会话卡住或行为异常\">会话卡住或行为异常\u003c/h3>\n\u003cp>右键该会话选择 \u003cstrong>诊断此会话\u003c/strong>，选择由哪个会话或模型来分析原因。也可以先 \u003cstrong>重启会话\u003c/strong>（历史保留）。\u003c/p>\n\u003ch3 id=\"提示无法读取主密钥\">提示无法读取主密钥\u003c/h3>\n\u003cp>提示「密钥库已有密文但无法读取主密钥」时，检查 \u003ccode>~/.omp-workspace/env/.master.key\u003c/code> 的文件权限。供应商密钥的配置方法见\u003ca href=\"#/zh/05-settings-and-models\">第 5 章\u003c/a>。\u003c/p>\n\u003ch3 id=\"开发模式下窗口一片空白\">开发模式下窗口一片空白\u003c/h3>\n\u003cp>仅限 \u003ccode>pnpm tauri dev\u003c/code>：前端文件改到一半时 WebView 会整页重载并停在空白。在项目根目录执行 \u003ccode>touch index.html\u003c/code> 让 Vite 重新加载，再确认界面恢复。\u003c/p>\n\u003ch2 id=\"数据位置\">数据位置\u003c/h2>\n\u003cp>本应用的数据默认放在 \u003ccode>~/.omp-workspace/\u003c/code>。设置环境变量 \u003ccode>OMPWS_DATA_DIR\u003c/code> 可以换到别的目录（用于隔离的试用实例，例如 \u003ccode>pnpm dev:preview\u003c/code> 使用 \u003ccode>~/.omp-workspace-dev\u003c/code>）。\u003cstrong>设置 ▸ 高级 ▸ 数据与备份\u003c/strong> 的 \u003cstrong>打开数据目录\u003c/strong> 可直接定位。\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>路径\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/app.db\u003c/code>\u003c/td>\u003ctd>应用数据库（会话元数据、待办、想法、定时任务等）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/global/\u003c/code>\u003c/td>\u003ctd>Universal 空间的全局工作区目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/images/\u003c/code>\u003c/td>\u003ctd>粘贴、拖入的图片；超过 30 天且没有被引用的图片会在每天启动后自动清理\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/env/keys.env\u003c/code>\u003c/td>\u003ctd>加密保存的供应商密钥（主密钥为同目录下的 \u003ccode>.master.key\u003c/code>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/status/\u003c/code>\u003c/td>\u003ctd>omp 扩展上报的会话状态文件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/extension/\u003c/code>\u003c/td>\u003ctd>应用安装的 omp 扩展\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/plugins/\u003c/code>\u003c/td>\u003ctd>随应用安装的 omp 插件（如 Visualize）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/oneshot-sessions/\u003c/code>\u003c/td>\u003ctd>摘要、诊断等一次性 \u003ccode>omp -p\u003c/code> 调用使用的目录\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/privacy/\u003c/code>\u003c/td>\u003ctd>隐私库条目，见\u003ca href=\"#/zh/05-settings-and-models\">第 5 章\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp/agent/sessions/\u003c/code>\u003c/td>\u003ctd>OMP 自己的会话记录，应用读取并展示\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;项目&gt;/.worktrees/&lt;名称&gt;\u003c/code>\u003c/td>\u003ctd>在独立工作树中创建的会话所用的工作树\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">提示\u003c/div>\n\u003cp>\u003cstrong>设置 ▸ 高级 ▸ 数据与备份\u003c/strong> 提供 \u003cstrong>导出设置\u003c/strong> 与 \u003cstrong>导入设置\u003c/strong>（换电脑时使用，不含 omp 自己的配置），以及 \u003cstrong>恢复默认设置\u003c/strong>。恢复默认无法撤销，请先导出备份。\u003cstrong>设置 ▸ 存储空间\u003c/strong> 可查看磁盘占用并清理无用图片、网页缓存和旧会话。\u003c/p>\n\u003c/blockquote>"}],"en":[{"slug":"01-getting-started","title":"Getting started","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/getting-started-layout.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/getting-started-first-session.png\"/>\u003ch1 id=\"getting-started\">Getting started\u003c/h1>\n\u003cblockquote>\n\u003cp>omp-workspace is a desktop workbench for launching, watching, and managing all your OMP agent sessions in one window. This chapter covers the prerequisites, the window layout, and how to start your first session.\u003c/p>\n\u003c/blockquote>\n\u003cp>After this chapter you can:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/01-getting-started/what-omp-workspace-is\">Understand what omp-workspace is\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/prepare-your-environment\">Check the prerequisites and launch the app\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/tour-the-window-layout\">Find your way around the window\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/start-your-first-session\">Start your first session\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/sign-in-to-a-model-provider\">Sign in to a model provider\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is in Simplified Chinese only. This guide shows each UI label as \u003cstrong>English name\u003c/strong> (「中文原文」) the first time it appears in a section, so you can match it to what you see on screen.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"what-omp-workspace-is\">What omp-workspace is\u003c/h2>\n\u003cp>omp-workspace is a desktop shell (a Tauri 2 app) around the OMP command-line agent. It does not replace \u003ccode>omp\u003c/code>; it adds:\u003c/p>\n\u003cul>\n\u003cli>A session list grouped by project and branch, with status marks that show which sessions are running, waiting for you, or interrupted.\u003c/li>\n\u003cli>A conversation UI: message stream, tool-call cards, approval buttons, a composer, and side chats you can open at any time.\u003c/li>\n\u003cli>Workspace tools: file browsing and editing, Git changes and worktrees, a terminal.\u003c/li>\n\u003cli>Automation and monitoring: scheduled tasks, todos and ideas, an inbox, usage stats, and mobile access.\u003c/li>\n\u003c/ul>\n\u003cp>On launch the app reads the OMP sessions already stored in \u003ccode>~/.omp/agent/sessions/\u003c/code>, so sessions you created earlier with \u003ccode>omp\u003c/code> in a terminal appear in the list right away.\u003c/p>\n\u003ch2 id=\"prepare-your-environment\">Prepare your environment\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Requirement\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>OS\u003c/td>\u003ctd>macOS (the app uses the system keychain for secrets and offers &quot;Reveal in Finder&quot; actions)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OMP CLI\u003c/td>\u003ctd>\u003ccode>omp\u003c/code> installed and runnable from a terminal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model credentials\u003c/td>\u003ctd>At least one working model provider (API key or OAuth login); see \u003ca href=\"#/en/01-getting-started/sign-in-to-a-model-provider\">Sign in to a model provider\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Building from source\u003c/td>\u003ctd>Node.js, \u003ccode>pnpm\u003c/code>, and a Rust toolchain\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The app starts sessions with the command set in the &quot;omp binary&quot; setting, which defaults to \u003ccode>omp\u003c/code>.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>If \u003ccode>omp\u003c/code> is not on your \u003ccode>PATH\u003c/code> or is installed in an unusual place, enter its full path in \u003cstrong>Settings ▸ Advanced ▸ omp program location\u003c/strong> (「设置 ▸ 高级 ▸ omp 程序位置」). When omp cannot be found, \u003cstrong>Settings ▸ Version and updates\u003c/strong> (「设置 ▸ 版本与更新」) shows &quot;未找到 omp，可在「高级」中设置 omp 程序位置&quot; (&quot;omp not found; set its location under Advanced&quot;).\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"install-and-launch\">Install and launch\u003c/h2>\n\u003cp>Run or package the app from source:\u003c/p>\n\u003cpre>\u003ccode class=\"hljs language-bash\">pnpm install        \u003cspan class=\"hljs-comment\"># install frontend dependencies\u003c/span>\npnpm tauri dev      \u003cspan class=\"hljs-comment\"># run in development mode (builds Rust and starts Vite)\u003c/span>\npnpm build:app      \u003cspan class=\"hljs-comment\"># type-check, build the frontend, and bundle the desktop app\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>To run a second, isolated instance (for example to try a new build), use \u003ccode>pnpm dev:preview\u003c/code>. It uses its own port and keeps data in \u003ccode>~/.omp-workspace-dev\u003c/code>. See \u003ca href=\"#/en/07-shortcuts-and-troubleshooting/data-locations\">Data locations\u003c/a> for more.\u003c/p>\n\u003c/blockquote>\n\u003cp>On first launch the app:\u003c/p>\n\u003col>\n\u003cli>Creates its own data directory under \u003ccode>~/.omp-workspace/\u003c/code>.\u003c/li>\n\u003cli>Scans \u003ccode>~/.omp/agent/sessions/\u003c/code> and loads existing sessions into the list.\u003c/li>\n\u003cli>Returns to the session you were in when you last quit, if it belongs to the current space; otherwise it shows the home page.\u003c/li>\n\u003c/ol>\n\u003cp>The default window size is 1440 × 900, with an overlay title bar (content extends under it).\u003c/p>\n\u003ch2 id=\"tour-the-window-layout\">Tour the window layout\u003c/h2>\n\u003cp>The window has a left sidebar, a center area, a right panel, and a bottom status bar.\u003c/p>\n\u003cp>\u003cimg src=\"images/getting-started-layout.png\" alt=\"Window overview: left sidebar, center conversation area, right panel, and bottom status bar\"/>\u003c/p>\n\u003ch3 id=\"left-sidebar\">Left sidebar\u003c/h3>\n\u003cp>The left sidebar manages every session. Press \u003ccode>⌘B\u003c/code> to collapse or expand it.\u003c/p>\n\u003cul>\n\u003cli>Top: the name of the current \u003cstrong>space\u003c/strong> (click to switch; see \u003ca href=\"#/en/02-sessions-and-chat/spaces\">Spaces\u003c/a>), plus three buttons: \u003cstrong>Inbox\u003c/strong> (「收件箱」), \u003cstrong>Search\u003c/strong> (「搜索」, \u003ccode>⌘F\u003c/code>), and \u003cstrong>Collapse left sidebar\u003c/strong> (「收起左侧栏」).\u003c/li>\n\u003cli>Navigation: \u003cstrong>New session\u003c/strong> (「新建会话」, \u003ccode>⌘N\u003c/code>), \u003cstrong>Scheduled tasks\u003c/strong> (「定时任务」), \u003cstrong>Skills management\u003c/strong> (「Skills 管理」).\u003c/li>\n\u003cli>\u003cstrong>Projects\u003c/strong> (「项目」): the project directories you added; each holds its sessions, which can be grouped further by branch or worktree.\u003c/li>\n\u003cli>Bottom: \u003cstrong>Settings\u003c/strong> (「设置」).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"center-area\">Center area\u003c/h3>\n\u003cp>By default the center shows the current session: a header with the session title and action buttons (share and export, terminal, ideas), then the message stream and composer. \u003cstrong>Inbox\u003c/strong>, \u003cstrong>Scheduled tasks\u003c/strong>, \u003cstrong>Skills management\u003c/strong>, the document editor, and Settings take over the center area and show a \u003cstrong>Back\u003c/strong> control (you can also press \u003ccode>Esc\u003c/code> or \u003ccode>⌘[\u003c/code>).\u003c/p>\n\u003ch3 id=\"right-panel\">Right panel\u003c/h3>\n\u003cp>The right panel hosts auxiliary tools as tabs. Press \u003ccode>⌘J\u003c/code> to collapse or expand it, and use \u003cstrong>Open new tab\u003c/strong> (「打开新标签页」) at the end of the tab strip to add one.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tab\u003c/th>\u003cth>Purpose\u003c/th>\u003cth>See\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Side chat (「辅助对话」)\u003c/td>\u003ctd>A side conversation that does not interrupt the main session\u003c/td>\u003ctd>\u003ca href=\"#/en/02-sessions-and-chat/side-chats\">Chapter 2\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Explorer (「文件」)\u003c/td>\u003ctd>Browse project files\u003c/td>\u003ctd>\u003ca href=\"#/en/03-workspace\">Chapter 3\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Git\u003c/td>\u003ctd>Changes, worktrees, time machine\u003c/td>\u003ctd>\u003ca href=\"#/en/03-workspace\">Chapter 3\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Terminal (「终端」)\u003c/td>\u003ctd>A shell in the project directory\u003c/td>\u003ctd>\u003ca href=\"#/en/03-workspace\">Chapter 3\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>File preview (「文件预览」)\u003c/td>\u003ctd>Preview or edit a single file\u003c/td>\u003ctd>\u003ca href=\"#/en/03-workspace\">Chapter 3\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plan (「计划」)\u003c/td>\u003ctd>The plan that appears when plan mode is on\u003c/td>\u003ctd>\u003ca href=\"#/en/02-sessions-and-chat/the-add-menu\">Chapter 2\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Services (「服务」)\u003c/td>\u003ctd>Local ports and processes\u003c/td>\u003ctd>\u003ca href=\"#/en/06-monitoring-and-mobile\">Chapter 6\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Token usage (「Token 用量」)\u003c/td>\u003ctd>Usage heatmap and session check-ups\u003c/td>\u003ctd>\u003ca href=\"#/en/06-monitoring-and-mobile\">Chapter 6\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>On the \u003cstrong>Inbox\u003c/strong>, \u003cstrong>Scheduled tasks\u003c/strong>, and \u003cstrong>Skills management\u003c/strong> pages the center area uses the full width and the right panel is hidden.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"status-bar\">Status bar\u003c/h3>\n\u003cp>The bottom status bar shows the current session&#x27;s rounds and steps, cache hit rate, \u003cstrong>Performance\u003c/strong> (「性能」, memory use; click for a per-process breakdown), the omp version (click to open \u003cstrong>Settings ▸ Version and updates\u003c/strong>), the UI zoom buttons, and the current Git branch (click to open the Git panel).\u003c/p>\n\u003ch2 id=\"start-your-first-session\">Start your first session\u003c/h2>\n\u003col>\n\u003cli>Check the current space at the top of the left sidebar. The \u003cstrong>Universal\u003c/strong> space needs no project; the other spaces (Code, Work, Study, Research) organize sessions by project.\u003c/li>\n\u003cli>If the current space has no project yet, the home page shows \u003cstrong>Choose a project directory\u003c/strong> (「选择项目目录」). Click it, pick a local folder, and the folder is added to the current space with a new session ready.\u003c/li>\n\u003cli>Type your request in the composer. Its placeholder reads &quot;输入你的需求，Enter 发送&quot; (&quot;Type your request, Enter to send&quot;); the first character you type starts the session.\u003c/li>\n\u003cli>Press \u003ccode>Enter\u003c/code> to send. Once the agent starts working, the message stream shows its thinking, tool calls, and reply live.\u003c/li>\n\u003c/ol>\n\u003cp>At any time you can click \u003cstrong>New session\u003c/strong> or press \u003ccode>⌘N\u003c/code> to open another one. It uses the project of the currently selected session, or the space&#x27;s most recently used project when no session is selected.\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>You do not have to click the composer first: when no other input control has focus and no popup is open, typing anywhere sends the characters to the current session&#x27;s composer.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cimg src=\"images/getting-started-first-session.png\" alt=\"Home page: choose a project directory and type the first message\"/>\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>If the home page shows &quot;会话没启动成功，点此重试&quot; (&quot;Session failed to start, click to retry&quot;), click it to try again. If it keeps failing, check that omp works; see \u003ca href=\"#/en/07-shortcuts-and-troubleshooting/common-problems\">Common problems\u003c/a>.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"sign-in-to-a-model-provider\">Sign in to a model provider\u003c/h2>\n\u003cp>A session needs at least one working model provider. Pick any of these entry points:\u003c/p>\n\u003cul>\n\u003cli>Open \u003cstrong>Settings ▸ Models and providers\u003c/strong> (「设置 ▸ 模型与供应商」) and use \u003cstrong>Add provider\u003c/strong> (「添加供应商」), \u003cstrong>OAuth login\u003c/strong> (「OAuth 登录」), or the \u003cstrong>Import / Export\u003c/strong> (「导入 / 导出」) menu&#x27;s &quot;一键导入 OMP 供应商&quot; (one-click import of OMP providers, which encrypts the keys OMP already has into the workbench).\u003c/li>\n\u003cli>Type \u003ccode>/login\u003c/code> in the composer and choose \u003cstrong>Login\u003c/strong> (「登录」) to jump to that page.\u003c/li>\n\u003cli>If you have already signed in with \u003ccode>omp\u003c/code> in a terminal, you usually do not need to configure anything again.\u003c/li>\n\u003c/ul>\n\u003cp>API keys are encrypted with the system keychain and stored in \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>; plaintext only exists in memory. See \u003ca href=\"#/en/05-settings-and-models\">Chapter 5\u003c/a> for the details.\u003c/p>\n\u003ch2 id=\"next-steps\">Next steps\u003c/h2>\n\u003cul>\n\u003cli>Learn everything about the session list and composer: \u003ca href=\"#/en/02-sessions-and-chat\">Sessions and chat\u003c/a>\u003c/li>\n\u003cli>Files, Git, and the terminal: \u003ca href=\"#/en/03-workspace\">Workspace\u003c/a>\u003c/li>\n\u003cli>Shortcut cheat sheet and troubleshooting: \u003ca href=\"#/en/07-shortcuts-and-troubleshooting\">Shortcuts and troubleshooting\u003c/a>\u003c/li>\n\u003c/ul>"},{"slug":"02-sessions-and-chat","title":"Sessions and chat","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-sidebar.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-composer.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-side-chat.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-tool-cards.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/sessions-and-chat-share-image.png\"/>\u003ch1 id=\"sessions-and-chat\">Sessions and chat\u003c/h1>\n\u003cblockquote>\n\u003cp>Manage the session list, write messages, follow what the agent is doing, and put the results to use with side chats, annotations, and sharing.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter you can:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/browse-and-manage-sessions\">Browse and manage sessions\u003c/a>: spaces, groups, status, search, archive\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/start-a-new-session\">Start a new session\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/write-messages-in-the-composer\">Write messages in the composer\u003c/a>: sending, attachments, \u003ccode>@\u003c/code> and \u003ccode>/\u003c/code>, model and thinking level\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/annotate-and-quote\">Annotate and quote\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/side-chats\">Use side chats\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/read-the-conversation-and-handle-approvals\">Read the conversation and handle approvals\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/check-context-usage\">Check context usage\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/share-and-export\">Share and export\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is in Simplified Chinese only. UI labels appear as \u003cstrong>English name\u003c/strong> (「中文原文」) the first time they are mentioned in each section.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"browse-and-manage-sessions\">Browse and manage sessions\u003c/h2>\n\u003ch3 id=\"spaces\">Spaces\u003c/h3>\n\u003cp>The top of the left sidebar shows the name of the current \u003cstrong>space\u003c/strong> (hovering shows &quot;Code 模式 (点击切换)&quot;, &quot;Code mode (click to switch)&quot;). Click it and pick another one from the \u003cstrong>Switch mode\u003c/strong> (「切换模式」) menu:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Space\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Code\u003c/td>\u003ctd>Code projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Work\u003c/td>\u003ctd>Work projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Study\u003c/td>\u003ctd>Study projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Research\u003c/td>\u003ctd>Research projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Universal\u003c/td>\u003ctd>General conversations that belong to no project\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Each space has its own projects and sessions and shares nothing with the others; after switching, the list shows only that space&#x27;s content. When another space has running sessions, an indicator dot appears in the menu.\u003c/p>\n\u003ch3 id=\"how-the-session-list-is-organized\">How the session list is organized\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Projects\u003c/strong> (「项目」): click the \u003ccode>+\u003c/code> next to the \u003cstrong>Projects\u003c/strong> heading (\u003cstrong>Add workspace directory\u003c/strong>, 「添加工作区目录」) to add a local directory. Each project is a collapsible group.\u003c/li>\n\u003cli>The \u003ccode>+\u003c/code> on a project group (「新建会话（选择当前目录或独立工作树）」, &quot;New session (current directory or isolated worktree)&quot;) opens \u003cstrong>New session options\u003c/strong> (「新建会话选项」): \u003cstrong>Create in current directory\u003c/strong> (「在当前目录创建」), or \u003cstrong>Create in isolated worktree\u003c/strong> (「在独立工作树创建」). The latter only appears when \u003cstrong>Settings ▸ Sessions ▸ Group sessions by worktree\u003c/strong> is on (see \u003ca href=\"#/en/02-sessions-and-chat/start-a-new-session\">Start a new session\u003c/a>).\u003c/li>\n\u003cli>In the Code space, with \u003cstrong>Group sessions by worktree\u003c/strong> (「按工作树区分会话」) on, sessions inside a project are further grouped by Git worktree / branch. Turn it off for a flat list.\u003c/li>\n\u003cli>The Universal space has no projects: sessions are listed directly. You can create groups with \u003cstrong>New group\u003c/strong> (「新建分组」) and file a session into one with \u003cstrong>Move to group\u003c/strong> (「移到分组」) from its context menu.\u003c/li>\n\u003cli>Pinned sessions carry a \u003cstrong>Pinned\u003c/strong> (「已置顶」) icon.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-sidebar.png\" alt=\"Left sidebar: spaces, project groups, session status marks, and search\"/>\u003c/p>\n\u003ch3 id=\"session-status\">Session status\u003c/h3>\n\u003cp>Each session row shows a status mark next to its title; hovering the status dot in the center header shows the status name:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Status\u003c/th>\u003cth>Mark in the list\u003c/th>\u003cth>Meaning\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Running (「运行中」)\u003c/td>\u003ctd>Spinner\u003c/td>\u003ctd>The agent is working\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Awaiting approval / Awaiting answer (「待批准」/「待回答」)\u003c/td>\u003ctd>Blue \u003cstrong>Awaiting reply\u003c/strong> (「待回复」) tag\u003c/td>\u003ctd>You need to approve a tool call or answer the agent&#x27;s question\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Review (「待验收」)\u003c/td>\u003ctd>Blue unread dot at the row end\u003c/td>\u003ctd>A round finished and awaits your confirmation; the context menu offers \u003cstrong>Accept and archive\u003c/strong> (「验收并归档」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Idle (「空闲」)\u003c/td>\u003ctd>None\u003c/td>\u003ctd>Nothing in progress\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Error (「出错」)\u003c/td>\u003ctd>Red dot (\u003cstrong>Error\u003c/strong>, 「异常」)\u003c/td>\u003ctd>The session stopped on an error\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interrupted (「已中断」)\u003c/td>\u003ctd>Red dot (\u003cstrong>Interrupted\u003c/strong>)\u003c/td>\u003ctd>The process exited unexpectedly; use \u003cstrong>Resume session\u003c/strong> (「恢复会话」) in the context menu to continue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Suspended (「已挂起」)\u003c/td>\u003ctd>None\u003c/td>\u003ctd>Put to sleep after being idle to save memory; resumes automatically when you send a message\u003c/td>\u003c/tr>\u003ctr>\u003ctd>External (「外部」)\u003c/td>\u003ctd>None\u003c/td>\u003ctd>Running in a terminal via \u003ccode>omp\u003c/code>; use \u003cstrong>Take over session\u003c/strong> (「接管会话」) in the context menu\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>\u003cstrong>Take over session\u003c/strong> terminates the original omp process in the terminal (SIGTERM first, forced after 5 seconds) and then resumes the session in this app. Unsaved state may be lost. A \u003cstrong>Take over external session\u003c/strong> (「接管外部会话」) dialog asks you to confirm first.\u003c/p>\n\u003c/blockquote>\n\u003cp>Adjust the idle sleep time under \u003cstrong>Settings ▸ Sessions ▸ Sleep after idle (minutes)\u003c/strong> (「闲置多久后休眠（分钟）」).\u003c/p>\n\u003ch3 id=\"search-sessions\">Search sessions\u003c/h3>\n\u003cp>Press \u003ccode>⌘F\u003c/code> (or click \u003cstrong>Search\u003c/strong>) and type a keyword. Separate several keywords with spaces; all of them must match. Matching covers the title, label, branch, worktree, model, the latest assistant reply, and the directory name. With no results the list shows &quot;未找到匹配会话&quot; (&quot;No matching sessions&quot;); if only archived sessions match, a hint lets you reveal them in one click.\u003c/p>\n\u003ch3 id=\"pin-archive-and-delete\">Pin, archive, and delete\u003c/h3>\n\u003cp>Right-click a session row, or click the \u003cstrong>Action menu\u003c/strong> (「操作菜单」) at the end of the row:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Menu item\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Rename (「重命名」)\u003c/td>\u003ctd>Change the title (you can also double-click the title in the header)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pin session / Unpin (「置顶会话」/「取消置顶」)\u003c/td>\u003ctd>Pin the session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Archive session / Unarchive (「归档会话」/「取消归档」)\u003c/td>\u003ctd>Move it out of the list; an \u003cstrong>Undo\u003c/strong> (「撤销」) bar appears after archiving\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Assign to workspace (「归入工作区」)\u003c/td>\u003ctd>Manually choose the project the session belongs to\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Move to group (「移到分组」)\u003c/td>\u003ctd>Universal space only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Diagnose this session (「诊断此会话」)\u003c/td>\u003ctd>Opens the diagnose dialog; see \u003ca href=\"#/en/06-monitoring-and-mobile\">Chapter 6\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copy session ID / Copy branch name (「复制会话 ID」/「复制分支名」)\u003c/td>\u003ctd>Copy to the clipboard\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open in Finder (「在访达中打开」)\u003c/td>\u003ctd>Open the session&#x27;s directory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Restart session (「重启会话」)\u003c/td>\u003ctd>Start or restart the session&#x27;s omp process; history is kept\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Delete session (「删除会话」)\u003c/td>\u003ctd>Permanently delete; cannot be undone\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Archived sessions are hidden by default. Open \u003cstrong>Filter and display settings\u003c/strong> (「过滤与显示设置」) next to the search box and tick \u003cstrong>Show archived sessions\u003c/strong> (「显示已归档会话」) to see them; the same popover has \u003cstrong>Expand all\u003c/strong> (「全部展开」) and \u003cstrong>Collapse all\u003c/strong> (「全部折叠」).\u003c/p>\n\u003cp>If the session has a Git worktree, archiving opens \u003cstrong>Archive session and clean up worktree\u003c/strong> (「归档会话与工作树清理」), where you choose \u003cstrong>Archive session only (keep worktree)\u003c/strong> (「仅归档会话 (保留工作树)」) or \u003cstrong>Archive and clean up worktree\u003c/strong> (「归档并清理工作树」).\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>\u003cstrong>Delete session\u003c/strong> also deletes the transcript file and cannot be undone. Archive instead if you want to keep the record.\u003c/p>\n\u003c/blockquote>\n\u003cp>Hold \u003ccode>⌘\u003c/code> (\u003ccode>Ctrl\u003c/code> on other platforms) and click several sessions, or hold \u003ccode>Shift\u003c/code> and click to select a range. The context menu then offers bulk archive, pin, move to group, and delete.\u003c/p>\n\u003ch3 id=\"navigate-the-list-with-the-keyboard\">Navigate the list with the keyboard\u003c/h3>\n\u003cp>After you click the session list so that it has focus:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Key\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>Move the highlight and switch to that session (with a short delay, so rapid presses do not switch repeatedly)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>Open the highlighted session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> \u003ccode>→\u003c/code>\u003c/td>\u003ctd>Collapse / expand the group of the highlighted session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Delete\u003c/code> / \u003ccode>Backspace\u003c/code>\u003c/td>\u003ctd>Archive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Delete\u003c/code>\u003c/td>\u003ctd>Delete permanently (asks first)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>F2\u003c/code>\u003c/td>\u003ctd>Rename\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+F10\u003c/code> or the menu key\u003c/td>\u003ctd>Open the action menu\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"start-a-new-session\">Start a new session\u003c/h2>\n\u003ch3 id=\"start-from-new-session\">Start from New session\u003c/h3>\n\u003cp>Click \u003cstrong>New session\u003c/strong> (「新建会话」) or press \u003ccode>⌘N\u003c/code>: the app opens an empty draft in the current space. Universal uses the global workspace; other spaces use the project of the selected session, or the most recently used project when nothing is selected. If the space has no project at all, the home page asks you to \u003cstrong>Choose a project directory\u003c/strong> (「选择项目目录」) first.\u003c/p>\n\u003cp>An empty draft is discarded automatically when you leave it without typing anything, so it never leaves an empty session in the list; a draft with text or images is kept.\u003c/p>\n\u003cp>While a session has no messages, two small pills sit on the top edge of the composer: \u003cstrong>Project\u003c/strong> on the left (click to switch workspace, or choose \u003cstrong>New workspace\u003c/strong> (「新建工作区」) or \u003cstrong>Global mode (no project)\u003c/strong> (「全局模式 (不关联项目)」)) and \u003cstrong>Git branch\u003c/strong> on the right (search and switch branches, \u003cstrong>Create and check out new branch\u003c/strong> (「创建并检出新分支」), or jump to an existing worktree).\u003c/p>\n\u003ch3 id=\"create-in-an-isolated-worktree\">Create in an isolated worktree\u003c/h3>\n\u003cp>A Git project can give each session its own worktree, so several sessions can edit the same repository in parallel without overwriting each other:\u003c/p>\n\u003col>\n\u003cli>Click the \u003ccode>+\u003c/code> on the project group and choose \u003cstrong>Create in isolated worktree\u003c/strong> (requires \u003cstrong>Group sessions by worktree\u003c/strong> and a project with Git worktree support; otherwise the item is missing or disabled).\u003c/li>\n\u003cli>In the \u003cstrong>New worktree session\u003c/strong> (「新建工作树会话」) dialog, confirm \u003cstrong>Branch to branch from\u003c/strong> (「从哪个分支分出」), \u003cstrong>New branch prefix\u003c/strong> (「新分支名前缀」, for example \u003ccode>omp/\u003c/code>), and \u003cstrong>Worktree directory name\u003c/strong> (「工作树目录名」).\u003c/li>\n\u003cli>Click \u003cstrong>Create\u003c/strong> (「创建」), or press \u003ccode>⌘Enter\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>Worktrees live in \u003ccode>&lt;project&gt;/.worktrees/&lt;name&gt;\u003c/code>. See \u003ca href=\"#/en/03-workspace\">Chapter 3\u003c/a> for more Git and worktree operations.\u003c/p>\n\u003ch3 id=\"use-new-and-fork\">Use /new and /fork\u003c/h3>\n\u003cp>In the composer, \u003ccode>/new\u003c/code> starts a new session in the current directory; \u003ccode>/fork\u003c/code> copies the current conversation into a new session and can take a first message right after it.\u003c/p>\n\u003ch2 id=\"write-messages-in-the-composer\">Write messages in the composer\u003c/h2>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-composer.png\" alt=\"Composer: add menu, model and thinking level, context ring, and send button\"/>\u003c/p>\n\u003ch3 id=\"send-and-newline\">Send and newline\u003c/h3>\n\u003cp>By default \u003ccode>Enter\u003c/code> sends and \u003ccode>Shift+Enter\u003c/code> inserts a newline. In \u003cstrong>Settings ▸ Sessions ▸ Sending ▸ Send shortcut\u003c/strong> (「设置 ▸ 会话 ▸ 发送方式 ▸ 发送快捷键」) you can switch to \u003cstrong>⌘ Enter sends\u003c/strong> (「⌘ Enter 发送」); then \u003ccode>Enter\u003c/code> inserts a newline. Sending never fires while an input method is composing text. Inside a list, \u003ccode>Enter\u003c/code> continues the Markdown list and \u003ccode>Tab\u003c/code> / \u003ccode>Shift+Tab\u003c/code> indent or outdent it.\u003c/p>\n\u003cp>Press \u003ccode>↑\u003c/code> in an empty composer to recall earlier messages; keep pressing \u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code> to browse.\u003c/p>\n\u003ch3 id=\"send-while-a-task-is-running\">Send while a task is running\u003c/h3>\n\u003cp>What happens to a message you send while the agent is still replying is controlled by \u003cstrong>Settings ▸ Sessions ▸ Sending ▸ Message sent while a task is running\u003c/strong> (「任务进行中发送新消息」):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Steer (「引导」)\u003c/td>\u003ctd>Insert it into the current round immediately so the agent adjusts (default)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Queue (「排队」)\u003c/td>\u003ctd>Send after the current round ends\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Interrupt and send (「打断后发送」)\u003c/td>\u003ctd>Stop the current round first, then send\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Hold \u003ccode>⌥\u003c/code> while sending (\u003ccode>⌥Enter\u003c/code> by default, \u003ccode>⌥⌘Enter\u003c/code> when the send shortcut is ⌘ Enter) to use the other way for a single message: steer and queue swap, and &quot;interrupt and send&quot; becomes queue.\u003c/p>\n\u003cp>A queued message shows in the stream as a grey &quot;排队中&quot; (&quot;queued&quot;) bubble that you can send now or remove. The \u003cstrong>Queued N\u003c/strong> (「排队 N」) chip at the bottom right of the composer reveals held messages, and the \u003cstrong>Queue\u003c/strong> (「排队队列」) bar lets you send them merged, confirm one by one, move them up or down, or clear them. \u003cstrong>Settings ▸ Sessions ▸ Auto-send queued messages\u003c/strong> (「排队消息自动发送」) controls whether they go out one by one when the round ends.\u003c/p>\n\u003cp>Click \u003cstrong>Stop current round\u003c/strong> (「停止当前回合」), or press \u003ccode>Esc\u003c/code>, to stop generation.\u003c/p>\n\u003ch3 id=\"the-add-menu\">The add menu\u003c/h3>\n\u003cp>Click the \u003ccode>+\u003c/code> (\u003cstrong>Add\u003c/strong>, 「添加」) at the bottom left of the composer:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>File (「文件」)\u003c/td>\u003ctd>Pick files from your computer and attach them\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Finder selection (「Finder 选中项」)\u003c/td>\u003ctd>Attach the files currently selected in Finder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Work in a project (「在项目中工作」)\u003c/td>\u003ctd>Choose a project for a new chat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Goal (「目标」)\u003c/td>\u003ctd>Set a goal for the agent to keep pursuing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Plan mode (「规划模式」)\u003c/td>\u003ctd>Plan first, then execute; a \u003cstrong>Plan\u003c/strong> tab appears in the right panel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Sketch (「草图」)\u003c/td>\u003ctd>Draw a sketch and attach it as an image\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Once a \u003cstrong>Goal\u003c/strong> is active, a \u003cstrong>Goal\u003c/strong> bar appears above the composer with \u003cstrong>Pause goal\u003c/strong> / \u003cstrong>Resume goal\u003c/strong>, \u003cstrong>Edit goal\u003c/strong>, and \u003cstrong>Clear goal\u003c/strong>. You can also use \u003ccode>/goal &lt;description | pause | resume | off&gt;\u003c/code>. While plan mode is on, a pill above the composer turns it off when clicked; \u003ccode>/plan\u003c/code> toggles it too.\u003c/p>\n\u003ch3 id=\"attach-images-and-files\">Attach images and files\u003c/h3>\n\u003cul>\n\u003cli>Paste or drag an image into the composer: it is saved to \u003ccode>~/.omp-workspace/images/\u003c/code> and inserted at the caret as an \u003ccode>Image #N\u003c/code> marker (「图片 #N」).\u003c/li>\n\u003cli>Non-image files dragged in or picked with \u003cstrong>File\u003c/strong> are inserted as \u003ccode>File #N\u003c/code> markers (「文件 #N」); on send, omp reads the original file path.\u003c/li>\n\u003cli>Markers move and delete like text. If you delete a marker but the file is still in the attachment list, the file is still sent with the message.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"sketches\">Sketches\u003c/h3>\n\u003cp>Choose \u003cstrong>Sketch\u003c/strong> to open the sketch editor. Tools are \u003cstrong>Select\u003c/strong> (「选择」), \u003cstrong>Pen\u003c/strong> (「画笔」), \u003cstrong>Text\u003c/strong> (「文字」), \u003cstrong>Shapes\u003c/strong> (「形状」: line, arrow, rectangle, ellipse, triangle, diamond, star, heart), and \u003cstrong>Eraser\u003c/strong> (「橡皮」); you can \u003cstrong>Undo\u003c/strong> / \u003cstrong>Redo\u003c/strong> and change the \u003cstrong>Pen color\u003c/strong>. Click \u003cstrong>Attach sketch\u003c/strong> (「附加草图」) to insert it into the composer as an image.\u003c/p>\n\u003ch3 id=\"reference-files-with--and-run-commands-with-\">Reference files with @ and run commands with /\u003c/h3>\n\u003cul>\n\u003cli>Type \u003ccode>@\u003c/code> followed by a file name to pick from the files in the session&#x27;s working directory. Use \u003ccode>↑↓\u003c/code> to move, \u003ccode>Tab\u003c/code> or \u003ccode>Enter\u003c/code> to confirm, and \u003ccode>Esc\u003c/code> to close.\u003c/li>\n\u003cli>Type \u003ccode>/\u003c/code> to open the command menu. Some commands run inside the app; the rest are forwarded to omp:\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Commands\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Session\u003c/td>\u003ctd>\u003ccode>/new\u003c/code> \u003ccode>/fork\u003c/code> \u003ccode>/btw\u003c/code> \u003ccode>/rename\u003c/code> \u003ccode>/compact\u003c/code> \u003ccode>/handoff\u003c/code> \u003ccode>/shake\u003c/code> \u003ccode>/export\u003c/code> \u003ccode>/copy\u003c/code> \u003ccode>/retry\u003c/code> \u003ccode>/resume\u003c/code> \u003ccode>/plan\u003c/code> \u003ccode>/goal\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model\u003c/td>\u003ctd>\u003ccode>/model\u003c/code> \u003ccode>/thinking\u003c/code> \u003ccode>/fast\u003c/code> \u003ccode>/slow\u003c/code> \u003ccode>/advisor\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Status\u003c/td>\u003ctd>\u003ccode>/status\u003c/code> \u003ccode>/context\u003c/code> \u003ccode>/usage\u003c/code> \u003ccode>/tools\u003c/code> \u003ccode>/jobs\u003c/code> \u003ccode>/stats\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Integrations\u003c/td>\u003ctd>\u003ccode>/mcp\u003c/code> \u003ccode>/plugins\u003c/code> \u003ccode>/memory\u003c/code> \u003ccode>/browser\u003c/code> \u003ccode>/computer\u003c/code> \u003ccode>/extended-context\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Settings\u003c/td>\u003ctd>\u003ccode>/agents\u003c/code> \u003ccode>/approvals\u003c/code> \u003ccode>/login\u003c/code> \u003ccode>/settings\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>More OMP commands\u003c/td>\u003ctd>\u003ccode>/init\u003c/code> \u003ccode>/share\u003c/code> \u003ccode>/review\u003c/code> \u003ccode>/changelog\u003c/code> \u003ccode>/security\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skills\u003c/td>\u003ctd>\u003ccode>/skill:visualize\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Every command in the menu has a Chinese title and description (for example \u003ccode>/compact\u003c/code> is \u003cstrong>Compress context\u003c/strong> (「压缩上下文」) and \u003ccode>/btw\u003c/code> is \u003cstrong>By the way\u003c/strong> (「顺便问一句」)).\u003c/p>\n\u003ch3 id=\"model-and-thinking-level\">Model and thinking level\u003c/h3>\n\u003cp>The toolbar at the bottom of the composer shows the current model. Click it to open the model picker: providers on the left, that provider&#x27;s models on the right, and typing searches across providers. After a successful switch the app shows &quot;已切换模型&quot; (&quot;Model switched&quot;).\u003c/p>\n\u003cp>The thinking-level chip next to the model offers only the levels the current model actually supports (such as \u003ccode>off\u003c/code>, \u003ccode>low\u003c/code>, \u003ccode>medium\u003c/code>, \u003ccode>high\u003c/code>), each with a one-line description. If the model cannot think, the chip reads \u003cstrong>Thinking not supported\u003c/strong> (「不支持思考」); if it can think but has no levels configured, it reads \u003cstrong>Thinking levels not configured\u003c/strong> (「未配置思考等级」), and clicking it takes you to the provider settings to fix that.\u003c/p>\n\u003ch2 id=\"annotate-and-quote\">Annotate and quote\u003c/h2>\n\u003cp>Select text in the message stream, a document, or code, and a floating toolbar appears:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Button\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Annotate (「批注」)\u003c/td>\u003ctd>Write a note about the selection and press \u003ccode>Enter\u003c/code> to confirm; pick \u003cstrong>Main chat\u003c/strong> (「主对话」) or \u003cstrong>Side chat\u003c/strong> (「辅助对话」) as the target\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Save to inbox (「记到收集箱」)\u003c/td>\u003ctd>Store the selected text as an idea; see \u003ca href=\"#/en/04-automation\">Chapter 4\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Send to main chat (「发到主对话」)\u003c/td>\u003ctd>Appears when you select text inside a side chat; puts it into the main session&#x27;s composer\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Annotations dock above the composer as pills labelled &quot;N annotations&quot; (「N 条批注」), where you can \u003cstrong>Locate in original message\u003c/strong> (「定位到原消息」), \u003cstrong>Edit annotation\u003c/strong> (「编辑批注」), \u003cstrong>Delete annotation\u003c/strong> (「删除批注」), or \u003cstrong>Clear annotations\u003c/strong> (「清空批注」). On send, annotations are assembled with the quoted text into a clear reference block for the agent.\u003c/p>\n\u003ch2 id=\"side-chats\">Side chats\u003c/h2>\n\u003cp>A side chat is a clone of the main session: it inherits the current context but runs as its own session, so it does not interrupt the main thread.\u003c/p>\n\u003cul>\n\u003cli>Click \u003cstrong>Open new tab\u003c/strong> in the right panel ▸ \u003cstrong>New side chat\u003c/strong> (「新辅助对话」), or type \u003ccode>/btw your question\u003c/code> (without a question it just opens the tab).\u003c/li>\n\u003cli>Select text in a message and set the annotation target to \u003cstrong>Side chat\u003c/strong>; the an
