notation is staged in the side chat&#x27;s composer.\u003c/li>\n\u003cli>Side chats also appear in the left sidebar under their main session. Nesting is limited to 3 levels; beyond that the app says &quot;已达分支嵌套深度上限（3 层）&quot; (&quot;branch nesting limit reached (3 levels)&quot;), so create a \u003cstrong>New main session\u003c/strong> (「新建主会话」).\u003c/li>\n\u003cli>The \u003cstrong>More actions\u003c/strong> (「更多操作」) menu at the top right of a side chat offers \u003cstrong>Open in main view\u003c/strong> (「在主视图打开」) and \u003cstrong>Hand back to parent session\u003c/strong> (「回传给父会话」). Handing back has the side chat write up its conclusions; after you confirm, they go into the main composer (never sent automatically). You can change the method to \u003cstrong>Manual selection\u003c/strong> (「手动选择」) under \u003cstrong>Settings ▸ Appearance ▸ Conversation display ▸ How to hand back to the parent session\u003c/strong>.\u003c/li>\n\u003cli>Press \u003ccode>⌘[\u003c/code> to return from a side chat to its parent session.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-side-chat.png\" alt=\"Side chat tab in the right panel\"/>\u003c/p>\n\u003ch2 id=\"read-the-conversation-and-handle-approvals\">Read the conversation and handle approvals\u003c/h2>\n\u003ch3 id=\"tool-cards-and-execution-steps\">Tool cards and execution steps\u003c/h3>\n\u003cp>Each action the agent takes is a tool card in the stream, and its verb changes with state: \u003cstrong>Reading\u003c/strong> (「正在读取」) becomes \u003cstrong>Read\u003c/strong> (「已读取」); the same goes for search, find, list, run, edit, write, update todos, fetch web page, and subagent. Long runs of steps collapse into &quot;已处理 N 个步骤&quot; (&quot;Processed N steps&quot;); click to expand. Thinking shows as &quot;思考&quot; (&quot;Thinking&quot;) and, while the model is thinking, can show its latest two lines (\u003cstrong>Settings ▸ Appearance ▸ Conversation display ▸ Show latest two lines while thinking\u003c/strong>). Run cards offer \u003cstrong>Copy command\u003c/strong> / \u003cstrong>Copy output\u003c/strong>, and cards that involve a file offer \u003cstrong>Open file\u003c/strong>.\u003c/p>\n\u003cp>The message area also has a \u003cstrong>Conversation question navigator\u003c/strong> (「对话问题导航」); click an entry to jump to question N.\u003c/p>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-tool-cards.png\" alt=\"Tool cards and collapsed execution steps in the message stream\"/>\u003c/p>\n\u003ch3 id=\"approve-and-answer\">Approve and answer\u003c/h3>\n\u003cp>When the agent needs permission, an approval card appears in the stream:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Button\u003c/th>\u003cth>Effect\u003c/th>\u003cth>Key\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>This time only (「仅本次」)\u003c/td>\u003ctd>Allow this one execution\u003c/td>\u003ctd>\u003ccode>y\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Always this session (「本会话始终」)\u003c/td>\u003ctd>Stop asking about this tool in this session\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Always allow (「永久允许」)\u003c/td>\u003ctd>Add it to the global allow list\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Deny (「拒绝」)\u003c/td>\u003ctd>Reject this execution\u003c/td>\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Always this session\u003c/strong> and \u003cstrong>Always allow\u003c/strong> appear only when the request offers those options.\u003c/p>\n\u003cp>When the agent asks you a question, a question panel replaces the composer: press a number key to choose an option (number or space to tick in multi-select), \u003ccode>←\u003c/code> \u003ccode>→\u003c/code> to switch questions, \u003ccode>Enter\u003c/code> to submit or go to the next, and \u003ccode>Esc\u003c/code> to cancel the question. You can also choose \u003cstrong>Other (write your own)\u003c/strong> (「其他（自己填写）」) or \u003cstrong>Skip\u003c/strong> (「跳过」). The default approval policy is under \u003cstrong>Settings ▸ General ▸ Approval mode\u003c/strong> (「设置 ▸ 通用 ▸ 审批模式」).\u003c/p>\n\u003ch3 id=\"edit-a-sent-message\">Edit a sent message\u003c/h3>\n\u003cp>Hover a message you sent and click \u003cstrong>Edit and resend\u003c/strong> (「编辑并重新发送」), change it, and press \u003ccode>⌘Enter\u003c/code> (or click \u003cstrong>Resend\u003c/strong>, 「重新发送」). If the agent is still generating, the current round is stopped first. Note that the edited text is sent as a new message; it does not rewrite the existing history.\u003c/p>\n\u003ch3 id=\"reply-time-and-undo\">Reply time and undo\u003c/h3>\n\u003cp>Each reply shows its \u003cstrong>Reply time\u003c/strong> (「回复时间」) and offers \u003cstrong>Copy reply\u003c/strong> (「复制回复」). A statistics line under each model request (time to first token, generation time, and so on) can be turned on under \u003cstrong>Settings ▸ Appearance ▸ Request statistics\u003c/strong>.\u003c/p>\n\u003cp>With \u003cstrong>Settings ▸ Sessions ▸ Conversation checkpoints ▸ Auto-save every round\u003c/strong> (「设置 ▸ 会话 ▸ 对话检查点 ▸ 每轮自动存档」) on, the app takes a Git snapshot of the project before each round (it only applies to conversations started afterwards in this app). Replies then show \u003cstrong>Undo this round\u003c/strong> (「撤回这一轮」), which restores the files changed in that round to how they were before it started (files created in that round are deleted, and later rounds are undone with it). You can also open \u003cstrong>This round changed N files\u003c/strong> (「这一轮改了 N 个文件」) to inspect the snapshot in version history.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>Undo only affects project files, and the agent is notified at its next round. If those files were changed again after that round, the app warns about the conflict first and overwrites only after you confirm.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"turn-timer\">Turn timer\u003c/h3>\n\u003cp>While the agent works, the execution area shows a live &quot;正在处理 Xs…&quot; (&quot;Processing Xs&quot;) timer; right after you send a request and before the model responds it shows &quot;正在等待模型回复&quot; (&quot;Waiting for the model&quot;). When the round ends it collapses into a &quot;已处理&quot; (&quot;Processed&quot;) summary (with the duration when known, otherwise the step count). The bottom status bar shows the session&#x27;s rounds and steps; click it to open \u003cstrong>Detailed session statistics\u003c/strong> (model time, TTFT, TPS, token usage).\u003c/p>\n\u003ch2 id=\"check-context-usage\">Check context usage\u003c/h2>\n\u003cp>The ring in the composer toolbar shows how full the context window is. Click it to expand the panel:\u003c/p>\n\u003cul>\n\u003cli>The top shows used tokens / window size. The stacked bar and list below split usage into \u003cstrong>System tools\u003c/strong> (「系统工具」), \u003cstrong>System prompt\u003c/strong> (「系统提示词」), \u003cstrong>MCP tools\u003c/strong> (「MCP 工具」), \u003cstrong>Skills\u003c/strong>, \u003cstrong>Rule files\u003c/strong> (「规则文件」), \u003cstrong>Conversation messages\u003c/strong> (「对话消息」), \u003cstrong>Other\u003c/strong> (「其他」), and \u003cstrong>Free space\u003c/strong> (「剩余空间」), and you can expand details for MCP tools, Skills, and rule files.\u003c/li>\n\u003cli>\u003cstrong>View system prompt composition\u003c/strong> (「查看系统提示词构成」) jumps to \u003cstrong>Settings ▸ System prompt composition\u003c/strong>, where you see what every request carries and can ask an AI to slim it down.\u003c/li>\n\u003cli>The \u003cstrong>Compress\u003c/strong> (「压缩」) button compresses the context (unavailable while a round is running); you can also type \u003ccode>/compact\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>When the context nears its limit, try \u003ccode>/compact\u003c/code> first. To drop large blocks such as tool results without calling the model, use \u003ccode>/shake\u003c/code>.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"share-and-export\">Share and export\u003c/h2>\n\u003cp>Click \u003cstrong>Share and export\u003c/strong> (「分享与导出」) in the center header:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth>Effect\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Select messages to share as image (「选择消息分享为图片」)\u003c/td>\u003ctd>Tick messages, then \u003cstrong>Generate image\u003c/strong> (「生成图片」) and \u003cstrong>Copy image\u003c/strong> or \u003cstrong>Save image\u003c/strong> (PNG)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Create share link (「创建分享链接」)\u003c/td>\u003ctd>Uploads the session, encrypted, to the OMP sharing service; anyone with the link can view it, and known secrets are masked automatically. You confirm first\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Copy as Markdown (「复制为 Markdown」)\u003c/td>\u003ctd>Copies the whole conversation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Export as HTML (「导出为 HTML」)\u003c/td>\u003ctd>Exports a standalone HTML file and reveals it in Finder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Scan on phone (「手机扫码查看」)\u003c/td>\u003ctd>Scan with a phone on the same LAN; see \u003ca href=\"#/en/06-monitoring-and-mobile\">Chapter 6\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>While selecting messages, a selection bar appears at the bottom with \u003cstrong>Select all\u003c/strong> / \u003cstrong>Deselect all\u003c/strong> (「全选」/「取消全选」), \u003cstrong>Cancel\u003c/strong> (「取消」), and \u003cstrong>Generate image\u003c/strong>.\u003c/p>\n\u003cp>\u003cimg src=\"images/sessions-and-chat-share-image.png\" alt=\"Preview dialog for sharing selected messages as an image\"/>\u003c/p>"},{"slug":"03-workspace","title":"Workspace: files, Git, and terminal","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-right-panel-tabs.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-explorer-tree.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-doc-split.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-git-panel.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-git-history.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/workspace-terminal.png\"/>\u003ch1 id=\"workspace-files-git-and-terminal\">Workspace: files, Git, and terminal\u003c/h1>\n\u003cblockquote>\n\u003cp>Browse project files, preview and edit documents, manage Git worktrees and history, and use a terminal from the right-hand panel without leaving omp-workspace.\u003c/p>\n\u003c/blockquote>\n\u003cp>You can:\u003c/p>\n\u003cul>\n\u003cli>Browse and search workspace files in the \u003ca href=\"#/en/03-workspace/browse-project-files\">explorer\u003c/a>\u003c/li>\n\u003cli>Read and edit files, and annotate Markdown, in \u003ca href=\"#/en/03-workspace/preview-and-edit-files\">file preview and the document view\u003c/a>\u003c/li>\n\u003cli>Review changes, save commits, and manage worktrees and branches in the \u003ca href=\"#/en/03-workspace/review-and-manage-git\">Git panel\u003c/a>\u003c/li>\n\u003cli>Preview or roll back to older versions from \u003ca href=\"#/en/03-workspace/go-back-to-an-earlier-version\">version history\u003c/a>\u003c/li>\n\u003cli>Run commands in the \u003ca href=\"#/en/03-workspace/use-the-terminal\">terminal\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/open-in-other-apps\">Open files in other apps\u003c/a> or reveal them in Finder\u003c/li>\n\u003c/ul>\n\u003cp>These features live in the \u003cstrong>right panel\u003c/strong> (a strip of tabs along the top) and the central \u003cstrong>document\u003c/strong> view. Toggle the right panel with \u003ccode>⌘J\u003c/code>; see \u003ca href=\"#/en/07-shortcuts-and-troubleshooting\">Shortcuts and troubleshooting\u003c/a>.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is Simplified Chinese only. In this guide, UI labels appear as \u003cstrong>English name\u003c/strong> (「中文原文」) on first mention in each section, and by their English name afterwards.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"know-the-right-panel-tabs\">Know the right panel tabs\u003c/h2>\n\u003cp>The right panel is organized as browser-style tabs. Click the \u003cstrong>+\u003c/strong> at the end of the tab strip (「打开新标签页」) to add one:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tab\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Explorer\u003c/strong> (「文件」)\u003c/td>\u003ctd>File tree of the current workspace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Git\u003c/strong>\u003c/td>\u003ctd>Changes, worktrees, branches, version history\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Terminal\u003c/strong> (「终端」)\u003c/td>\u003ctd>Command-line terminals; you can open several\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>File preview\u003c/strong> (「文件预览」)\u003c/td>\u003ctd>Opens when you click a file path in the chat; one tab per file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Side chat\u003c/strong> (「辅助对话」)\u003c/td>\u003ctd>A side conversation attached to the current session; see \u003ca href=\"#/en/02-sessions-and-chat\">Sessions and chat\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Services\u003c/strong> (「服务」)\u003c/td>\u003ctd>Running services and ports; see \u003ca href=\"#/en/06-monitoring-and-mobile\">Monitoring and mobile\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Token usage\u003c/strong> (「Token 用量」)\u003c/td>\u003ctd>Usage heatmap; see \u003ca href=\"#/en/06-monitoring-and-mobile\">Monitoring and mobile\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>When there are too many tabs to fit, the extras collect in a \u003cstrong>+N\u003c/strong> overflow menu (「全部标签页」). Each tab has a close button (「关闭标签页」).\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-right-panel-tabs.png\" alt=\"Right panel tab strip and the + menu\"/>\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The \u003cstrong>Plan\u003c/strong> (「计划」) tab cannot be added manually; it opens automatically in plan mode.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"browse-project-files\">Browse project files\u003c/h2>\n\u003cp>Open the \u003cstrong>Explorer\u003c/strong> (「文件」) tab to see the current workspace&#x27;s file tree. The workspace card at the top shows the workspace name and path. If you have more than one workspace, click the card to \u003cstrong>switch workspace\u003c/strong> (「切换工作区」). The status dot reads &quot;工作区已就绪&quot; (workspace ready) or shows the number of uncommitted changes.\u003c/p>\n\u003cp>Toolbar buttons:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Button\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Search files (\u003ccode>⌘F\u003c/code>)\u003c/td>\u003ctd>Opens a filter box; type a file name to filter. Results show as &quot;搜索结果 (N)&quot;; click \u003cstrong>show more\u003c/strong> (「显示更多」) for long lists\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reveal workspace folder in Finder\u003c/td>\u003ctd>Opens the workspace root in Finder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Collapse all\u003c/td>\u003ctd>Collapses every expanded folder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Refresh file tree\u003c/td>\u003ctd>Re-reads directories\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>A folder&#x27;s contents load the first time you expand it. Right-click a file or folder (or use the row&#x27;s \u003cstrong>more options\u003c/strong> button, 「更多选项」) to:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Reveal in Finder\u003c/strong> (「在访达中显示」)\u003c/li>\n\u003cli>\u003cstrong>Copy relative path\u003c/strong> (「复制相对路径」)\u003c/li>\n\u003cli>\u003cstrong>Copy full path\u003c/strong> (「复制完整路径」)\u003c/li>\n\u003cli>\u003cstrong>Refresh this folder\u003c/strong> (「刷新此目录」; folders only)\u003c/li>\n\u003c/ul>\n\u003cp>Clicking a file opens it in the central document view, described next.\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-explorer-tree.png\" alt=\"Explorer file tree with the context menu\"/>\u003c/p>\n\u003ch2 id=\"preview-and-edit-files\">Preview and edit files\u003c/h2>\n\u003cp>There are two places to view a file:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Document view\u003c/strong>: fills the center area. Open it from the explorer or the Git changes list.\u003c/li>\n\u003cli>\u003cstrong>File preview tab\u003c/strong>: lives in the right panel. It opens when you click a file path in a chat message.\u003c/li>\n\u003c/ul>\n\u003cp>Both can save changes to disk and share the same behavior:\u003c/p>\n\u003cul>\n\u003cli>A \u003cstrong>unsaved\u003c/strong> (「未保存」) badge appears next to the title when there are unsaved edits.\u003c/li>\n\u003cli>Click \u003cstrong>Save\u003c/strong> (「保存」, \u003ccode>⌘S\u003c/code>) to write to disk.\u003c/li>\n\u003cli>Click \u003cstrong>Reload\u003c/strong> (「重新加载」) to re-read from disk.\u003c/li>\n\u003cli>When you return to the window and the file was changed by another program, a &quot;文件已在磁盘上被修改&quot; (file was modified on disk) banner appears. A clean buffer updates silently; with unsaved edits you choose \u003cstrong>Reload\u003c/strong> or \u003cstrong>Keep my changes\u003c/strong> (「保留我的修改」).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"preview-a-file-on-the-right\">Preview a file on the right\u003c/h3>\n\u003cp>The file preview tab uses the \u003cstrong>view mode\u003c/strong> switch (「查看方式」) to toggle between \u003cstrong>Preview\u003c/strong> (「预览」) and \u003cstrong>Edit\u003c/strong> (「编辑」). Text files open read-only; switching to Edit loads a code editor (CodeMirror). Images render inline. Markdown previews use the same renderer as the chat, so paths inside the document remain clickable.\u003c/p>\n\u003cp>Two shortcut buttons sit at the top of the tab: \u003cstrong>Open with system app\u003c/strong> (「系统打开」) and \u003cstrong>Finder\u003c/strong> (「访达」, reveal in Finder).\u003c/p>\n\u003cp>With nothing open you will see &quot;还没有打开的文件&quot; (no file open yet); click a file path in a chat to preview it here.\u003c/p>\n\u003ch3 id=\"read-and-edit-in-the-document-view\">Read and edit in the document view\u003c/h3>\n\u003cp>The document view offers three layouts, chosen with the switch at the top:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Layout\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Preview\u003c/strong> (「预览」)\u003c/td>\u003ctd>Rendered Markdown\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Split\u003c/strong> (「分栏」)\u003c/td>\u003ctd>Source on the left, preview on the right\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Edit\u003c/strong> (「编辑」)\u003c/td>\u003ctd>Source editor only\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Click \u003cstrong>Close\u003c/strong> (「关闭」, \u003ccode>Esc\u003c/code>) to leave the document view. With unsaved edits you are asked whether to discard and exit.\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-doc-split.png\" alt=\"Document view in split layout\"/>\u003c/p>\n\u003ch3 id=\"annotate-a-document\">Annotate a document\u003c/h3>\n\u003cp>You can send a passage from a document, together with your comment, to an agent:\u003c/p>\n\u003col>\n\u003cli>Select text in the preview or the editor. A &quot;划选片段&quot; (selected snippet) bar appears below.\u003c/li>\n\u003cli>Write a comment (optional) and pick the target session. If a session is already selected, it is used automatically; otherwise choose one in the \u003cstrong>Select target session\u003c/strong> (「选择目标会话」) dropdown.\u003c/li>\n\u003cli>Click \u003cstrong>Annotate\u003c/strong> (「批注」, \u003ccode>⌘Enter\u003c/code>).\u003c/li>\n\u003c/ol>\n\u003cp>The annotation is added to that session&#x27;s composer draft. Click \u003cstrong>Go to session\u003c/strong> (「前往会话查看」) to jump there and send it when you are ready.\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>The same annotation flow works in the Git diff window (below) and for text selected in the terminal.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"review-and-manage-git\">Review and manage Git\u003c/h2>\n\u003cp>The \u003cstrong>Git\u003c/strong> tab follows the working directory of the currently selected session. With no session selected, or a session without a working directory, it says &quot;没有选中的会话，或该会话未关联工作目录&quot; (no session selected or no working directory). If the directory is not a repository it says &quot;不是 git 仓库&quot; (not a git repository). The panel refreshes every 10 seconds, or click the refresh button (\u003ccode>⌘R\u003c/code>).\u003c/p>\n\u003cp>The panel is split into two parts, with a draggable divider between them:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Top\u003c/strong>: use the switch to choose \u003cstrong>Worktrees\u003c/strong> (「工作树」) or \u003cstrong>Branches\u003c/strong> (「分支」).\u003c/li>\n\u003cli>\u003cstrong>Bottom\u003c/strong>: for the selected worktree, the \u003cstrong>Changes\u003c/strong> (「改动」) and \u003cstrong>History\u003c/strong> (「历史」) tabs show details.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/workspace-git-panel.png\" alt=\"Git panel: worktree list and change details\"/>\u003c/p>\n\u003ch3 id=\"review-and-save-changes\">Review and save changes\u003c/h3>\n\u003cp>The \u003cstrong>Changes\u003c/strong> tab lists uncommitted files. Each file shows its status (modified, added, deleted, renamed, untracked) and added/removed line counts.\u003c/p>\n\u003cul>\n\u003cli>Click \u003cstrong>All diff\u003c/strong> (「全部 diff」) to open the diff window with every uncommitted change.\u003c/li>\n\u003cli>Each file row has buttons: \u003cstrong>Open in document view\u003c/strong> (Markdown files), \u003cstrong>Copy relative path\u003c/strong>, \u003cstrong>Dispatch to agent for review\u003c/strong> (「派发给 Agent 审查」), and \u003cstrong>Revert this file&#x27;s changes\u003c/strong> (for untracked files, \u003cstrong>Delete untracked file\u003c/strong>). Right-click a file for more, including \u003cstrong>View diff\u003c/strong>, \u003cstrong>Copy full path\u003c/strong>, and \u003cstrong>Ask the agent about this change\u003c/strong>.\u003c/li>\n\u003cli>Reverting and deleting untracked files both ask for confirmation and cannot be undone.\u003c/li>\n\u003c/ul>\n\u003cp>To save the changes as a version, click \u003cstrong>Save: commit all N files\u003c/strong> (「存档：提交全部 N 个文件」). The commit message is written by AI; alternatively, open the write-your-own-message control, type a message, and press \u003ccode>⌘Enter\u003c/code>. Saving only commits locally and never pushes.\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>If an agent is still editing the worktree, saving may capture only half of its changes. The panel shows a reminder in that case.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"annotate-in-the-diff-window\">Annotate in the diff window\u003c/h3>\n\u003cp>The diff window supports:\u003c/p>\n\u003cul>\n\u003cli>Switching between \u003cstrong>Unified\u003c/strong> (single-column) and \u003cstrong>Split\u003c/strong> (two-column) views, plus \u003cstrong>word wrap\u003c/strong> (「自动换行」).\u003c/li>\n\u003cli>Hiding or showing the file list on the left, and collapsing each file&#x27;s diff.\u003c/li>\n\u003cli>Selecting lines and clicking \u003cstrong>Add comment on this line\u003c/strong> (「为此行添加批注」) next to them, writing your note, then choosing \u003cstrong>Add to draft only\u003c/strong> (「仅加到草稿」; adds to the current session&#x27;s composer draft and keeps the window open), \u003cstrong>Send to agent\u003c/strong> (「发给 Agent」; sends immediately), or \u003cstrong>Annotate and close\u003c/strong> (「批注并关闭」, \u003ccode>⌘Enter\u003c/code>).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"work-with-worktrees\">Work with worktrees\u003c/h3>\n\u003cp>A worktree is another independent folder on disk for the same repository, letting several tasks modify code in parallel without interfering. In the \u003cstrong>Worktrees\u003c/strong> view:\u003c/p>\n\u003cul>\n\u003cli>Each row shows the branch name, number of uncommitted files, commits ahead of/behind the main branch, and linked sessions. If a worktree is listening on a port, click the port to preview it in your browser.\u003c/li>\n\u003cli>Row buttons: \u003cstrong>Commit all changes\u003c/strong> (AI writes the message), \u003cstrong>New session in this worktree\u003c/strong>, and \u003cstrong>More actions\u003c/strong>. Right-click opens the same menu.\u003c/li>\n\u003cli>Click \u003cstrong>New parallel worktree\u003c/strong> (「新建并行工作树」) in the header, type a name (for example \u003ccode>feat-auth\u003c/code>), and press \u003ccode>Enter\u003c/code>. \u003cstrong>More options\u003c/strong> (「更多选项」) opens the full new-session dialog, where you can pick the base branch and branch-name prefix; see \u003ca href=\"#/en/02-sessions-and-chat\">Sessions and chat\u003c/a>.\u003c/li>\n\u003cli>Below the list, &quot;未建工作树的分支&quot; (branches without a worktree) offers \u003cstrong>Create worktree\u003c/strong> (「建工作树」) for each branch.\u003c/li>\n\u003c/ul>\n\u003cp>The \u003cstrong>More actions\u003c/strong> menu includes:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Sync from main\u003c/strong> (「从 main 同步」)\u003c/td>\u003ctd>Merge the latest main-branch commits into this worktree, with a conflict pre-check\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Sync and merge into main\u003c/strong> (「同步并合入 main」)\u003c/td>\u003ctd>Merge main in first, then fast-forward local main to this branch; local only, nothing is pushed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Merge another branch in\u003c/strong> (「合并其他分支进来」)\u003c/td>\u003ctd>Pick a branch to merge into this worktree\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Rebase onto main\u003c/strong> (「变基到 main」)\u003c/td>\u003ctd>Rewrites this branch&#x27;s history; if already pushed, you need a force push\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Deliver / open PR\u003c/strong> (「交付/提PR」)\u003c/td>\u003ctd>Delivers according to the main-branch delivery mode, see below\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>View total diff against main\u003c/strong>\u003c/td>\u003ctd>All commits on this branch relative to main\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Open terminal in this worktree\u003c/strong>\u003c/td>\u003ctd>Starts a terminal in that folder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Open in file manager\u003c/strong>, \u003cstrong>Copy path\u003c/strong>, \u003cstrong>Copy branch name\u003c/strong>\u003c/td>\u003ctd>Convenience actions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Discard all uncommitted changes\u003c/strong>\u003c/td>\u003ctd>Includes untracked files; cannot be undone\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Delete worktree\u003c/strong>\u003c/td>\u003ctd>Cleans up the worktree; you can also delete its branch. If sessions still reference it, they are archived automatically\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Merge, sync, and rebase run a conflict pre-check first. If conflicts are found, the repository is left untouched and you are asked whether to start \u003cstrong>AI-assisted conflict resolution\u003c/strong> (「AI 辅助解冲突」), which creates a session where the agent performs the operation and resolves the conflicts.\u003c/p>\n\u003cp>The behavior of delivery is set in \u003cstrong>Settings → General → Git → Main-branch delivery mode\u003c/strong> (「主干交付模式」):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Mode\u003c/th>\u003cth>Behavior\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Open a Pull Request (recommended)\u003c/strong> (「发起 Pull Request（推荐）」)\u003c/td>\u003ctd>Pushes to a same-named cloud branch and opens GitHub&#x27;s PR creation page in the browser\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Merge locally and push directly\u003c/strong> (「本地合并并直接推送」)\u003c/td>\u003ctd>Merges into main locally and pushes straight to \u003ccode>origin/main\u003c/code>, with no PR review\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>Direct push modifies the production main branch. You are asked to confirm first.\u003c/p>\n\u003c/blockquote>\n\u003cp>A worktree with no linked sessions is marked &quot;idle&quot; (「闲置」). The Git panel then shows an \u003cstrong>Idle worktrees\u003c/strong> (「闲置工作树」) banner where you can \u003cstrong>Reclaim all\u003c/strong> (「全部回收」) or choose \u003cstrong>Stop reminding for this repo\u003c/strong> (「对此仓库不再提醒」). Reclaiming deletes the worktree folder and its associated branch.\u003c/p>\n\u003ch3 id=\"manage-branches\">Manage branches\u003c/h3>\n\u003cp>In the \u003cstrong>Branches\u003c/strong> view, the \u003cstrong>Repository branch assets\u003c/strong> (「仓库分支资产」) panel lists branches on two tabs, \u003cstrong>Local\u003c/strong> (「本地」) and \u003cstrong>Cloud origin\u003c/strong> (「云端 origin」), with name search.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Refresh cloud\u003c/strong> (「刷新云端」) runs \u003ccode>git fetch\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Clean merged\u003c/strong> (「清理已合并」) deletes local branches already merged into main (it lists them and asks first).\u003c/li>\n\u003cli>Each branch shows states such as &quot;仅本地&quot; (local only), &quot;已同步&quot; (in sync), &quot;已合并&quot; (merged), and how many commits it is ahead of or behind the cloud.\u003c/li>\n\u003cli>Branch row actions include \u003cstrong>View worktree\u003c/strong>, push to cloud, deliver, sync from main, create worktree, and delete. A branch in use by a worktree cannot be deleted.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"go-back-to-an-earlier-version\">Go back to an earlier version\u003c/h2>\n\u003cp>The \u003cstrong>History\u003c/strong> tab lists the current worktree&#x27;s commits grouped by day. Search by message, author, or version ID, and click \u003cstrong>Load more commits\u003c/strong> (「加载更多提交」) at the bottom. Expanding a version shows rows of actions:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Row\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Look\u003c/strong> (「看看」)\u003c/td>\u003ctd>\u003cstrong>What changed in this version\u003c/strong> (「这一版改了什么」): view that version&#x27;s diff\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Try\u003c/strong> (「试试」)\u003c/td>\u003ctd>\u003cstrong>Time machine snapshot preview\u003c/strong> (「时光机快照预览」): runs a snapshot of that version in an isolated temporary directory (\u003ccode>.worktrees/tm-xxxx\u003c/code>) without touching your current code. You can also \u003cstrong>run with a custom command\u003c/strong>, for example \u003ccode>pnpm dev --port 5180\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Return\u003c/strong> (「回到」)\u003c/td>\u003ctd>\u003cstrong>Return to this version\u003c/strong> (「回到这个版本」): choose \u003cstrong>keep later changes (recommended)\u003c/strong>, which undoes later commits but leaves their edits as uncommitted changes, or \u003cstrong>discard everything after\u003c/strong>, which removes later commits and all uncommitted edits and cannot be undone\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Running snapshots appear as cards showing the command, address, and logs. You can \u003cstrong>open the folder\u003c/strong>, \u003cstrong>stop\u003c/strong> it, or \u003cstrong>discard\u003c/strong> it.\u003c/p>\n\u003cp>If a version came from a conversation turn, the expanded view shows &quot;来自对话&quot; (from conversation) and links back to that turn.\u003c/p>\n\u003cp>\u003cimg src=\"images/workspace-git-history.png\" alt=\"An expanded version with time machine actions\"/>\u003c/p>\n\u003ch3 id=\"conversation-checkpoints\">Conversation checkpoints\u003c/h3>\n\u003cp>The History tab may show an \u003cstrong>Enable conversation checkpoints\u003c/strong> (「开启对话检查点」) prompt. When enabled, every turn is saved automatically so you can undo a bad change in one click, and the agent saves a commit after finishing and verifying its work (never pushed to a remote). It only applies to sessions opened afterwards. Click \u003cstrong>View rule text\u003c/strong> (「查看规则原文」) to see exactly which rule is injected. Choose \u003cstrong>Not now\u003c/strong> (「暂不」) to leave it off.\u003c/p>\n\u003ch2 id=\"use-the-terminal\">Use the terminal\u003c/h2>\n\u003cp>The \u003cstrong>Terminal\u003c/strong> tab provides a real login shell, handy for typing commands, secrets, or answers by hand while an agent works.\u003c/p>\n\u003cp>\u003cstrong>Open and switch\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Press \u003ccode>⌘`\u003c/code> (\u003ccode>Ctrl+`\u003c/code> on Windows/Linux) to toggle the terminal tab. You can also use the terminal button in the center title bar, or choose \u003cstrong>New terminal\u003c/strong> (「新建终端」) from the \u003cstrong>+\u003c/strong> menu in the right panel.\u003c/li>\n\u003cli>A terminal starts in the selected session&#x27;s working directory. Creating a terminal always makes a new tab, named &quot;终端 1&quot;, &quot;终端 2&quot;, and so on; up to 10 can be open at once.\u003c/li>\n\u003cli>Each terminal&#x27;s status is \u003cstrong>Connecting\u003c/strong> (「正在连接」), \u003cstrong>Connected\u003c/strong> (「已连接」), \u003cstrong>Exited\u003c/strong> (「已退出」), or \u003cstrong>Failed to start\u003c/strong> (「启动失败」). After the process exits the exit code is shown with a \u003cstrong>Reconnect\u003c/strong> (「重新连接」) button; on failure click \u003cstrong>Retry\u003c/strong> (「重试」).\u003c/li>\n\u003cli>Switching right-panel tabs does not end terminal processes. Closing a terminal tab terminates its running process (with a confirmation if one is running).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Everyday actions\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Search\u003c/td>\u003ctd>Search the terminal with case-sensitive, whole-word, and regex toggles; \u003ccode>Enter\u003c/code> for next, \u003ccode>Shift+Enter\u003c/code> for previous, \u003ccode>Esc\u003c/code> to close\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Select text, then click \u003cstrong>Quote\u003c/strong> (「引用」)\u003c/td>\u003ctd>Adds the selection to the current session as an annotation (\u003ccode>⌘⇧A\u003c/code>); without a session this becomes \u003cstrong>Copy\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Send to side chat\u003c/strong> (「发送到侧聊」)\u003c/td>\u003ctd>Sends the selected terminal text to the side chat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Right-click menu\u003c/td>\u003ctd>\u003cstrong>Copy selection\u003c/strong>, \u003cstrong>Paste into terminal\u003c/strong>, \u003cstrong>Clear screen\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The \u003cstrong>fold into background service\u003c/strong> button (「折叠为后台服务」) on a tab collapses the terminal into a background service; you can view and restore it in the \u003cstrong>Services\u003c/strong> panel, see \u003ca href=\"#/en/06-monitoring-and-mobile\">Monitoring and mobile\u003c/a>.\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>Running \u003ccode>omp\u003c/code>, \u003ccode>claude\u003c/code>, or \u003ccode>codex\u003c/code> in this terminal resumes the transcript of the currently selected session.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cimg src=\"images/workspace-terminal.png\" alt=\"Command terminal with the search bar\"/>\u003c/p>\n\u003ch2 id=\"open-in-other-apps\">Open in other apps\u003c/h2>\n\u003cul>\n\u003cli>At the top of a \u003cstrong>File preview\u003c/strong> tab: \u003cstrong>Open with system app\u003c/strong> (「系统打开」) opens the file with your OS default app; \u003cstrong>Finder\u003c/strong> (「访达」) reveals it in Finder.\u003c/li>\n\u003cli>\u003cstrong>Explorer\u003c/strong>: right-click \u003cstrong>Reveal in Finder\u003c/strong>, or use the toolbar button to reveal the workspace folder.\u003c/li>\n\u003cli>\u003cstrong>Git panel\u003c/strong>: a worktree&#x27;s more-actions menu has \u003cstrong>Open in file manager\u003c/strong>; a worktree row can also open its folder in the explorer on the right.\u003c/li>\n\u003cli>The folder button next to the session name in the center title bar reveals the session&#x27;s working directory in Finder.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>These entries use the system default apps. omp-workspace does not offer a setting for choosing an external editor.\u003c/p>\n\u003c/blockquote>"},{"slug":"04-automation","title":"Automation: schedules, inbox, and skills","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-schedules-list.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-schedule-editor.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-inbox.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-ideas-panel.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/automation-skills-list.png\"/>\u003ch1 id=\"automation-schedules-inbox-and-skills\">Automation: schedules, inbox, and skills\u003c/h1>\n\u003cblockquote>\n\u003cp>Have agents work on a schedule, handle everything that needs your attention in one inbox, jot down ideas to dispatch later, and manage the skills and extensions agents can use.\u003c/p>\n\u003c/blockquote>\n\u003cp>You can:\u003c/p>\n\u003cul>\n\u003cli>Use \u003ca href=\"#/en/04-automation/create-a-scheduled-task\">scheduled tasks\u003c/a> to send instructions to an agent at a set time or interval\u003c/li>\n\u003cli>Handle approvals, questions, errors, interruptions, and unread sessions in the \u003ca href=\"#/en/04-automation/handle-the-inbox\">inbox\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/04-automation/collect-ideas\">Collect ideas\u003c/a> on the fly and dispatch them to an agent later\u003c/li>\n\u003cli>View, enable, and disable skills and extensions in \u003ca href=\"#/en/04-automation/manage-skills-and-extensions\">Skills management\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is Simplified Chinese only. UI labels appear as \u003cstrong>English name\u003c/strong> (「中文原文」) on first mention in each section, and by their English name afterwards.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"create-a-scheduled-task\">Create a scheduled task\u003c/h2>\n\u003cp>A scheduled task sends an instruction to an agent at preset times and syncs the result to the inbox. Click \u003cstrong>Scheduled tasks\u003c/strong> (「定时任务」) in the sidebar to open the list.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>Scheduling relies on the local process, so the app must stay running for tasks to fire on time. Runs missed while the app was closed are made up once at startup.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"the-task-list\">The task list\u003c/h3>\n\u003cp>Tasks are grouped as \u003cstrong>Upcoming\u003c/strong> (「即将运行」), \u003cstrong>Paused\u003c/strong> (「已暂停」), and \u003cstrong>Completed\u003c/strong> (「已完成」). Use the search box and the status filter (\u003cstrong>All\u003c/strong>, \u003cstrong>Running\u003c/strong>, \u003cstrong>Paused\u003c/strong>, \u003cstrong>Completed\u003c/strong>) to narrow the list. When it is empty, click \u003cstrong>Create your first task\u003c/strong> (「创建第一个任务」) or start from one of the templates:\u003c/p>\n\u003cul>\n\u003cli>Summarize yesterday&#x27;s commits every morning (weekdays 09:00)\u003c/li>\n\u003cli>Check dependency security updates (weekdays 10:00)\u003c/li>\n\u003cli>Review to-dos and unfinished work (Fridays 17:00)\u003c/li>\n\u003c/ul>\n\u003cp>Each row shows the next run time, whether the last run failed, and an on/off switch. The \u003cstrong>More actions\u003c/strong> button (「更多操作」) at the end of the row offers:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Run now\u003c/strong> (「立即运行」)\u003c/td>\u003ctd>Trigger one run immediately\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Pause\u003c/strong> / \u003cstrong>Resume\u003c/strong>\u003c/td>\u003ctd>Pause or resume the task; a completed task cannot be resumed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Edit\u003c/strong>\u003c/td>\u003ctd>Open the editor page\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Rename\u003c/strong>\u003c/td>\u003ctd>Change the title\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Duplicate\u003c/strong> (「复制」)\u003c/td>\u003ctd>Create a new task with this task&#x27;s configuration (title gets a &quot;（副本）&quot; suffix)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Delete\u003c/strong>\u003c/td>\u003ctd>Asks for confirmation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cimg src=\"images/automation-schedules-list.png\" alt=\"Scheduled tasks list page\"/>\u003c/p>\n\u003ch3 id=\"configure-a-task\">Configure a task\u003c/h3>\n\u003cp>Click \u003cstrong>New task\u003c/strong> (「新建任务」) or \u003cstrong>Edit\u003c/strong> to open the editor. At the top you can switch between \u003cstrong>Settings\u003c/strong> (「设置」) and \u003cstrong>History\u003c/strong> (「历史」). The \u003cstrong>Settings\u003c/strong> page has these fields:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Task title\u003c/strong> (「任务标题」)\u003c/td>\u003ctd>If left empty, the first line of the instruction is used\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Schedule\u003c/strong> (「周期」)\u003c/td>\u003ctd>Click \u003cstrong>Add schedule\u003c/strong> (「添加计划」) and choose \u003cstrong>Hourly\u003c/strong>, \u003cstrong>Daily\u003c/strong>, \u003cstrong>Weekdays\u003c/strong>, \u003cstrong>Weekly\u003c/strong>, \u003cstrong>Monthly\u003c/strong>, \u003cstrong>Custom\u003c/strong> (every N minutes/hours/days/weeks/months; minutes must be at least 5), or \u003cstrong>Once\u003c/strong> (「不重复（仅一次）」). Depending on the choice you also set a time, weekdays, or day of month (short months roll over to the last day)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Stop repeating\u003c/strong> (「结束重复」)\u003c/td>\u003ctd>\u003cstrong>Never\u003c/strong>, \u003cstrong>End date\u003c/strong>, or \u003cstrong>After N repeats\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Instruction\u003c/strong> (「指令」)\u003c/td>\u003ctd>What is sent to the agent; you can paste or drag in images\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The toolbar under the instruction box selects:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Project directory\u003c/strong>: where the task runs (an existing project, \u003cstrong>Global\u003c/strong>, or \u003cstrong>Custom directory\u003c/strong>).\u003c/li>\n\u003cli>\u003cstrong>Approval mode\u003c/strong>:\n\u003cul>\n\u003cli>\u003cstrong>Ask every time\u003c/strong>: only read-only tools pass automatically; writes and execution need confirmation.\u003c/li>\n\u003cli>\u003cstrong>Writes need approval\u003c/strong>: read-only tools and file writes pass; running commands needs confirmation.\u003c/li>\n\u003cli>\u003cstrong>Full access\u003c/strong>: all tools are approved automatically, so it can finish unattended.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Model\u003c/strong> and thinking level; the default is \u003cstrong>Use default model\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003cp>Expand \u003cstrong>Advanced options\u003c/strong> (「高级选项」) for:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Option\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Inbox notifications\u003c/strong> (「收件箱通知」)\u003c/td>\u003ctd>\u003cstrong>Important updates\u003c/strong> (only when a run fails or needs your approval/answer midway), \u003cstrong>All updates\u003c/strong> (every finished run), \u003cstrong>No notification\u003c/strong> (nothing goes to the inbox; the run is still saved in History)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Run location\u003c/strong> (「运行位置」)\u003c/td>\u003ctd>\u003cstrong>Local directory\u003c/strong>, or \u003cstrong>Isolated Git worktree\u003c/strong> (runs in a dedicated branch; unavailable if the directory is not a Git repository)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>New session each run\u003c/strong> (「每次运行新建会话」)\u003c/td>\u003ctd>When off, each run continues the previous run&#x27;s session; in worktree mode every run uses a new session\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>Below \u003cstrong>Full access\u003c/strong>, if an unattended run needs approval it waits in the inbox for your confirmation, and the task does not continue in the meantime.\u003c/p>\n\u003c/blockquote>\n\u003cp>Before saving, the form checks that an instruction, a project directory, and a schedule are set, and that a one-time run is in the future. Click \u003cstrong>Create scheduled task\u003c/strong> (「创建定时任务」; \u003cstrong>Save changes\u003c/strong> when editing) to finish.\u003c/p>\n\u003cp>\u003cimg src=\"images/automation-schedule-editor.png\" alt=\"Scheduled task editor page\"/>\u003c/p>\n\u003ch3 id=\"view-run-history\">View run history\u003c/h3>\n\u003cp>The \u003cstrong>History\u003c/strong> tab of the editor lists every run of the task with its state (\u003cstrong>Running\u003c/strong>, \u003cstrong>Success\u003c/strong>, \u003cstrong>Failed\u003c/strong>, \u003cstrong>Skipped\u003c/strong>). Click a run to open its session in the main workbench; runs without a session say &quot;该次运行没有关联会话&quot; (this run has no linked session). History is available after the task has been created.\u003c/p>\n\u003ch2 id=\"handle-the-inbox\">Handle the inbox\u003c/h2>\n\u003cp>The inbox gathers everything that needs you. Click the bell icon (\u003cstrong>Inbox\u003c/strong>, 「收件箱」) at the top of the sidebar. The number on the icon is the pending count (running sessions are not counted).\u003c/p>\n\u003cp>Items are split into tabs by type:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tab\u003c/th>\u003cth>Contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>All\u003c/strong>\u003c/td>\u003ctd>Everything, grouped in the order Pending approval → Question → Error → Interrupted → Unread → Scheduled → Running\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Pending approval\u003c/strong> (「待审批」)\u003c/td>\u003ctd>Sessions waiting for you to approve a tool call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Question\u003c/strong> (「提问」)\u003c/td>\u003ctd>Sessions waiting for you to answer the agent\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Error\u003c/strong> (「报错」)\u003c/td>\u003ctd>Sessions that failed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Interrupted\u003c/strong> (「中断」)\u003c/td>\u003ctd>Sessions that were interrupted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Unread\u003c/strong> (「未读」)\u003c/td>\u003ctd>Finished sessions you have not looked at yet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Scheduled\u003c/strong> (「定时任务」)\u003c/td>\u003ctd>Pending results from scheduled tasks\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>How to work with it:\u003c/p>\n\u003cul>\n\u003cli>Click a row to open its session. A scheduled-task entry also jumps to its session if it has one; otherwise it opens the scheduled tasks page.\u003c/li>\n\u003cli>Keyboard: \u003ccode>j\u003c/code>/\u003ccode>k\u003c/code> (or \u003ccode>↓\u003c/code>/\u003ccode>↑\u003c/code>) move the selection and \u003ccode>Enter\u003c/code> opens it.\u003c/li>\n\u003cli>\u003cstrong>Mark all read\u003c/strong> (「全部已读」) marks the unread, error, and interrupted sessions in the current list as read. Pending approvals, questions, running sessions, and scheduled-task entries are not affected.\u003c/li>\n\u003cli>Scheduled-task entries have \u003cstrong>Done\u003c/strong> (「完成」) and \u003cstrong>Ignore\u003c/strong> (「忽略」) buttons.\u003c/li>\n\u003cli>The refresh button at the top right reloads, and the gear button opens \u003cstrong>Inbox settings\u003c/strong> (「收件箱设置」).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/automation-inbox.png\" alt=\"Inbox page with category tabs and list\"/>\u003c/p>\n\u003ch3 id=\"smart-to-dos\">Smart to-dos\u003c/h3>\n\u003cp>You never type to-dos into the inbox. When a session raises an approval request, asks a question, errors, is interrupted, or is waiting for your review, the app collects it automatically, and it disappears once resolved. Adjust this in \u003cstrong>Settings → Inbox\u003c/strong> (「收件箱」):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Collect to-dos automatically\u003c/strong> (「自动收集待办」)\u003c/td>\u003ctd>Collect the items above automatically\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Auto-remove after (hours)\u003c/strong> (「自动移出时间（小时）」)\u003c/td>\u003ctd>Sessions with no activity for longer than this leave the inbox; sessions awaiting a reply are exempt. Accepts 1–720\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>Archived sessions and sessions not created by omp-workspace never appear in the inbox.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"collect-ideas\">Collect ideas\u003c/h2>\n\u003cp>Idea collection is a lightweight scratchpad: jot down an idea or a bug now and hand it to an agent later. Click the lightbulb icon (\u003cstrong>Idea collection\u003c/strong>, 「想法收集」) on the right of the center title bar. The icon turns amber when items are pending or awaiting review.\u003c/p>\n\u003ch3 id=\"capture\">Capture\u003c/h3>\n\u003cul>\n\u003cli>Type into the \u003cstrong>Jot down an idea\u003c/strong> box (「记一条想法」) at the top of the panel, choose the kind \u003cstrong>Idea\u003c/strong> (「想法」) or \u003cstrong>Bug\u003c/strong> (「缺陷」), and press \u003ccode>Enter\u003c/code>.\u003c/li>\n\u003cli>Click \u003cstrong>Add image\u003c/strong>, or paste or drag images in.\u003c/li>\n\u003cli>Tick \u003cstrong>Attach current session\u003c/strong> (「附带当前会话」) to store the current session as a reference.\u003c/li>\n\u003cli>\u003cstrong>Project\u003c/strong> (「归属项目」) chooses which project the item belongs to: \u003cstrong>Follow current session\u003c/strong>, a specific project, or \u003cstrong>No project\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"global-quick-capture\">Global quick capture\u003c/h3>\n\u003cp>Press the global shortcut from any app to pop up the \u003cstrong>Add to inbox box\u003c/strong> (「记到收集箱」) window. Set the shortcut in \u003cstrong>Settings → General → Shortcuts → Quick capture shortcut\u003c/strong> (「快速记录快捷键」): click the button and press a new combination. Clearing it disables the shortcut, and it must include one of \u003ccode>⌘\u003c/code> / \u003ccode>⌃\u003c/code> / \u003ccode>⌥\u003c/code> / \u003ccode>⇧\u003c/code> (F keys excepted).\u003c/p>\n\u003ch3 id=\"organize-and-dispatch\">Organize and dispatch\u003c/h3>\n\u003cp>The panel is divided into tabs by status: \u003cstrong>Pending\u003c/strong> (「待处理」), \u003cstrong>Running\u003c/strong> (「运行中」), \u003cstrong>In review\u003c/strong> (「待验收」), \u003cstrong>Finished\u003c/strong> (「已结束」), and \u003cstrong>Trash\u003c/strong> (「废纸篓」). Search at the top right, and use \u003cstrong>Filter by project\u003c/strong> (「按项目筛选」) to switch between \u003cstrong>All projects\u003c/strong> and a single project.\u003c/p>\n\u003cp>Each item supports:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Fill composer\u003c/strong> (「填入输入框」)\u003c/td>\u003ctd>Appends it to the current session&#x27;s composer (select a session first)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Dispatch\u003c/strong> (「派发」)\u003c/td>\u003ctd>Opens the \u003cstrong>Dispatch to agent\u003c/strong> (「派给 Agent」) dialog: choose an \u003cstrong>Existing session\u003c/strong> or \u003cstrong>Start a new session\u003c/strong>, click \u003cstrong>Next\u003c/strong>, then confirm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Done\u003c/strong> / \u003cstrong>Put back\u003c/strong> (「完成」/「放回」)\u003c/td>\u003ctd>Mark it finished, or return it to pending\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Edit, delete\u003c/td>\u003ctd>Delete moves the item to Trash first, with an \u003cstrong>Undo\u003c/strong> toast\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>You can select multiple items for batch actions (\u003cstrong>Select all\u003c/strong>, \u003cstrong>Fill composer\u003c/strong>, \u003cstrong>Dispatch\u003c/strong>, \u003cstrong>Done\u003c/strong>, \u003cstrong>Put back\u003c/strong>, \u003cstrong>Delete\u003c/strong>). Items already dispatched are never sent twice, and failures can be retried with \u003cstrong>Retry\u003c/strong>.\u003c/p>\n\u003cp>Items in Trash are kept for 7 days and then deleted for good. You can also \u003cstrong>Restore\u003c/strong>, \u003cstrong>Delete permanently\u003c/strong>, or \u003cstrong>Empty trash\u003c/strong>.\u003c/p>\n\u003cp>\u003cimg src=\"images/automation-ideas-panel.png\" alt=\"Idea collection panel\"/>\u003c/p>\n\u003ch2 id=\"manage-skills-and-extensions\">Manage skills and extensions\u003c/h2>\n\u003cp>Click \u003cstrong>Skills management\u003c/strong> (「Skills 管理」) in the sidebar. The page has two tabs: \u003cstrong>My skills\u003c/strong> (「我的 Skill」) and \u003cstrong>Extensions\u003c/strong> (「扩展」).\u003c/p>\n\u003ch3 id=\"skills\">Skills\u003c/h3>\n\u003cp>A skill is a \u003ccode>SKILL.md\u003c/code> in a folder; the model decides when to invoke it from its \u003ccode>description\u003c/code>. omp-workspace discovers skills in two places:\u003c/p>\n\u003cul>\n\u003cli>Global: \u003ccode>~/.omp/agent/skills\u003c/code>\u003c/li>\n\u003cli>Project: \u003ccode>.omp/skills\u003c/code> inside a project\u003c/li>\n\u003c/ul>\n\u003cp>Summary cards at the top show \u003cstrong>All skills\u003c/strong>, \u003cstrong>Recently active\u003c/strong>, \u003cstrong>Gathering dust\u003c/strong> (zero triggers in the time window), and \u003cstrong>Problems\u003c/strong>. The \u003cstrong>Always-on context usage\u003c/strong> (「常驻上下文占用」) bar estimates how much context all skill descriptions consume and warns when it exceeds the suggested limit; the further over, the higher the fixed per-turn cost.\u003c/p>\n\u003cp>The list supports:\u003c/p>\n\u003cul>\n\u003cli>Search, plus filters by source (\u003cstrong>Global\u003c/strong>, \u003cstrong>Project\u003c/strong>) and state (\u003cstrong>Active\u003c/strong>, \u003cstrong>Not triggered\u003c/strong>, \u003cstrong>Problems\u003c/strong>, \u003cstrong>Disabled\u003c/strong>).\u003c/li>\n\u003cli>Sorting \u003cstrong>by trigger count\u003c/strong>, \u003cstrong>by last triggered\u003c/strong>, or \u003cstrong>by name\u003c/strong>. Trigger counts include automatic model invocations and manual \u003ccode>/skill:\u003c/code> calls.\u003c/li>\n\u003cli>A &quot;N copies&quot; badge when several skills share a name; the one with the highest priority takes effect.\u003c/li>\n\u003c/ul>\n\u003cp>&quot;Problems&quot; covers three cases: \u003cstrong>Missing description\u003c/strong>, \u003cstrong>Description too long\u003c/strong> (over 1024 characters; truncated when injected into the system prompt), and \u003cstrong>Unreadable\u003c/strong>.\u003c/p>\n\u003cp>Per-row actions:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Enable switch\u003c/td>\u003ctd>Writes to the OMP config and \u003cstrong>takes effect for new sessions\u003c/strong>; it deletes no files and does not affect running conversations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Reveal in Finder\u003c/strong>\u003c/td>\u003ctd>Opens the skill&#x27;s location\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Move to Trash\u003c/strong>\u003c/td>\u003ctd>Moves the whole skill folder to the Trash; restorable from there\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>View details\u003c/strong>\u003c/td>\u003ctd>Opens a drawer with install location, \u003ccode>SKILL.md\u003c/code> path, trigger stats, problems, and the document\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Use in current session\u003c/strong> (「在当前会话中使用」) in the drawer inserts \u003ccode>/skill:name\u003c/code> into the current session&#x27;s composer. If the skill is disabled, it inserts a temporary &quot;read this skill file&quot; instruction instead. Select a session in the sidebar first.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>If the switch is greyed out, the whole class of skills has been turned off in settings (for example \u003ccode>skills.enabled = false\u003c/code>, a source switch, or an ignore rule). Hover to see which one.\u003c/p>\n\u003c/blockquote>\n\u003cp>\u003cimg src=\"images/automation-skills-list.png\" alt=\"Skills management page with summary cards and list\"/>\u003c/p>\n\u003ch3 id=\"extensions\">Extensions\u003c/h3>\n\u003cp>The \u003cstrong>Extensions\u003c/strong> tab lists OMP native extensions with name, source, path, and state. Extensions can hook into tool calls and the message stream. Enabling and disabling is synced through the OMP config key \u003ccode>disabledExtensions\u003c/code> and applied when a session starts. Use \u003cstrong>Disable extension\u003c/strong> / \u003cstrong>Enable extension\u003c/strong> in the details to toggle one.\u003c/p>\n\u003cp>For model, plugin, and MCP server configuration, see \u003ca href=\"#/en/05-settings-and-models\">Settings and models\u003c/a>.\u003c/p>"},{"slug":"05-settings-and-models","title":"Settings and models","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-settings-nav.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-provider-dialog.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-quota-overview.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-role-assignments.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-model-replace-preview.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-templates-rules.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/settings-and-models-privacy-library.png\"/>\u003ch1 id=\"settings-and-models\">Settings and models\u003c/h1>\n\u003cblockquote>\n\u003cp>Use \u003cstrong>Settings\u003c/strong> (「设置」) to configure providers, model roles, MCP servers, plugins, the privacy library and omp options. When many places need a new model, use bulk replace and templates to change them in one step.\u003c/p>\n\u003c/blockquote>\n\u003cp>You can:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/open-the-settings-page\">Browse or search\u003c/a> every setting by category\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/configure-model-providers\">Add API keys, sign in to subscription accounts and check quota\u003c/a> under \u003cstrong>Models and providers\u003c/strong>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/choose-a-model-for-each-purpose\">Decide which model each role uses\u003c/a>: main, lightweight, sub-agents and more\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/replace-models-in-bulk\">Replace one model with another everywhere\u003c/a>, with undo\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/use-templates-and-quota-based-auto-switching\">Save role-to-model presets and switch them automatically\u003c/a> when quota runs low\u003c/li>\n\u003cli>Configure \u003ca href=\"#/en/05-settings-and-models/set-fallback-models-and-context-windows\">fallback models, retries and context windows\u003c/a>\u003c/li>\n\u003cli>Connect \u003ca href=\"#/en/05-settings-and-models/manage-mcp-servers\">MCP servers\u003c/a> and \u003ca href=\"#/en/05-settings-and-models/manage-plugins\">plugins\u003c/a>\u003c/li>\n\u003cli>Keep passwords and tokens out of prompts with the \u003ca href=\"#/en/05-settings-and-models/protect-sensitive-data-with-the-privacy-library\">privacy library\u003c/a>\u003c/li>\n\u003cli>Tune the rest in \u003ca href=\"#/en/05-settings-and-models/adjust-omp-settings\">omp settings\u003c/a>, and \u003ca href=\"#/en/05-settings-and-models/back-up-restore-and-reset\">back up or reset\u003c/a> your settings\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is in Simplified Chinese. On the first mention in each section, labels are written as \u003cstrong>English name\u003c/strong> (「中文原文」) so you can find them on screen.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"open-the-settings-page\">Open the settings page\u003c/h2>\n\u003cp>Click \u003cstrong>Settings\u003c/strong> (「设置」) at the bottom of the sidebar, or run \u003ccode>/settings\u003c/code> in the composer. Settings open in the center area. Click \u003cstrong>Settings\u003c/strong> again to go back.\u003c/p>\n\u003cp>The left side is category navigation; the right side shows the selected category:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Pages\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>General\u003c/strong> (「常规」)\u003c/td>\u003ctd>\u003cstrong>General\u003c/strong> (「通用」), \u003cstrong>Storage\u003c/strong> (「存储空间」), \u003cstrong>Appearance\u003c/strong> (「外观」), \u003cstrong>Notifications\u003c/strong> (「通知」), \u003cstrong>Privacy\u003c/strong> (「隐私」), \u003cstrong>Version and updates\u003c/strong> (「版本与更新」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Models\u003c/strong> (「模型」)\u003c/td>\u003ctd>\u003cstrong>Models and providers\u003c/strong> (「模型与供应商」), \u003cstrong>Model roles\u003c/strong> (「模型角色」), \u003cstrong>Thinking and sampling\u003c/strong> (「思考与采样」), \u003cstrong>Helper models\u003c/strong> (「辅助模型」), \u003cstrong>Fallback models and retries\u003c/strong> (「备用模型与重试」), \u003cstrong>Context window\u003c/strong> (「上下文窗口」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Sessions\u003c/strong> (「会话」)\u003c/td>\u003ctd>\u003cstrong>Sessions\u003c/strong> (「会话」), \u003cstrong>Inbox\u003c/strong> (「收件箱」), \u003cstrong>Session checkup\u003c/strong> (「会话体检」), \u003cstrong>Rule files\u003c/strong> (「规则文件」), \u003cstrong>System prompt composition\u003c/strong> (「系统提示词构成」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Agent capabilities\u003c/strong> (「Agent 能力」)\u003c/td>\u003ctd>\u003cstrong>Tools\u003c/strong> (「工具」), \u003cstrong>File access\u003c/strong> (「文件读写」), \u003cstrong>Command line\u003c/strong> (「命令行」), \u003cstrong>Sub-agents\u003c/strong> (「子代理」), \u003cstrong>Memory\u003c/strong> (「记忆」), \u003cstrong>Skills and commands\u003c/strong> (「技能与命令」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Connections\u003c/strong> (「连接」)\u003c/td>\u003ctd>\u003cstrong>Mobile access\u003c/strong> (「手机访问」), \u003cstrong>MCP servers\u003c/strong> (「MCP 服务器」), \u003cstrong>Plugins\u003c/strong> (「插件」), \u003cstrong>Web search\u003c/strong> (「联网搜索」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Advanced\u003c/strong> (「高级」)\u003c/td>\u003ctd>\u003cstrong>Advanced\u003c/strong> (「高级」)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Type in the \u003cstrong>Search settings\u003c/strong> (「搜索设置」) box at the top of the navigation (\u003ccode>⌘F\u003c/code> focuses it, \u003ccode>Esc\u003c/code> clears it) to list matching settings page by page. If nothing matches, the app suggests a different keyword.\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-settings-nav.png\" alt=\"Settings page: category navigation on the left and the search box on top\"/>\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>There are two kinds of settings: the app&#x27;s own settings (stored in the app data directory, see \u003ca href=\"#/en/07-shortcuts-and-troubleshooting/data-locations\">Data locations\u003c/a>) and omp&#x27;s configuration (stored in omp&#x27;s \u003ccode>config.yml\u003c/code>, which omp also reads when you use it in a terminal). Most changes apply only to \u003cstrong>sessions started afterwards\u003c/strong>; the page says so where it matters.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"configure-model-providers\">Configure model providers\u003c/h2>\n\u003cp>Open \u003cstrong>Settings ▸ Models and providers\u003c/strong> (「模型与供应商」). The page has two tabs: \u003cstrong>Interfaces and keys\u003c/strong> (「接口与密钥」) and \u003cstrong>Subscriptions and quota\u003c/strong> (「订阅与配额」). \u003cstrong>Edit raw config files\u003c/strong> (「编辑原始配置文件」) in the top-right corner lets you edit omp&#x27;s \u003ccode>models.yml\u003c/code>, \u003ccode>config.yml\u003c/code> and \u003ccode>.env\u003c/code> directly. YAML syntax is validated before saving. These files may contain API keys, so do not share screenshots of them.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>A provider is a service that supplies models. Once configured, its models are available in new sessions.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"add-a-provider\">Add a provider\u003c/h3>\n\u003col>\n\u003cli>On the \u003cstrong>Interfaces and keys\u003c/strong> tab, click \u003cstrong>Add provider\u003c/strong> (「添加供应商」).\u003c/li>\n\u003cli>Under \u003cstrong>Start from a preset\u003c/strong> (「从预设开始」), pick a preset (built in: OpenAI, Anthropic, Google Gemini, DeepSeek, Moonshot Kimi, OpenRouter, SiliconFlow, Groq, Mistral, xAI, Ollama, and \u003cstrong>Custom OpenAI compatible\u003c/strong> (「自定义 OpenAI 兼容」)), or fill in the fields yourself.\u003c/li>\n\u003cli>Fill in \u003cstrong>Name\u003c/strong> (「名称」), \u003cstrong>Environment variable name\u003c/strong> (「环境变量名」) and \u003cstrong>Key\u003c/strong> (「密钥」). Expand \u003cstrong>Advanced settings\u003c/strong> (「进阶设置」) to change the \u003cstrong>Identifier\u003c/strong> (「标识符」), the \u003cstrong>Protocol\u003c/strong> (「协议」: \u003cstrong>OpenAI compatible\u003c/strong>, \u003cstrong>OpenAI Responses\u003c/strong>, \u003cstrong>Anthropic\u003c/strong>, \u003cstrong>Gemini\u003c/strong>, \u003cstrong>Ollama\u003c/strong>), the \u003cstrong>Default context window (tokens)\u003c/strong> and the \u003cstrong>Default output limit (tokens)\u003c/strong>.\u003c/li>\n\u003cli>Under \u003cstrong>Model list\u003c/strong> (「模型列表」), click \u003cstrong>Add model\u003c/strong> (「添加模型」) to type model IDs, or \u003cstrong>Fetch model list\u003c/strong> (「获取模型列表」) to pull them from the provider&#x27;s API. Select models, then choose \u003cstrong>Append to list\u003c/strong> (「追加到列表」) or \u003cstrong>Replace current list\u003c/strong> (「覆盖当前列表」). A model whose context window or output limit is empty inherits the provider defaults above.\u003c/li>\n\u003cli>Optionally set a \u003cstrong>Default model\u003c/strong> (「默认模型」) and a \u003cstrong>Note\u003c/strong> (「备注」), then click \u003cstrong>Save and encrypt key\u003c/strong> (「保存并加密密钥」).\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/settings-and-models-provider-dialog.png\" alt=\"Add provider dialog\"/>\u003c/p>\n\u003cp>After saving, select this provider&#x27;s models in new sessions as \u003ccode>ompws-&lt;identifier&gt;/&lt;model ID&gt;\u003c/code>.\u003c/p>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>Keys are encrypted (AES-256-GCM) with a master key held in the macOS Keychain and stored in \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>. Plaintext appears only in memory and is never written to the database or logs.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"import-export-and-sign-in\">Import, export and sign in\u003c/h3>\n\u003cp>Click \u003cstrong>Import / export\u003c/strong> (「导入 / 导出」):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Action\u003c/th>\u003cth>What it does\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Import OMP providers in one click\u003c/strong> (「一键导入 OMP 供应商」)\u003c/td>\u003ctd>Imports providers that already have keys configured in omp into the workbench, encrypted\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Import from .env file\u003c/strong> (「从 .env 文件导入」)\u003c/td>\u003ctd>Paste several \u003ccode>NAME=key\u003c/code> lines. Recognised variables are matched to presets automatically; check the preview, then confirm\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Copy .env text\u003c/strong> (「复制 .env 文本」)\u003c/td>\u003ctd>Copies configured keys as a plaintext \u003ccode>.env\u003c/code> to the clipboard. Clear the clipboard after pasting\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>OAuth sign-in\u003c/strong> (「OAuth 登录」) is for subscription accounts. Choose a provider that supports sign-in; the app opens your browser through omp&#x27;s native authorization flow, writes the credentials to omp&#x27;s own credential store and refreshes the list. A few providers must be signed in from a terminal: run \u003ccode>omp\u003c/code>, then use \u003ccode>/login\u003c/code>.\u003c/p>\n\u003ch3 id=\"manage-the-provider-list\">Manage the provider list\u003c/h3>\n\u003cp>Use the search box to filter by provider name, address or model. For each provider you can:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Test connection\u003c/strong> (「测试连接」) and see \u003cstrong>Connection OK\u003c/strong> (「连接正常」) or \u003cstrong>Connection failed\u003c/strong> (「连接失败」)\u003c/li>\n\u003cli>Expand a row to see its models and \u003cstrong>Test\u003c/strong> (「测试」) a single model (the provider must be imported into the workbench first)\u003c/li>\n\u003cli>\u003cstrong>Edit\u003c/strong> (「编辑」) or \u003cstrong>Delete\u003c/strong> (「删除」). Delete removes only the workbench&#x27;s private copy and encrypted key; omp&#x27;s global configuration (\u003ccode>models.yml\u003c/code>, \u003ccode>agent.db\u003c/code>) is untouched\u003c/li>\n\u003cli>\u003cstrong>Re-import\u003c/strong> (「重新导入」) keys from omp&#x27;s configuration to refresh the workbench copy\u003c/li>\n\u003cli>Use the switch to enable or disable the provider; when enabled, its key is injected into new sessions\u003c/li>\n\u003c/ul>\n\u003cp>Providers managed by omp (no API key to import, such as subscription accounts) do not need importing.\u003c/p>\n\u003ch3 id=\"check-subscriptions-and-quota\">Check subscriptions and quota\u003c/h3>\n\u003cp>On the \u003cstrong>Subscriptions and quota\u003c/strong> tab, \u003cstrong>Quota and usage overview\u003c/strong> (「配额与用量概览」) summarizes authorized subscription accounts: used percentage and reset time for each window, per provider. Click \u003cstrong>View details\u003c/strong> (「查看明细」) for each account&#x27;s usage, overage balance and reset coupons. Click \u003cstrong>Refresh\u003c/strong> (「刷新」) to fetch again; the data comes from omp.\u003c/p>\n\u003cp>With no accounts, the page tells you to run \u003ccode>omp login\u003c/code> in a terminal. Plain API keys are billed per use and are not shown here; configure them on \u003cstrong>Interfaces and keys\u003c/strong>.\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-quota-overview.png\" alt=\"Subscriptions and quota overview\"/>\u003c/p>\n\u003ch2 id=\"choose-a-model-for-each-purpose\">Choose a model for each purpose\u003c/h2>\n\u003cp>Open \u003cstrong>Settings ▸ Model roles\u003c/strong> (「模型角色」). omp splits usage into roles, and each role can use a different model. \u003cstrong>Configuration scope\u003c/strong> (「配置范围」) at the top decides where changes are written:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Scope\u003c/th>\u003cth>Written to\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Global\u003c/strong> (「全局」)\u003c/td>\u003ctd>omp&#x27;s global config\u003c/td>\u003ctd>Applies to all projects\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Project\u003c/strong> (「项目」)\u003c/td>\u003ctd>The selected project&#x27;s \u003ccode>.omp/config.yml\u003c/code>\u003c/td>\u003ctd>Applies to that project only; roles you leave unset inherit the global value. Add a project in the sidebar or open a session first\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"role-assignments\">Role assignments\u003c/h3>\n\u003cp>The \u003cstrong>Role assignments\u003c/strong> (「角色分配」) table lists roles and sub-agents together:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Role\u003c/th>\u003cth>Used for\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Main model\u003c/strong> (「主力模型」, \u003ccode>default\u003c/code>)\u003c/td>\u003ctd>Default for sessions: main conversation and tool calls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Fast model\u003c/strong> (「快速模型」, \u003ccode>smol\u003c/code>)\u003c/td>\u003ctd>Lightweight tasks and quick responses\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Deep model\u003c/strong> (「深度模型」, \u003ccode>slow\u003c/code>)\u003c/td>\u003ctd>Deep reasoning; slower but more careful\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Vision model\u003c/strong> (「视觉模型」, \u003ccode>vision\u003c/code>)\u003c/td>\u003ctd>Images, screenshots and other multimodal input\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Planning model\u003c/strong> (「规划模型」, \u003ccode>plan\u003c/code>)\u003c/td>\u003ctd>Plan mode and solution design\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Commit message\u003c/strong> (「提交信息」, \u003ccode>commit\u003c/code>), \u003cstrong>Light background\u003c/strong> (「轻量后台」, \u003ccode>tiny\u003c/code>), \u003cstrong>Memory\u003c/strong> (「记忆」, \u003ccode>memory\u003c/code>), \u003cstrong>Sub-agent\u003c/strong> (「子代理」, \u003ccode>task\u003c/code>), \u003cstrong>Advisor\u003c/strong> (「顾问」, \u003ccode>advisor\u003c/code>)\u003c/td>\u003ctd>The matching background tasks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Image generation\u003c/strong>, \u003cstrong>Web search\u003c/strong>, \u003cstrong>Speech synthesis\u003c/strong>, \u003cstrong>Speech recognition\u003c/strong>, \u003cstrong>Judge\u003c/strong> (「图像生成」「网络搜索」「语音合成」「语音识别」「判断」)\u003c/td>\u003ctd>Models used by dedicated services\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Each row has two mutually exclusive ways to set a value:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Dedicated model\u003c/strong> (「专属模型」): pick a model (optionally with a thinking level); the model name is written\u003c/li>\n\u003cli>\u003cstrong>Reuse role model\u003c/strong> (「复用角色模型」): pick another role; \u003ccode>@role-name\u003c/code> is written, so the row always follows that role&#x27;s current model\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Clear\u003c/strong> (「清除」), or selecting the default option, removes the entry and leaves the decision to the lower-priority layers.\u003c/p>\n\u003ch3 id=\"which-model-a-sub-agent-uses\">Which model a sub-agent uses\u003c/h3>\n\u003cp>For sub-agents, the app looks top to bottom and the first layer with a value wins. Click the ⓘ at the end of the row (\u003cstrong>View fields and priority\u003c/strong>, 「查看读写的字段和优先级」) to see each layer&#x27;s current value and which one is marked \u003cstrong>✓ In use\u003c/strong> (「✓ 正在使用」):\u003c/p>\n\u003col>\n\u003cli>\u003ccode>task.agentModelOverrides.&lt;name&gt;\u003c/code>: the \u003cstrong>Dedicated model\u003c/strong> or \u003cstrong>Reuse role model\u003c/strong> set on this page\u003c/li>\n\u003cli>The \u003ccode>model:\u003c/code> field in the sub-agent&#x27;s definition file (for built-in sub-agents this is omp&#x27;s factory definition; this page does not change it)\u003c/li>\n\u003cli>\u003ccode>modelRoles.task\u003c/code>: the model of the \u003cstrong>Sub-agent\u003c/strong> role\u003c/li>\n\u003cli>The model the current session is using\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>In project scope, if the global config already overrides the same sub-agent, the global value wins and the project value has no effect. The ⓘ panel points this out.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"dedicated-model-for-side-chat\">Dedicated model for side chat\u003c/h3>\n\u003cp>The \u003cstrong>Side chat\u003c/strong> (「侧边对话」) card at the bottom has a switch, \u003cstrong>Dedicated model for side chat\u003c/strong> (「侧边对话专用模型」). When off, side chats inherit the main conversation&#x27;s model and thinking level. When on, newly created side chats use the model you pick, and you can choose its thinking level to the right of the model. You can still change the model temporarily inside the side-chat panel.\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-role-assignments.png\" alt=\"Model roles page: the role assignments table\"/>\u003c/p>\n\u003ch2 id=\"replace-models-in-bulk\">Replace models in bulk\u003c/h2>\n\u003cp>When a model is retired, you switch providers or you want to upgrade everywhere, you do not need to edit each place. On the \u003cstrong>Model roles\u003c/strong> page click \u003cstrong>Bulk replace\u003c/strong> (「批量替换」) to open the \u003cstrong>Bulk replace models\u003c/strong> (「批量替换模型」) dialog. It swaps every reference to one model for another model. It covers roles and sub-agent overrides in global and project configs, fallback chains, app settings (new-session model, side-chat model, session-checkup model) and scheduled tasks.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>Project configs are covered only for projects added in this desktop app. Locations that can
