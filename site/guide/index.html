ing Started\u003c/h1>\n\u003cblockquote>\n\u003cp>omp-workspace is a community desktop workbench for OMP AI agents: start, view, debug, and manage all your agent sessions and workspace code in a modern native window. This chapter covers the architecture, prerequisites, window layout, and starting your first session.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/01-getting-started/understand-omp-workspace\">Understand the role of omp-workspace\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/prerequisites\">Check prerequisites and launch the app\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/window-layout\">Navigate the primary window layout\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/start-your-first-session\">Start your first agent session\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/01-getting-started/configure-model-providers\">Configure model providers and credentials\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"understand-omp-workspace\">Understand omp-workspace\u003c/h2>\n\u003cp>omp-workspace is a native desktop shell (built with Tauri 2 + React 19) for the OMP command-line agent. It works seamlessly alongside the CLI rather than replacing it:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Bidirectional Session Sync\u003c/strong>: When the app launches, it automatically scans \u003ccode>~/.omp/agent/sessions/\u003c/code>. Sessions started in your terminal via \u003ccode>omp\u003c/code> appear in the sidebar; sessions created in the desktop app can be resumed in the terminal.\u003c/li>\n\u003cli>\u003cstrong>Git Worktree Isolation\u003c/strong>: Native support for Git worktrees. Multiple agents can work on separate branches of the same repository simultaneously without file collisions.\u003c/li>\n\u003cli>\u003cstrong>Visual Chat &amp; Execution Tracing\u003c/strong>: Real-time streaming of model reasoning, code diffs, tool call cards, and human-in-the-loop approvals, complete with IME-safe type-to-focus and rich inline annotations.\u003c/li>\n\u003cli>\u003cstrong>Integrated Workspace Tools\u003c/strong>: Built-in file explorer, Markdown split-pane editor, multi-tab persistent terminal, Time Machine version snapshots, port monitor, and token heatmap diagnostics.\u003c/li>\n\u003cli>\u003cstrong>Automation &amp; Remote Access\u003c/strong>: Scheduled background tasks, an action-oriented Inbox, a global ideas backlog, and mobile remote pairing via local Wi-Fi, Cloudflare Tunnels, or direct IPv6.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"prerequisites\">Prerequisites\u003c/h2>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Requirement\u003c/th>\u003cth>Details\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Operating System\u003c/td>\u003ctd>macOS (uses macOS Keychain for secure credential encryption and supports Finder integrations)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OMP CLI\u003c/td>\u003ctd>\u003ccode>omp\u003c/code> should be installed and accessible in your shell\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Model Credentials\u003c/td>\u003ctd>At least one valid provider (API key or OAuth subscription account), see \u003ca href=\"#/en/01-getting-started/configure-model-providers\">Configure model providers\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Building from Source\u003c/td>\u003ctd>Node.js (&gt;=18), \u003ccode>pnpm\u003c/code>, and Rust (Cargo) toolchain\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The app starts sessions using the command defined under \u003cstrong>Settings ▸ Advanced ▸ omp program path\u003c/strong>, which defaults to \u003ccode>omp\u003c/code>.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>If \u003ccode>omp\u003c/code> is located in a custom path or specific virtual environment, set its absolute path in \u003cstrong>Settings ▸ Advanced ▸ omp program path\u003c/strong>. Check \u003cstrong>Settings ▸ Version and updates\u003c/strong> to verify detection.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"installation--launch\">Installation &amp; Launch\u003c/h2>\n\u003cp>To run from source or build the release bundle:\u003c/p>\n\u003cpre>\u003ccode class=\"hljs language-bash\">pnpm install        \u003cspan class=\"hljs-comment\"># Install frontend and workspace dependencies\u003c/span>\npnpm tauri dev      \u003cspan class=\"hljs-comment\"># Start dev mode (builds Rust core and launches Vite)\u003c/span>\npnpm build:app      \u003cspan class=\"hljs-comment\"># Typecheck, build frontend, and package native app (.app / .dmg)\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>To run a completely isolated instance without touching existing data, use \u003ccode>pnpm dev:preview\u003c/code>. It uses a dedicated port and stores data in \u003ccode>~/.omp-workspace-dev\u003c/code>. See \u003ca href=\"#/en/07-shortcuts-and-troubleshooting/data-locations\">Data locations\u003c/a>.\u003c/p>\n\u003c/blockquote>\n\u003cp>On initial launch, the app will:\u003c/p>\n\u003col>\n\u003cli>Initialize local configuration and SQLite storage under \u003ccode>~/.omp-workspace/\u003c/code>.\u003c/li>\n\u003cli>Scan and index historical sessions from \u003ccode>~/.omp/agent/sessions/\u003c/code>.\u003c/li>\n\u003cli>Restore your last active session, or present the space onboarding view.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"window-layout\">Window Layout\u003c/h2>\n\u003cp>The window is structured into four functional areas:\u003c/p>\n\u003cp>\u003cimg src=\"images/getting-started-layout.png\" alt=\"Layout overview: sidebar, central chat, right panel, and bottom status bar\"/>\u003c/p>\n\u003ch3 id=\"1-left-sidebar\">1. Left Sidebar\u003c/h3>\n\u003cp>Manage sessions and spaces; press \u003ccode>⌘B\u003c/code> to toggle.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Space Switcher\u003c/strong>: Displays the active space (Code, Work, Study, Research, or Universal). Each space maintains its own isolated projects and sessions.\u003c/li>\n\u003cli>\u003cstrong>Quick Links\u003c/strong>: Access \u003cstrong>Inbox\u003c/strong> (aggregating approvals, questions, and errors), \u003cstrong>Search\u003c/strong> (\u003ccode>⌘F\u003c/code>), \u003cstrong>New Session\u003c/strong> (\u003ccode>⌘N\u003c/code>), \u003cstrong>Schedules\u003c/strong>, and \u003cstrong>Skills\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Projects &amp; Worktrees\u003c/strong>: Local repositories with collapsible session trees, optionally grouped by Git worktree or branch.\u003c/li>\n\u003cli>\u003cstrong>Settings\u003c/strong>: Open preferences with the gear icon at the bottom (\u003ccode>⌘,\u003c/code>).\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"2-center-area-workbench\">2. Center Area (Workbench)\u003c/h3>\n\u003cp>The primary workspace:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Conversation Stream\u003c/strong>: Shows session title, status badge, model chip, message history, tool execution cards, approval forms, and composer.\u003c/li>\n\u003cli>\u003cstrong>Full-page Views\u003c/strong>: Opening Inbox, Schedules, Skills management, document editors, or Settings expands over the center area. Press \u003ccode>Esc\u003c/code> or \u003ccode>⌘[\u003c/code> to return.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3-right-panel-utility-drawer\">3. Right Panel (Utility Drawer)\u003c/h3>\n\u003cp>Multi-tab inspector; press \u003ccode>⌘J\u003c/code> to toggle. Click \u003ccode>+\u003c/code> to open tabs:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Side Chat\u003c/strong>: Lightweight secondary chats inheriting context without polluting the main thread.\u003c/li>\n\u003cli>\u003cstrong>Explorer\u003c/strong>: File tree navigation and fast file filtering.\u003c/li>\n\u003cli>\u003cstrong>Git\u003c/strong>: File diffs, stage &amp; commit, worktree management, and Time Machine snapshots.\u003c/li>\n\u003cli>\u003cstrong>Terminal\u003c/strong>: Multi-tab login shell with one-click quote-to-composer actions.\u003c/li>\n\u003cli>\u003cstrong>File Preview\u003c/strong>: Syntax-highlighted code viewer and Markdown renderer.\u003c/li>\n\u003cli>\u003cstrong>Services\u003c/strong>: Active port scanner with orphaned process cleanup.\u003c/li>\n\u003cli>\u003cstrong>Token Heatmap\u003c/strong>: Context breakdown and deep session diagnostics.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"4-bottom-status-bar\">4. Bottom Status Bar\u003c/h3>\n\u003cp>Global operational metrics:\u003c/p>\n\u003cul>\n\u003cli>Real-time turn and step counts, plus context cache hit rate.\u003c/li>\n\u003cli>\u003cstrong>Performance\u003c/strong>: Physical resident memory (footprint) of the app and helper processes.\u003c/li>\n\u003cli>\u003cstrong>OMP Version\u003c/strong>: Version check and hot update trigger.\u003c/li>\n\u003cli>\u003cstrong>Git Branch &amp; Zoom\u003c/strong>: Active branch name and UI scaling buttons.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"start-your-first-session\">Start Your First Session\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Select a Space\u003c/strong>: Choose \u003cstrong>Code\u003c/strong> for programming repositories, or \u003cstrong>Universal\u003c/strong> for general unattached inquiries.\u003c/li>\n\u003cli>\u003cstrong>Choose a Directory\u003c/strong>: Click \u003cstrong>Choose project folder\u003c/strong> to link your local codebase.\u003c/li>\n\u003cli>\u003cstrong>Type Your Goal\u003c/strong>: Click into the composer or use \u003cstrong>Type-to-focus\u003c/strong> (start typing when no dialog or text field is focused).\u003c/li>\n\u003cli>\u003cstrong>Press \u003ccode>Enter\u003c/code>\u003c/strong>: The agent will start streaming reasoning steps, generating diffs, and running tools.\u003c/li>\n\u003c/ol>\n\u003cp>Press \u003ccode>⌘N\u003c/code> at any time to open a new session in the current project. Empty drafts are automatically cleaned up if left blank.\u003c/p>\n\u003ch2 id=\"configure-model-providers\">Configure Model Providers\u003c/h2>\n\u003cp>To configure AI model access:\u003c/p>\n\u003cul>\n\u003cli>Open \u003cstrong>Settings ▸ Models and providers\u003c/strong>, click \u003cstrong>Add provider\u003c/strong> (presets for Anthropic, OpenAI, DeepSeek, Gemini, OpenRouter, Ollama, etc.), or use \u003cstrong>OAuth login\u003c/strong>.\u003c/li>\n\u003cli>Click \u003cstrong>Import / Export ▸ Import OMP providers\u003c/strong> to migrate credentials from your CLI setup in one click.\u003c/li>\n\u003cli>Type \u003ccode>/login\u003c/code> in the composer and press Enter to jump directly to the provider page.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>API keys are encrypted using the macOS Keychain master key (AES-256-GCM) and saved to \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>. Plaintext keys reside only in memory during requests.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"next-steps\">Next Steps\u003c/h2>\n\u003cul>\n\u003cli>Explore advanced composer strategies and commands: \u003ca href=\"#/en/02-sessions-and-chat\">Sessions and chat\u003c/a>\u003c/li>\n\u003cli>Work with parallel Git worktrees and the terminal: \u003ca href=\"#/en/03-workspace\">Workspace: files, Git, and terminal\u003c/a>\u003c/li>\n\u003cli>Review keyboard shortcuts and troubleshoot issues: \u003ca href=\"#/en/07-shortcuts-and-troubleshooting\">Shortcuts and troubleshooting\u003c/a>\u003c/li>\n\u003c/ul>"},{"slug":"02-sessions-and-chat","title":"Sessions and Chat","html":"\u003ch1 id=\"sessions-and-chat\">Sessions and Chat\u003c/h1>\n\u003cblockquote>\n\u003cp>Manage the session lifecycle, master composer concurrency and slash commands, and use side chats, inline annotations, and Git checkpoints to stay in control.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/spaces-and-sessions\">Organize spaces and sessions\u003c/a>: spaces, grouping, states, search, and archiving\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/start-new-sessions\">Start sessions in parallel worktrees\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/the-smart-composer\">Use the smart composer\u003c/a>: sending strategies, attachments, \u003ccode>@\u003c/code> file references, and \u003ccode>/\u003c/code> commands\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/inline-annotations\">Create inline annotations from code and messages\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/side-chats\">Run parallel side chats without context pollution\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/tool-execution-and-approvals\">Track tool execution and handle approval requests\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/context-window-and-compression\">Monitor context usage and compress on demand\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/02-sessions-and-chat/sharing-and-export\">Share and export conversations\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"spaces-and-sessions\">Spaces and Sessions\u003c/h2>\n\u003ch3 id=\"spaces\">Spaces\u003c/h3>\n\u003cp>The active space name is shown at the top of the left sidebar. Click to switch:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Space\u003c/th>\u003cth>Focus and Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Code\u003c/strong>\u003c/td>\u003ctd>Coding projects, structured by Git worktrees and branches\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Work\u003c/strong>\u003c/td>\u003ctd>General business tasks, draft writing, and project tracking\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Study\u003c/strong>\u003c/td>\u003ctd>Research papers, learning notes, and tutorials\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Research\u003c/strong>\u003c/td>\u003ctd>Long-form deep research and analytical tasks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Universal\u003c/strong>\u003c/td>\u003ctd>Ad-hoc chats unattached to any local project directory\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Each space keeps completely isolated projects and sessions. An active indicator appears next to spaces with ongoing agent tasks.\u003c/p>\n\u003ch3 id=\"session-lifecycle-and-status\">Session Lifecycle and Status\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Status\u003c/th>\u003cth>Icon / Badge\u003c/th>\u003cth>Meaning and Actions\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Running\u003c/strong>\u003c/td>\u003ctd>Spinning icon\u003c/td>\u003ctd>The agent is actively generating or running tools\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Waiting\u003c/strong>\u003c/td>\u003ctd>Blue &quot;Waiting&quot; badge\u003c/td>\u003ctd>Awaiting your approval for a tool or answer to a question\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Unreviewed\u003c/strong>\u003c/td>\u003ctd>Blue unread dot\u003c/td>\u003ctd>Turn completed and awaiting your review; right-click to accept &amp; archive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Idle\u003c/strong>\u003c/td>\u003ctd>None\u003c/td>\u003ctd>Waiting for new input\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Error\u003c/strong>\u003c/td>\u003ctd>Red solid dot\u003c/td>\u003ctd>Stopped due to an error; right-click to run diagnostics\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Interrupted\u003c/strong>\u003c/td>\u003ctd>Orange warning badge\u003c/td>\u003ctd>Process stopped unexpectedly; right-click &quot;Resume&quot; to continue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Suspended\u003c/strong>\u003c/td>\u003ctd>Grey sleep badge\u003c/td>\u003ctd>Suspended after being idle to save RAM; resumes instantly on input\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>External\u003c/strong>\u003c/td>\u003ctd>Terminal icon\u003c/td>\u003ctd>Running in CLI; right-click to &quot;Take over session&quot;\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"session-navigation-and-shortcuts\">Session Navigation and Shortcuts\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Search (\u003ccode>⌘F\u003c/code>)\u003c/strong>: Search across session titles, branches, worktree paths, models, and recent reply snippets.\u003c/li>\n\u003cli>\u003cstrong>Keyboard Navigation\u003c/strong>: In the list, press \u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code> to switch sessions, \u003ccode>←\u003c/code> / \u003ccode>→\u003c/code> to collapse or expand groups, \u003ccode>Delete\u003c/code> to archive, and \u003ccode>Shift+Delete\u003c/code> to permanently delete.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"start-new-sessions\">Start New Sessions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Standard Project Session\u003c/strong>: Click \u003cstrong>New Session\u003c/strong> or press \u003ccode>⌘N\u003c/code>. If left blank without sending, the draft is automatically discarded.\u003c/li>\n\u003cli>\u003cstrong>Parallel Worktree Session\u003c/strong>: Click \u003ccode>+\u003c/code> on a project header and choose \u003cstrong>Create in independent worktree\u003c/strong>. Specify the base branch (e.g., \u003ccode>main\u003c/code>) and a folder name. A dedicated Git worktree is provisioned under \u003ccode>&lt;project&gt;/.worktrees/&lt;name&gt;\u003c/code>, allowing multiple agents to code in parallel without branch conflicts.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"the-smart-composer\">The Smart Composer\u003c/h2>\n\u003ch3 id=\"type-to-focus--ime-safety\">Type-to-focus &amp; IME Safety\u003c/h3>\n\u003cp>Start typing anywhere on your keyboard, and keystrokes automatically route directly to the composer without requiring a mouse click, provided no dialog or editor has focus. IME composition is strictly respected.\u003c/p>\n\u003ch3 id=\"concurrency-and-dispatch-strategies\">Concurrency and Dispatch Strategies\u003c/h3>\n\u003cp>When the agent is already running a turn, you can configure how new messages are dispatched (configured in \u003cstrong>Settings ▸ Sessions ▸ Sending method\u003c/strong>):\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Steer (Default)\u003c/strong>: Injects your message into the active turn immediately, steering the agent mid-flight.\u003c/li>\n\u003cli>\u003cstrong>Queue\u003c/strong>: Holds the message in a queue and sends it sequentially once the current turn completes.\u003c/li>\n\u003cli>\u003cstrong>Interrupt\u003c/strong>: Stops the active turn immediately and starts a new one with your message.\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>Hold \u003ccode>⌥\u003c/code> when sending (e.g. \u003ccode>⌥Enter\u003c/code>) to invert the dispatch mode for that single message (e.g. switch Steer to Queue).\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"composer-add-menu--modes\">Composer Add Menu &amp; Modes\u003c/h3>\n\u003cp>Click \u003ccode>+\u003c/code> in the composer:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Plan Mode (\u003ccode>/plan\u003c/code>)\u003c/strong>: Requires the agent to produce a structured roadmap before executing changes.\u003c/li>\n\u003cli>\u003cstrong>Goal Mode (\u003ccode>/goal &lt;desc&gt;\u003c/code>)\u003c/strong>: Keeps a persistent objective pinned above the composer throughout the session.\u003c/li>\n\u003cli>\u003cstrong>Sketchpad\u003c/strong>: Vector drawing board for quick UI wireframes or architecture diagrams.\u003c/li>\n\u003cli>\u003cstrong>Attachments\u003c/strong>: Drag and drop images, logs, or select Finder items.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"-mentions---slash-commands\">\u003ccode>@\u003c/code> Mentions &amp; \u003ccode>/\u003c/code> Slash Commands\u003c/h3>\n\u003cul>\n\u003cli>Type \u003ccode>@\u003c/code> followed by filename characters to search and insert file references.\u003c/li>\n\u003cli>Type \u003ccode>/\u003c/code> to open the command palette: \u003ccode>/model\u003c/code>, \u003ccode>/compact\u003c/code>, \u003ccode>/shake\u003c/code>, \u003ccode>/btw\u003c/code>, \u003ccode>/plan\u003c/code>, \u003ccode>/goal\u003c/code>, \u003ccode>/stats\u003c/code>, \u003ccode>/login\u003c/code>, etc.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"inline-annotations\">Inline Annotations\u003c/h2>\n\u003cp>Highlight any text in messages, code blocks, diffs, or terminal output to display the floating toolbar:\u003c/p>\n\u003cul>\n\u003cli>Write an annotation and press \u003ccode>Enter\u003c/code>. Choose \u003cstrong>Main Chat\u003c/strong> or \u003cstrong>Side Chat\u003c/strong> as the target.\u003c/li>\n\u003cli>Annotations dock as structured chips above the composer, ensuring the agent receives precise line references.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"side-chats\">Side Chats\u003c/h2>\n\u003cp>Side chats act as disposable branches of the main conversation:\u003c/p>\n\u003cul>\n\u003cli>Click \u003ccode>+\u003c/code> ▸ \u003cstrong>New side chat\u003c/strong> in the right panel, or type \u003ccode>/btw your question\u003c/code>.\u003c/li>\n\u003cli>Fully inherits existing context without adding clutter to the main timeline.\u003c/li>\n\u003cli>Supports nested side chats (up to 3 levels). Click \u003cstrong>Hand back to parent session\u003c/strong> to summarize findings and insert them into the main composer.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"tool-execution-and-approvals\">Tool Execution and Approvals\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Step Cards\u003c/strong>: Tool executions display as dynamic cards (Reading → Read, Writing → Saved). Multi-step sequences fold neatly.\u003c/li>\n\u003cli>\u003cstrong>Approvals\u003c/strong>: Press \u003ccode>y\u003c/code> to approve for this turn only, or \u003ccode>n\u003c/code> to reject. Click &quot;Always allow in this session&quot; or &quot;Permanently allow&quot; for trusted tools.\u003c/li>\n\u003cli>\u003cstrong>Git Checkpoints &amp; One-Click Undo\u003c/strong>: When enabled in \u003cstrong>Settings ▸ Sessions ▸ Checkpoints\u003c/strong>, Git snapshots are taken before each turn. If code is modified incorrectly, click \u003cstrong>Undo this turn\u003c/strong> to restore files instantly.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"context-window-and-compression\">Context Window and Compression\u003c/h2>\n\u003cp>Click the context ring next to the composer to view token breakdown:\u003c/p>\n\u003cul>\n\u003cli>View usage by System Prompt, Tool Specs, MCP, Skills, AGENTS rules, and Chat History.\u003c/li>\n\u003cli>\u003cstrong>Compress (\u003ccode>/compact\u003c/code>)\u003c/strong>: Invokes a model to summarize past turns.\u003c/li>\n\u003cli>\u003cstrong>Shake (\u003ccode>/shake\u003c/code>)\u003c/strong>: Drops large tool outputs instantly without incurring model token costs.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"sharing-and-export\">Sharing and Export\u003c/h2>\n\u003cp>From the top toolbar \u003cstrong>Share &amp; Export\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Export Image\u003c/strong>: Select message turns and export a polished PNG screenshot.\u003c/li>\n\u003cli>\u003cstrong>Encrypted Link\u003c/strong>: Upload an end-to-end sanitized read-only link.\u003c/li>\n\u003cli>\u003cstrong>Markdown / HTML\u003c/strong>: Copy raw Markdown or export a standalone HTML file.\u003c/li>\n\u003cli>\u003cstrong>Scan QR Code\u003c/strong>: Connect your phone to view and reply on the local network.\u003c/li>\n\u003c/ul>"},{"slug":"03-workspace","title":"Workspace: Files, Git, and Terminal","html":"\u003ch1 id=\"workspace-files-git-and-terminal\">Workspace: Files, Git, and Terminal\u003c/h1>\n\u003cblockquote>\n\u003cp>Browse repository files, view and edit Markdown documents, run parallel Git worktrees, inspect code diffs, and work in multi-tab terminals without leaving the app.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/03-workspace/the-right-panel-tab-system\">Use the right panel tab system\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/file-explorer\">Explore and search workspace files\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/document-views-and-split-editing\">Preview, edit, and annotate documents\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/git-diffs-and-commits\">Review Git diffs and commit changes\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/parallel-git-worktrees\">Work with Git worktrees in parallel\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/time-machine-snapshots\">Use Time Machine to preview past revisions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/03-workspace/integrated-terminals\">Work in multi-tab persistent terminals\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"the-right-panel-tab-system\">The Right Panel Tab System\u003c/h2>\n\u003cp>The right panel consolidates engineering tools into a flexible tab bar. Press \u003ccode>⌘J\u003c/code> to toggle.\u003c/p>\n\u003cp>Click \u003ccode>+\u003c/code> at the end of the tab bar to add tabs:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Explorer\u003c/strong>: File tree with live search.\u003c/li>\n\u003cli>\u003cstrong>Git\u003c/strong>: Diffs, staging, worktrees, branches, and commit history.\u003c/li>\n\u003cli>\u003cstrong>Terminal\u003c/strong>: Interactive command line supporting multiple tabs.\u003c/li>\n\u003cli>\u003cstrong>File Preview\u003c/strong>: Code viewer and Markdown renderer.\u003c/li>\n\u003cli>\u003cstrong>Side Chat\u003c/strong>: Secondary conversation threads.\u003c/li>\n\u003cli>\u003cstrong>Services\u003c/strong>: Active port scanner with orphan process cleanup.\u003c/li>\n\u003cli>\u003cstrong>Token Heatmap\u003c/strong>: Context breakdown and session health check.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"file-explorer\">File Explorer\u003c/h2>\n\u003cp>Open the \u003cstrong>Explorer\u003c/strong> tab to inspect the workspace tree:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Quick Filter (\u003ccode>⌘F\u003c/code>)\u003c/strong>: Filter files instantly by typing keywords.\u003c/li>\n\u003cli>\u003cstrong>Context Menu\u003c/strong>: Right-click any file to \u003cstrong>Show in Finder\u003c/strong>, \u003cstrong>Copy Relative Path\u003c/strong>, or \u003cstrong>Refresh\u003c/strong>. Single-clicking any file opens the full document view in the center area.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"document-views-and-split-editing\">Document Views and Split Editing\u003c/h2>\n\u003cp>The center area provides three viewing modes:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Preview\u003c/strong>: Rendered Markdown with clickable links.\u003c/li>\n\u003cli>\u003cstrong>Split\u003c/strong>: Source code editor (CodeMirror) on the left, live preview on the right.\u003c/li>\n\u003cli>\u003cstrong>Edit\u003c/strong>: Dedicated code editor. Press \u003ccode>⌘S\u003c/code> to save to disk.\u003c/li>\n\u003c/ul>\n\u003cp>Highlighting text in preview or editor mode exposes an \u003cstrong>Add Annotation\u003c/strong> bar (\u003ccode>⌘Enter\u003c/code>) to send code snippets directly to the composer.\u003c/p>\n\u003ch2 id=\"git-diffs-and-commits\">Git Diffs and Commits\u003c/h2>\n\u003cp>Under the \u003cstrong>Git\u003c/strong> tab, the \u003cstrong>Changes\u003c/strong> view lists all modified, added, deleted, and untracked files:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>All Diffs\u003c/strong>: Open a full-screen diff inspector supporting \u003cstrong>Unified\u003c/strong> and \u003cstrong>Split\u003c/strong> views.\u003c/li>\n\u003cli>\u003cstrong>Inline Diff Annotations\u003c/strong>: Click the comment icon next to any changed line to annotate and instruct the agent on specific code diffs.\u003c/li>\n\u003cli>\u003cstrong>AI Commit Generation\u003c/strong>: Click \u003cstrong>Archive: commit all N files\u003c/strong> to automatically generate a Conventional Commit message and commit locally.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"parallel-git-worktrees\">Parallel Git Worktrees\u003c/h2>\n\u003cp>Git worktrees allow multiple agents to modify different branches in the same repository simultaneously without file collisions.\u003c/p>\n\u003cp>Under \u003cstrong>Git ▸ Worktrees\u003c/strong>:\u003c/p>\n\u003col>\n\u003cli>Click \u003cstrong>New parallel worktree\u003c/strong> to check out a new branch into \u003ccode>.worktrees/&lt;name&gt;\u003c/code>.\u003c/li>\n\u003cli>Launch distinct agent sessions in separate worktrees to handle bugs and features concurrently.\u003c/li>\n\u003cli>Sync from \u003ccode>main\u003c/code> or merge branches with automated conflict pre-checks. If a conflict occurs, launch an AI session to resolve conflicts automatically.\u003c/li>\n\u003cli>Set delivery mode in \u003cstrong>Settings ▸ General ▸ Git ▸ Delivery mode\u003c/strong>: Create a Pull Request or Merge &amp; Push directly.\u003c/li>\n\u003cli>Clean up idle worktrees in one click.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"time-machine-snapshots\">Time Machine Snapshots\u003c/h2>\n\u003cp>Under \u003cstrong>Git ▸ History\u003c/strong>:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Inspect Diffs\u003c/strong>: View changes introduced in any past commit.\u003c/li>\n\u003cli>\u003cstrong>Snapshot Sandbox Preview\u003c/strong>: Run historical revisions in an isolated sandbox (\u003ccode>.worktrees/tm-xxxx\u003c/code>) with custom commands (e.g., \u003ccode>pnpm dev --port 5180\u003c/code>) without altering your active worktree.\u003c/li>\n\u003cli>\u003cstrong>Safe Rollback\u003c/strong>: Revert commits while keeping subsequent changes as uncommitted working tree modifications.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"integrated-terminals\">Integrated Terminals\u003c/h2>\n\u003cp>Press \u003ccode>⌘`\u003c/code> to toggle the built-in terminal:\u003c/p>\n\u003cul>\n\u003cli>Supports up to 10 persistent shell tabs.\u003c/li>\n\u003cli>Highlight any error log or terminal text and click \u003cstrong>Quote\u003c/strong> (\u003ccode>⌘⇧A\u003c/code>) to send it to the composer, or click \u003cstrong>Send to side chat\u003c/strong>.\u003c/li>\n\u003cli>Fold long-running terminals into the background \u003cstrong>Services\u003c/strong> panel to free up UI space.\u003c/li>\n\u003cli>Running \u003ccode>omp\u003c/code> directly in this terminal automatically detects and attaches to the active session.\u003c/li>\n\u003c/ul>"},{"slug":"04-automation","title":"Task Automation: Schedules, Inbox & Backlog","html":"\u003ch1 id=\"task-automation-schedules-inbox--backlog\">Task Automation: Schedules, Inbox &amp; Backlog\u003c/h1>\n\u003cblockquote>\n\u003cp>Schedule automated routine tasks, triage items requiring human intervention in a centralized Inbox, and capture spontaneous ideas and bugs into a global backlog.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/04-automation/recurring-schedules\">Create and manage recurring schedules\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/04-automation/the-smart-inbox\">Triage items in the smart Inbox\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/04-automation/the-ideas-backlog\">Capture ideas and bugs into the backlog\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/04-automation/skills-and-extensions-overview\">Overview of skills and extensions\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"recurring-schedules\">Recurring Schedules\u003c/h2>\n\u003cp>Schedules automatically dispatch prompts to agents on preset time intervals (e.g., daily morning commit summaries, weekly dependency security audits, or periodic dead-code scanning).\u003c/p>\n\u003cp>Click \u003cstrong>Schedules\u003c/strong> in the left sidebar to manage tasks.\u003c/p>\n\u003ch3 id=\"quick-start-with-templates\">Quick Start with Templates\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Morning Standup Prep\u003c/strong>: Summarize previous day commits and flag priorities every weekday at 09:00.\u003c/li>\n\u003cli>\u003cstrong>Dependency Audit\u003c/strong>: Scan for updates and known CVEs every weekday at 10:00.\u003c/li>\n\u003cli>\u003cstrong>Friday Cleanup\u003c/strong>: Triage open TODOs and unfinished items every Friday at 17:00.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"configuration-guide\">Configuration Guide\u003c/h3>\n\u003cp>Click \u003cstrong>New schedule\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Cadence\u003c/strong>: Hourly, daily, weekdays, weekly, monthly, custom intervals, or one-time runs.\u003c/li>\n\u003cli>\u003cstrong>Prompt\u003c/strong>: Instructions for the agent, with image attachment support.\u003c/li>\n\u003cli>\u003cstrong>Approval Mode\u003c/strong>: Full Access (unattended), Write Approval Required, or Ask Every Time.\u003c/li>\n\u003cli>\u003cstrong>Git Worktree Isolation\u003c/strong>: Under Advanced Options, run schedules in an independent Git worktree to prevent background runs from touching active code branches.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"the-smart-inbox\">The Smart Inbox\u003c/h2>\n\u003cp>The Inbox aggregates all items needing human intervention. Click the bell icon in the sidebar header to open.\u003c/p>\n\u003ch3 id=\"automatic-triage-categories\">Automatic Triage Categories\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Approvals\u003c/strong>: Agent requests permission for risky tools (file modifications, shell commands).\u003c/li>\n\u003cli>\u003cstrong>Questions\u003c/strong>: Agent asks for user clarification or design decisions.\u003c/li>\n\u003cli>\u003cstrong>Errors\u003c/strong>: Sessions encountering unhandled exceptions or connection errors.\u003c/li>\n\u003cli>\u003cstrong>Interrupted\u003c/strong>: Sessions halted unexpectedly, ready to resume.\u003c/li>\n\u003cli>\u003cstrong>Unread\u003c/strong>: Sessions completed and waiting for your review.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"keyboard-first-processing\">Keyboard-First Processing\u003c/h3>\n\u003cul>\n\u003cli>Press \u003ccode>j\u003c/code> / \u003ccode>k\u003c/code> (or \u003ccode>↓\u003c/code> / \u003ccode>↑\u003c/code>) to cycle through entries, then press \u003ccode>Enter\u003c/code> to open the session.\u003c/li>\n\u003cli>Click \u003cstrong>Mark all as read\u003c/strong> to dismiss completed notifications. Non-blocking items auto-expire after an idle window configured in \u003cstrong>Settings ▸ Sessions ▸ Inbox\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"the-ideas-backlog\">The Ideas Backlog\u003c/h2>\n\u003cp>Click the lightbulb icon in the center header to open the backlog.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Dual Classification\u003c/strong>: Tag items as \u003cstrong>Idea\u003c/strong> or \u003cstrong>Bug\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Context Attachment\u003c/strong>: Link the current session context and attach screenshots directly.\u003c/li>\n\u003cli>\u003cstrong>Global Shortcut\u003c/strong>: Press the system-wide shortcut (default \u003ccode>⌘⇧I\u003c/code>) from any app to pop up the capture box. Press \u003ccode>⌘Enter\u003c/code> to submit.\u003c/li>\n\u003cli>\u003cstrong>Dispatch to Agent\u003c/strong>: Select items and click \u003cstrong>Dispatch\u003c/strong> to append them to an existing session or start a new session.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"skills-and-extensions-overview\">Skills and Extensions Overview\u003c/h2>\n\u003cp>Click \u003cstrong>Skills\u003c/strong> in the left sidebar to view native agent capabilities discovered in \u003ccode>~/.omp/agent/skills/\u003c/code> and local \u003ccode>.omp/skills/\u003c/code>:\u003c/p>\n\u003cul>\n\u003cli>Track trigger counts and health status (flagging missing descriptions or truncated prompts).\u003c/li>\n\u003cli>Click \u003cstrong>Use in current session\u003c/strong> to inject the skill command into the composer.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>For advanced agent definitions, model roles, and system prompt tuning, see \u003ca href=\"#/en/05-settings-and-models\">Settings: Models &amp; Agent Capabilities\u003c/a>.\u003c/p>\n\u003c/blockquote>"},{"slug":"05-settings-and-models","title":"Settings: Models & Agent Capabilities","html":"\u003ch1 id=\"settings-models--agent-capabilities\">Settings: Models &amp; Agent Capabilities\u003c/h1>\n\u003cblockquote>\n\u003cp>Master the workbench configuration: manage providers and keys, distinguish model roles from custom sub-agents, configure fallback chains, inspect system prompt composition, and connect MCP and plugins.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/settings-information-architecture\">Explore the settings information architecture\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/configure-model-providers-and-keys\">Configure model providers and secure keys\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/model-roles-vs-custom-sub-agents\">Understand the distinction: Model Roles vs Custom Sub-agents\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/assign-models-to-roles\">Assign models to roles\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/create-and-manage-custom-sub-agents\">Create and manage custom sub-agents\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/bulk-replace-and-quota-templates\">Replace models in bulk and automate quota switching\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/fallback-chains-and-retries\">Set fallback chains and auto-retries\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/rules-memory-and-prompt-composition\">Manage rule files, memory, and prompt composition\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/mcp-servers-and-plugins\">Connect MCP servers and plugins\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/the-privacy-library\">Protect secrets with the privacy library\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/05-settings-and-models/backup-restore-and-updates\">Back up, restore, and update settings\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"settings-information-architecture\">Settings Information Architecture\u003c/h2>\n\u003cp>Open settings via the gear icon in the sidebar or by pressing \u003ccode>⌘,\u003c/code> (or \u003ccode>/settings\u003c/code> in the composer).\u003c/p>\n\u003cp>The settings are structured into seven distinct groups:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Included Pages &amp; Scope\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>General\u003c/strong> (「常规」)\u003c/td>\u003ctd>\u003cstrong>General\u003c/strong> (defaults, Git delivery mode, approvals), \u003cstrong>Storage\u003c/strong> (disk usage &amp; cleanup), \u003cstrong>Appearance\u003c/strong> (themes &amp; density), \u003cstrong>Notifications\u003c/strong> (system alerts), \u003cstrong>Privacy\u003c/strong> (secret redaction)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Models\u003c/strong> (「模型」)\u003c/td>\u003ctd>\u003cstrong>Models and providers\u003c/strong> (API keys, OAuth accounts), \u003cstrong>Model roles\u003c/strong> (role mappings), \u003cstrong>Thinking and sampling\u003c/strong> (reasoning effort), \u003cstrong>Helper models\u003c/strong> (advisors &amp; vision), \u003cstrong>Fallback models and retries\u003c/strong> (fallback chains), \u003cstrong>Context window\u003c/strong> (token limits &amp; compaction)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Sessions\u003c/strong> (「会话」)\u003c/td>\u003ctd>\u003cstrong>Sessions\u003c/strong> (worktree &amp; sleep timers), \u003cstrong>Inbox\u003c/strong> (triage rules), \u003cstrong>Session checkup\u003c/strong> (doctor defaults), \u003cstrong>Rule files\u003c/strong> (AGENTS.md guidelines), \u003cstrong>System prompt composition\u003c/strong> (system prompt visualizer &amp; AI pruning)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Agent capabilities\u003c/strong> (「Agent 能力」)\u003c/td>\u003ctd>\u003cstrong>Tools\u003c/strong> (tool whitelist), \u003cstrong>File access\u003c/strong> (read/write &amp; LSP), \u003cstrong>Command line\u003c/strong> (shell execution), \u003cstrong>Sub-agents\u003c/strong> (custom sub-agent definitions), \u003cstrong>Memory\u003c/strong> (long-term memory files), \u003cstrong>Skills and commands\u003c/strong> (skill directories)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Connections\u003c/strong> (「连接」)\u003c/td>\u003ctd>\u003cstrong>Mobile access\u003c/strong> (LAN pairing, Cloudflare Tunnel, IPv6 DDNS), \u003cstrong>MCP servers\u003c/strong> (external tool protocol), \u003cstrong>Plugins\u003c/strong> (installed plugins &amp; extensions), \u003cstrong>Web search\u003c/strong> (search engines)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Advanced\u003c/strong> (「高级」)\u003c/td>\u003ctd>\u003cstrong>Advanced\u003c/strong> (omp executable path, terminal bridge extension, backup &amp; reset)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Help\u003c/strong> (「帮助」)\u003c/td>\u003ctd>\u003cstrong>User guide\u003c/strong> (this guide, feature walkthroughs &amp; shortcuts), \u003cstrong>Version and updates\u003c/strong> (version check &amp; engine hot-updates)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"configure-model-providers-and-keys\">Configure Model Providers and Keys\u003c/h2>\n\u003cp>Navigate to \u003cstrong>Settings ▸ Models and providers\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Add Provider\u003c/strong>: Select built-in presets (Anthropic, OpenAI, DeepSeek, Gemini, Moonshot Kimi, OpenRouter, SiliconFlow, Groq, Mistral, xAI, Ollama) or \u003cstrong>Custom OpenAI Compatible\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Hardware-backed Encryption\u003c/strong>: API keys are encrypted with AES-256-GCM using the macOS Keychain master key and stored in \u003ccode>~/.omp-workspace/env/keys.env\u003c/code>. Plaintext keys exist only in memory during network requests.\u003c/li>\n\u003cli>\u003cstrong>OAuth Subscriptions\u003c/strong>: Sign in via OAuth to track usage percentages, reset cycles, and balance across subscription accounts.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"model-roles-vs-custom-sub-agents\">Model Roles vs Custom Sub-agents\u003c/h2>\n\u003cp>Understanding this distinction is essential:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Dimension\u003c/th>\u003cth>Model Roles (「模型角色」)\u003c/th>\u003cth>Custom Sub-agents (「子代理」)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Core Concept\u003c/strong>\u003c/td>\u003ctd>Model aliases mapped to task categories\u003c/td>\u003ctd>Standalone agents with custom prompts, models, and tools\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Location\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Settings ▸ Model roles\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Settings ▸ Sub-agents\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Storage\u003c/strong>\u003c/td>\u003ctd>\u003ccode>~/.omp/agent/config.yml\u003c/code> (\u003ccode>modelRoles.*\u003c/code>)\u003c/td>\u003ctd>\u003ccode>~/.omp/agent/agents/&lt;name&gt;.md\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Examples\u003c/strong>\u003c/td>\u003ctd>\u003ccode>default\u003c/code> (main), \u003ccode>smol\u003c/code> (fast), \u003ccode>slow\u003c/code> (reasoning)\u003c/td>\u003ctd>\u003ccode>task\u003c/code> (general sub-task), \u003ccode>scout\u003c/code> (read-only search), custom roles\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Invocation\u003c/strong>\u003c/td>\u003ctd>Referenced via \u003ccode>@role\u003c/code> aliases\u003c/td>\u003ctd>Dispatched autonomously or assigned explicitly\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"assign-models-to-roles\">Assign Models to Roles\u003c/h2>\n\u003cp>Under \u003cstrong>Settings ▸ Model roles\u003c/strong>, assign models to standard system roles:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Default (\u003ccode>default\u003c/code>)\u003c/strong>: Main conversation and tool calling.\u003c/li>\n\u003cli>\u003cstrong>Fast (\u003ccode>smol\u003c/code>)\u003c/strong>: High-speed, cost-effective lightweight reasoning.\u003c/li>\n\u003cli>\u003cstrong>Deep (\u003ccode>slow\u003c/code>)\u003c/strong>: Architecture design and complex root-cause analysis.\u003c/li>\n\u003cli>\u003cstrong>Vision (\u003ccode>vision\u003c/code>)\u003c/strong>: Multimodal image and screenshot interpretation.\u003c/li>\n\u003cli>Use \u003cstrong>Reuse role model\u003c/strong> (e.g. \u003ccode>@default\u003c/code>) to keep subordinate roles synchronized with your primary model.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"create-and-manage-custom-sub-agents\">Create and Manage Custom Sub-agents\u003c/h2>\n\u003cp>Under \u003cstrong>Settings ▸ Sub-agents\u003c/strong>, manage dispatchable expert sub-agents:\u003c/p>\n\u003col>\n\u003cli>Click \u003cstrong>Add sub-agent\u003c/strong>:\n\u003cul>\n\u003cli>\u003cstrong>Name\u003c/strong>: Alphanumeric identifier (e.g. \u003ccode>security-reviewer\u003c/code>).\u003c/li>\n\u003cli>\u003cstrong>Description\u003c/strong>: Explains when the primary agent should delegate to this specialist.\u003c/li>\n\u003cli>\u003cstrong>Assigned Model\u003c/strong>: Dedicated model for this role.\u003c/li>\n\u003cli>\u003cstrong>Tool Whitelist\u003c/strong>: Restrict available tools (e.g., read-only tools).\u003c/li>\n\u003cli>\u003cstrong>System Prompt\u003c/strong>: Specific guidelines and output contracts.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>&quot;Let AI write it&quot;\u003c/strong>: Click the AI assistant button to describe your specialist in plain language and generate a complete sub-agent definition in one click.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"bulk-replace-and-quota-templates\">Bulk Replace and Quota Templates\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Bulk Replace\u003c/strong>: Open \u003cstrong>Settings ▸ Model roles ▸ Bulk replace\u003c/strong> to replace all occurrences of a model across global configs, projects, fallback chains, and schedules, complete with a 4-step wizard, impact preview, hot session migration, and full undo history.\u003c/li>\n\u003cli>\u003cstrong>Quota Templates\u003c/strong>: Save role-to-model presets (e.g., &quot;Performance Mode&quot; vs &quot;Cost-Saver Mode&quot;). Set automated downgrade rules to switch templates when provider quotas exceed a threshold (e.g. 90%).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"fallback-chains-and-retries\">Fallback Chains and Retries\u003c/h2>\n\u003cp>Under \u003cstrong>Settings ▸ Fallback models and retries\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>Define prioritized fallback chains (e.g., \u003ccode>Claude 3.5 Sonnet\u003c/code> → \u003ccode>DeepSeek V3\u003c/code> → \u003ccode>GPT-4o\u003c/code>).\u003c/li>\n\u003cli>Automatically rotate among multiple accounts under the same provider when quota is exhausted.\u003c/li>\n\u003cli>Built-in circuit breakers prevent infinite retry loops.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"rules-memory-and-prompt-composition\">Rules, Memory, and Prompt Composition\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Rule Files (AGENTS.md)\u003c/strong>: Manage global (\u003ccode>~/.omp/agent/AGENTS.md\u003c/code>) and project-specific rule files under \u003cstrong>Settings ▸ Rule files\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Memory Management\u003c/strong>: Inspect and clean cross-session memory under \u003cstrong>Settings ▸ Memory\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>System Prompt Composition\u003c/strong>: Under \u003cstrong>Settings ▸ System prompt composition\u003c/strong>, view an itemized breakdown of tokens consumed by system instructions, tool definitions, MCP schemas, and rules. Click \u003cstrong>Analyze with AI\u003c/strong> to trim unnecessary instructions.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"mcp-servers-and-plugins\">MCP Servers and Plugins\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>MCP Servers (Model Context Protocol)\u003c/strong>: Connect external tools via local \u003ccode>stdio\u003c/code> commands, HTTP, or SSE under \u003cstrong>Settings ▸ MCP servers\u003c/strong>. Scope servers to specific projects to save context.\u003c/li>\n\u003cli>\u003cstrong>Plugins\u003c/strong>: Enable or disable installed plugins and native extensions under \u003cstrong>Settings ▸ Plugins\u003c/strong>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"the-privacy-library\">The Privacy Library\u003c/h2>\n\u003cp>Under \u003cstrong>Settings ▸ Privacy\u003c/strong>, prevent API keys and passwords from leaking to upstream LLMs:\u003c/p>\n\u003cul>\n\u003cli>Text matching items in the privacy library is replaced with opaque placeholders (e.g., \u003ccode>⟦secret_a1b2⟧\u003c/code>) before sending.\u003c/li>\n\u003cli>Placeholders are restored to plaintext in memory only when executing local tools.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"backup-restore-and-updates\">Backup, Restore, and Updates\u003c/h2>\n\u003cul>\n\u003cli>Export and import all app settings under \u003cstrong>Settings ▸ Advanced ▸ Data &amp; backup\u003c/strong>.\u003c/li>\n\u003cli>Check and install updates for both the desktop app and the OMP core engine under \u003cstrong>Settings ▸ Version and updates\u003c/strong>.\u003c/li>\n\u003c/ul>"},{"slug":"06-monitoring-and-mobile","title":"Monitoring, Diagnostics & Remote Access","html":"\u003ch1 id=\"monitoring-diagnostics--remote-access\">Monitoring, Diagnostics &amp; Remote Access\u003c/h1>\n\u003cblockquote>\n\u003cp>Inspect context watermarks and token expenditure, run session checkups to eliminate inefficiencies, monitor local dev ports, and connect mobile devices securely.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/token-usage-and-distribution\">Analyze token distribution and costs\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/session-doctor\">Run session checkups with Session Doctor\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/session-diagnostics\">Diagnose broken and interrupted sessions\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/local-services-and-ports\">Manage local ports and clean orphan processes\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/performance-and-memory-monitoring\">Monitor physical resident memory footprint\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/mobile-remote-access\">Configure mobile access across networks\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"token-usage-and-distribution\">Token Usage and Distribution\u003c/h2>\n\u003cp>Open \u003cstrong>Token Heatmap\u003c/strong> in the right panel (\u003ccode>⌘J\u003c/code>):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Watermark Gauge\u003c/strong>: Real-time context consumption as a percentage of the model window.\u003c/li>\n\u003cli>\u003cstrong>Category Breakdown\u003c/strong>:\n\u003cul>\n\u003cli>\u003cstrong>Tool Calls\u003c/strong>: Input parameters and return payloads.\u003c/li>\n\u003cli>\u003cstrong>Skills\u003c/strong>: Injected skill descriptions.\u003c/li>\n\u003cli>\u003cstrong>System Prompt\u003c/strong>: Base instructions and AGENTS rules.\u003c/li>\n\u003cli>\u003cstrong>MCP Tools\u003c/strong>: Schemas registered by external MCP servers.\u003c/li>\n\u003cli>\u003cstrong>Reasoning &amp; Reply\u003c/strong>: Internal reasoning traces and model outputs.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Drilldown\u003c/strong>: Click any category to inspect individual calls and click \u003cstrong>Locate\u003c/strong> to jump directly to the relevant turn.\u003c/li>\n\u003cli>\u003cstrong>Sub-agent Savings\u003c/strong>: Track tokens saved through sub-agent context isolation.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"session-doctor\">Session Doctor\u003c/h2>\n\u003cp>When a session becomes sluggish or exhibits repetitive trial-and-error, run \u003cstrong>Session Doctor\u003c/strong> under \u003cstrong>Token Heatmap ▸ 🩺 Session Checkup\u003c/strong>:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Direction\u003c/th>\u003cth>Focus\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>🪙 Cost Saver\u003c/strong>\u003c/td>\u003ctd>Pinpoint redundant file reads, oversized tool returns, and unnecessary retries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🎯 Prompt Tuning\u003c/strong>\u003c/td>\u003ctd>Identify vague instructions or missing constraints in initial user prompts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🛡️ Code Pitfalls\u003c/strong>\u003c/td>\u003ctd>Flag unverified assumptions, over-engineering, or breaking changes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>💬 Custom Inquiry\u003c/strong>\u003c/td>\u003ctd>Ask specific questions regarding session execution\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The Doctor extracts a lightweight skeleton (goals, actions, errors, modified files) and generates an actionable \u003cstrong>Correction Prompt Draft\u003c/strong>. Click \u003cstrong>Fill in composer\u003c/strong> to steer the agent immediately.\u003c/p>\n\u003ch2 id=\"session-diagnostics\">Session Diagnostics\u003c/h2>\n\u003cp>For errored or interrupted sessions:\u003c/p>\n\u003col>\n\u003cli>Right-click the session in the sidebar and choose \u003cstrong>Diagnose this session\u003c/strong>.\u003c/li>\n\u003cli>An error summary and diagnostic prompt are generated automatically.\u003c/li>\n\u003cli>Delegate the diagnosis to an idle session or spin up a new diagnostic agent.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"local-services-and-ports\">Local Services and Ports\u003c/h2>\n\u003cp>Under the \u003cstrong>Services\u003c/strong> tab:\u003c/p>\n\u003cul>\n\u003cli>Detect active development servers (Vite, Next.js, Webpack, etc.) with PID and working directory details.\u003c/li>\n\u003cli>Identify services spawned by Time Machine snapshots.\u003c/li>\n\u003cli>\u003cstrong>One-Click Cleanup\u003c/strong>: Services whose parent sessions have finished are flagged as \u003cstrong>Orphaned\u003c/strong>. Click \u003cstrong>Clean up all\u003c/strong> to terminate them in one click.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"performance-and-memory-monitoring\">Performance and Memory Monitoring\u003c/h2>\n\u003cp>Click the \u003cstrong>Performance xxx MB\u003c/strong> button in the bottom status bar:\u003c/p>\n\u003cul>\n\u003cli>Reports physical resident memory (\u003cstrong>Footprint\u003c/strong>) matching macOS Activity Monitor.\u003c/li>\n\u003cli>Separates memory used by the desktop app UI, active agent processes, external OMP instances, and free system memory.\u003c/li>\n\u003cli>In dev mode (\u003ccode>pnpm tauri dev\u003c/code>), values are naturally higher due to Vite HMR and debug symbols; production builds are heavily optimized.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"mobile-remote-access\">Mobile Remote Access\u003c/h2>\n\u003cp>Configure mobile pairing under \u003cstrong>Settings ▸ Mobile access\u003c/strong>:\u003c/p>\n\u003ch3 id=\"1-local-wi-fi-pairing\">1. Local Wi-Fi Pairing\u003c/h3>\n\u003cp>Click \u003cstrong>Start\u003c/strong>, generate a pairing QR code, and scan it with your phone&#x27;s camera to open the web workbench. Inspect progress, send prompts, and approve tool calls directly from your phone.\u003c/p>\n\u003ch3 id=\"2-cloudflare-tunnel-remote-cellular-access\">2. Cloudflare Tunnel (Remote Cellular Access)\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Temporary URL\u003c/strong>: Automatically provisions an encrypted \u003ccode>trycloudflare.com\u003c/code> tunnel using \u003ccode>cloudflared\u003c/code> (no public IP or router port forwarding required).\u003c/li>\n\u003cli>\u003cstrong>Custom Domain\u003c/strong>: Connect with your custom Cloudflare tunnel and domain for permanent remote access.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3-ipv6-direct-connection--ddns\">3. IPv6 Direct Connection &amp; DDNS\u003c/h3>\n\u003cp>Connect directly over IPv6 on cellular networks. Enable \u003cstrong>Cloudflare DDNS\u003c/strong> to update AAAA DNS records automatically when your dynamic IP changes.\u003c/p>\n\u003cp>Click \u003cstrong>Revoke all\u003c/strong> at the bottom of the page to revoke access immediately if a device is lost.\u003c/p>"},{"slug":"07-shortcuts-and-troubleshooting","title":"Shortcuts & Troubleshooting","html":"\u003ch1 id=\"shortcuts--troubleshooting\">Shortcuts &amp; Troubleshooting\u003c/h1>\n\u003cblockquote>\n\u003cp>Keyboard shortcut cheat sheet, troubleshooting tips for common issues, and a reference for local data storage locations.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter, you will learn how to:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/07-shortcuts-and-troubleshooting/keyboard-shortcuts\">Look up all keyboard shortcuts\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/07-shortcuts-and-troubleshooting/troubleshooting\">Troubleshoot common issues\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/07-shortcuts-and-troubleshooting/data-locations\">Understand the local data directory structure\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"keyboard-shortcuts\">Keyboard Shortcuts\u003c/h2>\n\u003cblockquote>\n\u003cp>Note: \u003ccode>⌘\u003c/code> refers to Command on macOS; use \u003ccode>Ctrl\u003c/code> on Windows and Linux.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"1-global-shortcuts\">1. Global Shortcuts\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Description\u003c/th>\u003cth>Context\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘B\u003c/code>\u003c/td>\u003ctd>Toggle left sidebar\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘J\u003c/code>\u003c/td>\u003ctd>Toggle right utility panel\u003c/td>\u003ctd>Global (except full-page views)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘N\u003c/code>\u003c/td>\u003ctd>New session\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>Focus search (sessions or settings)\u003c/td>\u003ctd>Global (except code editors)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘,\u003c/code>\u003c/td>\u003ctd>Open / close Settings\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘[\u003c/code>\u003c/td>\u003ctd>Back / return to previous view\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘`\u003c/code>\u003c/td>\u003ctd>Toggle built-in terminal\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘W\u003c/code>\u003c/td>\u003ctd>Smart close: top overlay → active tab → hide window\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘+\u003c/code> / \u003ccode>⌘-\u003c/code> / \u003ccode>⌘0\u003c/code>\u003c/td>\u003ctd>Zoom in / out / reset zoom (80%–140%)\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>Dismiss popover / stop running turn / return\u003c/td>\u003ctd>Global\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧I\u003c/code>\u003c/td>\u003ctd>Global Idea/Bug capture popover\u003c/td>\u003ctd>System-wide (from any desktop app)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"2-composer-shortcuts\">2. Composer Shortcuts\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Any character\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>Type-to-focus\u003c/strong>: Automatically routes typing to the composer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>Send message (default)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Enter\u003c/code>\u003c/td>\u003ctd>Insert newline (default)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>Send message (when configured in \u003cstrong>Settings ▸ Sessions\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌥Enter\u003c/code>\u003c/td>\u003ctd>Invert dispatch strategy (e.g. Steer ↔ Queue)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>Cycle through prompt history\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>@\u003c/code>\u003c/td>\u003ctd>Trigger file reference menu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/\u003c/code>\u003c/td>\u003ctd>Trigger slash command palette\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"3-approvals-and-questions\">3. Approvals and Questions\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>y\u003c/code>\u003c/td>\u003ctd>Approve tool call for this turn only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\u003ctd>Reject tool call\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>1\u003c/code>–\u003ccode>9\u003c/code>\u003c/td>\u003ctd>Select question option by number\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> / \u003ccode>→\u003c/code>\u003c/td>\u003ctd>Navigate between multiple questions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>Submit selected answer\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"troubleshooting\">Troubleshooting\u003c/h2>\n\u003ch3 id=\"1-omp-not-found-or-session-fails-to-start\">1. &quot;omp not found&quot; or session fails to start\u003c/h3>\n\u003cul>\n\u003cli>Verify \u003ccode>omp\u003c/code> runs in your shell (\u003ccode>which omp\u003c/code>).\u003c/li>\n\u003cli>Set the absolute executable path under \u003cstrong>Settings ▸ Advanced ▸ omp program path\u003c/strong>.\u003c/li>\n\u003cli>Check \u003cstrong>Settings ▸ Version and updates\u003c/strong> to confirm detection.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"2-terminal-sessions-do-not-appear-in-the-sidebar\">2. Terminal sessions do not appear in the sidebar\u003c/h3>\n\u003cul>\n\u003cli>Open \u003cstrong>Settings ▸ Advanced ▸ External terminal integration\u003c/strong> and click \u003cstrong>Install extension\u003c/strong>.\u003c/li>\n\u003cli>Sessions run directly in your terminal will now appear in the sidebar with an \u003cstrong>External\u003c/strong> badge. Right-click to take over.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"3-session-status-shows-interrupted\">3. Session status shows &quot;Interrupted&quot;\u003c/h3>\n\u003cul>\n\u003cli>Occurs when the background process exits unexpectedly.\u003c/li>\n\u003cli>Right-click the session and choose \u003cstrong>Resume session\u003c/strong>, or click \u003cstrong>Resume interrupted turn\u003c/strong> in the chat view.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"4-keystrokes-do-not-route-to-the-composer\">4. Keystrokes do not route to the composer\u003c/h3>\n\u003cul>\n\u003cli>Type-to-focus intentionally yields focus when another input field, code editor, modal dialog, or terminal has focus.\u003c/li>\n\u003cli>Press \u003ccode>Esc\u003c/code> or click the chat background, then start typing again.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"5-window-turns-blank-in-development-mode-pnpm-tauri-dev\">5. Window turns blank in development mode (\u003ccode>pnpm tauri dev\u003c/code>)\u003c/h3>\n\u003cul>\n\u003cli>Run \u003ccode>touch index.html\u003c/code> in the repository root to force Vite to trigger a clean full reload.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"6-cannot-read-master-key-error\">6. &quot;Cannot read master key&quot; error\u003c/h3>\n\u003cul>\n\u003cli>Ensure \u003ccode>~/.omp-workspace/env/.master.key\u003c/code> exists and has \u003ccode>600\u003c/code> permissions.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"data-locations\">Data Locations\u003c/h2>\n\u003cp>All local workspace data is transparently stored under:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>Contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/app.db\u003c/code>\u003c/td>\u003ctd>Local SQLite database (metadata, backlog, schedules, settings)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/env/keys.env\u003c/code>\u003c/td>\u003ctd>Keychain-encrypted API key ciphertext\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/env/.master.key\u003c/code>\u003c/td>\u003ctd>Local master key file\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/global/\u003c/code>\u003c/td>\u003ctd>Working directory for Universal space sessions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/images/\u003c/code>\u003c/td>\u003ctd>Cached session images (cleaned automatically after 30 days)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/privacy/\u003c/code>\u003c/td>\u003ctd>Local privacy library definitions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp/agent/sessions/\u003c/code>\u003c/td>\u003ctd>Native OMP session records\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp/agent/agents/\u003c/code>\u003c/td>\u003ctd>Custom sub-agent markdown definitions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;project&gt;/.worktrees/\u003c/code>\u003c/td>\u003ctd>Independent Git worktree directories\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>Use \u003cstrong>Settings ▸ Advanced ▸ Data &amp; backup ▸ Export settings\u003c/strong> to back up and migrate your preferences to a new machine.\u003c/p>\n\u003c/blockquote>"}]}</script>
<script>
(function(){
var DATA=JSON.parse(document.getElementById("guide-data").textContent);
var KEY="ompws.guide.lang";
var T={zh:{brand:"omp-workspace 使用说明",toc:"本页内容",prev:"上一章",next:"下一章",copy:"复制",copied:"已复制",empty:"暂无内容",html:"zh-CN"},
en:{brand:"omp-workspace User Guide",toc:"On this page",prev:"Previous",next:"Next",copy:"Copy",copied:"Copied",empty:"No content yet",html:"en"}};
var $=function(i){return document.getElementById(i)};
function getLang(){try{var l=localStorage.getItem(KEY);if(l==="zh"||l==="en")return l}catch(e){}return "zh"}
var lang=getLang(),cur=null,spy=[];
function parse(){var m=location.hash.match(/^#\/(zh|en)(?:\/([^\/]+))?(?:\/(.+))?$/);
return m?{lang:m[1],slug:m[2]||null,anchor:m[3]?decodeURIComponent(m[3]):null}:{lang:lang,slug:null,anchor:null}}
function go(l,slug,anchor){location.hash="#/"+l+"/"+slug+(anchor?"/"+encodeURIComponent(anchor):"")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function enhance(root){
root.querySelectorAll("pre").forEach(function(pre){var b=document.createElement("button");b.className="copy";b.type="button";b.textContent=T[lang].copy;
b.onclick=function(){var t=pre.querySelector("code");var txt=(t||pre).textContent;var done=function(){b.textContent=T[lang].copied;setTimeout(function(){b.textContent=T[lang].copy},1500)};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,done);else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()}};
pre.appendChild(b)});
root.querySelectorAll("img").forEach(function(img){
var fail=function(){var d=document.createElement("div");d.className="img-ph";d.setAttribute("role","img");d.textContent=img.getAttribute("alt")||"";img.replaceWith(d)};
img.addEventListener("error",fail);if(img.complete&&img.naturalWidth===0)fail()});}
function render(){
var r=parse();lang=r.lang;try{localStorage.setItem(KEY,lang)}catch(e){}
var list=DATA[lang]||[];var t=T[lang];
document.documentElement.lang=t.html;document.title=t.brand+" / "+(lang==="zh"?"User Guide":"使用说明");
$("brand").textContent=lang==="zh"?"omp-workspace 使用说明 / User Guide":"omp-workspace User Guide / 使用说明";
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===lang))});
$("nav").innerHTML=list.map(function(c){return '<a href="#/'+lang+'/'+c.slug+'"'+(c.slug===r.slug?' aria-current="page"':'')+'>'+esc(c.title)+'</a>'}).join("");
var idx=-1;for(var i=0;i<list.length;i++)if(list[i].slug===r.slug)idx=i;
if(idx<0&&list.length){if(r.slug||!location.hash||true){idx=0}}
var content=$("content"),toc=$("toc");
if(idx<0){content.innerHTML='<p class="empty">'+t.empty+'</p>';toc.innerHTML="";return}
var ch=list[idx];
if(cur!==lang+"/"+ch.slug){cur=lang+"/"+ch.slug;
var p=idx>0?list[idx-1]:null,n=idx<list.length-1?list[idx+1]:null;
content.innerHTML=ch.html+'<div class="pager">'+(p?'<a class="prev" href="#/'+lang+'/'+p.slug+'"><small>← '+t.prev+'</small>'+esc(p.title)+'</a>':'')+(n?'<a class="next" href="#/'+lang+'/'+n.slug+'"><small>'+t.next+' →</small>'+esc(n.title)+'</a>':'')+'</div>';
enhance(content);
var hs=content.querySelectorAll("h2,h3");
toc.innerHTML='<h4>'+t.toc+'</h4>'+Array.prototype.map.call(hs,function(h){return '<a class="'+h.tagName.toLowerCase()+'" data-id="'+h.id+'" href="#/'+lang+'/'+ch.slug+'/'+encodeURIComponent(h.id)+'">'+esc(h.textContent)+'</a>'}).join("");
spy=Array.prototype.slice.call(hs);
if(!r.anchor)window.scrollTo({top:0,behavior:"instant"});
document.body.classList.remove("drawer");}
if(r.anchor){var el=document.getElementById(r.anchor);if(el)el.scrollIntoView()}
onScroll();}
function onScroll(){var act=null;for(var i=0;i<spy.length;i++){if(spy[i].getBoundingClientRect().top<=90)act=spy[i];else break}
if(!act&&spy.length)act=spy[0];
document.querySelectorAll("#toc a").forEach(function(a){var on=act&&a.dataset.id===act.id;a.classList.toggle("active",!!on)})}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){var r=parse(),l=b.dataset.lang;if(l===lang&&location.hash)return;
var other=DATA[l]||[];var same=other.some(function(c){return c.slug===r.slug});
try{localStorage.setItem(KEY,l)}catch(e){}
if(other.length)go(l,same?r.slug:other[0].slug,same?r.anchor:null);else{location.hash="#/"+l;}}});
$("menu").onclick=function(){document.body.classList.toggle("drawer")};
$("scrim").onclick=function(){document.body.classList.remove("drawer")};
window.addEventListener("hashchange",render);
window.addEventListener("scroll",onScroll,{passive:true});
if(!/^#\/(zh|en)/.test(location.hash)){var l0=getLang(),f=(DATA[l0]||[])[0];if(f)history.replaceState(null,"","#/"+l0+"/"+f.slug)}
render();
})();
</script>
</body>
