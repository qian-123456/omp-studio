not be scanned are listed in the preview under \u003cstrong>Locations that could not be scanned\u003c/strong> (「未能扫描的位置」) and are not modified. Sub-agent definition files, \u003ccode>models.yml\u003c/code>, \u003ccode>providers.json\u003c/code> and session history are never touched.\u003c/p>\n\u003c/blockquote>\n\u003cp>The dialog has four steps. \u003cstrong>Previous\u003c/strong> (「上一步」) is at the bottom, and \u003cstrong>History\u003c/strong> (「历史记录」) at the top right shows past replacements at any time:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Choose source\u003c/strong> (「选择来源」): the overview lists every model reference by type: \u003cstrong>Not found in the model catalog (may be invalid)\u003c/strong> (「模型目录中找不到（可能已失效）」), \u003cstrong>Chat models\u003c/strong> (「对话模型」), \u003cstrong>Search services\u003c/strong> (「搜索服务」), \u003cstrong>Judge models\u003c/strong> (「判断模型」) and \u003cstrong>Other types\u003c/strong> (「其他类型」). Search by model name, provider or location, and narrow with \u003cstrong>Scope\u003c/strong> (「范围」): all, global or one project. Click \u003cstrong>Replace\u003c/strong> (「替换」) next to a model to select it. \u003cstrong>Test\u003c/strong> (「测试」) probes the model with one real call, which uses a small number of tokens and runs only when clicked.\u003c/li>\n\u003cli>\u003cstrong>Choose target\u003c/strong> (「选择目标」): pick the \u003cstrong>Unified target\u003c/strong> model and a \u003cstrong>Thinking level\u003c/strong>; \u003cstrong>Model default\u003c/strong> (「模型默认」) writes no level suffix. Then click \u003cstrong>Preview changes\u003c/strong> (「预览改动」). Matching looks only at the model selector itself and ignores a trailing thinking-level suffix such as \u003ccode>:off\u003c/code> or \u003ccode>:high\u003c/code>. Models with the same name from a different provider are not replaced, and \u003ccode>@role\u003c/code> aliases are not rewritten.\u003c/li>\n\u003cli>\u003cstrong>Preview changes\u003c/strong>: every old → new edit is listed, grouped under \u003cstrong>Global\u003c/strong>, each project, \u003cstrong>Fallback chains\u003c/strong> (「回退链」), \u003cstrong>App settings\u003c/strong> (「应用设置」) and \u003cstrong>Scheduled tasks\u003c/strong> (「定时任务」), each with a checkbox. Use \u003cstrong>Change to another model\u003c/strong> (「换成别的模型」) to give one row its own model or level, and \u003cstrong>Revert to unified target\u003c/strong> (「改回统一目标」) to undo that. When the target key already exists in the fallback chains the row is marked \u003cstrong>Conflict\u003c/strong> (「冲突」): checking it merges the entries into the existing chain instead of overwriting it. \u003cstrong>Deduplicated\u003c/strong> (「已去重」) means duplicate entries were removed. Click \u003cstrong>Apply N items\u003c/strong> (「应用 N 项」) to write.\u003c/li>\n\u003cli>\u003cstrong>Results\u003c/strong> (「执行结果」): each edit shows success, or the failure reason; use \u003cstrong>Retry failed items\u003c/strong> (「重试失败项」) for failures. Click \u003cstrong>Back to overview\u003c/strong> (「返回总览」) to start over.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/settings-and-models-model-replace-preview.png\" alt=\"Bulk replace models: preview\"/>\u003c/p>\n\u003cp>Writing configuration does not change sessions that are already running. The results page lists sessions still running on the old model; check them and click \u003cstrong>Switch to &lt;new model&gt;\u003c/strong> (「切换到 &lt;新模型&gt;」) to move them immediately (the thinking level is set too if you chose one).\u003c/p>\n\u003cp>\u003cstrong>History\u003c/strong> keeps the latest 10 replacements. Expand one to see every change and click \u003cstrong>Undo\u003c/strong> (「撤销」) to restore the values from before that replacement. Undo restores only what the replacement wrote; locations you changed afterwards are skipped.\u003c/p>\n\u003ch2 id=\"use-templates-and-quota-based-auto-switching\">Use templates and quota-based auto switching\u003c/h2>\n\u003cp>The \u003cstrong>Templates and auto switching\u003c/strong> (「模板与自动切换」) card on the \u003cstrong>Model roles\u003c/strong> page stores a role-to-model table as a template that you can apply in one click, and can switch templates automatically when subscription quota runs low. Templates and rules belong to the \u003cstrong>Configuration scope\u003c/strong> chosen above; global and each project cannot see one another&#x27;s.\u003c/p>\n\u003ch3 id=\"role-templates\">Role templates\u003c/h3>\n\u003cp>Click \u003cstrong>New template\u003c/strong> (「新建模板」). The editor starts from the model roles configured in the current scope:\u003c/p>\n\u003cul>\n\u003cli>Enter a \u003cstrong>Template name\u003c/strong> (「模板名称」, for example &quot;Save money&quot;) and choose a model for each role, or leave it \u003cstrong>Not configured\u003c/strong> (「未配置」)\u003c/li>\n\u003cli>A role set to \u003cstrong>Not configured\u003c/strong> is removed from that scope&#x27;s config when applied, restoring inheritance; roles not in the template are left unchanged\u003c/li>\n\u003cli>Check \u003cstrong>Make fallback template\u003c/strong> (「设为保底模板」): it is applied even when all quota is exhausted. Each scope can have only one fallback template\u003c/li>\n\u003c/ul>\n\u003cp>In the list you can \u003cstrong>Apply\u003c/strong> (「应用」), \u003cstrong>Edit\u003c/strong> (「编辑」), \u003cstrong>Copy\u003c/strong> (「复制」) or \u003cstrong>Delete\u003c/strong> (「删除」) a template (rules that reference it are deleted with it). A template shows \u003cstrong>Currently active\u003c/strong> (「当前生效」) when the config matches it.\u003c/p>\n\u003cp>\u003cstrong>Apply\u003c/strong> first shows a preview: the roles that change (old → new), the files that will be written, project overrides that will not follow, and a quota \u003cstrong>preflight result\u003c/strong> (\u003cstrong>Can apply\u003c/strong> (「可以应用」), \u003cstrong>Some roles lack quota\u003c/strong> (「部分角色额度不足」), \u003cstrong>Current quota is insufficient\u003c/strong> (「当前额度不满足」)). If the preflight fails the apply is refused, and you can confirm with \u003cstrong>Apply anyway\u003c/strong> (「仍然应用」). Applying also pushes the new model to running sessions in that scope.\u003c/p>\n\u003ch3 id=\"auto-switch-rules\">Auto-switch rules\u003c/h3>\n\u003cp>\u003cstrong>Auto-switch rules\u003c/strong> (「自动切换规则」) turn &quot;a provider&#x27;s quota window has reached N%&quot; into &quot;apply a template&quot;:\u003c/p>\n\u003col>\n\u003cli>Click \u003cstrong>New rule\u003c/strong> (「新建规则」). You need at least one template first, and a usable quota account; otherwise \u003cstrong>Provider\u003c/strong> (「供应商」) and \u003cstrong>Window\u003c/strong> (「窗口」) cannot be chosen yet.\u003c/li>\n\u003cli>Choose the \u003cstrong>Provider\u003c/strong>, \u003cstrong>Window\u003c/strong> and the \u003cstrong>Reach\u003c/strong> (「达到」) threshold percentage, then the \u003cstrong>Scope\u003c/strong> (「作用范围」) and the template to \u003cstrong>Apply\u003c/strong> (「应用模板」).\u003c/li>\n\u003cli>Optionally turn on \u003cstrong>Switch back automatically when quota recovers\u003c/strong> (「额度恢复后自动切回」) and set the \u003cstrong>drops to … % or below\u003c/strong> threshold; if empty, the threshold minus 10% is used.\u003c/li>\n\u003c/ol>\n\u003cp>Rules are checked from top to bottom, and within one scope the first match wins. Reorder them with the move up and down buttons, or disable them at any time. At the bottom of the card you can set the \u003cstrong>Fallback template\u003c/strong> (「保底模板」) and the \u003cstrong>Quota check frequency\u003c/strong> (「额度检查频率」, every 1–1440 minutes, with the last and next check times shown). With no enabled rule, no quota report is fetched.\u003c/p>\n\u003cp>Recent applies, automatic switches and undos are recorded under \u003cstrong>Recent switches\u003c/strong> (「最近切换」, up to 200). Expand an entry for the reason, role changes and session switches, and \u003cstrong>Undo\u003c/strong> it to restore the models from before the switch; if you manually changed a role since, that role is skipped.\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-templates-rules.png\" alt=\"Templates and auto-switch rules\"/>\u003c/p>\n\u003ch2 id=\"set-fallback-models-and-context-windows\">Set fallback models and context windows\u003c/h2>\n\u003cp>\u003cstrong>Settings ▸ Fallback models and retries\u003c/strong>: switch to a fallback model automatically when a model errors or its quota runs out.\u003c/p>\n\u003cul>\n\u003cli>The \u003cstrong>Switch to fallback model automatically\u003c/strong> (「自动换备用模型」) switch (on by default). When off, the settings below have no effect\u003c/li>\n\u003cli>\u003cstrong>Fallback trigger\u003c/strong> (「回退触发条件」), \u003cstrong>Switch back after fallback\u003c/strong> (「回退后切回策略」), and \u003cstrong>Fall back early when quota runs low\u003c/strong> (「额度快用完时提前回退」: switches to another account of the same provider first, then to a fallback model; plain API keys do not take part; off by default)\u003c/li>\n\u003cli>Fallback chains are edited per role. Each role is in one of three states: \u003cstrong>Not set\u003c/strong> (「未设置」: dedicated roles use built-in candidates, chat roles follow the \u003ccode>default\u003c/code> list), \u003cstrong>No fallback\u003c/strong> (「不回退」: stop on error) or \u003cstrong>Custom\u003c/strong> (「自定义」: try your ordered list; entries can be a model, an \u003ccode>@role\u003c/code> or \u003ccode>provider/*\u003c/code>). Expand \u003cstrong>Which fallback list is used after an error?\u003c/strong> (「出错后用哪份备用名单？看这里」) to see the lookup order\u003c/li>\n\u003cli>\u003cstrong>Switching in session\u003c/strong> (「会话内切换」) sets the role rotation order used by the model-switch shortcut inside a session\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Settings ▸ Context window\u003c/strong> (「上下文窗口」): set each model&#x27;s context window in bulk and configure auto-compaction. Search, filter by provider and status, select several models and enter a \u003cstrong>Bulk window value\u003c/strong> (「批量窗口值」) such as \u003ccode>200k\u003c/code> or \u003ccode>1m\u003c/code>. Check \u003cstrong>Remember as rule\u003c/strong> (「记住为规则」) to save the models&#x27; common name as a &quot;keyword + window&quot; rule. A new or edited rule applies immediately to every matching model, and you can \u003cstrong>Undo\u003c/strong> it. The \u003cstrong>Auto compaction\u003c/strong> (「自动压缩」) card lets you set the compaction threshold as an absolute token count or as a percentage of the window (10%–95%).\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>A window larger than the model&#x27;s real limit prevents auto-compaction from triggering in time, and requests fail with a context-too-long error.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"manage-mcp-servers\">Manage MCP servers\u003c/h2>\n\u003cp>\u003cstrong>Settings ▸ MCP servers\u003c/strong> (「MCP 服务器」) connects external tool services to the AI. Changes apply only to sessions started afterwards.\u003c/p>\n\u003cp>The page reads omp&#x27;s \u003ccode>mcp.json\u003c/code> files (the project&#x27;s \u003ccode>.omp/mcp.json\u003c/code> and \u003ccode>.mcp.json\u003c/code>, the user-level \u003ccode>mcp.json\u003c/code> and \u003ccode>.mcp.json\u003c/code>, and the fallback files in the project root). Choose the \u003cstrong>Current project\u003c/strong> (「当前项目」) at the top; with none selected, only global servers are shown.\u003c/p>\n\u003cp>Click \u003cstrong>Add server\u003c/strong> (「添加服务器」):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Field\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Name\u003c/strong> (「名称」)\u003c/td>\u003ctd>For example \u003ccode>filesystem\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Connection type\u003c/strong> (「连接方式」)\u003c/td>\u003ctd>Run a command on this computer (the most common, for example starting a package with \u003ccode>npx\u003c/code>), connect to a remote HTTP address, or connect to a remote SSE address (the older push protocol)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Save to\u003c/strong> (「保存到」)\u003c/td>\u003ctd>\u003cstrong>Current project only\u003c/strong> (「仅当前项目」) or \u003cstrong>Global (shared by all projects)\u003c/strong> (「全局（所有项目通用）」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Command\u003c/strong>, \u003cstrong>Arguments (one per line)\u003c/strong>, \u003cstrong>Working directory (optional)\u003c/strong> (「命令」「参数（每行一个）」「工作目录（可选）」)\u003c/td>\u003ctd>For the local-command type. An empty working directory uses the session&#x27;s directory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Server address\u003c/strong>, \u003cstrong>Headers\u003c/strong> (「服务器地址」「请求头」)\u003c/td>\u003ctd>For remote types\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Environment variables\u003c/strong> (「环境变量」)\u003c/td>\u003ctd>Variables passed to the command, often used for API keys. You can also write \u003ccode>${VAR}\u003c/code> to reference a variable on this computer\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Timeout (ms)\u003c/strong> (「超时（毫秒）」)\u003c/td>\u003ctd>Leave empty for the default\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Saved environment-variable and header values are never displayed; enter the same name again to overwrite one. Full JSON (auth, OAuth and other extra fields) stays in the file, and the \u003cstrong>Config files\u003c/strong> (「配置文件」) card at the bottom opens it in the default app.\u003c/p>\n\u003cp>Each server row shows its scope (\u003cstrong>Global\u003c/strong> or \u003cstrong>Project\u003c/strong>), connection type and state, and offers:\u003c/p>\n\u003cul>\n\u003cli>A switch to enable or disable it. A global server applies to all projects; omp cannot yet disable a global server for one project only\u003c/li>\n\u003cli>\u003cstrong>Move into project\u003c/strong> (「移入项目」) / \u003cstrong>Move to global\u003c/strong> (「移至全局」): after moving into a project, new sessions in other projects no longer load its tools, which saves context right away\u003c/li>\n\u003cli>\u003cstrong>Edit\u003c/strong> and \u003cstrong>Delete\u003c/strong> (deleting rewrites the file and cannot be undone)\u003c/li>\n\u003c/ul>\n\u003cp>If a higher-priority config file has a server with the same name, this one is marked \u003cstrong>Overridden by same name\u003c/strong> (「被同名覆盖」) and has no effect.\u003c/p>\n\u003ch2 id=\"manage-plugins\">Manage plugins\u003c/h2>\n\u003cp>\u003cstrong>Settings ▸ Plugins\u003c/strong> (「插件」) lists installed plugins and extension modules. Switch changes apply only to sessions started afterwards.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Installed plugins\u003c/strong> (「已安装插件」): from omp&#x27;s global plugin directory and the current project&#x27;s plugin directory, with the source shown as \u003cstrong>Local link\u003c/strong> (「本地链接」) or \u003cstrong>Marketplace\u003c/strong> (「市场」). Use the switch to enable or disable. A plugin without an omp manifest is marked \u003cstrong>No manifest\u003c/strong> (「无清单」) and is not loaded at runtime; one disabled by the project&#x27;s override file is marked \u003cstrong>Disabled by project\u003c/strong> (「项目已禁用」). To install a plugin, run \u003ccode>omp plugin install &lt;package&gt;\u003c/code> in a terminal, then click the refresh button at the top right\u003c/li>\n\u003cli>\u003cstrong>Extension modules\u003c/strong> (「扩展模块」): script modules in the extension directory. You can enable, disable, reveal them in Finder, or delete them permanently (the files are removed from disk)\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"protect-sensitive-data-with-the-privacy-library\">Protect sensitive data with the privacy library\u003c/h2>\n\u003cp>\u003cstrong>Settings ▸ Privacy\u003c/strong> manages content that must be masked, such as passwords, tokens and private keys. Content in the privacy library is replaced with a placeholder (like \u003ccode>⟦name_a1b2⟧\u003c/code>) before it is sent to the AI, and restored only on this computer just before a tool runs. A placeholder never changes after it is created; renaming an entry affects only how it is displayed.\u003c/p>\n\u003ch3 id=\"mark-and-manage-entries\">Mark and manage entries\u003c/h3>\n\u003cul>\n\u003cli>In settings, click \u003cstrong>Add\u003c/strong> (「添加」) on the \u003cstrong>Privacy library\u003c/strong> (「隐私库」) card and enter the \u003cstrong>Private content\u003c/strong> (「隐私内容」) and an optional \u003cstrong>Label\u003c/strong> (「备注名称」, an alias for yourself; a code name is generated if you leave it empty)\u003c/li>\n\u003cli>In the composer, select some text and click \u003cstrong>Mark as private\u003c/strong> (「标记为隐私」), or use the context menu. You can add a name, but the AI sees that name, so do not put anything sensitive in it. Content shorter than 3 characters, containing line breaks or longer than 4096 characters cannot be marked\u003c/li>\n\u003cli>After marking, if asked \u003cstrong>Save to the privacy library? It will also be replaced automatically in other sessions\u003c/strong> (「保存到隐私库？以后在其他会话中也会自动替换」), choose \u003cstrong>Save\u003c/strong> (「保存」) to apply it in all sessions, or \u003cstrong>Don&#x27;t save\u003c/strong> (「不保存」) to apply it only in the session where you marked it. Such entries appear under \u003cstrong>Marked in sessions only\u003c/strong> (「仅在会话中标记」)\u003c/li>\n\u003c/ul>\n\u003cp>Each entry shows its label, placeholder and the masked real value. You can \u003cstrong>Show real value\u003c/strong> (「显示真实值」), \u003cstrong>Edit label\u003c/strong> (「编辑备注」), \u003cstrong>Remove from library\u003c/strong> (「移出隐私库」) or \u003cstrong>Delete permanently\u003c/strong> (「彻底删除」). Short or common content is marked \u003cstrong>Prone to false matches\u003c/strong> (「易误伤」) and gets an extra \u003cstrong>Don&#x27;t track (restore marked spots only)\u003c/strong> (「不追踪（只还原已标记处）」) checkbox: when checked, only the places you marked are restored, and the content is not replaced automatically elsewhere in text.\u003c/p>\n\u003cp>\u003cimg src=\"images/settings-and-models-privacy-library.png\" alt=\"Privacy library list and placeholders\"/>\u003c/p>\n\u003cp>\u003cstrong>Show real values by default\u003c/strong> (「默认显示真实值」) in the \u003cstrong>Display\u003c/strong> (「显示」) card decides whether placeholders in the conversation show the real content or the name (when off, click to toggle temporarily).\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>If the content already appeared earlier in this session, it has already been sent upstream and marking it cannot take it back. Choosing \u003cstrong>Also replace old history\u003c/strong> (「同时替换旧历史」) changes the request prefix, which can invalidate caches and cost more. If that is unacceptable, rotate the secret and continue in a new session.\u003c/p>\n\u003c/blockquote>\n\u003cp>When the privacy library has entries, omp&#x27;s \u003cstrong>Secret masking\u003c/strong> (「密钥脱敏」) is turned on automatically when a session starts; you do not need to turn it on below. If omp&#x27;s \u003ccode>secrets.yml\u003c/code> is not in list format or cannot be written, a warning appears at the top of the page and context compaction is paused to prevent leaks. Check that file.\u003c/p>\n\u003ch2 id=\"adjust-omp-settings\">Adjust omp settings\u003c/h2>\n\u003cp>Most pages in the \u003cstrong>Models\u003c/strong>, \u003cstrong>Sessions\u003c/strong>, \u003cstrong>Agent capabilities\u003c/strong> and \u003cstrong>Connections\u003c/strong> groups (for example \u003cstrong>Thinking and sampling\u003c/strong>, \u003cstrong>Helper models\u003c/strong>, \u003cstrong>Tools\u003c/strong>, \u003cstrong>File access\u003c/strong>, \u003cstrong>Command line\u003c/strong>, \u003cstrong>Sub-agents\u003c/strong>, \u003cstrong>Memory\u003c/strong> and \u003cstrong>Web search\u003c/strong>) present omp&#x27;s configuration keys as Chinese setting rows. The data comes from omp&#x27;s \u003ccode>config.yml\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>Each row shows a name, a description and a control. Hover over the name to see the config key and where the setting lives in omp&#x27;s terminal UI\u003c/li>\n\u003cli>Changed items are marked \u003cstrong>Modified\u003c/strong> (「已修改」). Click \u003cstrong>Restore default\u003c/strong> (「恢复默认」) to remove the override\u003c/li>\n\u003cli>Lists, key-value maps and nested structures have dedicated editors, or click \u003cstrong>Edit raw value\u003c/strong> (「直接编辑原始值」) to edit as JSON\u003c/li>\n\u003cli>Secret settings are write-only: saved content is never displayed; enter a new value to replace it entirely\u003c/li>\n\u003cli>If the current project&#x27;s \u003ccode>.omp/config.yml\u003c/code> sets the same key, the row shows \u003cstrong>Overridden by this project\u003c/strong> (「本项目已覆盖」): inside that project the project file wins, and what you change here is the global value\u003c/li>\n\u003cli>Settings that depend on another switch show the prerequisite, for example some settings have no effect while the main \u003cstrong>Auto compaction\u003c/strong> switch is off\u003c/li>\n\u003c/ul>\n\u003cp>If the page says \u003cstrong>Unable to read omp configuration\u003c/strong> (「无法读取 omp 配置」), make sure omp is installed and check the omp location on the \u003cstrong>Advanced\u003c/strong> page.\u003c/p>\n\u003ch2 id=\"back-up-restore-and-reset\">Back up, restore and reset\u003c/h2>\n\u003cp>\u003cstrong>Settings ▸ Advanced\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Environment and paths\u003c/strong> (「环境与路径」): \u003cstrong>Program location\u003c/strong> (「程序位置」) is the command the app uses to start AI sessions. Usually \u003ccode>omp\u003c/code>; enter a full path if it is installed somewhere unusual. You can also reveal omp&#x27;s \u003ccode>config.yml\u003c/code> in Finder, open omp&#x27;s data directory and \u003cstrong>Reload omp configuration\u003c/strong> (「重新读取 omp 配置」) here\u003c/li>\n\u003cli>\u003cstrong>External terminal link\u003c/strong> (「外部终端联动」): click \u003cstrong>Install extension\u003c/strong> (「安装扩展」) so omp conversations you run directly in a terminal also appear in this app&#x27;s list (installed to \u003ccode>~/.omp/agent/extensions/\u003c/code>)\u003c/li>\n\u003cli>\u003cstrong>Data and backup\u003c/strong> (「数据与备份」): \u003cstrong>Open data directory\u003c/strong> (「打开数据目录」), \u003cstrong>Export settings\u003c/strong> (「导出设置」) and \u003cstrong>Import settings\u003c/strong> (「导入设置」, which overwrites current settings after confirmation). The export contains only this app&#x27;s own settings, not omp&#x27;s configuration\u003c/li>\n\u003cli>\u003cstrong>Restore default settings\u003c/strong> (「恢复默认设置」): returns all of this app&#x27;s settings to how they were on first install. It asks for a second confirmation and cannot be undone, so export a backup first\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Settings ▸ Version and updates\u003c/strong> shows the versions of this app and omp, and can check for and install updates. When omp is updated, idle sessions switch to the new version immediately and running sessions switch after the current turn; conversation history is kept.\u003c/p>\n\u003cp>Related chapters: \u003ca href=\"#/en/06-monitoring-and-mobile\">Monitoring and mobile access\u003c/a>, \u003ca href=\"#/en/07-shortcuts-and-troubleshooting\">Shortcuts and troubleshooting\u003c/a>.\u003c/p>"},{"slug":"06-monitoring-and-mobile","title":"Monitoring and mobile access","html":"\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-token-distribution.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-doctor-result.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-services-panel.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-pairing-qr.png\"/>\u003clink rel=\"preload\" as=\"image\" href=\"images/monitoring-and-mobile-tunnel.png\"/>\u003ch1 id=\"monitoring-and-mobile-access\">Monitoring and mobile access\u003c/h1>\n\u003cblockquote>\n\u003cp>See where tokens and memory go with the Token usage, session checkup, Services and Performance panels, and use your phone to view sessions and handle approvals over your LAN or the internet.\u003c/p>\n\u003c/blockquote>\n\u003cp>You can:\u003c/p>\n\u003cul>\n\u003cli>Check each session&#x27;s context level, token distribution and estimated cost in the \u003ca href=\"#/en/06-monitoring-and-mobile/view-token-usage\">Token usage\u003c/a> panel\u003c/li>\n\u003cli>Have a model find context waste, rework and unclear requests with a \u003ca href=\"#/en/06-monitoring-and-mobile/check-up-a-session\">session checkup\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/06-monitoring-and-mobile/diagnose-an-abnormal-session\">Diagnose an abnormal session\u003c/a> by handing its error context to an agent\u003c/li>\n\u003cli>List listening ports, stop services and clean up leftovers in the \u003ca href=\"#/en/06-monitoring-and-mobile/manage-local-services-and-ports\">Services panel\u003c/a>\u003c/li>\n\u003cli>See how much memory this app and omp use in the \u003ca href=\"#/en/06-monitoring-and-mobile/view-performance-and-memory\">Performance popover\u003c/a>\u003c/li>\n\u003cli>Set up \u003ca href=\"#/en/06-monitoring-and-mobile/access-from-your-phone\">mobile access\u003c/a>: LAN pairing by QR code, IPv6 direct access or a public tunnel\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is in Simplified Chinese. On the first mention in each section, labels are written as \u003cstrong>English name\u003c/strong> (「中文原文」) so you can find them on screen.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"view-token-usage\">View token usage\u003c/h2>\n\u003cp>Open \u003cstrong>Token usage\u003c/strong> (「Token 用量」) from the tab bar of the right panel. The panel has three tabs at the top: \u003cstrong>This conversation\u003c/strong> (「本对话」), \u003cstrong>Global insights\u003c/strong> (「全局洞察」) and \u003cstrong>🩺 Session checkup\u003c/strong> (「🩺 会话体检」).\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>Press \u003ccode>⌘J\u003c/code> to collapse or expand the right panel.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"this-conversation\">This conversation\u003c/h3>\n\u003cp>Select a session in the sidebar first. The panel shows:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Context level\u003c/strong> (「上下文水位」): used tokens / model limit (percentage)\u003c/li>\n\u003cli>\u003cstrong>Token distribution\u003c/strong> (「Token 消耗分布」): a colored distribution bar plus category cards for \u003cstrong>Tool Calls\u003c/strong>, \u003cstrong>Skills injection\u003c/strong> (「Skills 注入」), \u003cstrong>System Prompt\u003c/strong>, \u003cstrong>MCP services\u003c/strong> (「MCP 服务」) and \u003cstrong>Thinking and replies\u003c/strong> (「思考与回复」). A category with possible waste or redundancy is marked ⚠️\u003c/li>\n\u003cli>\u003cstrong>Drill-down\u003c/strong> (「钻取明细」): click a category to list every item in it (for example each tool call) with its consumption. Expand an item to see the individual calls, and click \u003cstrong>Locate\u003c/strong> (「定位」) to jump to that step in the conversation; use previous/next to move between them\u003c/li>\n\u003c/ul>\n\u003cp>If the session used sub-agents, an \u003cstrong>Inspect target\u003c/strong> (「检查对象」) row appears at the top with one button for the \u003cstrong>Main conversation\u003c/strong> (「主对话」) and one per sub-agent. Switching changes the distribution bar and details to the selected target, and \u003cstrong>Isolation savings\u003c/strong> (「隔离省流」) at the top right shows how many tokens sub-agent isolation kept out of the main context.\u003c/p>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-token-distribution.png\" alt=\"Token usage: context level and consumption distribution\"/>\u003c/p>\n\u003ch3 id=\"global-insights\">Global insights\u003c/h3>\n\u003cp>\u003cstrong>Global insights\u003c/strong> aggregates all omp sessions:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Top 3 long-term common problems\u003c/strong> (「长期共性问题 Top 3」) comes from session checkups. It appears only after at least 2 checkups, once the same problem has recurred across several conversations\u003c/li>\n\u003cli>Choose a time range with \u003cstrong>Today\u003c/strong> (「今天」), \u003cstrong>Last 7 days\u003c/strong> (「近 7 天」) or \u003cstrong>All history\u003c/strong> (「全部历史」), and a \u003cstrong>Sort by\u003c/strong> (「排序方式」) of \u003cstrong>Highest consumption first\u003c/strong> (「最高消耗优先」), \u003cstrong>Most problems first\u003c/strong> (「最多问题优先」) or \u003cstrong>Latest activity first\u003c/strong> (「最新活动优先」)\u003c/li>\n\u003cli>Three summary cards show \u003cstrong>Total sessions\u003c/strong> (「会话总数」), \u003cstrong>Total consumption\u003c/strong> (「总消耗」) and \u003cstrong>Estimated cost\u003c/strong> (「预估成本」)\u003c/li>\n\u003cli>\u003cstrong>OMP session details\u003c/strong> (「OMP 会话明细」) lists each session&#x27;s tokens, cost, branch and state (\u003cstrong>Normal\u003c/strong> (「正常」) or \u003cstrong>Abnormal interruption\u003c/strong> (「异常中断」)). Click a row to jump to that session&#x27;s \u003cstrong>This conversation\u003c/strong> view\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>Cost is an estimate based on known unit prices, not a bill.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"check-up-a-session\">Check up a session\u003c/h2>\n\u003cp>\u003cstrong>Session checkup\u003c/strong> has a model review the current session and return a diagnosis and ready-to-use prompt drafts. A checkup only gives advice; it never modifies files.\u003c/p>\n\u003col>\n\u003cli>\n\u003cp>In the \u003cstrong>Token usage\u003c/strong> panel, select a session and switch to \u003cstrong>🩺 Session checkup\u003c/strong>.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>Under \u003cstrong>Choose a checkup focus\u003c/strong> (「选择体检方向」), pick one:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Focus\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>🪙 Save tokens\u003c/strong> (「省钱瘦身」)\u003c/td>\u003ctd>Find context waste, repeated reads and pointless retries\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🎯 Improve prompts\u003c/strong> (「提问调优」)\u003c/td>\u003ctd>Check whether how the request was worded caused scope creep or repeated rework\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>🛡️ Code pitfalls\u003c/strong> (「代码暗坑」)\u003c/td>\u003ctd>Look for over-engineering, hidden risks and unverified changes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>💬 Ask freely\u003c/strong> (「自由提问」)\u003c/td>\u003ctd>Ask your own question about this conversation (a question is required)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/li>\n\u003cli>\n\u003cp>Click \u003cstrong>Start checkup\u003c/strong> (「开始体检」). The panel shows that the conversation was reduced to a skeleton of about N tokens: only this compact skeleton (goal, action sequence, errors, changed files) is sent, never the full conversation transcript.\u003c/p>\n\u003c/li>\n\u003cli>\n\u003cp>The result contains \u003cstrong>Core conclusion\u003c/strong> (「核心结论」), \u003cstrong>Evidence\u003c/strong> (「事实证据」), \u003cstrong>Root-cause analysis\u003c/strong> (「根因分析」) and \u003cstrong>Corrective prompt drafts\u003c/strong> (「纠偏 Prompt 草稿」). Each draft can be copied with \u003cstrong>Copy\u003c/strong> (「复制」), or put into the composer with \u003cstrong>Put in composer\u003c/strong> (「填入输入框」) before you send it. Ask more under \u003cstrong>Follow-up\u003c/strong> (「追问」).\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-doctor-result.png\" alt=\"Session checkup result\"/>\u003c/p>\n\u003cp>Configure checkups in \u003cstrong>Settings ▸ Session checkup\u003c/strong> (the \u003cstrong>Settings\u003c/strong> link at the bottom of the panel goes there directly):\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Setting\u003c/th>\u003cth>Description\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Model\u003c/strong> (「使用模型」)\u003c/td>\u003ctd>The model used for checkups. Pick a fast, inexpensive one\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Automatic checkup\u003c/strong> (「自动体检」)\u003c/td>\u003ctd>\u003cstrong>Manual\u003c/strong> (「手动按需」, the default; nothing is spent unless you click), \u003cstrong>After session idle\u003c/strong> (「会话闲置后」) or \u003cstrong>Daily schedule\u003c/strong> (「每日定时」)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Idle time (minutes)\u003c/strong> (「闲置时长（分钟）」)\u003c/td>\u003ctd>How long a session must be idle before an automatic checkup: 30, 60 or 120 minutes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Scheduled time\u003c/strong> (「定时时间」)\u003c/td>\u003ctd>Time of day for the automatic checkup, 24-hour \u003ccode>HH:MM\u003c/code>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>Every checkup consumes tokens of the selected model, and automatic checkups keep consuming them. Turn them on only if you need them.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"diagnose-an-abnormal-session\">Diagnose an abnormal session\u003c/h2>\n\u003cp>For a session that failed or was interrupted, you can hand its error context to another agent. Right-click the session in the sidebar and choose \u003cstrong>Diagnose this session\u003c/strong> (「诊断此会话」) to open the \u003cstrong>Diagnose abnormal session\u003c/strong> (「诊断异常会话」) dialog.\u003c/p>\n\u003col>\n\u003cli>The dialog shows the \u003cstrong>Session being diagnosed\u003c/strong> (「被诊断会话」) with its title, status and working directory, and generates a \u003cstrong>diagnostic context prompt\u003c/strong> (「诊断上下文提示词」) by scanning the tail of the session for errors and summarizing them. You can edit the prompt directly, and click \u003cstrong>Regenerate\u003c/strong> (「重新生成」) to build it again.\u003c/li>\n\u003cli>Under \u003cstrong>Which agent runs the diagnosis?\u003c/strong> (「由哪个 Agent 执行诊断？」), choose \u003cstrong>Existing session\u003c/strong> (「现有会话」, pick another session; its state is shown as \u003cstrong>Busy\u003c/strong>, \u003cstrong>Idle\u003c/strong>, \u003cstrong>Abnormal\u003c/strong> or \u003cstrong>Suspended\u003c/strong>) or \u003cstrong>New diagnostic session\u003c/strong> (「新开诊断会话」, with an optional model; empty uses the default model, and it starts in the diagnosed session&#x27;s working directory).\u003c/li>\n\u003cli>Click \u003cstrong>Start diagnosis\u003c/strong> (「开始诊断」) and the prompt is dispatched to the chosen session.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"manage-local-services-and-ports\">Manage local services and ports\u003c/h2>\n\u003cp>Open \u003cstrong>Services\u003c/strong> (「服务」) in the right panel to see the ports this computer is listening on and the processes behind them. The number after \u003cstrong>Local services\u003c/strong> (「本地服务」) is the current row count.\u003c/p>\n\u003cul>\n\u003cli>By default only development-type services are shown (such as node, python and vite processes). Check \u003cstrong>Show all ports\u003c/strong> (「显示全部端口」) at the top right to show every listening port, and use \u003cstrong>Refresh service list\u003c/strong> (「刷新服务列表」) to rescan manually. The list also updates automatically when services change\u003c/li>\n\u003cli>Each row shows the port, process name, \u003ccode>pid\u003c/code>, working directory and the associated session (click it to switch to that session). The buttons on the right \u003cstrong>Open this service in browser\u003c/strong> (「在浏览器中打开此服务」), \u003cstrong>Copy service address\u003c/strong> (「复制服务地址」) and \u003cstrong>Stop this service\u003c/strong> (「停止此服务」, with confirmation)\u003c/li>\n\u003cli>Services started by Time Machine previews carry a \u003cstrong>Time Machine\u003c/strong> (「时光机」) badge\u003c/li>\n\u003cli>A service whose session has ended is marked \u003cstrong>Leftover\u003c/strong> (「残留」), and a banner with \u003cstrong>Clean up all\u003c/strong> (「一键清理」) appears at the top. Click it and confirm with \u003cstrong>Stop all\u003c/strong> (「全部停止」)\u003c/li>\n\u003cli>Terminals folded into the background appear in the \u003cstrong>Background terminals\u003c/strong> (「后台终端」) block, where you can \u003cstrong>Restore\u003c/strong> (「恢复」) them to the terminal or \u003cstrong>End\u003c/strong> (「结束」) the process\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-services-panel.png\" alt=\"Services panel\"/>\u003c/p>\n\u003ch2 id=\"view-performance-and-memory\">View performance and memory\u003c/h2>\n\u003cp>Click \u003cstrong>Performance xxx MB\u003c/strong> (「性能 xxx MB」) in the status bar at the bottom of the window to open the \u003cstrong>Performance\u003c/strong> (「性能」) popover. The number is the real physical memory of this app&#x27;s process tree (the app itself plus WebView and helper processes), measured the same way as Activity Monitor. While open, it refreshes every 4 seconds and contains:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Memory breakdown\u003c/strong> (「内存分布」): whole-machine memory in segments for \u003cstrong>This app\u003c/strong> (「本应用」), \u003cstrong>Agents\u003c/strong> (「智能体」), \u003cstrong>Other programs\u003c/strong> (「其他程序」) and \u003cstrong>Free\u003c/strong> (「空闲」)\u003c/li>\n\u003cli>\u003cstrong>This app (UI)\u003c/strong> (「本应用（界面）」): how many processes belong to the app itself\u003c/li>\n\u003cli>\u003cstrong>Sessions opened by this app\u003c/strong> (「本应用开的会话」): omp session processes started by this app. \u003cstrong>Opened from terminal/other windows\u003c/strong> (「终端/其他窗口开的」): other omp processes on this machine\u003c/li>\n\u003cli>\u003cstrong>Active windows\u003c/strong> (「活跃窗口」): omp-workspace instances running on this machine (labelled by worktree or branch) and the number of OMP sessions in this window\u003c/li>\n\u003cli>\u003cstrong>Service processes\u003c/strong> (「服务进程」): processes associated with the current project\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The popover never reads process command-line arguments; it shows only executable names. Numbers in development mode (\u003ccode>pnpm tauri dev\u003c/code>) are much higher than in a release build and do not represent normal memory use.\u003c/p>\n\u003c/blockquote>\n\u003cp>The session statistics button in the status bar, which shows rounds and steps, opens details for the current session: model time, time to first token (TTFT), output speed (TPS) and token consumption.\u003c/p>\n\u003ch2 id=\"access-from-your-phone\">Access from your phone\u003c/h2>\n\u003cp>Once mobile access is running, a phone on the same Wi-Fi can scan a QR code to view sessions, reply and handle approvals. Open \u003cstrong>Settings ▸ Mobile access\u003c/strong> (「手机访问」).\u003c/p>\n\u003ch3 id=\"start-and-pair-lan\">Start and pair (LAN)\u003c/h3>\n\u003col>\n\u003cli>On the \u003cstrong>Mobile access service\u003c/strong> (「手机访问服务」) card, click \u003cstrong>Start\u003c/strong> (「启动」). The card then shows the \u003cstrong>LAN address\u003c/strong> (「局域网地址」). The app remembers this switch in its settings and starts mobile access again the next time you open it.\u003c/li>\n\u003cli>Under \u003cstrong>Pair phone (LAN)\u003c/strong> (「配对手机（局域网）」), click \u003cstrong>Generate pairing QR code\u003c/strong> (「生成配对二维码」); mobile access must be started first. The code is valid for 5 minutes and can be used once. After it expires, click \u003cstrong>Regenerate\u003c/strong> (「重新生成」).\u003c/li>\n\u003cli>Scan it with your phone&#x27;s camera or WeChat, and finish pairing in the phone&#x27;s browser. You can also click \u003cstrong>Copy pairing link\u003c/strong> (「复制配对链接」) and open it on the phone.\u003c/li>\n\u003c/ol>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-pairing-qr.png\" alt=\"Mobile access settings and pairing QR code\"/>\u003c/p>\n\u003cp>The \u003cstrong>Port\u003c/strong> (「端口」) defaults to 7788 (range 1–65535). You rarely need to change it; change it only if startup fails because another program uses it, then click \u003cstrong>Restart now\u003c/strong> (「立即重启」) after saving.\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>LAN access uses HTTP. Only devices on the same Wi-Fi or local network can connect, and each phone must be paired once.\u003c/p>\n\u003c/blockquote>\n\u003cp>After pairing, the phone page has a left menu with \u003cstrong>Sessions\u003c/strong>, \u003cstrong>Inbox\u003c/strong>, \u003cstrong>Search\u003c/strong>, \u003cstrong>Scheduled tasks\u003c/strong>, \u003cstrong>Skills\u003c/strong>, \u003cstrong>Ideas\u003c/strong> and \u003cstrong>Settings\u003c/strong> (「会话」「收件箱」「搜索」「定时任务」「Skills」「想法」「设置」), and a right menu with \u003cstrong>Files\u003c/strong>, \u003cstrong>Side chat\u003c/strong>, \u003cstrong>Heatmap\u003c/strong> (sub-agent statistics), \u003cstrong>Todos\u003c/strong>, \u003cstrong>Git\u003c/strong>, \u003cstrong>Services\u003c/strong>, \u003cstrong>Terminal\u003c/strong> and \u003cstrong>Plan\u003c/strong> (「文件」「旁聊」「热力图」「待办」「Git」「服务」「终端」「计划」). On the phone you can send messages to a session, approve or reject agent requests, and manage scheduled tasks, ideas and some model settings.\u003c/p>\n\u003ch3 id=\"access-from-other-networks\">Access from other networks\u003c/h3>\n\u003cp>There are three ways to connect when you are away from the same Wi-Fi:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Method\u003c/th>\u003cth>Good for\u003c/th>\u003cth>Requires\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cstrong>Public tunnel ▸ Temporary public address\u003c/strong>\u003c/td>\u003ctd>Short-term use\u003c/td>\u003ctd>\u003ccode>cloudflared\u003c/code> installed; nothing else to configure. A random \u003ccode>trycloudflare.com\u003c/code> address is assigned and changes on every start\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Public tunnel ▸ Fixed domain\u003c/strong>\u003c/td>\u003ctd>Long-term use\u003c/td>\u003ctd>A tunnel you already created on Cloudflare and your own domain; configuring Cloudflare Access as well is recommended\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Direct access (IPv6)\u003c/strong>\u003c/td>\u003ctd>Connecting to this computer directly over cellular\u003c/td>\u003ctd>A public IPv6 address on this machine, and inbound ports allowed on your router\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch4 id=\"public-tunnel\">Public tunnel\u003c/h4>\n\u003cp>On the \u003cstrong>Access from another network (public tunnel)\u003c/strong> (「不在同一网络时访问（公网隧道）」) card, choose \u003cstrong>Temporary public address\u003c/strong> (「临时公网地址」) or \u003cstrong>Fixed domain\u003c/strong> (「固定域名」) under \u003cstrong>Access method\u003c/strong> (「访问方式」). \u003cstrong>Off\u003c/strong> (「关闭」) keeps access to the LAN only, which is the safest.\u003c/p>\n\u003col>\n\u003cli>If the card says \u003ccode>cloudflared\u003c/code> must be installed, run \u003ccode>brew install cloudflared\u003c/code> in a \u003cstrong>Terminal\u003c/strong>, then click \u003cstrong>Refresh status\u003c/strong> (「刷新状态」).\u003c/li>\n\u003cli>For \u003cstrong>Fixed domain\u003c/strong>, enter the \u003cstrong>Tunnel name\u003c/strong> (「隧道名称」) and \u003cstrong>Domain\u003c/strong> (「域名」).\u003c/li>\n\u003cli>Click \u003cstrong>Save and start tunnel\u003c/strong> (「保存并启动隧道」; \u003cstrong>Save and reconnect\u003c/strong> after changes). When it connects, the \u003cstrong>Public address\u003c/strong> (「公网地址」) and a \u003cstrong>Connected\u003c/strong> (「已连接」) badge appear. A temporary address can take a few seconds to show up.\u003c/li>\n\u003cli>Click \u003cstrong>Generate public pairing QR code\u003c/strong> (「生成公网配对二维码」) to pair a phone. Pairing by QR code is still required, so strangers cannot use the address directly.\u003c/li>\n\u003c/ol>\n\u003ch4 id=\"ipv6-direct-access\">IPv6 direct access\u003c/h4>\n\u003cp>The \u003cstrong>Direct access\u003c/strong> (「直连」) card takes advantage of public IPv6 having no NAT, so a phone on 4G/5G connects straight to this computer without a third-party relay.\u003c/p>\n\u003col>\n\u003cli>Click \u003cstrong>Start\u003c/strong>. The card shows the \u003cstrong>Public IPv6 address\u003c/strong> (「公网 IPv6 地址」), the \u003cstrong>Access link\u003c/strong> (「访问链接」) and the \u003cstrong>Certificate SHA-256 fingerprint\u003c/strong> (「证书 SHA-256 指纹」). It cannot be used if this machine has no public IPv6 address.\u003c/li>\n\u003cli>The \u003cstrong>Port\u003c/strong> defaults to 7789. Your router firewall must allow inbound IPv6 connections on that port.\u003c/li>\n\u003cli>Click \u003cstrong>Generate IPv6 pairing QR code\u003c/strong> (「生成 IPv6 配对二维码」) to pair a phone.\u003c/li>\n\u003c/ol>\n\u003cp>Tips shown on the card:\u003c/p>\n\u003cul>\n\u003cli>The first visit warns that the certificate is not trusted. Continue after checking that the fingerprint matches\u003c/li>\n\u003cli>Test with mobile data (turn off Wi-Fi)\u003c/li>\n\u003cli>After the address changes, pair again by QR code, or enable DDNS\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Dynamic domain\u003c/strong> (「动态域名」) updates the AAAA record on Cloudflare automatically when your public IPv6 address changes. Turn on \u003cstrong>Enable Cloudflare DDNS\u003c/strong> (「启用 Cloudflare DDNS」), fill in the \u003cstrong>Zone ID\u003c/strong> and the \u003cstrong>Domain to resolve (AAAA)\u003c/strong> (「解析域名（AAAA）」), and save a \u003cstrong>Cloudflare API token\u003c/strong> with \u003ccode>Zone:DNS:Edit\u003c/code> permission (\u003cstrong>Save token\u003c/strong> (「保存令牌」) / \u003cstrong>Clear token\u003c/strong> (「清除令牌」)). The token is kept in a local encrypted vault and is never echoed back. After an authentication failure or repeated sync errors, automatic sync pauses; check the settings and click \u003cstrong>Sync now\u003c/strong> (「立即同步」) to resume.\u003c/p>\n\u003cp>\u003cimg src=\"images/monitoring-and-mobile-tunnel.png\" alt=\"Public tunnel and IPv6 direct access cards\"/>\u003c/p>\n\u003ch3 id=\"revoke-phone-access\">Revoke phone access\u003c/h3>\n\u003cp>\u003cstrong>Revoke all\u003c/strong> (「全部撤销」) under \u003cstrong>Paired phones\u003c/strong> (「已配对的手机」) at the bottom of the page disconnects every paired phone immediately; they must scan a QR code again. Use it when a phone is lost or you no longer want a phone to have access.\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003cdiv class=\"callout-title\">Warning\u003c/div>\n\u003cp>You cannot remove a single phone yet. You can only revoke all of them and then pair the ones you still need again.\u003c/p>\n\u003c/blockquote>\n\u003cp>Related chapters: \u003ca href=\"#/en/05-settings-and-models\">Settings and models\u003c/a>, \u003ca href=\"#/en/07-shortcuts-and-troubleshooting\">Shortcuts and troubleshooting\u003c/a>.\u003c/p>"},{"slug":"07-shortcuts-and-troubleshooting","title":"Shortcuts and troubleshooting","html":"\u003ch1 id=\"shortcuts-and-troubleshooting\">Shortcuts and troubleshooting\u003c/h1>\n\u003cblockquote>\n\u003cp>A keyboard shortcut cheat sheet, fixes for common problems, and where the app keeps its data.\u003c/p>\n\u003c/blockquote>\n\u003cp>In this chapter:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/en/07-shortcuts-and-troubleshooting/keyboard-shortcuts\">Keyboard shortcuts\u003c/a>: global, composer, list, editors\u003c/li>\n\u003cli>\u003ca href=\"#/en/07-shortcuts-and-troubleshooting/common-problems\">Common problems\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/en/07-shortcuts-and-troubleshooting/data-locations\">Data locations\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>The app UI is in Simplified Chinese only. UI labels appear as \u003cstrong>English name\u003c/strong> (「中文原文」) the first time they are mentioned in each section.\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"keyboard-shortcuts\">Keyboard shortcuts\u003c/h2>\n\u003cp>In this guide \u003ccode>⌘\u003c/code> is the Command key on macOS and corresponds to \u003ccode>Ctrl\u003c/code> on other platforms.\u003c/p>\n\u003ch3 id=\"global-shortcuts\">Global shortcuts\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘B\u003c/code>\u003c/td>\u003ctd>Expand / collapse the left sidebar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘J\u003c/code>\u003c/td>\u003ctd>Expand / collapse the right panel (no effect on the \u003cstrong>Inbox\u003c/strong> (「收件箱」), \u003cstrong>Scheduled tasks\u003c/strong> (「定时任务」), and \u003cstrong>Skills management\u003c/strong> (「Skills 管理」) pages)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘N\u003c/code>\u003c/td>\u003ctd>New session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>Focus the sidebar search box; on the Settings page, focus the settings search. It does not intercept the key where the focus is in an area with its own find, such as a code editor or terminal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘[\u003c/code>\u003c/td>\u003ctd>Go back: from a full-page view (document, inbox, and so on) to the session; from a side chat to its parent session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘`\u003c/code>\u003c/td>\u003ctd>Open / close the \u003cstrong>Terminal\u003c/strong> (「终端」) tab in the right panel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘W\u003c/code>\u003c/td>\u003ctd>Closes, in order: the topmost floating layer → the active right-panel tab → otherwise hides the window\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘+\u003c/code> / \u003ccode>⌘-\u003c/code> / \u003ccode>⌘0\u003c/code>\u003c/td>\u003ctd>Zoom the UI in / out / reset (80%–140%, 5% steps, remembered)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>Close a popup; stop generation while a session is generating; go back to the session from a full-page view\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧I\u003c/code>\u003c/td>\u003ctd>Open the quick-capture window (a system-wide shortcut, the default value, usable from any app; see \u003ca href=\"#/en/04-automation\">Chapter 4\u003c/a> for the feature)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003cdiv class=\"callout-title\">Note\u003c/div>\n\u003cp>\u003ccode>⌘B\u003c/code>, \u003ccode>⌘J\u003c/code>, \u003ccode>⌘[\u003c/code>, and \u003ccode>⌘`\u003c/code> do nothing while Settings is open. \u003ccode>⌘K\u003c/code> works only on the Settings page, where it focuses the settings search.\u003c/p>\n\u003c/blockquote>\n\u003cp>Change the quick-capture shortcut under \u003cstrong>Settings ▸ General ▸ Shortcuts ▸ Quick capture shortcut\u003c/strong> (「设置 ▸ 通用 ▸ 快捷键 ▸ 快速记录快捷键」): click the button and press the new combination. Clearing it disables the shortcut, and a combination must include one of \u003ccode>⌘\u003c/code> / \u003ccode>⌃\u003c/code> / \u003ccode>⌥\u003c/code> / \u003ccode>⇧\u003c/code> (F keys excepted).\u003c/p>\n\u003cp>The zoom buttons in the bottom status bar, \u003cstrong>Zoom out (-5%)\u003c/strong> (「缩小界面 (-5%)」), \u003cstrong>Reset zoom to 100%\u003c/strong> (「重置缩放为 100%」), and \u003cstrong>Zoom in (+5%)\u003c/strong> (「放大界面 (+5%)」), do the same as the zoom shortcuts above.\u003c/p>\n\u003ch3 id=\"composer\">Composer\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>Send (default)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Enter\u003c/code>\u003c/td>\u003ctd>Newline (default)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>Send. If you chose \u003cstrong>⌘ Enter sends\u003c/strong> (「⌘ Enter 发送」) under \u003cstrong>Settings ▸ Sessions ▸ Sending ▸ Send shortcut\u003c/strong>, \u003ccode>Enter\u003c/code> inserts a newline and \u003ccode>⌘Enter\u003c/code> sends\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌥Enter\u003c/code> (or \u003ccode>⌥⌘Enter\u003c/code>)\u003c/td>\u003ctd>While the agent is replying, send this one message the other way: steer and queue swap, and &quot;interrupt and send&quot; becomes queue\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> / \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>Browse input history when the caret is on the first / last line\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>@\u003c/code>\u003c/td>\u003ctd>Reference a file in the working directory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>/\u003c/code>\u003c/td>\u003ctd>Open the command menu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> \u003ccode>↓\u003c/code> / \u003ccode>Tab\u003c/code> or \u003ccode>Enter\u003c/code> / \u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>Choose / confirm / close in the \u003ccode>@\u003c/code> and \u003ccode>/\u003c/code> popups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Tab\u003c/code> / \u003ccode>Shift+Tab\u003c/code>\u003c/td>\u003ctd>Indent / outdent in a Markdown list\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>Stop generation while a round is running\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The send and newline keys above do nothing while an input method is composing text.\u003c/p>\n\u003ch3 id=\"session-list-list-has-focus\">Session list (list has focus)\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>↑\u003c/code> \u003ccode>↓\u003c/code>\u003c/td>\u003ctd>Move the highlight and open that session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>Open the highlighted session\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>←\u003c/code> \u003ccode>→\u003c/code>\u003c/td>\u003ctd>Collapse / expand a group\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Delete\u003c/code> / \u003ccode>Backspace\u003c/code>\u003c/td>\u003ctd>Archive\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+Delete\u003c/code>\u003c/td>\u003ctd>Delete permanently\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>F2\u003c/code>\u003c/td>\u003ctd>Rename\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Shift+F10\u003c/code> / menu key\u003c/td>\u003ctd>Open the session action menu\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘\u003c/code> click / \u003ccode>Shift\u003c/code> click\u003c/td>\u003ctd>Multi-select / select a range\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"approvals-and-questions\">Approvals and questions\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>y\u003c/code>\u003c/td>\u003ctd>\u003cstrong>This time only\u003c/strong> (「仅本次」) on an approval card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>n\u003c/code>\u003c/td>\u003ctd>\u003cstrong>Deny\u003c/strong> (「拒绝」) on an approval card\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Number keys, \u003ccode>←\u003c/code> \u003ccode>→\u003c/code>, \u003ccode>Enter\u003c/code>, \u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>Choose, switch question, submit, cancel in the question panel\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>Submit in a confirmation card that asks for text\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>y\u003c/code> / \u003ccode>n\u003c/code> only work when focus is not in a text field.\u003c/p>\n\u003ch3 id=\"editing-and-dialogs\">Editing and dialogs\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Shortcut\u003c/th>\u003cth>Action\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>⌘S\u003c/code>\u003c/td>\u003ctd>Save: document editing, file-preview editing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Enter\u003c/code>\u003c/td>\u003ctd>Submit: resend an edited message, an annotation, a Git commit message, a new worktree session, diagnose, scheduled-task editing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Enter\u003c/code> / \u003ccode>Shift+Enter\u003c/code>\u003c/td>\u003ctd>Submit / newline in the annotation box\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>Esc\u003c/code>\u003c/td>\u003ctd>Cancel an annotation, close a dialog\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘Z\u003c/code>\u003c/td>\u003ctd>Undo in the sketch editor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>j\u003c/code> / \u003ccode>k\u003c/code> or \u003ccode>↓\u003c/code> / \u003ccode>↑\u003c/code>, \u003ccode>Enter\u003c/code>\u003c/td>\u003ctd>Move through and open entries on the \u003cstrong>Inbox\u003c/strong> page (when focus is not in an input)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘F\u003c/code>\u003c/td>\u003ctd>Open search inside the terminal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>⌘⇧A\u003c/code>\u003c/td>\u003ctd>In the terminal, quote the selected text into the composer as an annotation\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"common-problems\">Common problems\u003c/h2>\n\u003ch3 id=\"omp-is-not-found-or-sessions-will-not-start\">omp is not found, or sessions will not start\u003c/h3>\n\u003cp>The app starts omp with the command in \u003cstrong>Settings ▸ Advanced ▸ omp program location\u003c/strong> (「设置 ▸ 高级 ▸ omp 程序位置」), which defaults to \u003ccode>omp\u003c/code>. First confirm that \u003ccode>omp\u003c/code> runs in a terminal; if it is installed somewhere unusual, enter the full path. \u003cstrong>Settings ▸ Version and updates\u003c/strong> (「设置 ▸ 版本与更新」) shows whether omp was found and its version.\u003c/p>\n\u003cp>If the home page shows &quot;会话没启动成功，点此重试&quot; (&quot;Session failed to start, click to retry&quot;), fix omp and click it to retry.\u003c/p>\n\u003ch3 id=\"sessions-from-a-terminal-do-not-show-up-in-the-list\">Sessions from a terminal do not show up in the list\u003c/h3>\n\u003cp>The app reads sessions from \u003ccode>~/.omp/agent/sessions/\u003c/code>. To make conversations you run directly with \u003ccode>omp\u003c/code> in a terminal show up live, turn on \u003cstrong>Settings ▸ Advanced ▸ External terminal link ▸ Show omp in terminals here too\u003c/strong> (「设置 ▸ 高级 ▸ 外部终端联动 ▸ 让终端里的 omp 也显示在这里」); it installs a small extension into \u003ccode>~/.omp/agent/extensions/\u003c/code>.\u003c/p>\n\u003cp>Such sessions show the \u003cstrong>External\u003c/strong> (「外部」) status. To keep working on one in this app, choose \u003cstrong>Take over session\u003c/strong> (「接管会话」) from its context menu first.\u003c/p>\n\u003ch3 id=\"a-session-shows-interrupted\">A session shows &quot;Interrupted&quot;\u003c/h3>\n\u003cp>The session&#x27;s process exited unexpectedly. Right-click it and choose \u003cstrong>Resume session\u003c/strong> (「恢复会话」), or click \u003cstrong>Resume interrupted round\u003c/strong> (「恢复中断的回合」) in the session (it sends Continue).\u003c/p>\n\u003ch3 id=\"i-cannot-find-a-session\">I cannot find a session\u003c/h3>\n\u003cul>\n\u003cli>Check the current \u003cstrong>space\u003c/strong>: sessions are not shared between spaces, so switch to the right one at the top left.\u003c/li>\n\u003cli>Open \u003cstrong>Filter and display settings\u003c/strong> (「过滤与显示设置」) next to the search box and tick \u003cstrong>Show archived sessions\u003c/strong> (「显示已归档会话」).\u003c/li>\n\u003cli>Search by title, branch, or directory name.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"archived-or-deleted-by-mistake\">Archived or deleted by mistake\u003c/h3>\n\u003cul>\n\u003cli>After archiving, an \u003cstrong>Undo\u003c/strong> (「撤销」) bar appears at the top. If you missed it, show archived sessions and choose \u003cstrong>Unarchive\u003c/strong> (「取消归档」) on the session.\u003c/li>\n\u003cli>\u003cstrong>Delete session\u003c/strong> (「删除会话」) permanently deletes the transcript file and cannot be undone in the app. Sessions cleaned up through \u003cstrong>Settings ▸ Storage\u003c/strong> (「设置 ▸ 存储空间」) are moved to the Trash, so you can restore them from there.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"typing-does-not-go-into-the-composer\">Typing does not go into the composer\u003c/h3>\n\u003cp>Typed characters are redirected into the composer only when no other input control has focus and no menu or dialog is open. Press \u003ccode>Esc\u003c/code> to close any popup, or click an empty spot in the message area, then type.\u003c/p>\n\u003ch3 id=\"i-get-no-notifications\">I get no notifications\u003c/h3>\n\u003cp>Under \u003cstrong>Settings ▸ Notifications\u003c/strong> (「设置 ▸ 通知」), confirm the relevant events (round finished, needs your approval or answer, error or unexpected interruption) are on, check the \u003cstrong>Do not disturb\u003c/strong> (「免打扰」) period, and click \u003cstrong>Send test notification\u003c/strong> (「发送测试通知」) to check that system notifications and sound work. If even the test notification does not appear, check that the system settings allow notifications from omp-workspace.\u003c/p>\n\u003ch3 id=\"the-quick-capture-shortcut-does-nothing\">The quick-capture shortcut does nothing\u003c/h3>\n\u003cp>An invalid shortcut format is rejected with &quot;快捷键格式无效&quot; (&quot;invalid shortcut format&quot;). If the combination is already taken by the system or another app, registration fails; choose a different combination.\u003c/p>\n\u003ch3 id=\"memory-use-looks-high\">Memory use looks high\u003c/h3>\n\u003cp>\u003cstrong>Performance\u003c/strong> (「性能」) in the bottom status bar counts memory the way Activity Monitor does, including the main process and the WebView and helper processes; click it for a per-process breakdown. In development mode (\u003ccode>pnpm tauri dev\u003c/code>) the number is much higher because it includes unbundled frontend modules and a debug Rust build; judge by the packaged app. To keep fewer omp processes running, shorten \u003cstrong>Settings ▸ Sessions ▸ Sleep after idle (minutes)\u003c/strong> (「闲置多久后休眠（分钟）」).\u003c/p>\n\u003ch3 id=\"the-context-is-almost-full\">The context is almost full\u003c/h3>\n\u003cp>Type \u003ccode>/compact\u003c/code> or click \u003cstrong>Compress\u003c/strong> (「压缩」) in the context ring; to drop large blocks such as tool results without calling the model, use \u003ccode>/shake\u003c/code>. To see what every request carries, click \u003cstrong>View system prompt composition\u003c/strong> (「查看系统提示词构成」). More in \u003ca href=\"#/en/02-sessions-and-chat/check-context-usage\">Check context usage\u003c/a>.\u003c/p>\n\u003ch3 id=\"a-session-is-stuck-or-misbehaving\">A session is stuck or misbehaving\u003c/h3>\n\u003cp>Right-click the session and choose \u003cstrong>Diagnose this session\u003c/strong> (「诊断此会话」), then pick which session or model analyzes it. You can also try \u003cstrong>Restart session\u003c/strong> (「重启会话」) first; history is kept.\u003c/p>\n\u003ch3 id=\"cannot-read-master-key\">&quot;Cannot read master key&quot;\u003c/h3>\n\u003cp>If you see &quot;密钥库已有密文但无法读取主密钥&quot; (&quot;the vault has ciphertext but the master key cannot be read&quot;), check the file permissions of \u003ccode>~/.omp-workspace/env/.master.key\u003c/code>. For configuring provider keys, see \u003ca href=\"#/en/05-settings-and-models\">Chapter 5\u003c/a>.\u003c/p>\n\u003ch3 id=\"the-window-is-blank-in-development-mode\">The window is blank in development mode\u003c/h3>\n\u003cp>Only for \u003ccode>pnpm tauri dev\u003c/code>: when frontend files are half-edited, the WebView reloads the whole page and can stay blank. Run \u003ccode>touch index.html\u003c/code> in the project root so Vite reloads it, then confirm the UI is back.\u003c/p>\n\u003ch2 id=\"data-locations\">Data locations\u003c/h2>\n\u003cp>The app keeps its data in \u003ccode>~/.omp-workspace/\u003c/code> by default. Set the \u003ccode>OMPWS_DATA_DIR\u003c/code> environment variable to use another directory (for isolated trial instances; for example \u003ccode>pnpm dev:preview\u003c/code> uses \u003ccode>~/.omp-workspace-dev\u003c/code>). \u003cstrong>Open data directory\u003c/strong> (「打开数据目录」) under \u003cstrong>Settings ▸ Advanced ▸ Data and backup\u003c/strong> (「设置 ▸ 高级 ▸ 数据与备份」) takes you straight there.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>Contents\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/app.db\u003c/code>\u003c/td>\u003ctd>App database (session metadata, todos, ideas, scheduled tasks, and so on)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/global/\u003c/code>\u003c/td>\u003ctd>Working directory of the Universal space&#x27;s global workspace\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/images/\u003c/code>\u003c/td>\u003ctd>Pasted and dragged-in images; images older than 30 days that nothing references are cleaned up automatically once a day after launch\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/env/keys.env\u003c/code>\u003c/td>\u003ctd>Encrypted provider keys (the master key is \u003ccode>.master.key\u003c/code> in the same directory)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/status/\u003c/code>\u003c/td>\u003ctd>Session status files reported by the omp extension\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/extension/\u003c/code>\u003c/td>\u003ctd>omp extensions installed by the app\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/plugins/\u003c/code>\u003c/td>\u003ctd>omp plugins shipped with the app (such as Visualize)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/oneshot-sessions/\u003c/code>\u003c/td>\u003ctd>Directory used by one-shot \u003ccode>omp -p\u003c/code> calls such as summaries and diagnosis\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp-workspace/privacy/\u003c/code>\u003c/td>\u003ctd>Privacy library entries; see \u003ca href=\"#/en/05-settings-and-models\">Chapter 5\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>~/.omp/agent/sessions/\u003c/code>\u003c/td>\u003ctd>OMP&#x27;s own session records, which the app reads and displays\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>&lt;project&gt;/.worktrees/&lt;name&gt;\u003c/code>\u003c/td>\u003ctd>Worktrees used by sessions created in an isolated worktree\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-tip\">\u003cdiv class=\"callout-title\">Tip\u003c/div>\n\u003cp>\u003cstrong>Settings ▸ Advanced ▸ Data and backup\u003c/strong> offers \u003cstrong>Export settings\u003c/strong> (「导出设置」) and \u003cstrong>Import settings\u003c/strong> (「导入设置」) for moving to a new computer (omp&#x27;s own config is not included), plus \u003cstrong>Restore default settings\u003c/strong> (「恢复默认设置」). Restoring defaults cannot be undone, so export a backup first. \u003cstrong>Settings ▸ Storage\u003c/strong> shows disk usage and lets you clean up unused images, web cache, and old sessions.\u003c/p>\n\u003c/blockquote>"}]}</script>
<script>
(function(){
var DATA=JSON.parse(document.getElementById("guide-data").textContent);
var KEY="ompws.guide.lang";
var T={zh:{brand:"omp-workspace 使用说明",toc:"本页内容",prev:"上一章",next:"下一章",copy:"复制",copied:"已复制",empty:"暂无内容",html:"zh-CN"},
en:{brand:"omp-workspace User Guide",toc:"On this page",prev:"Previous",next:"Next",copy:"Copy",copied:"Copied",empty:"No content yet",html:"en"}};
var $=function(i){return document.getElementById(i)};
function getLang(){try{var l=localStorage.getItem(KEY);if(l==="zh"||l==="en")return l}catch(e){}return "zh"}
var lang=getLang(),cur=null,spy=[];
function parse(){var m=location.hash.match(/^#\/(zh|en)(?:\/([^\/]+))?(?:\/(.+))?$/);
return m?{lang:m[1],slug:m[2]||null,anchor:m[3]?decodeURIComponent(m[3]):null}:{lang:lang,slug:null,anchor:null}}
function go(l,slug,anchor){location.hash="#/"+l+"/"+slug+(anchor?"/"+encodeURIComponent(anchor):"")}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function enhance(root){
root.querySelectorAll("pre").forEach(function(pre){var b=document.createElement("button");b.className="copy";b.type="button";b.textContent=T[lang].copy;
b.onclick=function(){var t=pre.querySelector("code");var txt=(t||pre).textContent;var done=function(){b.textContent=T[lang].copied;setTimeout(function(){b.textContent=T[lang].copy},1500)};
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,done);else{var ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()}};
pre.appendChild(b)});
root.querySelectorAll("img").forEach(function(img){
var fail=function(){var d=document.createElement("div");d.className="img-ph";d.setAttribute("role","img");d.textContent=img.getAttribute("alt")||"";img.replaceWith(d)};
img.addEventListener("error",fail);if(img.complete&&img.naturalWidth===0)fail()});}
function render(){
var r=parse();lang=r.lang;try{localStorage.setItem(KEY,lang)}catch(e){}
var list=DATA[lang]||[];var t=T[lang];
document.documentElement.lang=t.html;document.title=t.brand+" / "+(lang==="zh"?"User Guide":"使用说明");
$("brand").textContent=lang==="zh"?"omp-workspace 使用说明 / User Guide":"omp-workspace User Guide / 使用说明";
document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.lang===lang))});
$("nav").innerHTML=list.map(function(c){return '<a href="#/'+lang+'/'+c.slug+'"'+(c.slug===r.slug?' aria-current="page"':'')+'>'+esc(c.title)+'</a>'}).join("");
var idx=-1;for(var i=0;i<list.length;i++)if(list[i].slug===r.slug)idx=i;
if(idx<0&&list.length){if(r.slug||!location.hash||true){idx=0}}
var content=$("content"),toc=$("toc");
if(idx<0){content.innerHTML='<p class="empty">'+t.empty+'</p>';toc.innerHTML="";return}
var ch=list[idx];
if(cur!==lang+"/"+ch.slug){cur=lang+"/"+ch.slug;
var p=idx>0?list[idx-1]:null,n=idx<list.length-1?list[idx+1]:null;
content.innerHTML=ch.html+'<div class="pager">'+(p?'<a class="prev" href="#/'+lang+'/'+p.slug+'"><small>← '+t.prev+'</small>'+esc(p.title)+'</a>':'')+(n?'<a class="next" href="#/'+lang+'/'+n.slug+'"><small>'+t.next+' →</small>'+esc(n.title)+'</a>':'')+'</div>';
enhance(content);
var hs=content.querySelectorAll("h2,h3");
toc.innerHTML='<h4>'+t.toc+'</h4>'+Array.prototype.map.call(hs,function(h){return '<a class="'+h.tagName.toLowerCase()+'" data-id="'+h.id+'" href="#/'+lang+'/'+ch.slug+'/'+encodeURIComponent(h.id)+'">'+esc(h.textContent)+'</a>'}).join("");
spy=Array.prototype.slice.call(hs);
if(!r.anchor)window.scrollTo({top:0,behavior:"instant"});
document.body.classList.remove("drawer");}
if(r.anchor){var el=document.getElementById(r.anchor);if(el)el.scrollIntoView()}
onScroll();}
function onScroll(){var act=null;for(var i=0;i<spy.length;i++){if(spy[i].getBoundingClientRect().top<=90)act=spy[i];else break}
if(!act&&spy.length)act=spy[0];
document.querySelectorAll("#toc a").forEach(function(a){var on=act&&a.dataset.id===act.id;a.classList.toggle("active",!!on)})}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){var r=parse(),l=b.dataset.lang;if(l===lang&&location.hash)return;
var other=DATA[l]||[];var same=other.some(function(c){return c.slug===r.slug});
try{localStorage.setItem(KEY,l)}catch(e){}
if(other.length)go(l,same?r.slug:other[0].slug,same?r.anchor:null);else{location.hash="#/"+l;}}});
$("menu").onclick=function(){document.body.classList.toggle("drawer")};
$("scrim").onclick=function(){document.body.classList.remove("drawer")};
window.addEventListener("hashchange",render);
window.addEventListener("scroll",onScroll,{passive:true});
if(!/^#\/(zh|en)/.test(location.hash)){var l0=getLang(),f=(DATA[l0]||[])[0];if(f)history.replaceState(null,"","#/"+l0+"/"+f.slug)}
render();
})();
</script>
</body>
</html>
